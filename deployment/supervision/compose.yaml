name: osr-supervision
services:
  integration:
    image: osr/integration:0.1.2
    build:
      context: ../..
      dockerfile: deployment/supervision/Dockerfile
    restart: unless-stopped
    volumes:
      - ../../var/supervision/integration.json:/run/secrets/integration.json:ro
      - integration-data:/data
    ports:
      - '127.0.0.1:8092:8092'
    networks: [supervision, erp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8092/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  fuxa:
    image: frangoteam/fuxa:1.3.4@sha256:3778da3377e7685842495497d13157d1548ccad8708c434dc5d4b99fb5cb25bf
    restart: unless-stopped
    ports:
      - '127.0.0.1:1881:1881'
    volumes:
      - fuxa-appdata:/usr/src/app/FUXA/server/_appdata
      - fuxa-db:/usr/src/app/FUXA/server/_db
      - fuxa-logs:/usr/src/app/FUXA/server/_logs
      - fuxa-images:/usr/src/app/FUXA/server/_images
      - ../../var/supervision/fuxa-settings.js:/usr/src/app/FUXA/server/_appdata/settings.js:ro
    networks: [supervision]
    depends_on:
      integration:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://localhost:1881', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
networks:
  supervision:
  erp:
    external: true
    name: osr-erpnext_default
volumes:
  integration-data:
  fuxa-appdata:
  fuxa-db:
  fuxa-logs:
  fuxa-images:
