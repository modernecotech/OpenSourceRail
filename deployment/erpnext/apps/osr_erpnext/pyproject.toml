[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osr_erpnext"
version = "0.4.0"
description = "OpenSourceRail business operations integration for ERPNext"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
osr_erpnext = ["*.txt", "**/*.json", "public/js/*.js"]
