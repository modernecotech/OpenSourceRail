<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenSourceRail · Continuing engineering</title>
<style>body{font:16px system-ui;margin:auto;max-width:1200px;padding:24px;color:#182b3d;background:#f5f7f8}h1{font-size:28px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:10px;border:1px solid #abc;border-radius:5px;background:white;cursor:pointer}button[aria-selected=true]{background:#183f57;color:white}section{background:white;padding:20px;border:1px solid #d3dde2;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #dde;padding:9px}svg{width:100%;height:260px;background:#f2f7fa}small{overflow-wrap:anywhere}strong{color:#804400}.error{color:#a00}a{color:#145c83}</style>
<header><h1>Continuing reference-cell engineering</h1><p>Five equipped vehicle proposals · two station spacings · station-only launch alternatives.</p><p><strong>Conditional research calculations. No manufacturing, safety or operating release.</strong></p><label>Candidate <select id="candidate"></select></label><p><small id="identity"></small></p></header>
<nav aria-label="Engineering views"><button data-view="design">Design explorer</button><button data-view="mass">Mass and cost</button><button data-view="simulation">Simulation</button><button data-view="closure">Closure and tests</button><button data-view="production">Manufacture and construction</button></nav><section id="content" aria-live="polite">Loading source-bound results…</section>
<script>
let current,view='design';const $=s=>document.querySelector(s),fmt=v=>v===null||v===undefined?'Unknown':typeof v==='number'?v.toLocaleString(undefined,{maximumFractionDigits:3}):String(v);
function node(tag,text,parent){let e=document.createElement(tag);e.textContent=text;parent.append(e);return e}function table(rows,head=['Quantity','Result']){let t=document.createElement('table');let tr=t.insertRow();head.forEach(h=>node('th',h,tr));for(let row of rows){tr=t.insertRow();row.forEach(v=>node('td',fmt(v),tr))}$('#content').append(t)}function details(title,value,parent=$('#content')){let d=node('details','',parent);node('summary',title,d);node('pre',JSON.stringify(value,null,2),d)}
function chart(trace,parent=$('#content')){let ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('viewBox','0 0 1000 260');s.setAttribute('role','img');s.setAttribute('aria-label','Conditional speed versus leading front position, metres and metres per second');let p=document.createElementNS(ns,'polyline');p.setAttribute('points',trace.map(r=>`${40+r.front_m/2100*920},${225-r.speed_m_s/22*200}`).join(' '));p.setAttribute('fill','none');p.setAttribute('stroke','#067d93');p.setAttribute('stroke-width','3');s.append(p);let tx=document.createElementNS(ns,'text');tx.setAttribute('x','45');tx.setAttribute('y','252');tx.textContent='Front position: 0–2,100 m · Speed: 0–22 m/s · conditional, unqualified';s.append(tx);parent.append(s)}
async function render(){if(!current)return;let r=current;$('#content').replaceChildren();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===view));node('h2',{'design':'Architecture and provenance','mass':'Mass, prices and uncertainty','simulation':'Force-driven conditional journey','closure':'Evidence, failures and next tests','production':'Manufacturing and construction'}[view],$('#content'));
if(view==='design'){table([['Vehicle',r.vehicle_id],['Station spacing (m)',r.distance_m],['Launch',r.alternative.kind],['Conditional arrivals',r.conditional_numerical_arrivals+' / '+r.journeys.length],['Qualified arrivals',r.qualified_numerical_arrivals],['Integrated winner',r.integrated_winner]]);details('Physical composition and subsystem ancestry',r.bundle);details('Launch definition, catalogue sources and remaining unknowns',r.alternative)}
if(view==='mass'){table(Object.entries(r.vehicle_summary));table([['Known stock/process estimate (Class C USD)',r.production.known_vehicle_stock_process_cost_usd.join(' – ')],['Complete installed cost',r.production.complete_installed_cost_usd],['Whole-life cost',r.economics.whole_life_cost_usd],['Actual authenticated price coverage',0]]);details('Unpriced components',r.production.unpriced_part_ids);let b=node('button','Load part and occurrence mass ledger',$('#content'));b.onclick=async()=>{b.disabled=true;try{let v=await fetch('/api/vehicles/'+r.vehicle_id).then(x=>x.json());details('Definitions: material, mass, process and evidence',v.registry.parts);details('Located physical occurrences',v.registry.occurrences)}catch(e){node('p',e.message,$('#content'))}}}
if(view==='simulation'){let sel=node('select','',$('#content'));for(let row of r.journeys){let o=node('option',row.name,sel);o.value=row.name}let box=node('div','',$('#content'));function show(){box.replaceChildren();let q=r.journeys.find(x=>x.name===sel.value).result;node('p',`${q.execution}; conditional arrival: ${q.conditional_numerical_arrival}; stopping error: ${fmt(q.stopping_error_m)} m; work–kinetic residual: ${fmt(q.discrete_work_kinetic_residual_J)} J`,box);chart(q.trajectory||[],box);details('Scenario, limits and open dynamic models',q,box)}sel.onchange=show;show()}
if(view==='closure'){table(r.failed_or_emergency_contexts.map(x=>[x.name,x.execution,fmt(x.final_front_m)+' m']),['Context','Execution','Final front']);details('Next experiments and physical redesigns',r.next_experiments);node('p','Prototype measurements, approved limits, independent assessment, HIL and a commissioned pilot remain external work. Input flags cannot qualify equipment.',$('#content'))}
if(view==='production'){table([['Dimensioned gross stock (kg)',r.production.dimensioned_vehicle_blank_kg],['Net counted stock (kg)',r.production.net_counted_vehicle_stock_kg],['Purchased occurrences',r.production.purchased_occurrences],['Conditional labour hours',r.production.known_vehicle_labour_h.join(' – ')]]);details('Part routings, blanks, yields and tooling',r.production.routings);details('Civil supports, loads, placement and erection sequence',r.civil);details('Disabled ERPNext draft boundary',r.production.ERPNext_drafts)}}
async function load(){try{let res=await fetch('/api/summary');if(!res.ok)throw Error('Source-bound summary unavailable');let s=await res.json();for(let r of s.cases){let o=node('option',r.vehicle_id+' · '+r.distance_m+' m',$('#candidate'));o.value=r.candidate_id}$('#candidate').onchange=async()=>{let res=await fetch('/api/cases/'+$('#candidate').value);if(!res.ok)throw Error('Candidate integrity check failed');current=await res.json();$('#identity').textContent='Candidate '+current.candidate_id+' · Evaluation '+current.evaluation_id;await render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});await $('#candidate').onchange()}catch(e){$('#content').textContent=e.message;$('#content').className='error'}}load();
</script></html>
