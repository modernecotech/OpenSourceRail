schema_version = 1
statuses = ["planned", "screening", "calibrated", "independently-checked", "accepted"]

[[analysis]]
id = "OSR-AN-STN-PED-001"
title = "Station corridor normal and constrained passenger flow"
status = "screening"
tool = "JuPedSim 1.4.2"
input_paths = ["design/component-catalogue/catalog/buildable-stations/station-kit-manifest.json", "engineering/analysis/benchmarks/jupedsim/station-corridor.py"]
result_path = "build/engineering/analysis/benchmarks/jupedsim/station-corridor.json"
acceptance_criterion = "80 agents clear in <=90 s normal and <=120 s constrained; constrained is not faster"
converged = true
limitations = "Screening corridor only; demand, accessibility, stairs, gates and local egress criteria are not calibrated."

[[analysis]]
id = "OSR-AN-STN-STR-001"
title = "Shared station-canopy Warren-truss global load path"
status = "screening"
tool = "OpenSeesPy 3.8.0.0"
input_paths = ["design/component-catalogue/catalog/buildable-stations/station-kit-manifest.json", "engineering/analysis/stations/station_systems.py"]
result_path = "engineering/analysis/stations/screening-summary.json"
acceptance_criterion = "22 m global truss converges for 1.10 kPa gravity and 1.20 kPa uplift; displacement <= span/240 and axial stress <= 0.60 x S355 yield"
converged = true
limitations = "Two-dimensional axial load-path screen using catalogue pressures and gross areas; connections, buckling, fatigue, 3D stability, site actions, load combinations and foundations require deployment design and independent review."

[[analysis]]
id = "OSR-AN-STN-PED-002"
title = "All station variants normal, degraded and egress route flow"
status = "screening"
tool = "JuPedSim 1.4.2"
input_paths = ["design/component-catalogue/catalog/buildable-stations/station-kit-manifest.json", "engineering/analysis/stations/station_systems.py"]
result_path = "engineering/analysis/stations/screening-summary.json"
acceptance_criterion = "Each independent platform route clears 80 agents in <=90 s normal and <=120 s degraded, and 120 agents in <=150 s egress"
converged = true
limitations = "Deterministic route test populations only; transfer conflicts, stairs, lifts, fare gates, trains, crossings, assisted evacuation, city demand and local authority criteria require deployment calibration."

[[analysis]]
id = "OSR-AN-STN-DRA-001"
title = "Station canopy repeatable roof-drainage branches"
status = "screening"
tool = "EPA SWMM / PySWMM 2.1.0"
input_paths = ["design/component-catalogue/catalog/buildable-stations/station-kit-manifest.json", "engineering/analysis/stations/station_systems.py", "engineering/analysis/stations/inputs/swmm/halt.inp", "engineering/analysis/stations/inputs/swmm/standard.inp", "engineering/analysis/stations/inputs/swmm/major.inp", "engineering/analysis/stations/inputs/swmm/interchange.inp", "engineering/analysis/stations/inputs/swmm/interchange-elevated.inp", "engineering/analysis/stations/inputs/swmm/terminal.inp", "engineering/analysis/stations/inputs/swmm/depot-terminal.inp"]
result_path = "engineering/analysis/stations/screening-summary.json"
acceptance_criterion = "All seven representative 300 mm roof-bay branches complete a 75 mm/h 20-minute storm with <=1% continuity error and inlet depth <0.80 m"
converged = true
limitations = "Ideal repeatable branch/free outfall model; local IDF rainfall, surveyed levels, headers, tailwater, blockage, climate allowance, track/yard drainage and exceedance routing require deployment design."

[[analysis]]
id = "OSR-AN-STN-THM-001"
title = "Depot charger and electrical-room thermal/ventilation model"
status = "planned"
tool = "EnergyPlus 26.1"
input_paths = ["design/component-catalogue/catalog/buildable-stations/station-kit-manifest.json", "engineering/analysis/stations/station_systems.py", "engineering/analysis/stations/inputs/energyplus/depot-equipment-room.idf"]
result_path = "engineering/analysis/stations/screening-summary.json"
acceptance_criterion = "Design-day solver completes after supplier heat-loss map, project climate, envelope, ventilation architecture and control limits are frozen"
converged = false
limitations = "Tracked input is an uncalibrated one-zone pre-sizing deck; no solver is installed in the current reproducibility environment and no thermal acceptance is claimed."

[[analysis]]
id = "OSR-AN-STN-FIR-001"
title = "Depot charger-room fire and tenability model"
status = "planned"
tool = "FDS 6.11.1"
input_paths = ["design/component-catalogue/catalog/buildable-stations/station-kit-manifest.json", "engineering/analysis/stations/station_systems.py", "engineering/analysis/stations/inputs/fds/depot-charger-room.fds"]
result_path = "engineering/analysis/stations/screening-summary.json"
acceptance_criterion = "FDS mesh/convergence and tenability criteria pass after a fire engineer freezes the credible heat-release curve, chemistry, ventilation, detection and suppression cases"
converged = false
limitations = "Tracked deck contains a prescribed 250 kW burner for model plumbing only, not a battery thermal-runaway representation; no solver result or fire-safety acceptance is claimed."

[[analysis]]
id = "OSR-AN-OPS-SUMO-001"
title = "Samawah network independent timetable run"
status = "screening"
tool = "Eclipse SUMO 1.27.1"
input_paths = ["cities/catalogue/west-asia/Iraq/Samawah/design.toml", "cities/catalogue/west-asia/Iraq/Samawah/samawah.corridor.geojson", "lib/templates/rolling-stock.toml", "engineering/analysis/benchmarks/sumo/city_timetable.py"]
result_path = "build/engineering/cities/samawah/sumo/summary.json"
acceptance_criterion = "All twelve scheduled services complete the three canonical routes"
converged = true
limitations = "Canonical GeoJSON geometry, not surveyed alignment; disconnected line models omit interchange conflicts, calibrated dwell and road interaction."

[[analysis]]
id = "OSR-AN-GIS-CITY-001"
title = "Samawah canonical city GeoPackage generation"
status = "screening"
tool = "QGIS 4.2.1 / GDAL 3.13.2"
input_paths = ["cities/catalogue/west-asia/Iraq/Samawah/design.toml", "cities/catalogue/west-asia/Iraq/Samawah/samawah.toml", "cities/catalogue/west-asia/Iraq/Samawah/samawah.corridor.geojson", "engineering/analysis/city_package.py"]
result_path = "build/engineering/cities/samawah/gis/summary.json"
acceptance_criterion = "GeoPackage is created with all populated canonical layers and zero input-schema findings"
converged = true
limitations = "EPSG:4326 catalogue geometry only; utilities, parcels, terrain, vertical datum, survey uncertainty and issue closure remain pending."

[[analysis]]
id = "OSR-AN-ENE-CITY-001"
title = "Samawah station microgrid and PV planning screen"
status = "screening"
tool = "pandapower 3.5.3 / pvlib 0.15.2"
input_paths = ["cities/catalogue/west-asia/Iraq/Samawah/design.toml", "cities/catalogue/west-asia/Iraq/Samawah/samawah.toml", "lib/templates/climate.toml", "engineering/analysis/city_microgrid.py"]
result_path = "build/engineering/cities/samawah/energy/summary.json"
acceptance_criterion = "Grid-only and coordinated-daylight load flows converge and PV assumptions/results are recorded"
converged = true
limitations = "Planning transformer model and clear-sky/climate envelope only; utility topology, fault levels, measured load coincidence, tariffs and measured weather are not calibrated."

[[analysis]]
id = "OSR-AN-IFC-STN-001"
title = "Station manifest to IFC stable-ID interchange"
status = "screening"
tool = "IfcOpenShell 0.8.5"
input_paths = ["design/component-catalogue/catalog/buildable-stations/station-kit-manifest.json", "design/component-catalogue/src/osr_mech/station/product_geometry.py", "engineering/interchange/station_ifc.py"]
result_path = "engineering/models/bim/reference/stations/summary.json"
acceptance_criterion = "All seven station archetypes provide positive-volume geometry for every installed product row and round-trip IFC4.3 IDs, properties and assembly hierarchy without drift"
converged = true
limitations = "Coordinated design-reference geometry and supplier/site envelopes only; project CRS, surveyed placement, grade-specific materials, detailed lift/equipment internals, station IDS/BCF and engineering release remain open."

[[analysis]]
id = "OSR-AN-IFC-CIV-001"
title = "Deterministic IFC4.3 civil federation and 4D construction handoff"
status = "screening"
tool = "IfcOpenShell 0.8.5 / IfcTester 0.8.5 / BCF 0.8.5 / Bonsai 0.8.5 / Blender 5.2"
input_paths = ["design/component-catalogue/src/osr_mech/civil_systems_integration.py", "design/component-catalogue/src/osr_mech/fabrication_assembly_twin.py", "engineering/interchange/civil_bonsai_ifc.py"]
result_path = "build/engineering/bonsai-civil/civil-coordination.validation.json"
acceptance_criterion = "IFC4.3 reopens with 185 stable non-overlapping assets, 19 reusable types, 36 native IfcBearing/ELASTOMERIC occurrences, nine pier caps, nine columns, nine virtual foundation interfaces and 36 virtual jacking interfaces, 27 native support relationships with 60 bearing realizations connecting all 36 bearings to nine caps and 13 superstructure assets, three source-backed material families inherited by 46 occurrences, one native 60E1 material profile driving 32 matching rail extrusions, two typed IfcVehicle/ROLLINGSTOCK trainsets with standard measured base quantities, one internal classification with 15 references covering all assets, five native coordination groups, six native functional systems (three specialized as IfcBuiltSystem) and four native presentation layers covering all assets exactly once in each scheme, seven system-to-railway-part references, nine hard interface objectives with six native IfcMetric/EQUALTO length benchmarks, three qualitative-only gates, 107 scoped project/asset/group/system evidence links and one native external-reference relationship from the hash-locked civil source document to all 15 constraint resources, 16 project-declared property/quantity templates with 99 typed fields matching 487 definitions, one native USD schedule containing three generated planning rates with no product assignments or project total, 15 hash-locked native source documents linked to all assets, four rail discipline parts, one alignment with native horizontal/vertical planning layouts, gradient-curve geometry and stationing, 18 construction tasks whose five output stages link 134 physical products while 45 virtual interfaces remain explicitly named review gates, 20/20 IDS specifications and 3340/3340 IDS checks passing, a nine-item external engineering decision register with zero source-supported IFC implementation tasks open, plus three BCF 3.0 topics whose 26 selected IFC GUIDs resolve; every emitted artifact is byte-deterministic"
converged = true
limitations = "Design-reference coordination geometry and family-level material declarations only. Nine indexed external decisions govern survey/alignment, geotechnics/foundations, structural release, bearing supplier data, material specifications, classification, commercial scope, rolling stock and CDE control. Foundation and jacking envelopes are virtual interfaces rather than released physical products. IDS validates information delivery, not engineering adequacy; BCF decisions are Git-reviewed and reissued without implying engineering release."

[[analysis]]
id = "OSR-AN-CIV-THERM-001"
title = "Thermal-block solver benchmark"
status = "screening"
tool = "CalculiX 2.23"
input_paths = ["engineering/analysis/benchmarks/calculix/thermal-block.inp", "engineering/analysis/benchmarks/calculix/thermal_block.py"]
result_path = "build/engineering/analysis/benchmarks/calculix/thermal-block/summary.json"
acceptance_criterion = "Middle-plane temperature within 1e-6 C of 40 C, longitudinal heat flux within 1e-5 W/m2 of -80 W/m2 and transverse flux below 1e-10 W/m2"
converged = true
limitations = "Two-element steady-state conduction solver benchmark only; it does not model a civil assembly, thermal bridges, weather, moisture, solar gain or released materials."

[[analysis]]
id = "OSR-AN-IFC-LM3-MFG-001"
title = "Deterministic LM3 product, method and tooling IFC4.3 handoff"
status = "screening"
tool = "IfcOpenShell 0.8.5 / FreeCAD 1.1"
input_paths = ["design/component-catalogue/catalog/buildable-trainset/buildable-trainset-manifest.json", "lib/templates/trainset-manufacturing-methods.toml", "design/component-catalogue/src/osr_mech/rolling_stock/product_geometry.py", "design/component-catalogue/src/osr_mech/rolling_stock/manufacturing_tooling.py", "design/component-catalogue/src/osr_mech/freecad_product_library.py", "engineering/interchange/trainset_manufacturing_ifc.py", "engineering/interchange/lm3_product_ifc_library.py"]
result_path = "engineering/models/bim/reference/lm3-manufacturing-reference.index.json"
acceptance_criterion = "All 101 product items have positive, envelope-contained geometry (523 primitives); 101 split part files and 26 hierarchy-preserving assembly files round-trip deterministically in both IFC4.3 and native FreeCAD; every active item reaches the final trainset; 54 bought-in rows map once to 25 manufacturer-family anchors; nine timed methods, 59 tasks and 20 multi-part tooling families have no missing required tags"
converged = true
limitations = "Design-reference product/method/tooling coordination only. Assembly libraries use a spaced inspection-fixture layout and do not claim installed-coordinate or tolerance closure. The selectable FreeCAD solids and IFC meshes are not released mould surfaces, shop drawings or NC data; supplier freeze, calculations, qualified processes, first articles, independent assessment and national authorisation remain open."

