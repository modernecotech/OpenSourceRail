acceptance_criterion = "22 m global truss converges for 1.10 kPa gravity and 1.20 kPa uplift; displacement <= span/240 and axial stress <= 0.60 x S355 yield"
converged = true
limitations = "Two-dimensional axial load-path screen using catalogue pressures and gross areas; connections, buckling, fatigue, 3D stability, site actions, load combinations and foundations require deployment design and independent review."

