# The inventory checks live pointers as well as identified live prose. Historic
# benchmark and prototype texts may still refer to their own 10 m geometry.
[spec.inventory]
globs = ["README.md", "cities/Baghdad/**/*.md", "docs/ROADMAP.md", "docs/DESIGN-DECISIONS.md", "docs/RELEASE-*.md", "docs/workbench/**/*.md", "docs/workbench/current/index.html", "docs/operator-review/**/*.md", "docs/book/*.md", "engineering/development_baseline/web/index.html"]
targets = [
    "cities/Baghdad/STRAIGHT-THROUGH-DELIVERY.md",
    "cities/Baghdad/engineering/mechanical/civil/CURVED-BEAM-PROGRAMME.md",
    "cities/Baghdad/engineering/mechanical/civil/curved-beam-register.json.gz",
    "cities/Baghdad/engineering/mechanical/civil/LIVE-STOCK.md",
]
markers = ['(?:(?:current|active) (?:Baghdad )?(?:civil|delivery|viaduct|deck)|recurring (?:Baghdad )?(?:viaduct|deck|stock)).{0,72}\b(?P<value>\d+(?:\.\d+)?)[ -]m(?:etre[s]?)?\b.{0,40}\b(?:stock|pier|girder|beam|span)s?\b']
strict_readers = [
    "README.md", "cities/Baghdad/README.md", "cities/Baghdad/PROPOSAL.md", "cities/Baghdad/TRAIN-AND-STATION.md",
    "cities/Baghdad/PROCUREMENT.md",
    "cities/Baghdad/engineering/mechanical/civil/LIVE-STOCK.md", "docs/DESIGN-DECISIONS.md",
    "docs/operator-review/README.md", "docs/operator-review/WORKPLAN.md",
    "docs/operator-review/screens/README.md", "docs/operator-review/delivery/README.md",
]
obsolete_claims = ['(?<![\w.])(?:10(?:\.0+)?[ -]?m(?:et(?:re|er)s?)?|ten[ -]met(?:re|er)s?)\b\s+(?:[a-z-]+\s+){0,2}(?:beams?|girders?|spans?|box(?:es)?)\b']

