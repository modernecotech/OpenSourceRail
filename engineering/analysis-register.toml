[[analysis]]
id = "OSR-AN-ENE-CHG-001"
title = "Shared 500 kW charger and repeated 500 kWh station-module closure"
status = "planned"
tool = "osr-sim + osr-energy-site"
input_paths = ["lib/templates/energy-sites.toml", "lib/templates/stations.toml", "crates/osr-sim/src/energy.rs", "crates/osr-energy-site/src/lib.rs"]
result_path = ""
acceptance_criterion = "Power/current/efficiency limits, two-contact arbitration, 60 s charge, low-solar, grid outage and charger failure preserve route reserve on Samawah before full-catalog regeneration"
converged = false
limitations = "Current model uses planning efficiency and bus voltage; measured converter derating and station contact losses are pending."

[[analysis]]
id = "OSR-AN-RS-FIRE-001"
title = "Under-seat LFP propagation, outward vent and localized water-mist response"
status = "planned"
tool = "IEC 62928-based physical test + evacuation/control scenario"
input_paths = ["crates/osr-fire-safety/src/lib.rs", "crates/osr-bms/src/lib.rs", "docs/certification/hazard-log.md"]
result_path = ""
acceptance_criterion = "Detection latency, containment, propagation interval, vent direction, mist flow/pressure, failed pump/nozzle/reservoir and staged stop/evacuation satisfy the deployment safety case"
converged = false
limitations = "No physical module fire test has been performed; water mist is credited only for cooling and propagation control."

[[analysis]]
id = "OSR-AN-RS-BODY-001"
title = "Keyed composite cassette structural, environmental and serviceability release"
status = "planned"
tool = "coupon/insert/bond testing + dimensional survey + FreeCAD/CalculiX"
input_paths = ["mechanical-py/src/osr_mech/cad_templates/rolling_stock.py", "mechanical-py/src/osr_mech/rolling_stock/car_body.py", "docs/rolling-stock/light-metro-3car/body.md"]
result_path = ""
acceptance_criterion = "3-2-1 repeatability, anti-reversal, insert pull-out, bond durability, water ingress, fire/smoke/toxicity, mass/axle load and timed service removal pass"
