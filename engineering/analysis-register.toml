[[analysis]]
id = "OSR-AN-RS-HV-001"
title = "800 V-class pack topology, transient margin, isolation and interruption"
status = "planned"
tool = "circuit model + supplier qualification review"
input_paths = ["docs/rfcs/0021-battery-traction.md", "docs/rolling-stock/light-metro-3car/traction.md", "lib/templates/rolling-stock.toml"]
result_path = ""
acceptance_criterion = "Cell/string count, minimum/nominal/maximum voltage, regen transient, precharge, HVIL, IMD, creepage/clearance and contactor interrupt duty close with margin"
