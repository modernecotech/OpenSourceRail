schema_version = 1
statuses = ["planned", "screening", "calibrated", "independently-checked", "accepted"]

[[analysis]]
id = "OSR-AN-STN-PED-001"
title = "Station corridor normal and constrained passenger flow"
status = "screening"
tool = "JuPedSim 1.4.2"
input_paths = ["mechanical-py/catalog/buildable-stations/station-kit-manifest.json", "engineering/benchmarks/jupedsim/station-corridor.py"]
result_path = "build/engineering/benchmarks/jupedsim/station-corridor.json"
acceptance_criterion = "80 agents clear in <=90 s normal and <=120 s constrained; constrained is not faster"
converged = true
limitations = "Screening corridor only; demand, accessibility, stairs, gates and local egress criteria are not calibrated."

[[analysis]]
id = "OSR-AN-OPS-SUMO-001"
title = "Samawah network independent timetable run"
status = "screening"
tool = "Eclipse SUMO 1.27.1"
input_paths = ["designs/west-asia/Iraq/Samawah/design.toml", "designs/west-asia/Iraq/Samawah/samawah.corridor.geojson", "lib/templates/rolling-stock.toml", "engineering/benchmarks/sumo/city_timetable.py"]
result_path = "build/engineering/cities/samawah/sumo/summary.json"
acceptance_criterion = "All twelve scheduled services complete the three canonical routes"
converged = true
limitations = "Canonical GeoJSON geometry, not surveyed alignment; disconnected line models omit interchange conflicts, calibrated dwell and road interaction."

[[analysis]]
id = "OSR-AN-GIS-CITY-001"
title = "Samawah canonical city GeoPackage generation"
status = "screening"
tool = "QGIS 4.2.1 / GDAL 3.13.2"
input_paths = ["designs/west-asia/Iraq/Samawah/design.toml", "designs/west-asia/Iraq/Samawah/samawah.toml", "designs/west-asia/Iraq/Samawah/samawah.corridor.geojson", "engineering/gis/city_package.py"]
result_path = "build/engineering/cities/samawah/gis/summary.json"
acceptance_criterion = "GeoPackage is created with all populated canonical layers and zero input-schema findings"
converged = true
limitations = "EPSG:4326 catalogue geometry only; utilities, parcels, terrain, vertical datum, survey uncertainty and issue closure remain pending."

[[analysis]]
id = "OSR-AN-ENE-CITY-001"
title = "Samawah station microgrid and PV planning screen"
status = "screening"
tool = "pandapower 3.5.3 / pvlib 0.15.2"
input_paths = ["designs/west-asia/Iraq/Samawah/design.toml", "designs/west-asia/Iraq/Samawah/samawah.toml", "lib/templates/climate.toml", "engineering/energy/city_microgrid.py"]
result_path = "build/engineering/cities/samawah/energy/summary.json"
acceptance_criterion = "Grid-only and coordinated-daylight load flows converge and PV assumptions/results are recorded"
converged = true
limitations = "Planning transformer model and clear-sky/climate envelope only; utility topology, fault levels, measured load coincidence, tariffs and measured weather are not calibrated."

[[analysis]]
id = "OSR-AN-IFC-STN-001"
title = "Station manifest to IFC stable-ID interchange"
status = "screening"
tool = "IfcOpenShell 0.8.5"
input_paths = ["mechanical-py/catalog/buildable-stations/station-kit-manifest.json", "engineering/interchange/station_ifc.py"]
result_path = "build/engineering/interchange/stations/summary.json"
acceptance_criterion = "Standard and interchange-elevated product and assembly IDs round-trip without missing or unexpected IDs"
converged = true
limitations = "Product-structure coordination skeleton only; geometry placement, materials, IDS and BCF remain open."

[[analysis]]
id = "OSR-AN-IFC-CIV-001"
title = "Deterministic IFC4.3 civil federation and 4D construction handoff"
status = "screening"
tool = "IfcOpenShell 0.8.5 / IfcTester 0.8.5 / BCF 0.8.5 / Bonsai 0.8.5 / Blender 5.2"
input_paths = ["mechanical-py/src/osr_mech/civil_systems_integration.py", "mechanical-py/src/osr_mech/fabrication_assembly_twin.py", "engineering/interchange/civil_bonsai_ifc.py"]
result_path = "build/engineering/bonsai-civil/civil-coordination.validation.json"
acceptance_criterion = "IFC4.3 reopens with 95 stable assets, 17 reusable types, three source-backed material families inherited by 46 occurrences, one native 60E1 material profile driving 32 matching rail extrusions, one internal classification with 11 references covering all assets, 15 hash-locked native source documents linked to all assets, four rail discipline parts, one alignment reference, 18 construction tasks, all nine civil interface checks, 8/8 IDS specifications and 1222/1222 IDS checks passing, plus three BCF 3.0 topics whose 35 selected IFC GUIDs resolve; every emitted artifact is byte-deterministic"
converged = true
limitations = "Design-reference coordination geometry and family-level material declarations only; survey-grade alignment, project material grades, geotechnics, structural capacity/reinforcement and bearing release remain open. IDS validates information delivery, not engineering adequacy; BCF decisions are Git-reviewed and reissued without implying engineering release."

