limitations = "Candidate controller transient withstand and pack module data require supplier NDA/RFQ evidence."

[[analysis]]
id = "OSR-AN-RS-TRAC-001"
title = "HM47-class motor/controller gearbox, adhesion and hot-duty closure"
status = "planned"
tool = "osr-traction + mechanical drivetrain model + dynamometer evidence"
input_paths = ["mechanical-py/src/osr_mech/rolling_stock/baseline.py", "mechanical-py/src/osr_mech/rolling_stock/bogie/motor.py", "mechanical-py/src/osr_mech/rolling_stock/bogie/gearbox.py"]
result_path = ""
acceptance_criterion = "AW0-AW3 acceleration, grade, 0.05/0.10/0.15 adhesion, new/worn wheel overspeed, regen and repeated-stop thermal duty pass at 50 C"
converged = false
