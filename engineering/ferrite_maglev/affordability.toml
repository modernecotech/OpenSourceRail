schema = "osr-maglev-affordability-input/1"
price_basis = "2026-10-22 constant USD; unquoted budget and real-rate sensitivities, not a cost estimate or finance offer"
construction_years = 5
operating_years = 30
operating_days_per_year = 365
discount_rate = 0.05
charger_efficiency = 0.90
finance_fee_fraction = 0.02
comparison_capex_multiplier = 1.50
comparison_opex_multiplier = 1.10
comparison_foreign_debt_fraction = 0.90

# These are explicit scope-covering allowances, not configured supplier prices.
# Low/base/high reuse the matching existing manufacturing quantity scenario.
[[cases]]
id = "low"
station_building_access_usd_per_stop = 500000
grid_usd_per_powered_site = 100000
depot_usd_per_train = 15000
land_special_works_usd_per_route_km = 250000
factory_nre_usd = 20000000
design_qualification_fraction = 0.06
epc_fraction = 0.08
contingency_fraction = 0.15
electricity_usd_per_kwh = 0.06
fixed_zone_loss_kwh_per_event = 8.0
station_auxiliary_kw_per_stop = 10.0
staff_per_stop = 3.0
staff_per_train = 0.25
staff_per_line = 12.0
loaded_staff_usd_per_year = 10000
routine_maintenance_fraction = 0.010
renewal_fraction = 0.04
renewal_interval_years = 10
debt_fraction = 0.50
foreign_debt_fraction = 0.25
annual_real_interest = 0.04
repayment_years = 25

