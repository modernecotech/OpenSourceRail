# A development evidence index. Trace closure is not a claim that a railway is safe.
[[goal]]
id = "PILOT-TRACE"
description = "Current pilot development claims have explicit evidence paths and separate physical acceptance gates"
[[strategy]]
id = "PILOT-STRATEGY"
parent = "PILOT-TRACE"
description = "Separate engineering, delivery, formal control and unaccepted physical qualification"
children = ["PILOT-ENGINEERING", "PILOT-DELIVERY", "PILOT-FORMAL", "PILOT-PHYSICAL"]

[[goal]]
id = "PILOT-ENGINEERING"
description = "Controlled product, coupled actuator and corridor/schedule implementations are traceable; execution must be recorded separately"
[[solution]]
id = "E-PRODUCT"
parent = "PILOT-ENGINEERING"
description = "Configuration-specific product and allowance substitution"
[solution.evidence]
kind = "pytest"
path = "engineering/analysis/tests/test_ferrite_maglev_pilot_product.py"
[[solution]]
id = "E-ACTUATOR"
parent = "PILOT-ENGINEERING"
description = "Bounded coupled actuator and fault tests"
[solution.evidence]
kind = "pytest"
path = "engineering/analysis/tests/test_ferrite_maglev_pilot_actuators.py"
[[solution]]
id = "E-DELIVERY-SCHEDULE"
parent = "PILOT-ENGINEERING"
description = "Resource schedule, cash and comparison tests"
[solution.evidence]
kind = "pytest"
path = "engineering/analysis/tests/test_ferrite_maglev_delivery_schedule.py"
[[solution]]
id = "E-CORRIDOR"
parent = "PILOT-ENGINEERING"
description = "Pilot access, demand proxy and service tests"
[solution.evidence]
kind = "pytest"
path = "engineering/analysis/tests/test_ferrite_maglev_pilot_corridor.py"

