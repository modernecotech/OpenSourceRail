[package]
name = "osr-full-dynamics-kernel"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
osr-maglev-control = { path = "../../../crates/osr-maglev-control" }

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
overflow-checks = true
panic = "abort"

[lints.rust]
unsafe_code = "deny"
