id = "OSR-ENG-001"
version = "1.0.0"
title = "Shared engineering definition, numerical verification and physical correlation"
status = "active-internal-process-standard"
effective_date = "2026-10-10"
owner = "OpenSourceRail engineering"
iso_catalogue_checked = "2026-10-10"
iso_conformity_claimed = false
basis = "OpenSourceRail engineering practice; ISO references define applicable method and quality domains. Numerical thresholds below are OpenSourceRail rules, not ISO limits."
precedence = ["applicable law and authority requirements", "accepted project design basis", "applicable adopted ISO method/edition", "OpenSourceRail process and numerical rules"]

[numerical]
refinement_relative_limit = 0.05
force_equilibrium_relative_limit = 0.001
moment_equilibrium_relative_limit = 0.001
contact_work_absolute_limit_w = 0.000001
section_equilibrium_relative_limit = 0.00001
benchmark_relative_limit = 0.000001
native_datum_residual_limit_mm = 0.00001
native_orientation_residual_limit_rad = 0.00000001
minimum_independent_refinement_levels = 2

[correlation]
standardised_holdout_rmse_limit = 2.0
standardised_absolute_holdout_bias_limit = 1.0
holdout_specimens_must_be_separate = true
require_identifiable_parameters = true
require_positive_measurement_uncertainty = true
require_retained_measurement_and_calibration_hashes = true
synthetic_data_can_establish_physical_validation = false
basis = "Candidate model screening against declared measurement uncertainty; not a reliability probability or an ISO acceptance band. Residual autocorrelation, model discrepancy and extrapolation require independent review."

[service]
minimum_normal_contact_n = 0.0
normal_contact_must_be_strictly_positive = true
require_geometry_specific_lateral_vertical_limit = true
require_weighted_ride_evaluation = true
require_complete_passage_and_resonance_cases = true
require_empty_nominal_crush_uneven = true
require_braking_rescue_maintenance_degradation = true
require_both_tracks_and_arrival_offsets = true
raw_peak_acceleration_is_iso_comfort_result = false
basis = "OpenSourceRail normal-service contact policy. Distress tests are separately authorised; their contact loss is retained and cannot qualify normal operation."

[manufacturing]
require_released_installation_geometry = true
require_complete_physical_joint_definition = true
require_measured_mass_cg_inertia = true
require_material_batch_and_serial_traceability = true
require_calibrated_characteristic_results = true
require_resolved_nonconformances = true
require_frozen_as_built_and_as_maintained = true
require_independent_review_and_authority_release = true
successful_cad_generation_issues_drawing = false

