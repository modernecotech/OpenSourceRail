schema = "osr-civil-shape-competition/1"
purpose = "next-experiment"
span_m = 20.0
deck_width_m = 2.0
families = ["reference_box", "ribbed_u", "variable_depth_box", "folded_plate", "hybrid_steel_concrete", "load_following_ribs"]
profiles = ["lean", "reference", "robust"]
maximum_candidates = 18
reference_changes_allowed = false

[production]
shifts_per_day = 2
hours_per_shift = 8
productive_utilisation = 0.75

[construction]
shifts_per_day = 2
hours_per_shift = 8

[screening]
maximum_stage_1_tasks = 6
maximum_runtime_s_per_task = 150
maximum_memory_bytes_per_task = 5368709120

# All new rates below are editable Class C planning assumptions. They are
# neither quoted prices, physical sizing results nor validated process times.
[rates]
concrete_labour_h_per_m3 = [0.5, 1.5, 4.0]
form_labour_h_per_m2 = [0.1, 0.3, 0.8]
steel_fabrication_h_per_kg = [0.01, 0.03, 0.08]
reinforcement_labour_h_per_kg = [0.005, 0.015, 0.04]
prestress_reserve_kg_per_m3 = [4.0, 8.0, 16.0]
prestress_handling_h_per_kg = [0.02, 0.05, 0.15]
form_tooling_iqd_per_m2 = [250000.0, 750000.0, 2500000.0]
form_reuses = [200.0, 100.0, 40.0]
inspection_iqd_per_m2 = [1000.0, 5000.0, 20000.0]
machine_hours_per_factory_labour_hour = [0.1, 0.2, 0.4]
surface_coating_iqd_per_m2 = [5000.0, 20000.0, 80000.0]
site_hours_per_span = [8.0, 24.0, 80.0]
site_support_foundation_bearings_allowance_iqd = [5000000.0, 20000000.0, 100000000.0]
site_services_allowance_iqd = [250000.0, 1000000.0, 5000000.0]
annual_maintenance_fraction_of_installed = [0.005, 0.015, 0.04]
renewal_fraction_at_year_15 = [0.05, 0.15, 0.4]
disposal_fraction_at_year_30 = [0.01, 0.05, 0.15]

# Complexity multiplies forming/fabrication hours and form investment; actual
# geometry still determines volumes, exposed surfaces and lifting stock.
[complexity]
reference_box = [1.0, 1.0, 1.0]
ribbed_u = [1.05, 1.3, 2.0]
variable_depth_box = [1.1, 1.6, 2.8]
folded_plate = [1.1, 1.7, 3.0]
hybrid_steel_concrete = [1.2, 1.8, 3.5]
load_following_ribs = [1.3, 2.2, 4.5]
