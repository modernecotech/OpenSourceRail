[[work]]
id = "installed-vehicle"
required = true
outputs = ["located parts/materials/quantities and interfaces", "mass/CG/inertia/axle reactions", "shaft and gear geometry", "brake and suspension retention", "fastener/tool/removal paths", "electrical/cooling/protection installation"]
closure = "No unexplained quantity/interface mismatch or known geometric contradiction within the declared dimensions and motion domain; major equipment has actual or explicitly bounded source geometry. Force, braking, heat and cost use this same revision."
qualification = "Supplier conformity, fatigue, dynamics, thermal tests and independent hardware acceptance remain separate."

[[work]]
id = "controlled-research-documents"
required = true
outputs = ["drawing/material/interface/tolerance definitions", "inspection characteristics", "fabrication/routing/tooling/assembly definitions", "part-to-document coverage manifest"]
closure = "Required component and assembly document coverage is complete at controlled-research-draft maturity; real payload bytes and exact part/candidate/revision identities verify. Missing documents remain missing."
qualification = "Controlled research drawings are not approved production instructions."

[[work]]
id = "mapped-corridor"
required = true
outputs = ["city and mapped route/station source", "selected detailed candidate binding", "route-class/grade/curve/site assumptions", "protected service/fleet/energy evaluation", "fourteen-scope quantities/costs/delivery"]
closure = "A mapped Baghdad corridor and smaller-city control use their own geometry, station/service/site assumptions and the detailed vehicle/drive/civil revision. A scalar pilot cost-per-kilometre multiplier is insufficient."
qualification = "Demand surveys, utilities, land, ground and actual site acceptance remain explicit external evidence."

[[work]]
id = "native-gis-return-path"
required = true
outputs = ["bounded authenticated native project import", "typed edits into the existing planning workflow", "updated geometry/service/fleet/cost/delivery", "verified study export for another native edit"]
closure = "Published and revised native projects round-trip through the canonical evaluator; equivalent planning and native edits agree. Stale identities, wrong CRS, unsupported/injected fields and resource excess fail explicitly."

[[work]]
id = "candidate-business-lifecycle"
required = true
outputs = ["source-priced reviewed Item/BOM/routing/inspection mapping", "authenticated project/revision review", "disposable native manufacture/QA/serial-install/observation/repair/handback evidence", "permission/outage/mismatch/refusal controls"]
closure = "The native acceptance scenario consumes the actual sealed candidate and controlled documents with declared component coverage. Synthetic unit fixtures and the retained one-kit scenario do not establish this closure."
qualification = "Business workflow completion grants no railway movement authority or hardware approval."

[[work]]
id = "all-city-outline-reconciliation"
required = true
outputs = ["all 266 city maps, line/station details and v0.4 front-door fields retained", "city/line-specific demand, calendar, headway, dwell and bounded uncertainty", "alignment alternatives with straightness/deviation and close-station consolidation evidence", "candidate-bound route, service, fleet, energy, civil and fourteen-scope cost updates", "Chinese-volume-procurement versus local-manufacture and funding scenarios", "source and candidate identities with incremental recomputation records"]
closure = "All 266 cities retain their mapped line-level outline, energy, capital/funding and local-evidence content. City/line calculations replace the universal 4,000 pphpd/200 s profile with sourced local inputs or explicit bounded scenarios. Routes are compared for directness and station proximity with access, curvature, land and service constraints recorded; ring-like networks include a square-loop alternative when applicable. Every edit propagates through the exact candidate bundle to quantities, service, fleet, energy, civil and all fourteen cost scopes; no scalar pilot cost-per-kilometre multiplier or inherited candidate result is used. China bulk-purchase discounts and establishing local manufacturing are comparable calculated scenarios with stated assumptions."
qualification = "City demand, land, utility, ground, supplier, tariff, tax, funding and local-price evidence may remain bounded assumptions; they are never presented as surveyed or quoted facts."

[[work]]
id = "unified-workbench"
required = true
outputs = ["city brief to compatible alternatives", "same-candidate journey/cost/delivery comparison", "drawing/BOM/manufacturing inspection", "review and remaining-evidence view", "downloadable reconciled project dossier"]
closure = "An end user can follow one project through the existing Workbench without manually reconciling candidate IDs or substituting a fixed-outline cost for a different detailed vehicle."

