schema = "osr-practical-launch-comparison/1"
purpose = "next-experiment"
reference_selector = "engineering/development-baseline.toml"
reference_changes_allowed = false
native_dispatch = false
maximum_cases = 200
maximum_runtime_s = 30

[space]
speed_m_s = [12.0, 16.0, 20.0]
acceleration_m_s2 = [0.4, 0.8]
grade_fraction = [0.0, 0.02]
fixed_drive_bank_m = [100.0, 500.0]
wheel_store_types = ["battery", "supercapacitor", "hybrid"]

[comparison]
station_spacing_m = 2000.0
target_headway_s = 120.0
dwell_s = 35.0
service_deceleration_m_s2 = 0.6
driven_axles = 12
total_axles = 24
traction_adhesion_hypotheses = [0.05, 0.10, 0.15]
drive_efficiency_hypotheses = [0.85, 0.90]
charger_efficiency_hypothesis = 0.95
usable_store_fraction_hypothesis = 0.70
end_of_life_fraction_hypothesis = 0.80
roller_friction_hypotheses = [0.10, 0.20]
cable_launch_stroke_m = 500.0
additional_mass_sensitivity_kg_train = [3000.0, 6000.0, 12000.0]

# This first cheap-bound study is not the complete design space. Higher
# acceleration is a revisable hypothesis, not an approved passenger limit.
# No available force, actual installed mass or hardware price is supplied.
