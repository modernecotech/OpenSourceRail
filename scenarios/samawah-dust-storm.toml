# Samawah with fault injection — dust storm during AM peak, then a late
# afternoon grid outage at the depot.
#
# Same topology and fleet as scenarios/samawah.toml. Demonstrates how the
# same network behaves under stress events (RFC 0002 §5.4 dust resilience;
# RFC 0001 §8 degraded-mode operation).
#
# Run:
#   cargo run --release --bin osr-sim -- --config scenarios/samawah-dust-storm.toml \
#       --duration 54000 --status-every 3600

# ===========================================================================
# This file is an overlay example — copy the full content of samawah.toml
# then append the [[faults]] section. For brevity the body is identical to
# scenarios/samawah.toml. In real use you would copy and edit a single file,
# not maintain two.
# ===========================================================================

[scenario]
name = "Samawah — with dust storm + depot grid outage"
start_time = "06:00"

[climate]
ambient_c = 42.0
peak_sun_hours = 6.0

