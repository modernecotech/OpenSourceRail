# ===========================================================================
#                              FAULT SCENARIOS
# ===========================================================================
# Two faults fire during the run: a system-wide dust storm during AM peak
# that cuts PV output to 30% for four hours, and a depot grid-tie failure in
# mid-afternoon so we can see the depot ride through on stored energy alone.

[[faults]]
name = "morning dust storm"
kind = "dust_event"
from = "07:00"
to = "11:00"
pv_output_factor = 0.3              # 70% PV loss system-wide

[[faults]]
name = "depot grid outage"
kind = "grid_outage"
from = "13:00"
to = "16:00"
station = "east-depot"              # omit station for system-wide outage

[[faults]]
name = "AMU pad service"
kind = "charging_pad_outage"
from = "14:00"
to = "18:00"
station = "al-muthanna-university"
