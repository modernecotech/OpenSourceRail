# Samawah Line 1 only — simpler variant of samawah.toml useful for scale
# comparisons and for experimenting with changes to just the radial line.

[scenario]
name = "Samawah Line 1 only"
start_time = "06:00"

[climate]
ambient_c = 42.0
peak_sun_hours = 6.0

[[stations]]
id = "samawah-rws"
name = "Samawah Railway Station"
charging_power_kw = 1000
dwell_seconds = 60
is_terminal = true

[[stations]]
id = "north-gate"
name = "North Gate"
dwell_seconds = 30

[[stations]]
id = "old-souq"
name = "Old Souq"
dwell_seconds = 30

[[stations]]
id = "samawah-central"
name = "Samawah Central"
charging_power_kw = 500
dwell_seconds = 45

[[stations]]
id = "riverside"
name = "Riverside"
dwell_seconds = 30

[[stations]]
id = "eastern-bridge"
name = "Eastern Bridge"
charging_power_kw = 500
dwell_seconds = 45

[[stations]]
id = "al-salam"
name = "Al-Salam"
dwell_seconds = 30

[[stations]]
id = "governorate-hospital"
name = "Governorate Hospital"
charging_power_kw = 500
dwell_seconds = 45

[[stations]]
id = "new-german-hospital"
name = "New German Hospital"
charging_power_kw = 500
dwell_seconds = 45

[[stations]]
id = "engineering-quarter"
name = "Engineering Quarter"
dwell_seconds = 30

[[stations]]
id = "al-muthanna-university"
name = "Al-Muthanna University"
charging_power_kw = 500
dwell_seconds = 60

[[stations]]
id = "east-depot"
name = "East Depot & Yard"
charging_power_kw = 1000
dwell_seconds = 240
is_terminal = true
is_depot = true

[[lines]]
id = "line-1"
name = "Line 1 Nahrain"
is_ring = false
stations = [
    { id = "samawah-rws",            distance_from_prev_m = 0 },
    { id = "north-gate",             distance_from_prev_m = 1000 },
    { id = "old-souq",               distance_from_prev_m = 1300 },
    { id = "samawah-central",        distance_from_prev_m = 1100 },
    { id = "riverside",              distance_from_prev_m = 900 },
    { id = "eastern-bridge",         distance_from_prev_m = 1200 },
    { id = "al-salam",               distance_from_prev_m = 1400 },
    { id = "governorate-hospital",   distance_from_prev_m = 1300 },
    { id = "new-german-hospital",    distance_from_prev_m = 1500 },
    { id = "engineering-quarter",    distance_from_prev_m = 1300 },
    { id = "al-muthanna-university", distance_from_prev_m = 1400 },
    { id = "east-depot",             distance_from_prev_m = 600 },
]

[[fleets]]
line = "line-1"
trainset_count = 6
dispatch_points = [
    { station = "samawah-rws", heading = "forward" },
    { station = "east-depot",  heading = "reverse" },
]
service_start = "05:30"
service_end   = "23:30"
schedule = [
    { from = "05:30", to = "07:00", headway_min = 10 },
    { from = "07:00", to = "09:30", headway_min = 4 },
    { from = "09:30", to = "16:00", headway_min = 8 },
    { from = "16:00", to = "19:00", headway_min = 4 },
    { from = "19:00", to = "22:00", headway_min = 10 },
    { from = "22:00", to = "23:30", headway_min = 15 },
]

# Energy sites — same allocation as samawah.toml for the Line 1 stations.
[[sites]]
station = "samawah-rws"
pv_nameplate_kw = 500
storage_capacity_kwh = 3000
storage_max_charge_kw = 1500
storage_max_discharge_kw = 1500
storage_initial_soc = 0.6
grid_import_kw = 800
grid_export_kw = 800

