<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">v0.7 joined prototype nominal arrangement</title>
  <desc id="desc">A schematic plan of two rail tracks around a central island platform and a schematic section showing 10.8 metre track centres, 8 metre platform, two metre beams, car body width and overhead collector envelope. Dimensions are quotation nominals, not fabrication tolerances.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172337; font-size: 16px; }
    .small { font-size: 13px; }
    .head { font-size: 23px; font-weight: bold; }
    .rail { stroke: #35475f; stroke-width: 5; }
    .dim { stroke: #a33a27; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    .guide { stroke: #8a99a8; stroke-width: 1.5; stroke-dasharray: 5 5; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a33a27"/></marker></defs>
  <text class="head" x="36" y="38">v0.7 powered wheel prototype: joined quotation geometry</text>
  <text class="small" x="36" y="61">Physical candidate osr-v07-joined-prototype-20261117 · schematic only · not a fabrication or safety drawing</text>

  <text x="36" y="105">Station plan, straight and approximately level</text>
  <rect x="94" y="142" width="880" height="112" fill="#d6e5cf" stroke="#587b4c" stroke-width="2"/>
  <text x="385" y="203">125 m × 8 m island platform</text>
  <line class="rail" x1="65" y1="115" x2="1007" y2="115"/>
  <line class="rail" x1="65" y1="281" x2="1007" y2="281"/>
  <rect x="166" y="83" width="736" height="25" rx="9" fill="#aac4e6" stroke="#346195" stroke-width="2"/>
  <rect x="166" y="287" width="736" height="25" rx="9" fill="#aac4e6" stroke="#346195" stroke-width="2"/>
  <text class="small" x="423" y="99">104.5 m six-car train → doors face island</text>
  <text class="small" x="423" y="305">← 104.5 m six-car train · doors face island</text>
  <line class="dim" x1="94" y1="326" x2="974" y2="326"/>
  <text class="small" x="504" y="347">125 m platform</text>
  <line class="dim" x1="166" y1="365" x2="902" y2="365"/>
  <text class="small" x="486" y="387">104.5 m train</text>
  <text class="small" x="74" y="384">10.25 m</text><text class="small" x="922" y="384">10.25 m</text>

  <text x="36" y="431">Station cross section, looking along the line</text>
  <rect x="350" y="494" width="400" height="43" fill="#d6e5cf" stroke="#587b4c" stroke-width="2"/>
  <text class="small" x="482" y="521">8.0 m island</text>
  <rect x="230" y="557" width="100" height="48" fill="#c6cdd5" stroke="#526272" stroke-width="2"/>
  <rect x="770" y="557" width="100" height="48" fill="#c6cdd5" stroke="#526272" stroke-width="2"/>
  <text class="small" x="232" y="625">2.0 m beam</text><text class="small" x="773" y="625">2.0 m beam</text>
  <line class="rail" x1="263" y1="553" x2="297" y2="553"/>
  <line class="rail" x1="803" y1="553" x2="837" y2="553"/>
  <path d="M214 504 L346 504 L346 475 L214 475 Z" fill="#aac4e6" stroke="#346195" stroke-width="2"/>
  <path d="M754 475 L886 475 L886 504 L754 504 Z" fill="#aac4e6" stroke="#346195" stroke-width="2"/>
  <text class="small" x="116" y="490">2.65 m body</text><text class="small" x="887" y="490">2.65 m body</text>
  <line class="guide" x1="280" y1="455" x2="280" y2="638"/>
  <line class="guide" x1="820" y1="455" x2="820" y2="638"/>
  <line class="dim" x1="280" y1="645" x2="820" y2="645"/>
  <text class="small" x="495" y="666">10.8 m track centres</text>
  <text class="small" x="355" y="480">75 mm static gap*</text>
  <text class="small" x="38" y="654">* Swept accessible gap, overhead height and all structural seats require survey, supplier drawings and qualification.</text>
</svg>
