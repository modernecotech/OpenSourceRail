<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">v0.7 ten metre beam and central platform concept</title>
  <desc id="desc">Schematic elevation of one ten metre simply supported beam with six metre pier and two and a half metre footing, plus plan of a 125 by 8 metre central platform between two tracks.</desc>
  <style>
    text { font: 16px sans-serif; fill: #18323a; }
    .small { font-size: 13px; }
    .heading { font-size: 23px; font-weight: 700; }
    .beam { fill: #b3ccd0; stroke: #18323a; stroke-width: 3; }
    .support { fill: #d3ded7; stroke: #18323a; stroke-width: 3; }
    .rail { stroke: #41565b; stroke-width: 5; }
    .dim { stroke: #087e85; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    .dash { stroke: #62737a; stroke-width: 2; stroke-dasharray: 7 5; }
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#087e85"/></marker></defs>
  <text class="heading" x="45" y="42">Representative elevated span — concept interface</text>
  <line class="rail" x1="100" y1="105" x2="700" y2="105"/>
  <rect class="beam" x="120" y="115" width="560" height="78"/>
  <rect class="support" x="120" y="197" width="56" height="217"/>
  <rect class="support" x="624" y="197" width="56" height="217"/>
  <rect class="support" x="83" y="414" width="130" height="33"/>
  <rect class="support" x="587" y="414" width="130" height="33"/>
  <line class="dim" x1="120" y1="80" x2="680" y2="80"/>
  <text x="337" y="72">10.0 m beam bay</text>
  <line class="dim" x1="735" y1="115" x2="735" y2="193"/>
  <text x="750" y="155">1.4 m beam depth</text>
  <line class="dim" x1="55" y1="197" x2="55" y2="414"/>
  <text x="78" y="318">6.0 m pier module</text>
  <text class="small" x="245" y="239">One beam per track; independent seats and supports</text>
  <text class="small" x="245" y="264">Section width 2.0 m; 1,435 mm rail gauge</text>
  <text class="small" x="245" y="289">Four bearing units per beam: provisional cost account</text>
  <text class="small" x="245" y="314">Footing module 2.5 × 2.5 × 1.0 m: quantity allowance only</text>
  <text class="heading" x="45" y="502">Representative central-platform station — plan</text>
  <line class="rail" x1="85" y1="535" x2="915" y2="535"/>
  <rect class="support" x="85" y="548" width="830" height="62"/>
  <line class="rail" x1="85" y1="623" x2="915" y2="623"/>
  <line class="dim" x1="85" y1="520" x2="915" y2="520"/>
  <text x="405" y="514">125 m platform</text>
  <text x="315" y="584">8 m island platform; six-car 104.5 m train</text>
  <text class="small" x="93" y="600">Egress</text><text class="small" x="823" y="600">Egress</text>
  <text class="small" x="766" y="643">Schematic, not to scale</text>
</svg>
