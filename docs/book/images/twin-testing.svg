<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f9fa"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#50717c"/>
    </marker>
  </defs>
  <g font-family="DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="600" y="51" font-size="30" font-weight="bold" fill="#172f3c">One candidate, several kinds of evidence</text>
    <text x="600" y="86" font-size="18" fill="#4d6470">Every change keeps its design identity and declares what must be recalculated</text>
    <rect x="40" y="132" width="330" height="116" rx="15" fill="#e1f0f2" stroke="#2c7e87" stroke-width="3"/>
    <text x="205" y="177" font-size="22" font-weight="bold" fill="#165d67">Physical definition</text>
    <text x="205" y="210" font-size="17" fill="#263c46">Shape, material, joints, equipment</text>
    <rect x="435" y="132" width="330" height="116" rx="15" fill="#e8eef9" stroke="#5e78ad" stroke-width="3"/>
    <text x="600" y="177" font-size="22" font-weight="bold" fill="#344e82">Counted installation</text>
    <text x="600" y="210" font-size="17" fill="#263c46">Mass, parts, locations, service access</text>
    <rect x="830" y="132" width="330" height="116" rx="15" fill="#f8efde" stroke="#aa823d" stroke-width="3"/>
    <text x="995" y="177" font-size="22" font-weight="bold" fill="#806025">Declared tests</text>
    <text x="995" y="210" font-size="17" fill="#263c46">Loads, journeys, heat, faults</text>
    <path d="M370 190H425" stroke="#50717c" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M765 190H820" stroke="#50717c" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M995 249V292" stroke="#50717c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="830" y="303" width="330" height="116" rx="15" fill="#e8eef9" stroke="#5e78ad" stroke-width="3"/>
    <text x="995" y="348" font-size="22" font-weight="bold" fill="#344e82">Independent checks</text>
    <text x="995" y="380" font-size="17" fill="#263c46">Reopen, compare, challenge, repeat</text>
    <path d="M830 361H775" stroke="#50717c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="435" y="303" width="330" height="116" rx="15" fill="#e1f0f2" stroke="#2c7e87" stroke-width="3"/>
    <text x="600" y="348" font-size="22" font-weight="bold" fill="#165d67">Model result</text>
    <text x="600" y="380" font-size="17" fill="#263c46">Pass, fail, incomplete or out of domain</text>
    <path d="M435 361H380" stroke="#50717c" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="40" y="303" width="330" height="116" rx="15" fill="#e8eef9" stroke="#5e78ad" stroke-width="3"/>
    <text x="205" y="348" font-size="22" font-weight="bold" fill="#344e82">Design decision</text>
    <text x="205" y="380" font-size="17" fill="#263c46">Revise, retain or study alternatives</text>
    <rect x="95" y="478" width="1010" height="100" rx="15" fill="#fff7e9" stroke="#b78639" stroke-width="3"/>
    <text x="600" y="519" font-size="22" font-weight="bold" fill="#805d23">Physical acceptance remains a separate step</text>
    <text x="600" y="552" font-size="17" fill="#263c46">Measurements, approved limits, qualified production and independent review</text>
  </g>
</svg>
