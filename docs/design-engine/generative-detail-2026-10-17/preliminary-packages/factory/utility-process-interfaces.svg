<svg xmlns="http://www.w3.org/2000/svg" width="800" height="595" viewBox="0 0 800 595"><rect width="800" height="595" fill="#f7f6f0"/><g font-family="sans-serif" font-size="14" fill="#263946"><text x="20" y="30" font-size="19">Factory utility / process interface investigation</text><text x="20" y="53">Hypotheses only. Sizing, hazards and commissioned performance remain unaccepted.</text><rect x="20" y="75" width="280" height="48" rx="5" fill="#e0eef3"/><text x="30" y="104">415V hypothesis bus</text><path d="M300 99H360" stroke="#506775" stroke-width="2"/><rect x="360" y="75" width="405" height="48" rx="5" fill="#e7eddd"/><text x="370" y="104">Machines / local isolation</text><rect x="20" y="150" width="280" height="48" rx="5" fill="#e0eef3"/><text x="30" y="179">Air header / receivers</text><path d="M300 174H360" stroke="#506775" stroke-width="2"/><rect x="360" y="150" width="405" height="48" rx="5" fill="#e7eddd"/><text x="370" y="179">CMM clean-air and resin branches</text><rect x="20" y="225" width="280" height="48" rx="5" fill="#e0eef3"/><text x="30" y="254">Clean water / thermal loop</text><path d="M300 249H360" stroke="#506775" stroke-width="2"/><rect x="360" y="225" width="405" height="48" rx="5" fill="#e7eddd"/><text x="370" y="254">Batch / curing / cooling</text><rect x="20" y="300" width="280" height="48" rx="5" fill="#e0eef3"/><text x="30" y="329">Dirty washout / reclaim</text><path d="M300 324H360" stroke="#506775" stroke-width="2"/><rect x="360" y="300" width="405" height="48" rx="5" fill="#e7eddd"/><text x="370" y="329">Contained treatment / agreed outfall</text><rect x="20" y="375" width="280" height="48" rx="5" fill="#e0eef3"/><text x="30" y="404">Separate LEV systems</text><path d="M300 399H360" stroke="#506775" stroke-width="2"/><rect x="360" y="375" width="405" height="48" rx="5" fill="#e7eddd"/><text x="370" y="404">Weld / GRP / resin source controls</text><rect x="20" y="450" width="280" height="48" rx="5" fill="#e0eef3"/><text x="30" y="479">Fire reserved space</text><path d="M300 474H360" stroke="#506775" stroke-width="2"/><rect x="360" y="450" width="405" height="48" rx="5" fill="#e7eddd"/><text x="370" y="479">Unaccepted fire strategy and duty</text><text x="20" y="565">Separate process streams; diagram establishes no distribution route, fire compliance or release.</text></g></svg>