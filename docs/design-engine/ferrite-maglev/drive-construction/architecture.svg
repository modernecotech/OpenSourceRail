<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#f3f8fc"/><g font-family="sans-serif" fill="#15384c"><text x="25" y="40" font-size="26">Separate support/guidance and station launch control</text><g fill="#d7eaf3" stroke="#376178"><rect x="30" y="90" width="330" height="115" rx="10"/><rect x="430" y="90" width="330" height="115" rx="10"/><rect x="830" y="90" width="330" height="115" rx="10"/><rect x="30" y="300" width="330" height="135" rx="10"/><rect x="430" y="300" width="330" height="135" rx="10"/><rect x="830" y="300" width="330" height="135" rx="10"/></g><g font-size="18"><text x="45" y="120">Car SBC: force allocation / logging</text><text x="45" y="151">Rust supervisor; 1 kHz study frame</text><text x="45" y="181">No direct power-gate operation</text><text x="445" y="120">24 local MCU boards / car</text><text x="445" y="151">48 current circuits at 20 kHz</text><text x="445" y="181">Dual current + gap acquisition</text><text x="845" y="120">PM-biased support / guidance</text><text x="845" y="151">72 physical trim coils / car</text><text x="845" y="181">288 H-bridges / six-car train</text><text x="45" y="332">Wayside authority + phase</text><text x="45" y="363">Protected receiver and DC sink</text><text x="45" y="394">Independent onboard recovery</text><text x="445" y="332">Four local converter controllers</text><text x="445" y="363">Clarke / Park + bounded PI</text><text x="445" y="394">2400 V hypothesis: no hardware</text><text x="845" y="332">350 m motor / direction</text><text x="845" y="363">560 face cassettes / station</text><text x="845" y="394">Three-phase fixed winding groups</text></g><g stroke="#376178" stroke-width="4"><path d="M360 148H430M760 148H830M360 360H430M760 360H830"/></g><g font-size="18"><text x="30" y="490">Local independent protection: overcurrent / temperature / bus / watchdog / capture and support energy</text><text x="30" y="530">A wayside launch or receive fault must not remove onboard support.</text><text x="30" y="575">Executed software uses synthetic frames and average-voltage RL plants. No PWM/ADC adapter or real-time qualification.</text><text x="30" y="620">All engineering, manufacturing and physical release gates remain open.</text></g></g></svg>
