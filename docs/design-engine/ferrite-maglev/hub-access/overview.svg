<text x="670" y="125" font-size="16">942 m corridor plus 36 m station-interface spurs</text>
<text x="670" y="161" font-size="16">54 deck bays; 55 unique support positions</text>
<text x="670" y="197" font-size="16">108 independently counted bearing seats</text>
<text x="670" y="233" font-size="16">19 recessed resting bays; clear route retained</text>
<text x="670" y="269" font-size="16">3 proposed access cores; datum +8 m assumed</text>
<text x="670" y="305" font-size="16">Three widths: 3.0 / 4.2 / 6.6 m; two stock sections</text>
<text x="670" y="341" font-size="16">All retained route bends receive support positions.</text>
<text x="670" y="377" font-size="16">12 m east offset; three counted platform spurs.</text>
<text x="670" y="413" font-size="16">All platform pairs: 495 to 966 m.</text>
<text x="670" y="449" font-size="16">Longest: 16.10 min at 1 m/s; 26.83 min at 0.6 m/s.</text>
<text x="670" y="485" font-size="16">Outer-to-outer path skips the middle-platform spur.</text>
<text x="670" y="521" font-size="16">Ramp alternative: sixteen separated 1:20 runs.</text>
<text x="670" y="557" font-size="16">Twin lifts are not automatically outage-resilient.</text>
<text x="670" y="593" font-size="16">Four-lift case still fails total common power loss.</text>
<text x="670" y="629" font-size="16">Crowd pulses and waiting areas are explicit assumptions.</text>
<text x="670" y="665" font-size="16">New shared-site circulation kits do not fit train tangents.</text>
<text x="670" y="701" font-size="16">Loads are unfactored UK-informed research benchmarks.</text>
<text x="670" y="737" font-size="16">Foundations, connections and fire strategy remain open.</text>
<text x="30" y="815" font-size="14">Grey: source guideway. Green: translated access deck and spurs. Amber: preliminary supports. Purple: access cores.</text></g></svg>
