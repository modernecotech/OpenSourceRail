<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-label="Adverse cycle balanced charging requirements"><rect width="1100" height="450" fill="#f1f5f9"/><g fill="#14283d" font-family="sans-serif"><text x="25" y="36" font-size="23">Calculated charging duty per car — assumed level 1 km cycle</text><text x="25" y="67" font-size="15">Heaviest target AW3; 60 s dwell / 45 s effective charge; excludes additional conversion losses.</text><text x="25" y="110" font-size="16">Hot 80 km/h; regen unavailable</text><rect x="370" y="88" width="408.9858282733231" height="33" fill="#087f78"/><text x="788.985828273323" y="111" font-size="16">540.2 kW</text><text x="25" y="205" font-size="16">Hot 90 km/h; regen available</text><rect x="370" y="183" width="413.4622331814902" height="33" fill="#087f78"/><text x="793.4622331814902" y="206" font-size="16">546.1 kW</text><text x="25" y="300" font-size="16">Hot 90 km/h; regen unavailable</text><rect x="370" y="278" width="469.0156185981569" height="33" fill="#087f78"/><text x="849.0156185981568" y="301" font-size="16">619.5 kW</text><line x1="824.2857142857142" x2="824.2857142857142" y1="80" y2="345" stroke="#a72a34" stroke-width="3"/><text x="25" y="405" font-size="17">Red line: 600 kW charger candidate. These calculations do not validate motor efficiency or route operation.</text></g></svg>