<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc" lang="ar">
  <title id="title">مقارنة طول شبكتي النقل السككي المقترحتين لبغداد</title>
  <desc id="desc">مترو بغداد المعلن عام 2024: 148 كم. سيناريو OpenSourceRail التخطيطي: 513.336 كم، أي نحو 3.47 أضعاف. لا تعني زيادة الأطوال وحدها زيادة وصول السكان.</desc>
  <rect width="1200" height="280" fill="#f4f7f9"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#172c42">
    <text x="600" y="43" text-anchor="middle" direction="rtl" font-size="27" font-weight="bold">طول الشبكة المخطط يعادل 3.47 أضعاف طول المترو المعلن</text>
    <text x="1160" y="109" text-anchor="start" direction="rtl" font-size="23">مترو 2024 المعلن</text>
    <text x="1160" y="184" text-anchor="start" direction="rtl" font-size="23">سيناريو OpenSourceRail التخطيطي</text>
    <rect x="80" y="79" width="172.985" height="43" fill="#7e8da0"/>
    <rect x="80" y="154" width="600" height="43" fill="#007f79"/>
    <text x="265" y="108" direction="ltr" font-size="24" font-weight="bold">148.0</text>
    <text x="693" y="183" direction="ltr" font-size="24" font-weight="bold">513.3</text>
    <text x="80" y="239" direction="rtl" text-anchor="end" font-size="18" fill="#516171">الأطوال بالكيلومتر</text>
    <text x="1160" y="263" text-anchor="start" direction="rtl" font-size="18" fill="#516171">أطوال خطوط مقترحة؛ لا تعمل أي من الشبكتين حالياً، ولا يثبت الطول وحده وصول السكان.</text>
  </g>
</svg>
