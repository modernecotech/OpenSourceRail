# OSR-ALN v1.0 — Samawah Line 2 (Halqa), counterclockwise ring.
#
# Hand-authored reference alignment per the bearing + radius table
# in docs/civil/west-asia/Iraq/Samawah/line2-segments.md. Counterclockwise ring
# starting from eastern-bridge (the L1 interchange), 10 stations,
# 16 km total.
#
# UTM Zone 38N coordinates computed step-by-step from the
# eastern-bridge anchor (which Line 1 also uses for its L1-05
# station). Planning-grade: on a real deployment the ring would
# close exactly on a surveyed anchor; here the hand-computed
# coordinates have < 2 % closure error, accepted per the
# line2-segments.md disclaimer (v2 surveyed alignment refines).
#
# Interchange geometry: `eastern-bridge` and
# `al-muthanna-university` are stacked interchanges per RFC 0010 §7
# — Line 1 at one level, Line 2 at another. The same station id
# appears on both lines' aln.toml files; vertical circulation
# handles the level difference on the ground.
#
# Validation:
#   osr-aln-validate docs/civil/west-asia/Iraq/Samawah/samawah-line2.aln.toml \
#       --design-toml designs/west-asia/Iraq/Samawah/design.toml

[meta]
schema_version = "1.0"
line_id        = "samawah-line2"
design_date    = "2026-04-23"
surveyor       = "OSR reference (hand-authored; v2 substitutes survey)"
preset         = "standard-urban"
consist        = "light-metro-3car"
crs            = "EPSG:32638"
units          = "metric"
is_ring        = true

# ----------------------------------------------------------------------
# Horizontal alignment — one PI per station, 10 ring segments.
# Bearings from docs/civil/west-asia/Iraq/Samawah/line2-segments.md.
# ----------------------------------------------------------------------

[[horizontal]]                                         # eastern-bridge (ring start)
station_m           = 0.0
easting_m           = 482381.20
northing_m          = 3464739.10
bearing_in_deg      = 28.000
bearing_out_deg     = 28.000
curve_radius_m      = 0.0
transition_length_m = 0.0

[[horizontal]]                                         # northern-suburbs-a
station_m           = 1800.0
easting_m           = 483226.30
northing_m          = 3466328.40
bearing_in_deg      = 28.000
bearing_out_deg     = 324.000
curve_radius_m      = 9500.0
transition_length_m = 50.0

[[horizontal]]                                         # northern-suburbs-b
station_m           = 3300.0
easting_m           = 482344.60
northing_m          = 3467541.90
bearing_in_deg      = 324.000
bearing_out_deg     = 297.000
curve_radius_m      = 12000.0
transition_length_m = 50.0

[[horizontal]]                                         # northwest-junction
station_m           = 5000.0
easting_m           = 480829.90
northing_m          = 3468313.70
bearing_in_deg      = 297.000
bearing_out_deg     = 240.000
curve_radius_m      = 4300.0
transition_length_m = 80.0

[[horizontal]]                                         # industrial-west
station_m           = 6600.0
easting_m           = 479444.30
northing_m          = 3467513.70
bearing_in_deg      = 240.000
bearing_out_deg     = 198.000
curve_radius_m      = 10200.0
transition_length_m = 50.0

[[horizontal]]                                         # western-residential
station_m           = 8100.0
easting_m           = 478980.80
northing_m          = 3466087.10
bearing_in_deg      = 198.000
bearing_out_deg     = 180.000
curve_radius_m      = 15000.0
transition_length_m = 50.0

[[horizontal]]                                         # south-west-residential
station_m           = 9900.0
easting_m           = 478980.80
northing_m          = 3464287.10
bearing_in_deg      = 180.000
bearing_out_deg     = 108.000
curve_radius_m      = 5800.0
transition_length_m = 80.0

[[horizontal]]                                         # southern-markets
station_m           = 11300.0
easting_m           = 480312.30
northing_m          = 3463854.40
bearing_in_deg      = 108.000
bearing_out_deg     = 90.000
curve_radius_m      = 10500.0
transition_length_m = 50.0

[[horizontal]]                                         # south-east-residential
station_m           = 12900.0
easting_m           = 481912.30
northing_m          = 3463854.40
bearing_in_deg      = 90.000
bearing_out_deg     = 36.000
curve_radius_m      = 5900.0
transition_length_m = 80.0

[[horizontal]]                                         # al-muthanna-university (L1/L2 interchange, L2 at elevated)
station_m           = 14400.0
easting_m           = 482794.00
northing_m          = 3465067.90
bearing_in_deg      = 36.000
bearing_out_deg     = 286.000
curve_radius_m      = 7800.0
transition_length_m = 80.0

[[horizontal]]                                         # ring-closure back to eastern-bridge
station_m           = 16000.0
easting_m           = 482381.20                        # ring wraps to L2 start coordinate
northing_m          = 3464739.10
bearing_in_deg      = 286.000
bearing_out_deg     = 28.000                           # matches the ring-start bearing
curve_radius_m      = 6000.0
transition_length_m = 80.0

# ----------------------------------------------------------------------
# Vertical alignment — level terrain across Line 2; only vertical
# features are the 35 ‰ ramp up + ramp down around al-muthanna-
# university's elevated deck.
# ----------------------------------------------------------------------

[[vertical]]
station_m   = 0.0
elevation_m = 6.0
vc_radius_m = 0.0

[[vertical]]                                          # start of ramp up to L2-09 elevated
station_m   = 13650.0
elevation_m = 6.0
vc_radius_m = 300.0

[[vertical]]                                          # elevated deck at al-muthanna-university
station_m   = 13800.0
elevation_m = 11.25
vc_radius_m = 0.0

[[vertical]]                                          # elevated deck (flat across station)
station_m   = 14400.0
elevation_m = 11.25
vc_radius_m = 0.0

[[vertical]]                                          # start of ramp down
station_m   = 14500.0
elevation_m = 11.25
vc_radius_m = 300.0

[[vertical]]                                          # at-grade again for ring wrap
station_m   = 14650.0
elevation_m = 6.0
vc_radius_m = 0.0

[[vertical]]                                          # ring-closure
station_m   = 16000.0
elevation_m = 6.0
vc_radius_m = 0.0

# ----------------------------------------------------------------------
# Civil classes — from line2-segments.md.
# At-grade 14 500 m (90.6 %) + elevated 1 500 m (9.4 %) + bridge 0 m.
# ----------------------------------------------------------------------

[[civil]]
from_station_m = 0.0
to_station_m   = 13650.0
class          = "at-grade"      # L2-01..08 + most of L2-09 ring path

[[civil]]
from_station_m = 13650.0
to_station_m   = 14650.0
class          = "elevated"      # L2-09 approach + al-muthanna-university platform

[[civil]]
from_station_m = 14650.0
to_station_m   = 16000.0
class          = "at-grade"      # L2-10 ring-wrap back to eastern-bridge

# ----------------------------------------------------------------------
# Station pin-points — `id` matches station id in design.toml.
# Eastern-bridge appears on both Line 1 and Line 2 at the same
# station id; the interchange is stacked per RFC 0010 §7.
# ----------------------------------------------------------------------

[[station]]
id                = "eastern-bridge"
station_m         = 0.0
platform_length_m = 75.0

[[station]]
id                = "northern-suburbs-a"
station_m         = 1800.0
platform_length_m = 75.0

[[station]]
id                = "northern-suburbs-b"
station_m         = 3300.0
platform_length_m = 75.0

[[station]]
id                = "northwest-junction"
station_m         = 5000.0
platform_length_m = 75.0

[[station]]
id                = "industrial-west"
station_m         = 6600.0
platform_length_m = 75.0

[[station]]
id                = "western-residential"
station_m         = 8100.0
platform_length_m = 75.0

[[station]]
id                = "south-west-residential"
station_m         = 9900.0
platform_length_m = 75.0

[[station]]
id                = "southern-markets"
station_m         = 11300.0
platform_length_m = 75.0

[[station]]
id                = "south-east-residential"
station_m         = 12900.0
platform_length_m = 75.0

[[station]]
id                = "al-muthanna-university"
station_m         = 14400.0
platform_length_m = 75.0

# ----------------------------------------------------------------------
# Cant — 20 mm on the four tightest-radius ring curves for ride
# quality (radii 4 300 m – 5 900 m). All well under standard-urban's
# 150 mm maximum.
# ----------------------------------------------------------------------

[[cant]]
from_station_m   = 5000.0
to_station_m     = 6600.0
max_cant_mm      = 20
transition_in_m  = 80.0
transition_out_m = 80.0

[[cant]]
from_station_m   = 9900.0
to_station_m     = 11300.0
max_cant_mm      = 20
transition_in_m  = 80.0
transition_out_m = 80.0

[[cant]]
from_station_m   = 12900.0
to_station_m     = 14400.0
max_cant_mm      = 20
transition_in_m  = 80.0
transition_out_m = 80.0

[[cant]]
from_station_m   = 14400.0
to_station_m     = 16000.0
max_cant_mm      = 20
transition_in_m  = 80.0
transition_out_m = 80.0
