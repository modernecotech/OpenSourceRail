# ----------------------------------------------------------------------
# Vertical alignment — Samawah sits on the Euphrates alluvial plain;
# elevation is 6–12 m ToR across the full line. The only vertical
# features are the viaduct ramp-up/ramp-down at L1-02/L1-03 + the
# bridge approach at L1-05.
# ----------------------------------------------------------------------

[[vertical]]
station_m   = 0.0
elevation_m = 6.0
vc_radius_m = 0.0

[[vertical]]                                          # start of ramp up to elevated at L1-02
station_m   = 950.0
elevation_m = 6.0
vc_radius_m = 300.0

[[vertical]]                                          # elevated deck starts at north-gate
station_m   = 1100.0
elevation_m = 11.25
vc_radius_m = 0.0

[[vertical]]                                          # elevated deck at old-souq
station_m   = 2300.0
elevation_m = 11.25
vc_radius_m = 0.0

[[vertical]]                                          # elevated deck at samawah-central
station_m   = 3400.0
elevation_m = 11.25
vc_radius_m = 0.0

[[vertical]]                                          # start of ramp down from L1-03 viaduct
station_m   = 3450.0
elevation_m = 11.25
vc_radius_m = 300.0

[[vertical]]                                          # at-grade again at riverside
station_m   = 3600.0
elevation_m = 6.0
vc_radius_m = 0.0

[[vertical]]                                          # start of bridge approach at L1-05
station_m   = 4200.0
elevation_m = 6.0
vc_radius_m = 500.0

[[vertical]]                                          # bridge deck at eastern-bridge (12 m clearance over river)
station_m   = 4400.0
elevation_m = 8.0
vc_radius_m = 0.0

[[vertical]]                                          # bridge deck (flat across river)
station_m   = 5500.0
elevation_m = 8.0
vc_radius_m = 0.0

[[vertical]]                                          # end of bridge descent to east bank
station_m   = 5700.0
elevation_m = 8.0
vc_radius_m = 500.0

[[vertical]]                                          # at-grade east bank
station_m   = 5900.0
elevation_m = 6.0
vc_radius_m = 0.0

[[vertical]]                                          # east-depot
station_m   = 13000.0
elevation_m = 6.0
vc_radius_m = 0.0

# ----------------------------------------------------------------------
# Civil classes — from line1-segments.md.
# At-grade (72.3 %) + elevated (18.5 %) + bridge (9.2 %).
# ----------------------------------------------------------------------

[[civil]]
from_station_m = 0.0
to_station_m   = 1000.0
class          = "at-grade"      # L1-01 samawah-rws → north-gate

[[civil]]
from_station_m = 1000.0
to_station_m   = 2300.0
class          = "elevated"      # L1-02 north-gate → old-souq

[[civil]]
from_station_m = 2300.0
to_station_m   = 3400.0
class          = "elevated"      # L1-03 old-souq → samawah-central

[[civil]]
from_station_m = 3400.0
to_station_m   = 4300.0
class          = "at-grade"      # L1-04 samawah-central → riverside

[[civil]]
from_station_m = 4300.0
to_station_m   = 5500.0
class          = "bridge"        # L1-05 riverside → eastern-bridge (Euphrates)

[[civil]]
from_station_m = 5500.0
to_station_m   = 13000.0
class          = "at-grade"      # L1-06..11 east bank → east-depot

