# OSR-ALN v1.0 — Samawah Line 1 (Nahrain), eastbound.
#
# Hand-authored reference alignment per the bearing + radius table
# in docs/civil/west-asia/Iraq/Samawah/line1-segments.md. UTM Zone 38N coordinates
# computed step-by-step from the published segment lengths and
# bearings; precision is planning-grade (centimetre noise in the
# station_m column does not match decimal rounding in the UTM
# projection, but every field is self-consistent to < 1 m).
#
# Validation:
#   osr-aln-validate docs/civil/west-asia/Iraq/Samawah/samawah-line1.aln.toml \
#       --design-toml designs/west-asia/Iraq/Samawah/design.toml

[meta]
schema_version = "1.0"
line_id        = "samawah-line1"
design_date    = "2026-04-23"
surveyor       = "OSR reference (hand-authored; v2 substitutes survey)"
preset         = "standard-urban"
consist        = "light-metro-3car"
crs            = "EPSG:32638"
units          = "metric"
is_ring        = false

# ----------------------------------------------------------------------
# Horizontal alignment — one PI per station, 11 inter-station segments.
# Bearings from docs/civil/west-asia/Iraq/Samawah/line1-segments.md. Entry radii at
# each PI are the radius of the transition curve entering that PI
# from the previous segment; 0 = tangent (straight-to-straight).
# ----------------------------------------------------------------------

[[horizontal]]                                         # samawah-rws (line start)
station_m           = 0.0
easting_m           = 477500.00
