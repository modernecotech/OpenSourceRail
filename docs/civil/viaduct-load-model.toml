[actions.longitudinal]
include = ["traction", "service-braking", "emergency-braking", "bearing-friction", "rail-bridge-interaction"]

[actions.transverse]
include = ["centrifugal", "nosing", "wind-on-empty-train", "wind-on-loaded-train", "derailment-containment", "collision"]

[actions.environmental]
include = ["uniform-temperature", "temperature-gradient", "creep", "shrinkage", "differential-settlement", "seismic", "scour-where-applicable", "fatigue", "durability"]

[actions.temporary]
include = ["demoulding", "lifting", "transport", "temporary-bracing", "tandem-crane-erection", "launcher-erection", "bearing-installation", "jacking-for-bearing-replacement"]

[analysis]
required = ["3d-open-section-global-model", "asymmetric-train-position", "torsion-and-distortion", "end-zone-and-anchorage", "prestress-loss-and-camber", "construction-stages", "foundation-interaction", "track-bridge-interaction"]
