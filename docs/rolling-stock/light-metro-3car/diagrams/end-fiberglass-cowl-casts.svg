<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" role="img" aria-labelledby="title desc">
  <title id="title">Identical fiberglass train end cowl cast kit</title>
  <desc id="desc">Front view and side exploded diagram of the reversible A/B-end cowl, showing upper brow, cheek casts, lower apron, backing ring, service hatches, glass panes, lights, and steel crash frame.</desc>
  <defs>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:31px;font-weight:700;fill:#132034}
      .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#132034}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700;fill:#132034}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#132034}
      .tiny{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#132034}
      .outline{fill:#ececea;stroke:#1e2b37;stroke-width:3}
      .brow{fill:#d8d9d4;stroke:#1e2b37;stroke-width:2}
      .cheek{fill:#f0f0ec;stroke:#1e2b37;stroke-width:2}
      .apron{fill:#c7cbc6;stroke:#1e2b37;stroke-width:2}
      .ring{fill:#9aa0a3;stroke:#26323d;stroke-width:3}
      .glass{fill:#071217;stroke:#d9e2e4;stroke-width:5}
      .mullion{fill:#8c9291}
      .lamp{fill:#fff3c7;stroke:#4d4b42;stroke-width:2}
      .marker{fill:#dceeff;stroke:#4d6273;stroke-width:1.5}
      .green{fill:#0a612f}
      .seam{stroke:#111820;stroke-width:5;stroke-dasharray:12 8;fill:none}
      .steel{fill:#d5a449;stroke:#5f4311;stroke-width:3}
      .call{stroke:#243241;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .box{fill:#f8fafc;stroke:#26364b;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#243241"/>
    </marker>
  </defs>

  <text x="44" y="48" class="title">Identical A/B-end fiberglass cowl cast kit</text>
  <text x="44" y="78" class="subtitle">Same mould set at both train ends; the B-end module is the A-end kit rotated 180 degrees. Steel remains the crash and coupler load path.</text>

  <g transform="translate(110 138)">
    <text x="185" y="-18" class="label">Front elevation, installed</text>
    <path class="outline" d="M105,24 L421,24 Q470,28 490,74 L535,486 Q541,548 490,586 L426,628 L96,628 L31,586 Q-20,548 -14,486 L31,74 Q51,28 105,24 Z"/>
    <path class="brow" d="M111,36 L416,36 Q459,41 474,84 L459,174 L66,174 L52,84 Q68,41 111,36 Z"/>
    <path class="cheek" d="M52,188 L137,188 L130,516 L43,573 Q9,541 13,490 Z"/>
    <path class="cheek" d="M459,188 L374,188 L381,516 L468,573 Q502,541 498,490 Z"/>
    <path class="apron" d="M137,515 L381,515 L468,573 L421,612 L96,612 L43,573 Z"/>
    <rect x="139" y="142" width="242" height="392" rx="8" class="ring"/>
    <rect x="158" y="165" width="67" height="333" rx="5" class="glass"/>
    <rect x="244" y="165" width="67" height="333" rx="5" class="glass"/>
    <rect x="330" y="165" width="67" height="333" rx="5" class="glass"/>
    <rect x="229" y="158" width="12" height="346" class="mullion"/>
    <rect x="315" y="158" width="12" height="346" class="mullion"/>
    <rect x="75" y="575" width="148" height="18" class="green"/>
    <rect x="334" y="575" width="148" height="18" class="green"/>
    <rect x="120" y="488" width="86" height="44" rx="8" class="lamp"/>
    <rect x="350" y="488" width="86" height="44" rx="8" class="lamp"/>
    <rect x="111" y="462" width="102" height="16" rx="5" class="marker"/>
    <rect x="341" y="462" width="102" height="16" rx="5" class="marker"/>
    <path class="seam" d="M66,174 L459,174"/>
    <path class="seam" d="M137,188 L130,516"/>
    <path class="seam" d="M374,188 L381,516"/>
    <path class="seam" d="M137,515 L381,515"/>

    <path class="call" d="M472,119 L622,82"/>
    <text x="636" y="86" class="small">CWL-FRP-01 upper brow / roof cap</text>
    <path class="call" d="M42,312 L-48,270"/>
    <text x="-88" y="248" class="small">CWL-FRP-02</text>
    <text x="-88" y="268" class="tiny">left cheek cast</text>
    <path class="call" d="M498,312 L620,292"/>
    <text x="636" y="296" class="small">CWL-FRP-03 right cheek cast</text>
    <path class="call" d="M278,592 L620,612"/>
    <text x="636" y="616" class="small">CWL-FRP-04 lower apron cast</text>
    <path class="call" d="M163,509 L-46,520"/>
    <text x="-88" y="512" class="small">CWL-FRP-05</text>
    <text x="-88" y="532" class="tiny">lamp/service hatches</text>
    <path class="call" d="M381,142 L620,168"/>
    <text x="636" y="172" class="small">CWL-FRP-06 backing-ring flange</text>
  </g>

  <g transform="translate(1040 156)">
    <text x="-10" y="-36" class="label">Side exploded stack</text>
    <rect x="0" y="86" width="150" height="430" rx="14" class="steel"/>
    <text x="16" y="128" class="small">steel crash</text>
    <text x="16" y="150" class="small">frame +</text>
    <text x="16" y="172" class="small">coupler pocket</text>
    <path class="call" d="M154,252 L232,252"/>
    <rect x="238" y="114" width="58" height="378" rx="8" class="ring"/>
    <text x="220" y="532" class="tiny">backing ring</text>
    <path class="call" d="M300,252 L377,252"/>
    <path class="cheek" d="M386,82 L492,130 L462,494 L386,532 Z"/>
    <path class="brow" d="M386,82 L492,130 L488,178 L384,154 Z"/>
    <path class="apron" d="M386,434 L462,494 L386,532 Z"/>
    <text x="352" y="574" class="tiny">fiberglass cast kit</text>
    <path class="call" d="M496,252 L574,252"/>
    <rect x="582" y="174" width="46" height="256" rx="6" class="glass"/>
    <text x="546" y="468" class="tiny">glass carrier</text>
    <path class="call" d="M632,252 L704,252"/>
    <rect x="710" y="214" width="78" height="138" rx="8" fill="#18242f" stroke="#273849" stroke-width="3"/>
    <text x="702" y="392" class="tiny">T-OBS pack</text>
  </g>

  <g transform="translate(105 744)">
    <rect x="0" y="0" width="1220" height="58" rx="8" class="box"/>
    <text x="22" y="24" class="small">Control rule:</text>
    <text x="128" y="24" class="tiny">fiberglass pieces are sacrificial, removable, and locally repairable; the steel frame, coupler pocket, anti-climber, and crash absorber carry certified loads.</text>
    <text x="128" y="44" class="tiny">Green livery, black glass, LED clusters, washer/heater, and T-OBS sightlines are identical at both ends.</text>
  </g>
</svg>
