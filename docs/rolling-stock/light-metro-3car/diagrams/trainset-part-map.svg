<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Light metro trainset annotated part map</title>
  <desc id="desc">Side and roof diagram labeling the fabricated structure, COTS modules, solar panels, HVAC, windows, doors, bogies, couplers, articulation, batteries, and electronics cabinets.</desc>
  <defs>
    <style>
      .body{fill:#e8e7e2;stroke:#1c2530;stroke-width:3}
      .glass{fill:#1a2b2d;stroke:#061113;stroke-width:2}
      .green{fill:#07572d}
      .door{fill:#151719;stroke:#f2c230;stroke-width:3}
      .solar{fill:#0b1e47;stroke:#6d8cc9;stroke-width:2}
      .hvac{fill:#9aa0a4;stroke:#4b535a;stroke-width:2}
      .skirt{fill:#34383d}
      .bogie{fill:#111;stroke:#555;stroke-width:2}
      .battery{fill:#29364c;stroke:#0e1420;stroke-width:2}
      .cots{fill:#e8f5ed;stroke:#0d6b34;stroke-width:2}
      .fab{fill:#eef3fb;stroke:#315d94;stroke-width:2}
      .safety{fill:#fff5d9;stroke:#be8a00;stroke-width:2}
      .call{stroke:#1d2732;stroke-width:2;fill:none}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#142033}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#142033}
      .tiny{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#142033}
      .head{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#142033}
    </style>
  </defs>

  <text x="40" y="44" class="head">Light-metro 3-car: delineated parts and module interfaces</text>
  <text x="40" y="76" class="small">Build123d source is canonical; STEP/PNG/SVG are generated or documentation handoff views.</text>

  <g transform="translate(65 155)">
    <rect x="0" y="55" width="1460" height="110" rx="28" class="body"/>
    <rect x="30" y="73" width="70" height="74" rx="12" class="glass"/>
    <rect x="1360" y="73" width="70" height="74" rx="12" class="glass"/>
    <rect x="0" y="124" width="1460" height="18" class="green"/>
    <rect x="0" y="152" width="1460" height="34" class="skirt"/>

    <line x1="487" y1="50" x2="487" y2="188" stroke="#222" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="973" y1="50" x2="973" y2="188" stroke="#222" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="190" y="38" class="label">Car 1 powered</text>
    <text x="665" y="38" class="label">Car 2 trailer</text>
    <text x="1130" y="38" class="label">Car 3 powered</text>

    <g>
      <rect x="132" y="79" width="120" height="54" rx="6" class="glass"/>
      <rect x="262" y="79" width="92" height="54" rx="6" class="glass"/>
      <rect x="378" y="72" width="48" height="76" rx="4" class="door"/>
      <rect x="516" y="79" width="120" height="54" rx="6" class="glass"/>
      <rect x="646" y="79" width="92" height="54" rx="6" class="glass"/>
      <rect x="760" y="72" width="48" height="76" rx="4" class="door"/>
      <rect x="1002" y="79" width="120" height="54" rx="6" class="glass"/>
      <rect x="1132" y="79" width="92" height="54" rx="6" class="glass"/>
      <rect x="1248" y="72" width="48" height="76" rx="4" class="door"/>
    </g>

    <g>
      <rect x="115" y="15" width="270" height="28" class="solar"/>
      <rect x="505" y="15" width="270" height="28" class="solar"/>
      <rect x="990" y="15" width="270" height="28" class="solar"/>
      <rect x="34" y="13" width="58" height="32" rx="5" class="hvac"/>
      <rect x="395" y="13" width="58" height="32" rx="5" class="hvac"/>
      <rect x="519" y="13" width="58" height="32" rx="5" class="hvac"/>
      <rect x="881" y="13" width="58" height="32" rx="5" class="hvac"/>
      <rect x="1004" y="13" width="58" height="32" rx="5" class="hvac"/>
      <rect x="1365" y="13" width="58" height="32" rx="5" class="hvac"/>
    </g>

    <g>
      <rect x="72" y="186" width="110" height="52" rx="8" class="bogie"/>
      <circle cx="96" cy="238" r="15" fill="#222"/>
      <circle cx="158" cy="238" r="15" fill="#222"/>
      <rect x="342" y="186" width="110" height="52" rx="8" class="bogie"/>
      <circle cx="366" cy="238" r="15" fill="#222"/>
      <circle cx="428" cy="238" r="15" fill="#222"/>
      <rect x="558" y="186" width="110" height="52" rx="8" class="bogie"/>
      <circle cx="582" cy="238" r="15" fill="#222"/>
      <circle cx="644" cy="238" r="15" fill="#222"/>
      <rect x="802" y="186" width="110" height="52" rx="8" class="bogie"/>
      <circle cx="826" cy="238" r="15" fill="#222"/>
      <circle cx="888" cy="238" r="15" fill="#222"/>
      <rect x="1018" y="186" width="110" height="52" rx="8" class="bogie"/>
      <circle cx="1042" cy="238" r="15" fill="#222"/>
      <circle cx="1104" cy="238" r="15" fill="#222"/>
      <rect x="1288" y="186" width="110" height="52" rx="8" class="bogie"/>
      <circle cx="1312" cy="238" r="15" fill="#222"/>
      <circle cx="1374" cy="238" r="15" fill="#222"/>
      <text x="76" y="268" class="tiny">powered</text>
      <text x="1300" y="268" class="tiny">powered</text>
      <text x="345" y="268" class="tiny">trailer</text>
      <text x="565" y="268" class="tiny">trailer</text>
      <text x="809" y="268" class="tiny">trailer</text>
      <text x="1028" y="268" class="tiny">trailer</text>
    </g>

    <g>
      <rect x="130" y="145" width="275" height="20" class="battery"/>
      <rect x="617" y="145" width="275" height="20" class="battery"/>
      <rect x="1105" y="145" width="275" height="20" class="battery"/>
    </g>
  </g>

  <g transform="translate(70 450)">
    <rect x="0" y="0" width="315" height="66" rx="8" class="fab"/>
    <text x="18" y="27" class="small">Fabricated parts</text>
    <text x="18" y="51" class="tiny">S355 frame, bolsters, cowl mounts, brackets, skirts</text>
    <rect x="355" y="0" width="315" height="66" rx="8" class="cots"/>
    <text x="373" y="27" class="small">COTS modules</text>
    <text x="373" y="51" class="tiny">Doors, windows, HVAC, seats, lighting, displays</text>
    <rect x="710" y="0" width="315" height="66" rx="8" class="safety"/>
    <text x="728" y="27" class="small">Safety / traction</text>
    <text x="728" y="51" class="tiny">T-OBS, T-ECU/S, batteries, brakes, motors</text>
    <rect x="1065" y="0" width="315" height="66" rx="8" fill="#f1f1f1" stroke="#555" stroke-width="2"/>
    <text x="1083" y="27" class="small">Generated views</text>
    <text x="1083" y="51" class="tiny">PNG/SVG diagrams and STEP export from build123d</text>
  </g>
</svg>
