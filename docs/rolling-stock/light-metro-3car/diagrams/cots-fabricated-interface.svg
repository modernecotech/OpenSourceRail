<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">COTS modules joining fabricated train structure</title>
  <desc id="desc">Exploded interface diagram showing fabricated steel datum structure, composite cladding, and COTS doors, windows, HVAC, solar, seats, batteries, electronics, couplers, and bogies.</desc>
  <defs>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:700;fill:#142033}
      .label{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#142033}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#142033}
      .tiny{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#142033}
      .fab{fill:#eaf2fb;stroke:#315d94;stroke-width:3}
      .cots{fill:#e8f5ed;stroke:#0d6b34;stroke-width:3}
      .safety{fill:#fff6df;stroke:#bd8500;stroke-width:3}
      .skin{fill:#ece9e2;stroke:#6d6d68;stroke-width:3}
      .arrow{stroke:#283747;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#283747"/>
    </marker>
  </defs>

  <text x="50" y="50" class="title">COTS modules join to fabricated datums, not bespoke body cut-ins</text>
  <text x="50" y="82" class="small">The welded steel frame owns load paths and datums. COTS suppliers own certified internals. Adapter plates and harness tails reconcile them.</text>

  <g transform="translate(70 140)">
    <rect x="0" y="0" width="430" height="650" rx="14" class="fab"/>
    <text x="24" y="42" class="label">Fabricated structure</text>
    <rect x="35" y="85" width="360" height="95" rx="8" fill="#cfe0f2" stroke="#315d94" stroke-width="2"/>
    <text x="55" y="122" class="small">S355 underframe ladder</text>
    <text x="55" y="150" class="tiny">side sills, cross bearers, centre spine</text>
    <rect x="35" y="210" width="360" height="95" rx="8" fill="#cfe0f2" stroke="#315d94" stroke-width="2"/>
    <text x="55" y="247" class="small">Side and roof spaceframe</text>
    <text x="55" y="275" class="tiny">door portals, window rails, roof rails</text>
    <rect x="35" y="335" width="360" height="95" rx="8" fill="#cfe0f2" stroke="#315d94" stroke-width="2"/>
    <text x="55" y="372" class="small">Bolsters and coupler pockets</text>
    <text x="55" y="400" class="tiny">machined pivots, crash-can faces</text>
    <rect x="35" y="460" width="360" height="95" rx="8" fill="#cfe0f2" stroke="#315d94" stroke-width="2"/>
    <text x="55" y="497" class="small">Adapter plates and service rails</text>
    <text x="55" y="525" class="tiny">door gauges, HVAC rails, battery trays</text>
  </g>

  <g transform="translate(535 140)">
    <rect x="0" y="0" width="400" height="650" rx="14" class="skin"/>
    <text x="24" y="42" class="label">Interface layer</text>
    <rect x="40" y="86" width="320" height="62" rx="8" fill="#f8f7f2" stroke="#6d6d68" stroke-width="2"/>
    <text x="58" y="125" class="small">Supplier-neutral envelope</text>
    <rect x="40" y="176" width="320" height="62" rx="8" fill="#f8f7f2" stroke="#6d6d68" stroke-width="2"/>
    <text x="58" y="215" class="small">Bolt pattern / adhesive land</text>
    <rect x="40" y="266" width="320" height="62" rx="8" fill="#f8f7f2" stroke="#6d6d68" stroke-width="2"/>
    <text x="58" y="305" class="small">Power, data, drain, earth</text>
    <rect x="40" y="356" width="320" height="62" rx="8" fill="#f8f7f2" stroke="#6d6d68" stroke-width="2"/>
    <text x="58" y="395" class="small">Inspection and removal clearance</text>
    <rect x="40" y="446" width="320" height="62" rx="8" fill="#f8f7f2" stroke="#6d6d68" stroke-width="2"/>
    <text x="58" y="485" class="small">Evidence pack and serial trace</text>
    <rect x="40" y="536" width="320" height="62" rx="8" fill="#f8f7f2" stroke="#6d6d68" stroke-width="2"/>
    <text x="58" y="575" class="small">Water/fire/EMC/vibration gates</text>
  </g>

  <g transform="translate(970 140)">
    <rect x="0" y="0" width="460" height="650" rx="14" class="cots"/>
    <text x="24" y="42" class="label">Installed COTS / BID modules</text>
    <rect x="35" y="75" width="180" height="70" rx="8" fill="#d6efdf" stroke="#0d6b34" stroke-width="2"/>
    <text x="55" y="116" class="small">Door cassette</text>
    <rect x="245" y="75" width="180" height="70" rx="8" fill="#d6efdf" stroke="#0d6b34" stroke-width="2"/>
    <text x="265" y="116" class="small">Window cassette</text>
    <rect x="35" y="175" width="180" height="70" rx="8" fill="#d6efdf" stroke="#0d6b34" stroke-width="2"/>
    <text x="55" y="216" class="small">Solar panel set</text>
    <rect x="245" y="175" width="180" height="70" rx="8" fill="#d6efdf" stroke="#0d6b34" stroke-width="2"/>
    <text x="265" y="216" class="small">HVAC unit</text>
    <rect x="35" y="275" width="180" height="70" rx="8" fill="#d6efdf" stroke="#0d6b34" stroke-width="2"/>
    <text x="55" y="316" class="small">Seats + rails</text>
    <rect x="245" y="275" width="180" height="70" rx="8" fill="#fff6df" stroke="#bd8500" stroke-width="2"/>
    <text x="265" y="316" class="small">Battery modules</text>
    <rect x="35" y="375" width="180" height="70" rx="8" fill="#fff6df" stroke="#bd8500" stroke-width="2"/>
    <text x="55" y="416" class="small">T-ECU cabinets</text>
    <rect x="245" y="375" width="180" height="70" rx="8" fill="#fff6df" stroke="#bd8500" stroke-width="2"/>
    <text x="265" y="416" class="small">T-OBS pack</text>
    <rect x="35" y="475" width="180" height="70" rx="8" fill="#d6efdf" stroke="#0d6b34" stroke-width="2"/>
    <text x="55" y="516" class="small">Coupler module</text>
    <rect x="245" y="475" width="180" height="70" rx="8" fill="#d6efdf" stroke="#0d6b34" stroke-width="2"/>
    <text x="265" y="516" class="small">Bogie modules</text>
    <rect x="35" y="575" width="390" height="45" rx="8" fill="#d6efdf" stroke="#0d6b34" stroke-width="2"/>
    <text x="55" y="604" class="small">Lighting, PIS, CCTV, intercom, flooring, panels</text>
  </g>

  <path class="arrow" d="M500 250 C530 250, 510 250, 535 250"/>
  <path class="arrow" d="M935 250 C960 250, 940 250, 970 250"/>
  <path class="arrow" d="M500 510 C530 510, 510 510, 535 510"/>
  <path class="arrow" d="M935 510 C960 510, 940 510, 970 510"/>
</svg>
