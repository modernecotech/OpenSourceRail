"ISO 22163:2023" = "https://www.iso.org/standard/79427.html"
"ISO 55001:2024" = "https://www.iso.org/standard/83054.html"
"ISO 19650-1:2018" = "https://www.iso.org/standard/68078.html"
"ISO 16739-1:2024" = "https://www.iso.org/standard/84123.html"
"ISO/IEC 17025:2017" = "https://www.iso.org/standard/17025"
"ISO/IEC/IEEE 15288:2023" = "https://www.iso.org/standard/81702.html"

[[control]]
id = "RAMS-01"
subject = "Railway lifecycle and hazards"
standards = ["IEC 62278-1:2025", "IEC 62278-2:2025", "ISO/IEC/IEEE 15288:2023"]
scope = "Shared selection method and revised Baghdad Airport study"
risk = "Scope or a design change invalidates an earlier safety or operating assumption."
objective = "Carry an identified system, operating conditions, requirements and open risks into each design decision."
match = "Requirement policy and the Airport register distinguish obligations, assumptions and evidence holds. The verification record identifies the inputs evaluated."
evidence = ["engineering/design_search/requirement_policy.py", "cities/Baghdad/engineering/simulation/audit_register.py", "cities/Baghdad/engineering/simulation/audit-verification.json"]
maturity = "digital study"
owner = "System integrator and independent safety assessor"
gap = "Set project RAMS targets and hazard ownership. Allocate safety and integrity requirements and review accepted residual risk for the installed system."

[[control]]
id = "SIG-01"
subject = "Train protection and command/control"
standards = ["IEC 62425:2025", "IEC 62290-1:2025", "IEC 62267:2009"]
scope = "Baghdad powered-wheel station controls and software bench"
risk = "A train moves while passengers are boarding or after trusted feedback is lost."
objective = "Verify the station cycle and degraded responses across train and wayside boundaries."
match = "The station bench specifies signals and fault cases. Its trace tests cover replay validation with simulated inputs."
evidence = ["cities/Baghdad/engineering/controls/STATION-BENCH.md", "cities/Baghdad/engineering/controls/test_bench_trace.py", "crates/osr-safety-case/src/lib.rs"]
maturity = "software and test procedure"
owner = "Train control integrator and independent safety assessor"
gap = "Measure target hardware timing, position and brake feedback. Exercise loss of authority, degraded operations, rescue and evacuation with the operator."

[[control]]
id = "SW-01"
subject = "Safety-related software lifecycle"
standards = ["IEC 62279:2015", "EN 50716:2023"]
scope = "Current Rust ATP, TCMS and door software"
risk = "A changed binary or configuration invalidates tested interlocks."
objective = "Tie verification to source, tests and the deployed configuration."
match = "Crate boundaries and pinned dependencies identify the software scope. Source-level and CI checks exercise software contracts."
evidence = ["Cargo.lock", "crates/osr-atp/src/lib.rs", "crates/osr-tcms/src/lib.rs", "crates/osr-door-control/src/lib.rs", ".github/workflows/v06-software-rust.yml"]
maturity = "software and test procedure"
owner = "Software assurance lead"
gap = "Agree the applicable software route, software requirements and integrity allocation. Review independence, tool and target baselines and hardware-in-the-loop records."

[[control]]
id = "ACCESS-01"
subject = "Boarding and door interfaces"
standards = ["EN 14752:2025", "IEC 62267:2009"]
scope = "Baghdad fitted-vehicle and prototype platform interface studies"
risk = "Passengers can be trapped, encounter an excessive boarding gap or be exposed to movement."
objective = "Review door permissives, movement clearances and accessibility across the complete train-platform interface."
match = "Platform sweeps and the fitted-train review expose nominal clearances and items awaiting evidence. Boarding permissions are exercised by the station bench."
evidence = ["cities/Baghdad/engineering/prototype/infrastructure/PLATFORM-SWEEP.md", "cities/Baghdad/engineering/simulation/vehicle-audit-guide.md", "cities/Baghdad/engineering/controls/STATION-BENCH.md"]
maturity = "digital study"
owner = "Vehicle and station integrators"
gap = "Apply local accessibility requirements. Test loaded movements, obstacle response and egress on fitted equipment and the surveyed platform."

[[control]]
id = "POWER-01"
subject = "Traction power isolation and return"
standards = ["IEC 62128-1:2013"]
scope = "Revised Baghdad Airport paired-feed and radial traction studies"
risk = "An isolated section remains energised or access exposes people to hazardous touch voltage."
objective = "Identify the live paths, protection interfaces and evidence needed to isolate and maintain the railway."
match = "The audit maps outages to service and collects equipment return data. The voltage screen covers collectors, with electrical safety evidence still due."
evidence = ["cities/Baghdad/engineering/simulation/AUDIT-RESULTS.md", "cities/Baghdad/engineering/simulation/test_audit_power_return.py", "cities/Baghdad/engineering/simulation/audited-enquiry.receipt.json", "cities/Baghdad/engineering/simulation/audited-enquiry-radial30.receipt.json"]
maturity = "digital study"
owner = "Utility and traction protection engineer"
gap = "Obtain source and fault data. Verify earthing, return paths, touch voltage, protective clearing, isolation and emergency access at site."

[[control]]
id = "CIV-01"
subject = "Structural verification and erection"
standards = ["EN 1990 series (deployment edition)"]
scope = "Baghdad viaduct family and erection comparison"
risk = "A girder, bearing, foundation or temporary lift fails under the governing site or train load."
objective = "Carry governing loads and working-life assumptions into structural checks and construction methods."
match = "The family comparison tests span alternatives, vehicle loading, foundation assumptions and erection scope."
evidence = ["cities/Baghdad/engineering/mechanical/civil/family_comparison.py", "cities/Baghdad/engineering/mechanical/civil/SPAN-FAMILIES.md", "cities/Baghdad/engineering/simulation/AUDIT-RESULTS.md"]
maturity = "digital study"
owner = "Civil designer and independent checker"
gap = "Select the local structural basis, applicable action and material codes and National Annex. Verify geotechnical conditions, fatigue, detailed prestress and lift conditions."

[[control]]
id = "QMS-01"
subject = "Supplier, manufacturing and inspection records"
standards = ["ISO 9001:2026", "ISO 22163:2023"]
scope = "Baghdad first-article planning and corrected supplier enquiry"
risk = "An offer, manufactured part or inspection record applies to a different design issue."
objective = "Carry quantity, revision, ownership and inspection points from the enquiry into purchasing and production."
match = "Factory routes, matched enquiry issues and the ERPNext handoff specify evidence for supplier comparisons, work orders and inspection."
evidence = ["cities/Baghdad/engineering/prototype/FACTORY-SPECIFICATION.md", "cities/Baghdad/engineering/simulation/audit_packet_evidence.py", "cities/Baghdad/engineering/simulation/audit_erpnext.py", "cities/Baghdad/engineering/simulation/audited-enquiry.receipt.json"]
maturity = "process and sample records"
owner = "Buyer and manufacturer quality leads"
gap = "Audit actual supplier controls, competence, special processes, nonconformance and production records. Agree how the railway standard's dated ISO 9001 reference applies."

[[control]]
id = "ASSET-01"
subject = "Asset history and renewal"
standards = ["ISO 55001:2024"]
scope = "ERPNext maintenance pilot and revised Baghdad Airport cost study"
risk = "An asset loses its identity or its required inspection, replacement or renewal funding."
objective = "Keep the installed serial, maintenance history and lifecycle obligations accessible to the operator."
match = "The pilot demonstrates serial history. The corrected cost study identifies renewal scope and the timing of owner costs."
evidence = ["docs/operator-review/screens/README.md", "deployment/erpnext/apps/osr_erpnext/osr_erpnext/field_operations.py", "cities/Baghdad/engineering/simulation/audit_feeder_cost.py"]
maturity = "process and sample records"
owner = "Operator asset manager"
gap = "Agree asset-management objectives, owner responsibilities, maintenance intervals and as-installed information. Demonstrate the process on operator records."

[[control]]
id = "BIM-01"
subject = "Information handover and IFC exchange"
standards = ["ISO 19650-1:2018", "ISO 16739-1:2024"]
scope = "Operator review IFC4 model examples, each on its registered candidate"
risk = "The buyer or maintainer imports the wrong model revision or misreads its quantities."
objective = "Exchange a model with identifiable occurrences, source revisions and a declared information scope."
match = "The twin register identifies candidates, occurrence counts and export hashes. The showcased IFC4 exports are an exchange example within the ISO 16739 standards family."
evidence = ["docs/operator-review/twins/model-register.json", "docs/operator-review/twins/baghdad.ifc", "docs/operator-review/twins/core.ifc"]
maturity = "digital model"
owner = "Project information manager"
gap = "Set information requirements and validation rules. Verify the required IFC edition, exchange view and as-built handover with the recipient."

[[control]]
id = "LAB-01"
subject = "Test evidence and calibration"
standards = ["ISO/IEC 17025:2017"]
scope = "Baghdad station bench and first-article qualification preparation"
risk = "A replay or measurement is attributed to the wrong article, instrument or test boundary."
objective = "Record the tested article, approved method and limit, instrument calibration and raw results."
match = "The bench procedure and ERPNext qualification gate specify evidence intake and reviewer responsibilities."
evidence = ["cities/Baghdad/engineering/controls/STATION-BENCH.md", "cities/Baghdad/engineering/controls/bench_trace.py", "deployment/erpnext/apps/osr_erpnext/osr_erpnext/qualification.py"]
maturity = "software and test procedure"
owner = "Test lead and competent laboratory"
gap = "Agree methods, uncertainty and acceptance limits. Obtain authenticated results for the exact article from a laboratory with the required scope."
