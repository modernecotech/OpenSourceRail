schema = 1
reviewed = 2026-11-24
review_due = 2027-02-24

[standards]
"IEC 62278-1:2025" = "https://webstore.iec.ch/en/publication/68933"
"IEC 62278-2:2025" = "https://webstore.iec.ch/en/publication/79793"
"IEC 62425:2025" = "https://webstore.iec.ch/en/publication/68909"
"IEC 62267:2009" = "https://webstore.iec.ch/en/publication/6681"
"IEC 62290-1:2025" = "https://webstore.iec.ch/en/publication/83773"
"IEC 62279:2015" = "https://webstore.iec.ch/en/publication/22781"
"EN 50716:2023" = "https://www.dinmedia.de/en/standard/din-en-50716/378381071"
"EN 14752:2025" = "https://www.dinmedia.de/en/standard/din-en-14752/392372313"
"IEC 62128-1:2013" = "https://webstore.iec.ch/en/publication/6496"
"EN 1990 series (deployment edition)" = "https://eurocodes.jrc.ec.europa.eu/EN-Eurocodes/eurocode-basis-structural-design"
