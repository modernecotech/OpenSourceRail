# G1 — Non-overlap decomposition.
#
# We argue G1 by three concurrent sub-claims (RFC 0004 §7):
#  - G1.1: the MA computation itself enforces section exclusivity (P2).
#  - G1.2: the sim continuously exercises the MA computer as a hard
#          gate on every section entry, so a violation of P2 would
#          surface as a recorded invariant failure.
#  - G1.3: both twins (Rust + Python reference interpreter) agree
#          byte-for-byte on MA output, so no single-implementation
#          bug could produce an overlap without being caught.

[[strategy]]
id = "S1"
description = "Decompose G1 into (i) formal P2, (ii) continuous sim gating, (iii) differential equivalence."
parent = "G1"
children = ["G1.1", "G1.2", "G1.3"]

[[goal]]
id = "G1.1"
description = "MA computation never grants overlapping authorities to distinct trains (P2)."
parent = "S1"

