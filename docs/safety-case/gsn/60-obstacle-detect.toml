[[goal]]
id = "G18"
description = "Speed/range degradation policy (O4a + O4b): both long-range sensors offline above 40 km/h forces EB; LIDAR offline with radar healthy restricts speed to ≤ 40 km/h (RestrictedSpeed)."

[[strategy]]
id = "S18"
description = "Decompose G18 by the two-tier policy — O4a covers the both-offline-fast case; O4b covers the LIDAR-degraded-radar-healthy case."
parent = "G18"
children = ["G18.1", "G18.2"]

[[goal]]
id = "G18.1"
description = "O4a: every long-range sensor offline AND speed > ULTRASONIC_MAX_SPEED_MMPS → EmergencyBrake."
parent = "S18"

[[solution]]
id = "E18.1a"
description = "Kani harness O4a — all long-range offline above band forces EB."
parent = "G18.1"
evidence = { kind = "kani", path = "crates/osr-obstacle-detect/src/kani_proofs.rs", anchor = "o4a_all_long_range_offline_above_band_forces_eb" }

[[solution]]
id = "E18.1b"
description = "Proptest O4a — all long-range offline above band always forces EB."
parent = "G18.1"
evidence = { kind = "proptest", path = "crates/osr-obstacle-detect/tests/proptest_obstacle.rs" }

[[goal]]
id = "G18.2"
description = "O4b: LIDAR offline with radar healthy produces at least RestrictedSpeed and never EB from the O4 branch alone."
parent = "S18"

[[solution]]
id = "E18.2a"
description = "Kani harness O4b — LIDAR offline + radar healthy restricts speed to 40 km/h, never EB via O4."
parent = "G18.2"
evidence = { kind = "kani", path = "crates/osr-obstacle-detect/src/kani_proofs.rs", anchor = "o4b_lidar_offline_with_radar_healthy_restricts_speed" }

[[solution]]
id = "E18.2b"
description = "Proptest O4b — LIDAR offline + radar healthy always produces at least RestrictedSpeed with reason=LidarDegraded."
parent = "G18.2"
evidence = { kind = "proptest", path = "crates/osr-obstacle-detect/tests/proptest_obstacle.rs" }

[[goal]]
id = "G19"
description = "osr-obstacle-detect is monotone in sensor freshness: making a frame strictly fresher never moves the verdict in the less-restrictive direction (O5)."

