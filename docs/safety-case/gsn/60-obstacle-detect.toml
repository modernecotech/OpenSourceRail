description = "Kani harness O5 — fresher sensors never increase severity."
parent = "G19"
evidence = { kind = "kani", path = "crates/osr-obstacle-detect/src/kani_proofs.rs", anchor = "o5_fresher_sensors_never_increase_severity" }

