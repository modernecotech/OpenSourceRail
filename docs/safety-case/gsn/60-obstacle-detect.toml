# G15..G19 — onboard obstacle detection for GoA 4 driverless operation.
#
# Per RFC 0015, unattended trains carry the obstacle-detection
# burden themselves. The `osr-obstacle-detect` evaluator replaces
# the driver's-eye detection function with a SIL-4 multi-physics
# sensor fusion (ultrasonic belt + LIDAR + mmWave radar + stereo
# camera). These goals claim the evaluator meets the five O-series
# safety properties, with evidence from Kani bounded-model-checker
# proofs + proptest suites.

[[goal]]
id = "G15"
description = "osr-obstacle-detect emits EmergencyBrake when any safety-primary sensor reports an obstacle inside the stopping-distance envelope (O1)."

[[solution]]
id = "E15a"
description = "Kani harness O1 — any ultrasonic echo in-band forces EB."
parent = "G15"
evidence = { kind = "kani", path = "crates/osr-obstacle-detect/src/kani_proofs.rs", anchor = "o1_ultrasonic_return_forces_eb" }

[[solution]]
id = "E15b"
description = "Proptest O1 — ultrasonic detection in-band always produces EB across the full parameter space."
parent = "G15"
evidence = { kind = "proptest", path = "crates/osr-obstacle-detect/tests/proptest_obstacle.rs" }

