# G3 — Consistency / determinism decomposition.
#
# Every MA is a pure function of (train_id, log_prefix, network,
# now_ns). Two observers with the same inputs must produce the same
# output — otherwise two trains could run under contradictory
# authorities.
#
# Two concurrent sub-claims:
#  - G3.1: compute_self_ma is byte-deterministic (P1) within one
#          implementation.
#  - G3.2: the Rust and Python implementations agree byte-for-byte —
#          a structural consistency check independent of the
#          implementation-internal P1 proof.

[[strategy]]
id = "S3"
description = "Decompose G3 into (i) single-implementation determinism, (ii) cross-implementation equivalence."
parent = "G3"
children = ["G3.1", "G3.2"]

[[goal]]
id = "G3.1"
description = "The Rust compute_self_ma produces byte-identical MA output for the same input (P1)."
parent = "S3"

[[solution]]
