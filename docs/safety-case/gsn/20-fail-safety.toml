# G2 — Fail-safety decomposition.
#
# The system is "fail-restrictive": any uncertainty in the inputs
# (unknown switch position, stale heartbeat, missing train
# registration, loss of quorum) must produce an MA that is no less
# restrictive than the MA from the known-good state.
#
# Three concurrent sub-claims:
#  - G2.1: a train without a registration or known head position gets
#          a fail-restrictive MA.
#  - G2.2: every MA expires after MA_VALIDITY_WINDOW_NS (P5).
#  - G2.3: the consensus layer is itself fail-safe — loss of quorum
#          prevents new safety entries rather than committing unsafe
#          ones (SMRaft safety invariants).

[[strategy]]
id = "S2"
description = "Decompose G2 into (i) fail-restrictive MA on missing inputs, (ii) MA expiry (P5), (iii) consensus safety."
parent = "G2"
children = ["G2.1", "G2.2", "G2.3"]

[[goal]]
id = "G2.1"
description = "Trains lacking a registration or known head position receive a fail-restrictive MA (has_known_position = false)."
parent = "S2"

[[solution]]
id = "E2.1a"
description = "Kani harness for the fail-restrictive path (P4 sub-case)."
parent = "G2.1"
