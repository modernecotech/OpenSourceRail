# G4 — Onboard SIL-4 actuator layer is correct.
#
# The MA computer (G1..G3) decides what is allowed; the onboard
# SIL-4 crates (osr-atp, osr-brake, osr-vigilance, osr-odometry)
# enforce it. This goal covers the enforcement layer: every pure
# evaluator is deterministic, fail-restrictive, and refuses to
# soften its outcome when inputs grow more uncertain.

[[goal]]
id = "G4"
description = "The onboard SIL-4 actuator layer (ATP, brake, vigilance, odometry) enforces the MA conservatively."

[[strategy]]
id = "S4"
description = "Decompose G4 by crate — each SIL-4 onboard evaluator claims a determinism + fail-restrictive bundle."
parent = "G4"
children = ["G4.1", "G4.2", "G4.3", "G4.4"]

