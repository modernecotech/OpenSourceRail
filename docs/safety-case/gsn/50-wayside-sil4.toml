# G5 — Wayside SIL-4 actuator layer is correct.
#
# The wayside power-switch (points) controller consumes commands
# from the consensus log, fuses its dual-redundant sensors
# conservatively, and never drives the motor in an unsafe way.
# Covers the W1–W6 properties declared in RFC 0005 §7 and mirrored
# in the osr-wayside-points crate docs.

[[goal]]
id = "G5"
description = "The wayside SIL-4 actuator layer (switch controller) enforces conservative sensor fusion and motor commands."

[[strategy]]
