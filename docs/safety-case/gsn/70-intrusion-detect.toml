# G20..G24 — wayside track-intrusion detection for GoA 4 (RFC 0016).
#
# Complements the RFC 0015 onboard obstacle-detect goals (G15..G19):
# wayside detection is the *proactive* half of the two-layer safety
# envelope. A section under active intrusion has MA withheld by the
# interlocking; onboard obstacle-detect is the reactive second line
# if an intrusion appears between ticks.

[[goal]]
id = "G20"
description = "osr-intrusion-detect emits Present when any LIDAR or radar detection lies inside the rail profile (I1)."

[[solution]]
id = "E20a"
description = "Kani harness I1 — LIDAR in-profile forces Present."
parent = "G20"
evidence = { kind = "kani", path = "crates/osr-intrusion-detect/src/kani_proofs.rs", anchor = "i1_lidar_in_profile_forces_present" }

[[solution]]
id = "E20b"
description = "Proptest I1 — LIDAR + radar in-profile across the parameter space always emit Present."
parent = "G20"
evidence = { kind = "proptest", path = "crates/osr-intrusion-detect/tests/proptest_intrusion.rs" }

[[goal]]
id = "G21"
description = "osr-intrusion-detect emits at least Unknown when any safety-primary sensor frame is stale or offline (I2, fail-restrictive)."

[[solution]]
id = "E21a"
description = "Kani harness I2 — stale LIDAR never produces Clear."
parent = "G21"
evidence = { kind = "kani", path = "crates/osr-intrusion-detect/src/kani_proofs.rs", anchor = "i2_stale_lidar_forces_unknown_or_worse" }

[[solution]]
id = "E21b"
description = "Proptest I2 — stale sensor age across the parameter space always produces not-Clear."
parent = "G21"
evidence = { kind = "proptest", path = "crates/osr-intrusion-detect/tests/proptest_intrusion.rs" }

