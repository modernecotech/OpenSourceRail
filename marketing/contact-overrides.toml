schema_version = 1

# Add only contacts verified on an official organisational source. The
# generator merges them into contact-research.csv. Prefer durable functional
# mailboxes; use recipient_name only when a named public official is necessary.
#
# [[contact]]
# campaign_id = "country:west-asia/Iraq"
# recipient_id = "transport-ministry"
# organization = "Official organisation name"
# recipient_name = ""
# email = "public.office@example.gov"
# official_url = "https://official.example.gov/contact"
# verified_on = "YYYY-MM-DD"
# source_url = "https://official.example.gov/contact"
# notes = "Public enquiry address; verify again immediately before sending."
#
# City campaign IDs use the retained design directory:
# campaign_id = "city:west-asia/Iraq/Samawah"
# recipient_id = "mayor-office"
