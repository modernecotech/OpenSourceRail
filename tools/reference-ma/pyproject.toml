# reference-ma — Python reference interpreter for osr-interlocking.
#
# An independent implementation of the Movement Authority state machine
# specified in RFC 0001 §7 and RFC 0004 §M4. The Rust implementation in
# `crates/osr-interlocking/` is the production code; this Python twin
# exists so that differential fuzzing against both implementations can
# catch bugs in either one.
#
# Deliberately stdlib-only — no numpy, no pydantic. Every byte of
# behaviour should be readable by a reviewer without chasing into a
# framework.

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "reference-ma"
version         = "0.2.0"
description     = "Python reference interpreter for osr-interlocking (RFC 0004 M4)."
requires-python = ">=3.11"
license         = { text = "Apache-2.0" }
dependencies    = []

[project.scripts]
reference-ma = "reference_ma.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
