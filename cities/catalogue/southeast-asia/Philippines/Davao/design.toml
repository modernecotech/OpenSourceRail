epc_overhead_eur     = 214292156
total_usd            = 3560444215  # base CAPEX before timetable-sized dedicated solar
total_eur            = 3275608678  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
