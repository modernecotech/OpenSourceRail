epc_overhead_eur     = 51970698
total_usd            = 863488301  # base CAPEX before timetable-sized dedicated solar
total_eur            = 794409237  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
