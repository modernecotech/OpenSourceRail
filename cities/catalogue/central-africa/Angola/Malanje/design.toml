epc_overhead_eur     = 19273289
total_usd            = 320223894  # base CAPEX before timetable-sized dedicated solar
total_eur            = 294605982  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
