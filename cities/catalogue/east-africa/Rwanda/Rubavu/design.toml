# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# direct-procurement planning basis). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2

[costs]
currency_basis      = "USD local-owner trainset-family planning basis with direct material, local assembly/labour, nominal per-train QA/acceptance, and modest handover logistics included; 1 m clip-on fiberglass body modules reduce shell labour, mould tooling, cure space, and production setup; adopted full-fleet line-depot geometry and prices supersede the retained maintenance-only depot unit benchmarks; fixtures/tooling live in one shared national railway production plant sized per supported vehicle/car module and excluded from city CAPEX; warranty, spares, and routine commissioning support are treated as OPEX; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 26164550
at_grade_eur         = 24071386
elevated_usd         = 254773728
elevated_eur         = 234391830
bridge_usd           = 9473400
bridge_eur           = 8715528
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 290411678
civil_subtotal_eur   = 267178744
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 76600000
stations_eur         = 70472000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 44197430
depots_eur           = 40661636
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 42560000
rolling_stock_eur    = 39155200
# Shared national railway production plant is excluded from city CAPEX.
production_plant_usd = 0
production_plant_eur = 0
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1839393
signalling_eur       = 1692242
charging_microgrid_usd = 1650000
charging_microgrid_eur = 1518000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 32008095
epc_overhead_eur     = 29447447
total_usd            = 489266596  # base CAPEX before timetable-sized dedicated solar
total_eur            = 450125268  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
car_count = 2
gross_battery_kwh_per_car = 225
traction_battery_system_usd_per_car = 24166.67
motor_controller_sets_per_car = 2
motor_controller_set_usd = 10000
hv_distribution_usd_per_car = 3333.33
lv_dc_dc_usd_per_car = 2500
roof_pv_mppt_usd_per_car = 1000
core_electrical_usd_per_car = 51000
