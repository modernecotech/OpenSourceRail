[city]
slug            = "jinja"
country         = "UG"
population      = 300000
bbox            = { south = 0.3803, west = 33.135, north = 0.5155, east = 33.2702 }
centroid_lat    = 0.44630300903430153
centroid_lon    = 33.2030042338275

[climate]
preset          = "tropical-wet"

[composition]
profile         = "mid-city-tropical"

[operations.energy_adaptive_service]
enabled                     = true
normal_service_soc          = 0.40
maximum_headway_multiplier  = 3.0
protected_peak_headway_min  = 3

[operations.traction_energy]
reference_energy_kwh_per_car_km = 3.0
modern_drive_energy_factor      = 0.80
nominal_energy_kwh_per_car_km   = 2.4
technology                      = "PMSM traction motors + SiC inverters"

[operations.radial_service]
minimum_charging_dwell_seconds = 120

[operations.ring_service]
station_spacing_multiplier  = 1.0
opportunity_charging_required = true
minimum_dwell_seconds        = 120
minimum_traversal_energy_margin = 1.10
