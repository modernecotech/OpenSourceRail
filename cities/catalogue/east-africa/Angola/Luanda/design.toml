centroid_lon    = 13.295905276020369

[climate]
preset          = "tropical-wet"

[composition]
profile         = "mega-city-tropical"

[operations.energy_adaptive_service]
enabled                     = true
normal_service_soc          = 0.40
maximum_headway_multiplier  = 3.0
protected_peak_headway_min  = 3

[operations.traction_energy]
