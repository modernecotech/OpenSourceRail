epc_overhead_eur     = 30290675
total_usd            = 503276750  # base CAPEX before timetable-sized dedicated solar
total_eur            = 463014610  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
