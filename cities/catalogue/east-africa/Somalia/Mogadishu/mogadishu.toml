# AUTO-GENERATED from cities/catalogue/east-africa/Somalia/Mogadishu/design.toml.
# Do not hand-edit; run `python -m osr_scenario --design ...` to regenerate.
# Source of truth: cities/catalogue/east-africa/Somalia/Mogadishu/design.toml

[scenario]
name = "Mogadishu"
start_time = "05:30"
# Clean + daily safety inspection + low-C recharge, concurrently.
depot_service_seconds = 720
# Preserve the 07:00–09:00 and 15:00–17:00 three-minute peaks;
# widen only off-peak headways when delivered charging energy is low.
energy_adaptive_service = true
normal_service_soc = 0.40
maximum_headway_multiplier = 3.0
protected_peak_headway_min = 3


[climate]
ambient_c = 28
peak_sun_hours = 6.0


[consist]
# From rolling-stock family 'metro-4car'.
car_count = 4
length_m = 75
mass_kg = 136000
max_speed_kmh = 90.0
# 720 kWh usable with a 20% protected reserve.
battery_capacity_kwh = 900
# 3.0 reference x 0.80 PMSM/SiC factor; climate uplift follows.
energy_kwh_per_car_km = 2.4
passenger_capacity = 480
seat_count = 80
crush_capacity = 640
service_accel_mps2 = 1.1

[consist.systems]
mechanical_standard_revision = "A-DRAFT"
door_cassettes_per_car = 4
window_cassettes_per_car = 6
service_rails_per_car = 8
fastener_family_count = 4
connector_family_count = 2
main_light_modules_per_car = 22
emergency_light_modules_per_car = 4
door_threshold_light_modules_per_car = 4
lighting_power_w_per_car = 500.0
hvac_thermal_kw_per_car = 24.0

[consist.systems.integrated_thermal]
architecture = "common refrigerant plant with physically separated cabin-air and battery-coolant circuits"
battery_priority = true
battery_target_c = 28.0
battery_derate_c = 45.0
battery_trip_c = 55.0
common_compressor_failure_response = "cabin fans only; traction derate; battery isolate at protection threshold"
release_boundary = "supplier data, pressure/refrigerant safety, thermal rig, EMC, vibration and first-article tests required"

[consist.roof_pv]
nameplate_kw = 25.6
usable_factor = 0.65
charges_while_moving = true
charges_while_dwelled = true

[consist.roof_pv.air_cleaner]
enabled = true
compressor_power_kw = 1.2
dust_loss_recovery_frac = 0.75


