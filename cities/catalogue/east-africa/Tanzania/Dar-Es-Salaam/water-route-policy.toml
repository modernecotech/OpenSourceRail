basis = "Replace the retained offshore or tiny isolated-shore endpoint with a permitted dry bank connected to the urban land route within a bounded 5 km envelope. Open-water rail extensions and small marine land patches are excluded from this generic city example; surveyed access, endpoint catchment, land rights, curves and crossing structures require separate project release. Every actual endpoint shift and route replacement is retained and priced in the regenerated layout."
