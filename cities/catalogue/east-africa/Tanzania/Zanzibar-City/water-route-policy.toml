basis = "The retained historical route has an offshore endpoint near Bawe and more than 8 km of wet approach. Remove that marine extension from this Unguja city rail example and select a permitted dry shore connected to the existing urban land route within an explicit 8.5 km endpoint envelope. A 5 km bound cannot reach the connected shore and would select an offshore island instead. Ferry and island links, surveyed access, catchment, land rights and shoreline/curve/structure release require a separate project design; an open-sea rail extension is not assumed. Actual scope removal and endpoint displacement are recorded and priced."
