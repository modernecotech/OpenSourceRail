epc_overhead_eur     = 123588000
total_usd            = 2053403118  # base CAPEX before timetable-sized dedicated solar
total_eur            = 1889130869  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
