epc_overhead_eur     = 182915300
total_usd            = 3039120657  # base CAPEX before timetable-sized dedicated solar
total_eur            = 2795991004  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
