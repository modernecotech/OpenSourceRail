epc_overhead_eur     = 76137308
total_usd            = 1265014269  # base CAPEX before timetable-sized dedicated solar
total_eur            = 1163813127  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
