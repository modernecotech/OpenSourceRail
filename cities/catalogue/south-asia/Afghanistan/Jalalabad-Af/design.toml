epc_overhead_eur     = 90455468
total_usd            = 1502909182  # base CAPEX before timetable-sized dedicated solar
total_eur            = 1382676447  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
