epc_overhead_eur     = 55384820
total_usd            = 920213615  # base CAPEX before timetable-sized dedicated solar
total_eur            = 846596526  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
