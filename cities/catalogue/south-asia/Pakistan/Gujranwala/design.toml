at_grade_eur         = 420813031
elevated_usd         = 99152757
elevated_eur         = 91220536
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 36000000  # $4.5 M per elevated interchange.
junction_premium_eur = 33120000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 592558225
civil_subtotal_eur   = 545153567
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 300600000
stations_eur         = 276552000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 244160000
rolling_stock_eur    = 224627200
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 0
production_plant_eur = 0
# Systems: residual train-control wayside + station/depot charging microgrids.
