epc_overhead_eur     = 158769045
total_usd            = 2637932898  # base CAPEX before timetable-sized dedicated solar
total_eur            = 2426898266  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
