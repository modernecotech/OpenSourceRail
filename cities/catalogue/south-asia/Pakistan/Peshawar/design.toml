epc_overhead_eur     = 361303784
total_usd            = 6003028704  # base CAPEX before timetable-sized dedicated solar
total_eur            = 5522786408  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
