epc_overhead_eur     = 204989776
total_usd            = 3405886034  # base CAPEX before timetable-sized dedicated solar
total_eur            = 3133415151  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
