epc_overhead_eur     = 40331125
total_usd            = 670097879  # base CAPEX before timetable-sized dedicated solar
total_eur            = 616490049  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
