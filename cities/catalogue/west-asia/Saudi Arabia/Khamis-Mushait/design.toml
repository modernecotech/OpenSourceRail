epc_overhead_eur     = 60171358
total_usd            = 999741512  # base CAPEX before timetable-sized dedicated solar
total_eur            = 919762191  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
