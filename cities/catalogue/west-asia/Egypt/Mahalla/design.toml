epc_overhead_eur     = 42460953
total_usd            = 705484778  # base CAPEX before timetable-sized dedicated solar
total_eur            = 649045996  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
