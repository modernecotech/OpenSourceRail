epc_overhead_eur     = 59596630
total_usd            = 990192466  # base CAPEX before timetable-sized dedicated solar
total_eur            = 910977069  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
