537.0" y="325.75" width="26" height="22" fill="#253b53"/><rect x="597.0" y="325.75" width="26" height="22" fill="#253b53"/><rect x="657.0" y="325.75" width="26" height="22" fill="#253b53"/><path d="M100 336.75H700" stroke="#d27b24" stroke-width="3"/><text x="100" y="443" font-size="14">Seat centres: 300 + 600 × i, i = 0…9; 20 seats per panel.</text><text x="100" y="470" font-size="14">Rail lines schematic: actual head profile needed for 1435 running-face gauge.</text><text x="100" y="506" font-size="14">Base: 250 thick; twin plinths: 380 × 160; two rows at 3500 track centres.</text><text x="100" y="533" font-size="14">Concrete: 5.0796 m³; bare mass: 12.699 t. Troughs, steel and rigging separate.</text><text x="100" y="574" font-size="14">Source: osr_mech.civil.slab; Baghdad detail register.</text><text x="100" y="604" font-size="14">Reference only. Not a fabrication or setting-out drawing.</text></g></svg>
