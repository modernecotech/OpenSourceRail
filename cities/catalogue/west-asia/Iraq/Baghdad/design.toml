# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# direct-procurement planning basis). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2

[costs]
currency_basis      = "USD local-owner trainset-family planning basis with direct material, local assembly/labour, nominal per-train QA/acceptance, and modest handover logistics included; 1 m clip-on fiberglass body modules reduce shell labour, mould tooling, cure space, and production setup; distributed overnight stabling reduces depot parking scope; fixtures/tooling live in one shared national railway production plant sized per supported vehicle/car module and excluded from city CAPEX; warranty, spares, and routine commissioning support are treated as OPEX; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 1106806151
at_grade_eur         = 1018261659
elevated_usd         = 2479407193
elevated_eur         = 2281054618
bridge_usd           = 222764000
bridge_eur           = 204942880
junction_premium_usd = 85500000  # $4.5 M per elevated interchange.
junction_premium_eur = 78660000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 3894477344
civil_subtotal_eur   = 3582919157
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 907900000
stations_eur         = 835268000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 1396080000
rolling_stock_eur    = 1284393600
# Shared national railway production plant is excluded from city CAPEX.
production_plant_usd = 0
production_plant_eur = 0
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 25825872
signalling_eur       = 23759803
charging_microgrid_usd = 67600000
charging_microgrid_eur = 62192000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 440991825
epc_overhead_eur     = 405712479
total_usd            = 6740875042  # base CAPEX before timetable-sized dedicated solar
total_eur            = 6201605038  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
car_count = 6
gross_battery_kwh_per_car = 225
traction_battery_system_usd_per_car = 24166.67
motor_controller_sets_per_car = 2
motor_controller_set_usd = 10000
hv_distribution_usd_per_car = 3333.33
lv_dc_dc_usd_per_car = 2500
roof_pv_mppt_usd_per_car = 1000
core_electrical_usd_per_car = 51000
core_electrical_usd_per_trainset = 306000
fleet_core_electrical_usd = 254286000
station_architecture = "500-1500 V DC/DC configured to 500 kW; 650-700 V train bus"
stationary_lfp_500kwh_usd = 37500
station_dcdc_500kw_usd = 15000
station_contact_protection_control_usd = 12500
station_equipment_total_usd = 65000
normal_integrated_charging_site_usd = 100000
station_charging_cabinet_count = 4
