# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# direct-procurement planning basis). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2

[costs]
currency_basis      = "USD local-owner trainset-family planning basis with direct material, local assembly/labour, nominal per-train QA/acceptance, and modest handover logistics included; 1 m clip-on fiberglass body modules reduce shell labour, mould tooling, cure space, and production setup; distributed overnight stabling reduces depot parking scope; fixtures/tooling live in one shared national railway production plant sized per supported vehicle/car module and excluded from city CAPEX; warranty, spares, and routine commissioning support are treated as OPEX; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 495592478
at_grade_eur         = 455945080
elevated_usd         = 2966633287
elevated_eur         = 2729302624
bridge_usd           = 400295922
bridge_eur           = 368272248
junction_premium_usd = 27000000  # $4.5 M per elevated interchange.
junction_premium_eur = 24840000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 3889521686
civil_subtotal_eur   = 3578359951
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 741900000
stations_eur         = 682548000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 1280160000
rolling_stock_eur    = 1177747200
# Shared national railway production plant is excluded from city CAPEX.
production_plant_usd = 0
production_plant_eur = 0
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 23708989
signalling_eur       = 21812269
charging_microgrid_usd = 57800000
charging_microgrid_eur = 53176000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 420076347
epc_overhead_eur     = 386470239
total_usd            = 6421167022  # base CAPEX before timetable-sized dedicated solar
total_eur            = 5907473660  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
car_count = 6
