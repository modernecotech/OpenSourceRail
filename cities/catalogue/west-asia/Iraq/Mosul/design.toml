centroid_lat    = 36.35575711766188
centroid_lon    = 43.125220632547396

[climate]
preset          = "hot-desert"

[composition]
profile         = "large-city-desert"

[operations.energy_adaptive_service]
enabled                     = true
normal_service_soc          = 0.40
maximum_headway_multiplier  = 3.0
protected_peak_headway_min  = 3

[operations.traction_energy]
reference_energy_kwh_per_car_km = 3.0
modern_drive_energy_factor      = 0.80
