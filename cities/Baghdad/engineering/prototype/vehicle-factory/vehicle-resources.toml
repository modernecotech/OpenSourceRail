[[product]]
name = "Gross RHS and liner blanks"
items = ["@saw"]
route = "Receive, saw, trim, deburr and mark"
resources = ["vehicle-stores", "vehicle-saw", "vehicle-prep"]
inspection = "First-off heat, setup, length, square/angle and traceability"
disposition = "local fabrication"

[[product]]
name = "Plate gussets and seat blanks"
items = ["@plate"]
route = "Nest, cut, mark, deburr and dimensional check"
resources = ["vehicle-plate-contract"]
inspection = "Heat, dimensions and released edge/finish allowance"
disposition = "contract blank supply"

[[product]]
name = "Braced steel body"
items = ["Braced steel body"]
route = "Preset side fields, join under dimensional control, inspect and coat"
resources = ["vehicle-body-bed", "vehicle-arc-set", "vehicle-metrology", "vehicle-weld-ndt", "vehicle-coat", "vehicle-shop-crane"]
inspection = "Body release with joint and datum records after unclamping"
disposition = "local build with finishing service"

[[product]]
name = "Powered bogie"
items = ["Removable powered bogie"]
route = "Join, inspect, machine, coat and integrate axle, suspension, drive and brake"
resources = ["vehicle-bogie-bed", "vehicle-arc-set", "vehicle-weld-ndt", "vehicle-bogie-machine", "vehicle-bogie-fit", "vehicle-bogie-test", "vehicle-metrology", "vehicle-shop-crane", "vehicle-coat"]
inspection = "Seat and axle survey, mounting records and restrained functional check"
disposition = "local integration and supplier safety assemblies"

[[product]]
name = "Wheelsets and bearing seats"
items = ["Wheelset", "Axlebox bearing positions"]
route = "Buy traceable wheelsets and approved mounted bearings"
resources = ["vehicle-bearings", "vehicle-bogie-fit"]
inspection = "Seat position is distinct from the supplier bearing component count"
disposition = "certified supply and clean assembly"

[[product]]
name = "Door opening assemblies"
items = ["Door opening and controller"]
route = "Fit liners, slide/stop/retention hardware and complete door; set and verify"
resources = ["vehicle-door-fixture", "vehicle-fit", "vehicle-metrology"]
inspection = "Eight loaded/worn apertures and full leaves sweep per car; proof of return/anti-drop"
disposition = "buy complete door and fabricate liners"

[[product]]
name = "Door liner hardware"
items = ["flush liner screws", "liner threaded receivers"]
route = "Prepare and fit approved flush fasteners"
resources = ["vehicle-prep", "vehicle-door-fixture", "vehicle-fit"]
inspection = "Six paired positions per liner, stock fastener strength and access subject to joint design"
disposition = "buy hardware and local fitting"

[[product]]
name = "Roof HVAC modules"
items = ["Roof HVAC module"]
route = "Receive, stage, lift, fasten, connect and test"
resources = ["vehicle-fit", "vehicle-shop-crane"]
inspection = "Fitted mass and mount, removal sweep, cool/condensate, bond and leak tests"
disposition = "buy module and local fitting"

[[product]]
name = "Onboard electrical cabinet and harness kits"
items = ["Braced steel body"]
route = "Prepare cabinet/boards by car role, cut/build harness, bench-test and install"
resources = ["vehicle-electric", "vehicle-harness-test", "vehicle-end-test"]
inspection = "Kit proxy per car, individual cabinet and harness count open. Validate crimp, continuity, isolation and installed flex"
disposition = "local build and supplier safety modules"

[[product]]
name = "Onboard collector sets"
items = ["onboard_contact_sets"]
route = "Fit suspended collector sets by role, connect and align"
resources = ["vehicle-collector-tools", "vehicle-end-test"]
inspection = "Check actual travel, contact forces and protective clearances"
disposition = "buy assembly and install"

[[product]]
name = "Drive, brake and spring interfaces"
items = ["Axle drive module", "Brake controller", "Primary spring interface", "Secondary spring interface"]
route = "Clean assembly and torque, protect fluid/electrical runs and verify restraint"
resources = ["vehicle-bogie-fit", "vehicle-bogie-test"]
inspection = "Preserve individual quantities by family; independent brake and parking friction scope open"
disposition = "buy approved modules and fit"

[[product]]
