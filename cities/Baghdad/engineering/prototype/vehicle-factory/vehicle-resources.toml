route = "Marriage, weigh, static test and stage six sets"
resources = ["vehicle-marriage", "vehicle-end-test", "vehicle-set-test", "vehicle-repair"]
inspection = "Serialised retention, flexible services, electrical and release/test records"
disposition = "local integration"

# Replaceable shop hardware per active jig. These quantities are included inside
# the fixture price. Working contact geometry and tolerances require tool design.
[[fixture_item]]
parent = "vehicle-body-bed"
name = "Primary datum wear pad"
per_unit = 3
route = "Machine three replaceable pads for the fixture reference plane. Mark the jig and position, survey installed faces and retain the calibration record."
[[fixture_item]]
parent = "vehicle-body-bed"
name = "Centreline survey monument"
per_unit = 2
route = "Machine and attach target nests outside the joining heat zone. Record the two target locations and the transform to the car frame."
[[fixture_item]]
parent = "vehicle-body-bed"
name = "Adjustable longitudinal reference stop"
per_unit = 1
route = "Fabricate the bolted stop base, machine the replaceable contact face and inspect its position against the car datum."
[[fixture_item]]
parent = "vehicle-bogie-bed"
name = "Primary seat locator block"
per_unit = 4
route = "Machine replaceable blocks for the four primary positions at local x ±1,050 and y ±1,040 mm. Survey jig faces before and after the trial weld."
[[fixture_item]]
parent = "vehicle-bogie-bed"
name = "Secondary seat locator block"
per_unit = 2
route = "Machine and identify a left and right locator at local x 0 and y ±850 mm. Inspect the face height and protect the approved reference surfaces during transport."
