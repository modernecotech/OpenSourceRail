# A separately costed rehearsal scenario for the buyer, one CAM technician and
# the first cohort. A factor list makes the working quantity reproducible.
[workshop.programming_pc]
scope = "One CAD/CAM workstation, dual screens, UPS and local backup for the manufacturing technician."
quantity_factors = [1]
unit = "workstation"
period = "initial setup"
usd = [1500, 2800, 5000]
credit = "Existing engineering PC or CAM supplier's workstation."
[workshop.reader]
scope = "One rugged shop-floor reader for released drawings, work instructions and offline exercises."
quantity_factors = [1]
unit = "reader"
period = "initial setup"
usd = [450, 950, 2200]
credit = "Existing workstation or ERP terminal in the parent shop."
[workshop.freecad]
scope = "FreeCAD desktop licence on the technician's PC. Reader uses a browser and the offline material."
quantity_factors = [1]
unit = "seat-year"
period = "annual support"
usd = [0, 0, 0]
refs = ["freecad"]
credit = "No commercial seat fee for the chosen open-source tool."
[workshop.setup]
scope = "One systems technician for one eight-hour day to install pinned software, test imports and record restore steps."
quantity_factors = [1, 8]
unit = "technician-hour"
period = "initial setup"
usd = [25, 55, 100]
credit = "Buyer IT setup, including any installation bundled in the workstation quote."
[workshop.post]
scope = "One CAM specialist for three eight-hour days to configure one machine/controller post and document its constraints."
quantity_factors = [3, 8]
unit = "specialist-hour"
period = "initial setup"
usd = [55, 110, 210]
credit = "Contract cutter's own postprocessor and setup fee."
[workshop.backplot]
scope = "One reviewer for one eight-hour day for source geometry versus post output, offline backplot and independent review record."
quantity_factors = [1, 8]
unit = "review-hour"
period = "initial setup"
usd = [40, 85, 160]
credit = "Existing CAM validation or engineering-assurance labour."
[workshop.instructor]
scope = "Two supervised four-hour sessions for one cohort covering the seven workshop roles, followed by a skills handover."
quantity_factors = [2, 4]
unit = "instructor-hour"
period = "first cohort and trials"
usd = [40, 85, 150]
credit = "Supplier training included with the machine or buyer induction."
[workshop.attendees]
scope = "Seven learners participate in both four-hour sessions. Attendance is owner time at a loaded hourly rate."
quantity_factors = [7, 2, 4]
unit = "learner-hour"
period = "first cohort and trials"
usd = [12, 25, 55]
credit = "Existing workforce payroll. Use as an opportunity cost when payroll is funded."
[workshop.witness]
scope = "One owner quality representative for two eight-hour first-off visits, separate from the inspection supplier."
quantity_factors = [1, 2, 8]
unit = "owner-hour"
period = "first cohort and trials"
usd = [25, 55, 110]
credit = "Owner quality or first-article assurance."
[workshop.coupons]
scope = "Two supervised shop bookings for sample preparation and first-off cuts against four plate families plus a representative saw cut. Includes shop time and sample stock."
quantity_factors = [2]
unit = "trial shift"
period = "first cohort and trials"
usd = [350, 850, 2000]
credit = "Cutting supplier's setup, coupons or first article in the fleet contract."
[workshop.metrology]
scope = "Two staffed first-off inspection visits for datum and dimensional checks with calibrated instruments and reports. Confirm instrument uncertainty against each feature."
quantity_factors = [2]
unit = "survey day"
period = "first cohort and trials"
usd = [850, 1700, 2800]
refs = ["tracker"]
credit = "Credit the instrument hire and inspection labour where the series metrology booking already contains this work."
[workshop.support]
scope = "Two eight-hour days per year for backup restore, postprocessor change review and a reference backplot."
quantity_factors = [2, 8]
unit = "support-hour"
period = "annual support"
usd = [40, 85, 160]
credit = "Included support, software assurance and workstation IT contracts."
[workshop.fusion]
scope = "Optional substitution of one standard commercial seat for the FreeCAD seat. Revalidate the post and confirm Iraqi licence terms before purchase."
quantity_factors = [1]
unit = "user-year"
period = "optional annual substitution"
usd = [680, 680, 680]
refs = ["fusion"]
credit = "Alternative subscription. Exclude when budgeting the open-source scenario."
