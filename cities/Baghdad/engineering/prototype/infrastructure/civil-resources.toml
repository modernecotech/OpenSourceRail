workdays = 425
hours_per_day = 8
utilisation = 0.875
note = "425 effective workdays already include the opening's annual ramp and availability. The 0.875 factor budgets seven repeat-operation hours in a staffed eight-hour effective day for shared minor stoppages. Continuous mould occupancy and the erection front have explicit overrides. Each resource count is an arithmetic procurement screen pending supplier or site return."

[daily_targets]
beam_count = 8
