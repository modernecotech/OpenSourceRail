# Approximate access markers and concept alignment controls in WGS84.
# Each route uses independent directional tracks. Crossing of the two lines at
# Tahrir uses separate levels and a single passenger interchange precinct.
scope = "Independent central Baghdad concept with end-to-end services"
interchange = "Tahrir"
commercial_speed_kmh = 30
speed_cap_kmh = 60
dwell_s = 35
terminal_layover_min = 3
headways_s = [600, 900, 1200]
availability = 0.85
public_notes = [
  "Provide an independent elevated crossing in the vicinity of Al Jumhuriya Bridge. The mapped road bridge supplies a corridor reference for the span and approaches.",
  "Align station access around existing streets and heritage sites. Old Rusafa needs a heritage, property and construction fit study. Concept vertices have no surveyed clearances or design radii.",
  "Give Tahrir an accessible transfer between separately tracked services. For the timetable screen, conservatively reserve one shared conflict resource at Tahrir until the layout demonstrates separation. Carry vertical circulation, turnbacks and terminal staging through engineering and price review.",
  "Intercity and bus transfers are candidate precincts. Confirm actual public entrances and pedestrian routes. Local transfer times, ridership, flood, utilities and property are open.",
]

[lines.C1]
name = "Mansour–Karkh–Tahrir–Zayouna"
basis = "Mansour district and central rail hub, national museum, a separate Tigris crossing by the mapped Republic Bridge corridor, Tahrir, east-bank employment and Zayouna."
sequence = ["Mansour", "Zawraa", "Allawi", "Museum", "Karkh", "Haifa-bend", "Haifa-approach", "Bridge-west", "Bridge-bank", "Bridge-east", "Tahrir", "Kilani", "East-approach", "Zayouna"]
tigris_crossings = 1

[lines.C2]
name = "Al Mustansiriya–Medical City–Old Rusafa–Jadriya"
basis = "Al Mustansiriya, hospital and bus transfers, the Mutanabbi and Shorja markets, Saadoun Street, Karrada, Jadriya and the University of Baghdad approach."
sequence = ["Mustansiriya", "Bab", "Medical", "Mutanabbi", "Shorja", "Tahrir", "Saadoun", "Firdos", "Karrada", "Jadriya", "University"]
tigris_crossings = 0

