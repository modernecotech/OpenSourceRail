<text x="450" y="230" font-family="sans-serif" font-size="15" fill="#294b34">8 m island</text>
<line x1="35" y1="270" x2="965" y2="270" stroke="#64717b" stroke-width="4"/>
<rect x="93.5" y="94" width="162" height="106" fill="#d7e8f0" stroke="#17364a" stroke-width="2"/>
<line x1="174.5" y1="198" x2="174.5" y2="281" stroke="#17364a" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="53.5" y="242" width="14" height="25" fill="#bd583d" stroke="#7e2b23" stroke-width="2"/>
<rect x="44.5" y="232" width="32" height="40" fill="none" stroke="#bd583d" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="744.5" y="94" width="162" height="106" fill="#d7e8f0" stroke="#17364a" stroke-width="2"/>
<line x1="825.5" y1="198" x2="825.5" y2="281" stroke="#17364a" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="932.5" y="242" width="14" height="25" fill="#bd583d" stroke="#7e2b23" stroke-width="2"/>
<rect x="923.5" y="232" width="32" height="40" fill="none" stroke="#bd583d" stroke-width="2" stroke-dasharray="4 3"/>
<text x="36" y="67" font-family="sans-serif" font-size="13" fill="#17364a">Protected contact rail and guard are outboard of each train, away from the island.</text>
<text x="36" y="307" font-family="sans-serif" font-size="13" fill="#17364a">Body 2.7 m · static platform gap 75 mm · floor 1 m above rail</text>
<text x="36" y="328" font-family="sans-serif" font-size="11" fill="#596e78">Track centres 10.85 m · contact rail 1.9 m outboard of track centre. Straight nominal section; access and insulation require detailed design.</text>
</svg>
