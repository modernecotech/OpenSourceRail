at_grade_eur         = 610332691
elevated_usd         = 293677437
elevated_eur         = 270183242
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 45000000  # $4.5 M per elevated interchange.
junction_premium_eur = 41400000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 1002082536
civil_subtotal_eur   = 921915933
# Stations (RFC 0010 archetype catalogue).
