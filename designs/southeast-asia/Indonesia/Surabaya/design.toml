at_grade_eur         = 690944978
elevated_usd         = 303919169
elevated_eur         = 279605635
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 54000000  # $4.5 M per elevated interchange.
junction_premium_eur = 49680000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 1108946319
civil_subtotal_eur   = 1020230613
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 216600000
stations_eur         = 199272000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 34000000
depots_eur           = 31280000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 384160696
rolling_stock_eur    = 353427840
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 14205559
signalling_eur       = 13069114
