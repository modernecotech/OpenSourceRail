# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 158241023
at_grade_eur         = 145581741
elevated_usd         = 160917541
elevated_eur         = 148044138
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 16000000  # $2 M per elevated interchange.
junction_premium_eur = 14720000  # EUR 1.8 M per elevated interchange.
civil_subtotal_usd   = 335158564
civil_subtotal_eur   = 308345879
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 58910000
stations_eur         = 54197200
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 15600000
depots_eur           = 14352000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 198483026
rolling_stock_eur    = 182604384
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3415008
signalling_eur       = 3141807
charging_microgrid_usd = 24125000
charging_microgrid_eur = 22195000
power_eur            = 22195000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 44498412
epc_overhead_eur     = 40938539
total_usd            = 680190010  # full CAPEX stack
total_eur            = 625774809  # full CAPEX stack
