# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 259730911
at_grade_eur         = 238952438
elevated_usd         = 60260802
elevated_eur         = 55439938
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 20000000  # $2.5 M per elevated interchange.
junction_premium_eur = 18400000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 339991713
civil_subtotal_eur   = 312792376
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 96760000
stations_eur         = 89019200
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 15600000
depots_eur           = 14352000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 198483026
rolling_stock_eur    = 182604384
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3433384
signalling_eur       = 3158714
charging_microgrid_usd = 24775000
charging_microgrid_eur = 22793000
power_eur            = 22793000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 47533019
epc_overhead_eur     = 43730377
total_usd            = 726576142  # full CAPEX stack
total_eur            = 668450051  # full CAPEX stack
