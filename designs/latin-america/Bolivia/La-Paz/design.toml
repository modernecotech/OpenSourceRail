# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 157450036
at_grade_eur         = 144854033
elevated_usd         = 103791284
elevated_eur         = 95487981
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 26000000  # $2 M per elevated interchange.
junction_premium_eur = 23920000  # EUR 1.8 M per elevated interchange.
civil_subtotal_usd   = 287241320
civil_subtotal_eur   = 264262014
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 72110000
stations_eur         = 66341200
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 15600000
depots_eur           = 14352000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 185677670
rolling_stock_eur    = 170823456
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3184581
signalling_eur       = 2929815
charging_microgrid_usd = 28025000
charging_microgrid_eur = 25783000
power_eur            = 25783000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 41428700
epc_overhead_eur     = 38114404
total_usd            = 633267270  # full CAPEX stack
total_eur            = 582605889  # full CAPEX stack
