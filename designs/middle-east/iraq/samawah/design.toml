# Samawah urban rail — design-time description.
#
# This file is the AUTHORITATIVE design artifact for the Samawah reference
# deployment. It is a SUPERSET of scenarios/samawah.toml:
#
#   designs/templates/*.toml          ← reusable Lego blocks
#   designs/.../samawah/design.toml   ← this file: city-specific composition
#   scenarios/samawah.toml            ← generated from this (operational fields)
#   corridor.geojson                  ← OSM-derived routing (generated)
#   bom.yaml / plan.yaml              ← generated by crates/osr-design
#
# Reference: docs/rfcs/0003-samawah-reference-deployment.md.
# Indicative alignment only — not a surveyed design.

[design]
schema_version = 1
id            = "middle-east/iraq/samawah"
name          = "Samawah — Line 1 Nahrain + Line 2 Halqa (RFC 0003)"
rfc           = "docs/rfcs/0003-samawah-reference-deployment.md"
scenario_out  = "scenarios/samawah.toml"

# Templates this city composes.
[design.templates]
rolling_stock    = "designs/templates/rolling-stock.toml"
stations         = "designs/templates/stations.toml"
energy_sites     = "designs/templates/energy-sites.toml"
climate          = "designs/templates/climate.toml"
structures       = "designs/templates/structures.toml"
depots           = "designs/templates/depots.toml"
signalling       = "designs/templates/signalling.toml"
comms            = "designs/templates/comms.toml"
switches         = "designs/templates/switches.toml"
level_crossings  = "designs/templates/level-crossings.toml"
accessibility    = "designs/templates/accessibility.toml"
platform_doors   = "designs/templates/platform-doors.toml"
passenger_info   = "designs/templates/passenger-info.toml"
fare_systems     = "designs/templates/fare-systems.toml"
track_geometry   = "designs/templates/track-geometry.toml"
country_costs    = "designs/templates/country-costs.toml"
fleet_sizing     = "designs/templates/fleet-sizing.toml"
demand_profiles  = "designs/templates/demand-profiles.toml"
service_hours    = "designs/templates/service-hours.toml"
climate_adapters = "designs/templates/climate-adapters.toml"

[location]
country     = "IQ"
governorate = "Al-Muthanna"
city        = "As-Samawah"
center_lat  = 31.3109
center_lon  = 45.2804
bbox        = { south = 31.265, west = 45.215, north = 31.355, east = 45.360 }

[climate]
preset   = "hot-desert"
adapters = ["sand-filter-hvac", "vertical-bifacial-pv", "high-ambient-traction"]
# Samawah-specific overrides of the preset:
peak_sun_hours = 6.0          # preset default is 6.0 — kept explicit

# ----------------------------------------------------------------------------
# Fare system — Iraq mobile-money + QR.
# ----------------------------------------------------------------------------
[fare]
system = "iraq-mobile-money"

# ----------------------------------------------------------------------------
# Country cost context — for BOM USD rollup and local-currency output.
# ----------------------------------------------------------------------------
[costs]
country = "IQ"                # → country-costs.toml [countries.IQ]

# ----------------------------------------------------------------------------
# Stations — archetype reference + id/name/coords + local overrides only.
# Everything else (platform, canopy, dwell, charging) comes from the archetype.
# ----------------------------------------------------------------------------

# --- Line 1, west to east ---

[[stations]]
id        = "samawah-rws"
name      = "Samawah Railway Station"
archetype = "terminal"
lat       = 31.3221
lon       = 45.2578
# Override: intercity interchange, larger canopy than default terminal.
canopy_area_m2 = 2400

[[stations]]
id        = "north-gate"
name      = "North Gate"
archetype = "standard"
lat       = 31.3169
lon       = 45.2654

[[stations]]
id        = "old-souq"
name      = "Old Souq"
archetype = "standard"
lat       = 31.3120
lon       = 45.2740
# Override: constrained site, smaller canopy, no PV.
canopy_type    = "shelter-only"
canopy_area_m2 = 1200

[[stations]]
id        = "samawah-central"
name      = "Samawah Central"
archetype = "major"
lat       = 31.3087
lon       = 45.2820

[[stations]]
id        = "riverside"
name      = "Riverside"
archetype = "standard"
lat       = 31.3065
lon       = 45.2905

[[stations]]
id        = "eastern-bridge"          # L1/L2 interchange
name      = "Eastern Bridge"
archetype = "interchange"
lat       = 31.3045
lon       = 45.3005

[[stations]]
id        = "al-salam"
name      = "Al-Salam"
archetype = "standard"
lat       = 31.3022
lon       = 45.3105

[[stations]]
id        = "governorate-hospital"
name      = "Governorate Hospital"
archetype = "major"
lat       = 31.3000
lon       = 45.3200

[[stations]]
id        = "new-german-hospital"
name      = "New German Hospital"
archetype = "major"
lat       = 31.2975
lon       = 45.3310

[[stations]]
id        = "engineering-quarter"
name      = "Engineering Quarter"
archetype = "standard"
lat       = 31.2955
lon       = 45.3405

[[stations]]
id        = "al-muthanna-university"  # L1/L2 interchange
name      = "Al-Muthanna University"
archetype = "interchange"
lat       = 31.2930
lon       = 45.3505
# Override: sharp 2,000 pax / 20 min term-time peak — longer platform.
platform_clearance_m = 25
canopy_area_m2    = 3200

[[stations]]
id        = "east-depot"
name      = "East Depot & Yard"
archetype = "depot-terminal"
lat       = 31.2920
lon       = 45.3560

# --- Line 2 ring, counterclockwise from Eastern Bridge ---

[[stations]]
id        = "northern-suburbs-a"
name      = "Northern Suburbs A"
archetype = "standard"
lat       = 31.3150
lon       = 45.3080

[[stations]]
id        = "northern-suburbs-b"
name      = "Northern Suburbs B"
archetype = "standard"
lat       = 31.3235
lon       = 45.3000

[[stations]]
id        = "northwest-junction"
name      = "Northwest Junction"
archetype = "major"
lat       = 31.3310
lon       = 45.2805
# Override: doubles as secondary layup depot.
is_depot = true

[[stations]]
id        = "industrial-west"
name      = "Industrial West"
archetype = "standard"
lat       = 31.3225
lon       = 45.2580

[[stations]]
id        = "western-residential"
name      = "Western Residential"
archetype = "standard"
lat       = 31.3115
lon       = 45.2420

[[stations]]
id        = "south-west-residential"
name      = "South-West Residential"
archetype = "standard"
lat       = 31.2960
lon       = 45.2430

[[stations]]
id        = "southern-markets"
name      = "Southern Markets"
archetype = "major"
lat       = 31.2840
lon       = 45.2730

[[stations]]
id        = "south-east-residential"
name      = "South-East Residential"
archetype = "standard"
lat       = 31.2850
lon       = 45.3190

# ----------------------------------------------------------------------------
# Lines — station sequences with per-section civil class.
# `civil_class` refers to designs/templates/structures.toml classes.
# ----------------------------------------------------------------------------

[[lines]]
id                    = "line-1"
name                  = "Line 1 Nahrain"
is_ring               = false
rolling_stock         = "light-metro-3car"
geometry              = "standard-urban"
comms_backbone        = "single-ring-10g"
service_hours         = "conservative-religious"  # Muslim-majority country default
track_count           = 2
default_max_speed_mps = 22                # 80 km/h
stations = [
    { id = "samawah-rws",            distance_from_prev_m = 0,    civil_class = "at-grade" },
    { id = "north-gate",             distance_from_prev_m = 1000, civil_class = "at-grade" },
    { id = "old-souq",               distance_from_prev_m = 1300, civil_class = "elevated" },
    { id = "samawah-central",        distance_from_prev_m = 1100, civil_class = "elevated" },
    { id = "riverside",              distance_from_prev_m = 900,  civil_class = "at-grade" },
    { id = "eastern-bridge",         distance_from_prev_m = 1200, civil_class = "bridge" },
    { id = "al-salam",               distance_from_prev_m = 1400, civil_class = "at-grade" },
    { id = "governorate-hospital",   distance_from_prev_m = 1300, civil_class = "at-grade" },
    { id = "new-german-hospital",    distance_from_prev_m = 1500, civil_class = "at-grade" },
    { id = "engineering-quarter",    distance_from_prev_m = 1300, civil_class = "at-grade" },
    { id = "al-muthanna-university", distance_from_prev_m = 1400, civil_class = "at-grade" },
    { id = "east-depot",             distance_from_prev_m = 600,  civil_class = "at-grade" },
]

[[lines]]
id                    = "line-2"
name                  = "Line 2 Halqa"
is_ring               = true
ring_wrap_length_m    = 1600
ring_wrap_civil_class = "at-grade"
rolling_stock         = "light-metro-3car"
geometry              = "standard-urban"
comms_backbone        = "single-ring-10g"
service_hours         = "conservative-religious"
track_count           = 2
default_max_speed_mps = 22
stations = [
    { id = "eastern-bridge",         distance_from_prev_m = 0,    civil_class = "at-grade" },
    { id = "northern-suburbs-a",     distance_from_prev_m = 1800, civil_class = "at-grade" },
    { id = "northern-suburbs-b",     distance_from_prev_m = 1500, civil_class = "at-grade" },
    { id = "northwest-junction",     distance_from_prev_m = 1700, civil_class = "at-grade" },
    { id = "industrial-west",        distance_from_prev_m = 1600, civil_class = "at-grade" },
    { id = "western-residential",    distance_from_prev_m = 1500, civil_class = "at-grade" },
    { id = "south-west-residential", distance_from_prev_m = 1800, civil_class = "at-grade" },
    { id = "southern-markets",       distance_from_prev_m = 1400, civil_class = "at-grade" },
    { id = "south-east-residential", distance_from_prev_m = 1600, civil_class = "at-grade" },
    { id = "al-muthanna-university", distance_from_prev_m = 1500, civil_class = "elevated" },
]

# ----------------------------------------------------------------------------
# Fleets — service plans (copied verbatim to scenarios/samawah.toml).
# ----------------------------------------------------------------------------

[[fleets]]
line            = "line-1"
trainset_count  = 6
dispatch_points = [
    { station = "samawah-rws", heading = "forward" },
    { station = "east-depot",  heading = "reverse" },
]
service_start = "05:30"
service_end   = "23:30"
schedule = [
    { from = "05:30", to = "07:00", headway_min = 10 },
    { from = "07:00", to = "09:30", headway_min = 4 },
    { from = "09:30", to = "16:00", headway_min = 8 },
    { from = "16:00", to = "19:00", headway_min = 4 },
    { from = "19:00", to = "22:00", headway_min = 10 },
    { from = "22:00", to = "23:30", headway_min = 15 },
]

[[fleets]]
line            = "line-2"
trainset_count  = 4
dispatch_points = [
    { station = "eastern-bridge",         heading = "forward" },
    { station = "al-muthanna-university", heading = "reverse" },
    { station = "eastern-bridge",         heading = "reverse" },
    { station = "al-muthanna-university", heading = "forward" },
]
service_start = "05:30"
service_end   = "23:30"
schedule = [
    { from = "05:30", to = "07:00", headway_min = 12 },
    { from = "07:00", to = "09:30", headway_min = 6 },
    { from = "09:30", to = "16:00", headway_min = 10 },
    { from = "16:00", to = "19:00", headway_min = 6 },
    { from = "19:00", to = "22:00", headway_min = 12 },
    { from = "22:00", to = "23:30", headway_min = 15 },
]

# ----------------------------------------------------------------------------
# Trackside energy sites — tier reference only, no explicit kW/kWh.
# ----------------------------------------------------------------------------

[[sites]]
station = "samawah-rws"
tier    = "terminal"

[[sites]]
station = "samawah-central"
tier    = "standard"

[[sites]]
station = "eastern-bridge"
tier    = "interchange"

[[sites]]
station = "governorate-hospital"
tier    = "standard"

[[sites]]
station = "new-german-hospital"
tier    = "standard"

[[sites]]
station = "al-muthanna-university"
tier    = "interchange"

[[sites]]
station = "east-depot"
tier    = "depot-main"

[[sites]]
station = "northwest-junction"
tier    = "depot-secondary"

[[sites]]
station = "southern-markets"
tier    = "standard"

# ----------------------------------------------------------------------------
# Depots — archetype reference for is_depot stations.
# ----------------------------------------------------------------------------

[[depots]]
station   = "east-depot"
archetype = "main-heavy"

[[depots]]
station   = "northwest-junction"
archetype = "layup-minimal"

# ----------------------------------------------------------------------------
# Wayside nodes — one SMRaft consensus peer per site (RFC 0001).
# kit from signalling.toml; comms from comms.toml [trackside.*].
# ----------------------------------------------------------------------------

wayside_nodes = [
    # Line 1 — 12 stations, 1 consensus region.
    { station = "samawah-rws",            kit = "depot-throat", comms = "dual-5g-lora", region = "line-1" },
    { station = "north-gate",             kit = "station",      comms = "dual-5g-lora", region = "line-1" },
    { station = "old-souq",               kit = "station",      comms = "dual-5g-lora", region = "line-1" },
    { station = "samawah-central",        kit = "station",      comms = "dual-5g-lora", region = "line-1" },
    { station = "riverside",              kit = "station",      comms = "dual-5g-lora", region = "line-1" },
    { station = "eastern-bridge",         kit = "interlocking", comms = "dual-5g-lora", region = "line-1" },
    { station = "al-salam",               kit = "station",      comms = "dual-5g-lora", region = "line-1" },
    { station = "governorate-hospital",   kit = "station",      comms = "dual-5g-lora", region = "line-1" },
    { station = "new-german-hospital",    kit = "station",      comms = "dual-5g-lora", region = "line-1" },
    { station = "engineering-quarter",    kit = "station",      comms = "dual-5g-lora", region = "line-1" },
    { station = "al-muthanna-university", kit = "interlocking", comms = "dual-5g-lora", region = "line-1" },
    { station = "east-depot",             kit = "depot-throat", comms = "dual-5g-lora", region = "line-1" },
    # Line 2 — 10 stations (2 shared with Line 1), 1 consensus region.
    { station = "northern-suburbs-a",     kit = "station",      comms = "dual-5g-lora", region = "line-2" },
    { station = "northern-suburbs-b",     kit = "station",      comms = "dual-5g-lora", region = "line-2" },
    { station = "northwest-junction",     kit = "depot-throat", comms = "dual-5g-lora", region = "line-2" },
    { station = "industrial-west",        kit = "station",      comms = "dual-5g-lora", region = "line-2" },
    { station = "western-residential",    kit = "station",      comms = "dual-5g-lora", region = "line-2" },
    { station = "south-west-residential", kit = "station",      comms = "dual-5g-lora", region = "line-2" },
    { station = "southern-markets",       kit = "station",      comms = "dual-5g-lora", region = "line-2" },
    { station = "south-east-residential", kit = "station",      comms = "dual-5g-lora", region = "line-2" },
]

# ----------------------------------------------------------------------------
# Switches — mainline turnbacks + yard throats.
# ----------------------------------------------------------------------------

switches = [
    { id = "sw-rws-1",   kit = "no-10-mainline", station = "samawah-rws",            side = "facing-east"   },
    { id = "sw-rws-2",   kit = "no-10-mainline", station = "samawah-rws",            side = "trailing-east" },
    { id = "sw-ebr-1",   kit = "no-10-mainline", station = "eastern-bridge",         side = "facing-west"   },
    { id = "sw-ebr-2",   kit = "no-10-mainline", station = "eastern-bridge",         side = "facing-east"   },
    { id = "sw-amu-1",   kit = "no-10-mainline", station = "al-muthanna-university", side = "facing-east"   },
    { id = "sw-amu-2",   kit = "no-10-mainline", station = "al-muthanna-university", side = "trailing-east" },
    { id = "sw-edp-01",  kit = "no-10-mainline", station = "east-depot",             side = "facing-east"   },
    { id = "sw-edp-yd1", kit = "no-8-yard",      station = "east-depot",             side = "yard-throat"   },
    { id = "sw-edp-yd2", kit = "no-8-yard",      station = "east-depot",             side = "yard-throat"   },
    { id = "sw-edp-yd3", kit = "no-8-yard",      station = "east-depot",             side = "yard-throat"   },
    { id = "sw-edp-yd4", kit = "no-8-yard",      station = "east-depot",             side = "yard-throat"   },
    { id = "sw-nwj-1",   kit = "no-10-mainline", station = "northwest-junction",     side = "facing-west"   },
    { id = "sw-nwj-yd1", kit = "no-8-yard",      station = "northwest-junction",     side = "yard-throat"   },
    { id = "sw-nwj-yd2", kit = "no-8-yard",      station = "northwest-junction",     side = "yard-throat"   },
]

# ----------------------------------------------------------------------------
# Level crossings — at-grade road intersections.
# Count indicative from RFC 0003 §D6 (~12 on Line 1, ~8 on Line 2). The OSM
# step will place each crossing at the actual road intersection.
# ----------------------------------------------------------------------------

level_crossings = [
    { id = "lx-l1-01", kit = "half-barrier", line = "line-1", from = "north-gate",           to = "old-souq",               offset_m = 500 },
    { id = "lx-l1-02", kit = "full-barrier", line = "line-1", from = "al-salam",             to = "governorate-hospital",   offset_m = 600 },
    { id = "lx-l1-03", kit = "full-barrier", line = "line-1", from = "governorate-hospital", to = "new-german-hospital",    offset_m = 700 },
    { id = "lx-l1-04", kit = "half-barrier", line = "line-1", from = "new-german-hospital",  to = "engineering-quarter",    offset_m = 600 },
    { id = "lx-l1-05", kit = "half-barrier", line = "line-1", from = "engineering-quarter",  to = "al-muthanna-university", offset_m = 700 },
    { id = "lx-l2-01", kit = "half-barrier", line = "line-2", from = "northern-suburbs-a",   to = "northern-suburbs-b",     offset_m = 700 },
    { id = "lx-l2-02", kit = "full-barrier", line = "line-2", from = "industrial-west",      to = "western-residential",    offset_m = 800 },
    { id = "lx-l2-03", kit = "half-barrier", line = "line-2", from = "western-residential",  to = "south-west-residential", offset_m = 800 },
    { id = "lx-l2-04", kit = "half-barrier", line = "line-2", from = "southern-markets",     to = "south-east-residential", offset_m = 700 },
]

# ----------------------------------------------------------------------------
# Construction phasing — drives the project plan generator.
# Each phase must be operationally meaningful on its own (RFC 0003 §9.5).
# ----------------------------------------------------------------------------

[[phases]]
id       = "A"
name     = "Line 1 west — RWS → Eastern Bridge"
stations = [
    "samawah-rws", "north-gate", "old-souq",
    "samawah-central", "riverside", "eastern-bridge",
]
duration_months = 30

[[phases]]
id       = "B"
name     = "Line 1 east — Eastern Bridge → East Depot"
stations = [
    "al-salam", "governorate-hospital", "new-german-hospital",
    "engineering-quarter", "al-muthanna-university", "east-depot",
]
duration_months = 24

[[phases]]
id       = "C"
name     = "Line 2 ring — Halqa loop"
stations = [
    "northern-suburbs-a", "northern-suburbs-b", "northwest-junction",
    "industrial-west", "western-residential", "south-west-residential",
    "southern-markets", "south-east-residential",
]
duration_months = 30
