# ----------------------------------------------------------------------------
# Depots — one main depot + one terminal-charging layup.
#
# Total fleet: L1 (5+1+1=7) + L2 (4+1+1=6) + L3 (3+1+1=5) + L4 (3+1+1=5)
#            = 23 trainsets.
# Main depot at Al-Maali (Line 1 south terminus) — open land available.
# Main-heavy stalls = ceil(23 × 1.25) = 29; ceiling is 20 per archetype
# so we round down, then add a second layup for the remainder.
# Layup at Al-Bustan Sharqi (Line 2 east terminus) for 4 trainsets.
# ----------------------------------------------------------------------------

[[depots]]
station            = "al-maali"
archetype          = "main-heavy"
fleet_stalls       = 24
pv_canopy_m2       = 9000
pv_nominal_kwp     = 1350
battery_kwh        = 4500
wheel_lathe        = true
overhaul_bay       = true
wash_track         = true
has_training_wing  = true

[[depots]]
station            = "al-bustan-sharqi"
archetype          = "layup-minimal"
fleet_stalls       = 4
pv_canopy_m2       = 800
pv_nominal_kwp     = 120
battery_kwh        = 250
wheel_lathe        = false
overhaul_bay       = false
wash_track         = false
has_training_wing  = false

