# ----------------------------------------------------------------------------
# Fleets — service plans (copied verbatim to scenarios/samawah.toml).
#
# Fleet sizing per RFC 0014 §4:
#   total = peak_revenue + spare + cold_reserve
#   spare = ceil(peak / 10), cold_reserve = 1 per line
# ----------------------------------------------------------------------------

[[fleets]]
line                = "line-1-nahrain"
trainset_count      = 5            # peak revenue
spare_count         = 1
cold_reserve_count  = 1
dispatch_points = [
    { station = "al-muthanna-university", heading = "forward" },
    { station = "al-maali",               heading = "reverse" },
]
service_start = "05:30"
service_end   = "23:30"
schedule = [
    { from = "05:30", to = "07:00", headway_min = 10 },
    { from = "07:00", to = "09:30", headway_min = 5  },
    { from = "09:30", to = "16:00", headway_min = 8  },
