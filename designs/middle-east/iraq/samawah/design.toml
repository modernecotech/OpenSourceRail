# station turnbacks + depot fans alike. One switch-machine spares
# pool across the whole deployment.
switches = [
    # Terminals — facing turnouts for single-track run-around.
    { id = "sw-amu-1",   kit = "no-9-mainline", station = "al-muthanna-university", side = "facing-south" },
    { id = "sw-amu-2",   kit = "no-9-mainline", station = "al-muthanna-university", side = "facing-L4-west" },
    { id = "sw-mal-1",   kit = "no-9-mainline", station = "al-maali",               side = "facing-north" },
    { id = "sw-naft-1",  kit = "no-9-mainline", station = "al-naft",                side = "facing-east"  },
    { id = "sw-bust-1",  kit = "no-9-mainline", station = "al-bustan-sharqi",       side = "facing-west"  },
    { id = "sw-rws-1",   kit = "no-9-mainline", station = "samawah-rws",            side = "facing-north" },
    { id = "sw-uma-1",   kit = "no-9-mainline", station = "um-al-asafir",           side = "facing-south" },
    { id = "sw-abw-1",   kit = "no-9-mainline", station = "abu-jwailana",           side = "facing-east"  },
    # Samawah Central — triple interchange throat.
    { id = "sw-cen-1",   kit = "no-9-mainline", station = "samawah-central",        side = "facing-L1-north" },
