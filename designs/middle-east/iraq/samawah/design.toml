# Samawah urban rail — design-time description.
#
# Authoritative design artefact for the Samawah reference deployment.
# Station coordinates in this file correspond to REAL OpenStreetMap
# anchors — verified against Overpass API queries for the Samawah
# bbox on 2026-04-24. The previous hand-authored geometry placed
# several stations in palm-grove / agricultural land and mis-located
# Al-Muthanna University by ~8 km; this revision fixes both.
#
#   designs/templates/*.toml          ← reusable Lego blocks
#   designs/.../samawah/design.toml   ← this file: city-specific composition
#   scenarios/samawah.toml            ← generated from this (operational fields)
#   corridor.geojson                  ← OSM-derived routing (generated)
#   bom.yaml / plan.yaml              ← generated by crates/osr-design
#
# Compliance with rail-engineering RFCs (all applied):
#   RFC 0008 — rolling stock (family: light-metro-3car)
#   RFC 0009 — track geometry (preset: standard-urban, all lines)
#   RFC 0010 — station archetypes (halt not used; all 5 others)
#   RFC 0011 — civil infrastructure (at-grade + elevated + bridge; NO tunnels)
#   RFC 0012 — switches: 1:9 throughout (no-9-mainline); no diamonds
#   RFC 0013 — operations rulebook (shared across deployments)
#   RFC 0014 — depot sizing: main-heavy (south) + layup-minimal (east)
#   RFC 0021 — battery traction (side-wall strake, Na-ion, plug-in charging)
#   RFC 0022 — bogie + traction drive (one SKU, per-family motorisation)
#
# Reference: docs/rfcs/0003-samawah-reference-deployment.md.
# Alignment revised 2026-04-24 against OSM; still a planning-grade concept.

[design]
schema_version = 1
id            = "middle-east/iraq/samawah"
name          = "Samawah — 4-line network (Nahrain + Sharqiyyeh + Mahatta + Shamal)"
rfc           = "docs/rfcs/0003-samawah-reference-deployment.md"
scenario_out  = "scenarios/samawah.toml"

# Templates this city composes.
[design.templates]
rolling_stock    = "designs/templates/rolling-stock.toml"
stations         = "designs/templates/stations.toml"
energy_sites     = "designs/templates/energy-sites.toml"
climate          = "designs/templates/climate.toml"
structures       = "designs/templates/structures.toml"
depots           = "designs/templates/depots.toml"
signalling       = "designs/templates/signalling.toml"
comms            = "designs/templates/comms.toml"
switches         = "designs/templates/switches.toml"
level_crossings  = "designs/templates/level-crossings.toml"
accessibility    = "designs/templates/accessibility.toml"
platform_doors   = "designs/templates/platform-doors.toml"
passenger_info   = "designs/templates/passenger-info.toml"
fare_systems     = "designs/templates/fare-systems.toml"
track_geometry   = "designs/templates/track-geometry.toml"
country_costs    = "designs/templates/country-costs.toml"
fleet_sizing     = "designs/templates/fleet-sizing.toml"
demand_profiles  = "designs/templates/demand-profiles.toml"
service_hours    = "designs/templates/service-hours.toml"
climate_adapters = "designs/templates/climate-adapters.toml"

[location]
country     = "IQ"
governorate = "Al-Muthanna"
city        = "As-Samawah"
center_lat  = 31.3079
center_lon  = 45.2827
bbox        = { south = 31.265, west = 45.240, north = 31.345, east = 45.325 }

[climate]
preset   = "hot-desert"
adapters = ["sand-filter-hvac", "vertical-bifacial-pv", "high-ambient-traction"]
peak_sun_hours = 6.0

[fare]
system = "iraq-mobile-money"

[costs]
country = "IQ"

