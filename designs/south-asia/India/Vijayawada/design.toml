# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 244484009
at_grade_eur         = 224925288
elevated_usd         = 101861246
elevated_eur         = 93712346
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 25000000  # $2.5 M per elevated interchange.
junction_premium_eur = 23000000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 371345255
civil_subtotal_eur   = 341637634
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 79390000
stations_eur         = 73038800
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 15600000
depots_eur           = 14352000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 196348800
rolling_stock_eur    = 180640896
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3375934
signalling_eur       = 3105860
charging_microgrid_usd = 20325000
charging_microgrid_eur = 18699000
power_eur            = 18699000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 48046949
epc_overhead_eur     = 44203193
total_usd            = 734431938  # full CAPEX stack
total_eur            = 675677383  # full CAPEX stack
