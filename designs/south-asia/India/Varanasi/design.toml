# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 204073389
at_grade_eur         = 187747518
elevated_usd         = 170772960
elevated_eur         = 157111123
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 15000000  # $2.5 M per elevated interchange.
junction_premium_eur = 13800000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 389846349
civil_subtotal_eur   = 358658641
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 83190000
stations_eur         = 76534800
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 13800000
depots_eur           = 12696000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 176073652
rolling_stock_eur    = 161987760
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3029751
signalling_eur       = 2787371
charging_microgrid_usd = 22575000
charging_microgrid_eur = 20769000
power_eur            = 20769000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 48196033
epc_overhead_eur     = 44340350
total_usd            = 736710785  # full CAPEX stack
total_eur            = 677773922  # full CAPEX stack
