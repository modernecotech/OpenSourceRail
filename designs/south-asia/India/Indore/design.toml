# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 357502216
at_grade_eur         = 328902039
elevated_usd         = 127080389
elevated_eur         = 116913958
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 40000000  # $2.5 M per elevated interchange.
junction_premium_eur = 36800000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 524582605
civil_subtotal_eur   = 482615997
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 119240000
stations_eur         = 109700800
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 17400000
depots_eur           = 16008000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 416174087
rolling_stock_eur    = 382880160
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 4853374
signalling_eur       = 4465105
charging_microgrid_usd = 32000000
charging_microgrid_eur = 29440000
power_eur            = 29440000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 77997505
epc_overhead_eur     = 71757704
total_usd            = 1192247571  # full CAPEX stack
total_eur            = 1096867766  # full CAPEX stack
