at_grade_eur         = 307398626
elevated_usd         = 108045337
elevated_eur         = 99401710
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 31500000  # $4.5 M per elevated interchange.
junction_premium_eur = 28980000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 473674279
civil_subtotal_eur   = 435780336
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 127900000
stations_eur         = 117668000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 155798504
rolling_stock_eur    = 143334624
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 8953475
signalling_eur       = 8237197
charging_microgrid_usd = 36000000
charging_microgrid_eur = 33120000
power_eur            = 33120000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 57702838
epc_overhead_eur     = 53086611
total_usd            = 882029097  # full CAPEX stack
total_eur            = 811466769  # full CAPEX stack
