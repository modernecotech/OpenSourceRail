at_grade_eur         = 349492874
elevated_usd         = 535543636
elevated_eur         = 492700145
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 54000000  # $4.5 M per elevated interchange.
junction_premium_eur = 49680000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 969427194
civil_subtotal_eur   = 891873019
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 661600000
stations_eur         = 608672000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 325920000
rolling_stock_eur    = 299846400
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 69840000
production_plant_eur = 64252800
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 8562824
signalling_eur       = 7877798
charging_microgrid_usd = 33375000
charging_microgrid_eur = 30705000
# EPC integration + project management (7 % of subtotal).
