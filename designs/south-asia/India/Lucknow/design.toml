# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 704140760
at_grade_eur         = 647809499
elevated_usd         = 198908246
elevated_eur         = 182995586
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 45000000  # $4.5 M per elevated interchange.
junction_premium_eur = 41400000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 948049006
civil_subtotal_eur   = 872205085
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 222200000
stations_eur         = 204424000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 30000000
depots_eur           = 27600000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 475398861
rolling_stock_eur    = 437366952
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 18708565
signalling_eur       = 17211880
charging_microgrid_usd = 63740000
charging_microgrid_eur = 58640800
power_eur            = 58640800  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 123066750
epc_overhead_eur     = 113221410
total_usd            = 1881163182  # full CAPEX stack
total_eur            = 1730670127  # full CAPEX stack
