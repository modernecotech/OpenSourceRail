version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 144201000
at_grade_eur         = 132664920
elevated_usd         = 12068400
elevated_eur         = 11102928
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 156269400
civil_subtotal_eur   = 143767848
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 38100000
stations_eur         = 35052000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 41617409
rolling_stock_eur    = 38288016
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2453636
signalling_eur       = 2257345
charging_microgrid_usd = 12050000
charging_microgrid_eur = 11086000
power_eur            = 11086000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 19074331
epc_overhead_eur     = 17548385
total_usd            = 291564776  # full CAPEX stack
total_eur            = 268239594  # full CAPEX stack
