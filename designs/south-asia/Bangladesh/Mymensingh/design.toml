# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 42308617
at_grade_eur         = 38923928
elevated_usd         = 175502960
elevated_eur         = 161462723
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $2.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 217811577
civil_subtotal_eur   = 200386651
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 22460000
stations_eur         = 20663200
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 53622430
rolling_stock_eur    = 49332636
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1009976
signalling_eur       = 929177
charging_microgrid_usd = 7100000
charging_microgrid_eur = 6532000
power_eur            = 6532000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 21980279
epc_overhead_eur     = 20221856
total_usd            = 335984262  # full CAPEX stack
total_eur            = 309105520  # full CAPEX stack
