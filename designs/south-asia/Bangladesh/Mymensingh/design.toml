epc_overhead_eur     = 34268240
total_usd            = 569363607  # base CAPEX before timetable-sized dedicated solar
total_eur            = 523814519  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
