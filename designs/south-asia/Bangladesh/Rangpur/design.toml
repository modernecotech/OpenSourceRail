junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 194436300
civil_subtotal_eur   = 178881396
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 143500000
stations_eur         = 132020000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 47219752
rolling_stock_eur    = 43442172
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2966333
signalling_eur       = 2729026
charging_microgrid_usd = 14400000
charging_microgrid_eur = 13248000
power_eur            = 13248000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
