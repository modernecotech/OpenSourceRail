# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 304750253
at_grade_eur         = 280370233
elevated_usd         = 242174404
elevated_eur         = 222800452
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 36000000  # $4.5 M per elevated interchange.
junction_premium_eur = 33120000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 582924657
civil_subtotal_eur   = 536290685
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 130700000
stations_eur         = 120244000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 30000000
depots_eur           = 27600000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 162201183
rolling_stock_eur    = 149225088
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 8964170
signalling_eur       = 8247036
charging_microgrid_usd = 36840000
charging_microgrid_eur = 33892800
power_eur            = 33892800  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 66614101
epc_overhead_eur     = 61284973
total_usd            = 1018244110  # full CAPEX stack
total_eur            = 936784581  # full CAPEX stack
