at_grade_eur         = 48357044
elevated_usd         = 11323128
elevated_eur         = 10417278
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4000000  # $2 M per elevated interchange.
junction_premium_eur = 3680000  # EUR 1.8 M per elevated interchange.
civil_subtotal_usd   = 67885133
civil_subtotal_eur   = 62454322
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 17970000
stations_eur         = 16532400
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 52021761
rolling_stock_eur    = 47860020
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 985258
signalling_eur       = 906438
charging_microgrid_usd = 8025000
charging_microgrid_eur = 7383000
power_eur            = 7383000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 11122101
epc_overhead_eur     = 10232333
total_usd            = 170009253  # full CAPEX stack
total_eur            = 156408513  # full CAPEX stack
