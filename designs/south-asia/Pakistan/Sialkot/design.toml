at_grade_eur         = 66938611
elevated_usd         = 373783844
elevated_eur         = 343881136
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 451043203
civil_subtotal_eur   = 414959747
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 157400000
stations_eur         = 144808000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 129600000
rolling_stock_eur    = 119232000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 25920000
production_plant_eur = 23846400
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2770089
signalling_eur       = 2548482
charging_microgrid_usd = 3275000
charging_microgrid_eur = 3013000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 54460580
epc_overhead_eur     = 50103734
total_usd            = 832468872  # base CAPEX before timetable-sized dedicated solar
total_eur            = 765871362  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
