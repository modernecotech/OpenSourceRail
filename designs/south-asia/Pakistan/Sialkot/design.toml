at_grade_eur         = 30867708
elevated_usd         = 172246397
elevated_eur         = 158466685
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 2500000  # $2.5 M per elevated interchange.
junction_premium_eur = 2300000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 208298254
civil_subtotal_eur   = 191634393
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 29930000
stations_eur         = 27535600
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 47219752
rolling_stock_eur    = 43442172
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 890310
signalling_eur       = 819085
charging_microgrid_usd = 8575000
charging_microgrid_eur = 7889000
power_eur            = 7889000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 21483932
epc_overhead_eur     = 19765218
total_usd            = 328397248  # full CAPEX stack
total_eur            = 302125468  # full CAPEX stack
