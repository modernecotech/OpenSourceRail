stations_usd         = 72640000
stations_eur         = 66828800
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 15600000
depots_eur           = 14352000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 162201183
rolling_stock_eur    = 149225088
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2725968
signalling_eur       = 2507891
