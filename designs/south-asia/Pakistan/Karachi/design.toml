# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# direct-procurement planning basis). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2

[costs]
currency_basis      = "USD local-owner trainset-family planning basis with direct material, local assembly/labour, nominal per-train QA/acceptance, and modest handover logistics included; 1 m clip-on fiberglass body modules reduce shell labour, mould tooling, cure space, and production setup; distributed overnight stabling reduces depot parking scope; fixtures/tooling live in the railway production plant line per vehicle/car module; warranty, spares, and routine commissioning support are treated as OPEX; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 1283321601
at_grade_eur         = 1180655873
elevated_usd         = 382394372
elevated_eur         = 351802822
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 94500000  # $4.5 M per elevated interchange.
junction_premium_eur = 86940000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 1760215973
civil_subtotal_eur   = 1619398695
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 720000000
stations_eur         = 662400000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 1187760000
rolling_stock_eur    = 1092739200
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 0
production_plant_eur = 0
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 22982003
signalling_eur       = 21143443
charging_microgrid_usd = 56300000
charging_microgrid_eur = 51796000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 262868058
epc_overhead_eur     = 241838613
total_usd            = 4018126034  # base CAPEX before timetable-sized dedicated solar
total_eur            = 3696675951  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
car_count = 6
gross_battery_kwh_per_car = 225
traction_battery_system_usd_per_car = 24166.67
motor_controller_sets_per_car = 2
motor_controller_set_usd = 10000
hv_distribution_usd_per_car = 3333.33
lv_dc_dc_usd_per_car = 2500
roof_pv_mppt_usd_per_car = 1000
core_electrical_usd_per_car = 51000
core_electrical_usd_per_trainset = 306000
fleet_core_electrical_usd = 216342000
station_architecture = "500-1500 V DC/DC configured to 500 kW; 650-700 V train bus"
stationary_lfp_500kwh_usd = 37500
station_dcdc_500kw_usd = 15000
station_contact_protection_control_usd = 12500
station_equipment_total_usd = 65000
normal_integrated_charging_site_usd = 100000
station_charging_cabinet_count = 4
