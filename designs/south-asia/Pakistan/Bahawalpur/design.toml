epc_overhead_eur     = 28385999
total_usd            = 471630733  # base CAPEX before timetable-sized dedicated solar
total_eur            = 433900274  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
