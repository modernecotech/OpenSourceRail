epc_overhead_eur     = 69824747
total_usd            = 1160131667  # base CAPEX before timetable-sized dedicated solar
total_eur            = 1067321134  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
