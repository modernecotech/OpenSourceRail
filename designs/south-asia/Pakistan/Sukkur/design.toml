version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 59627888
at_grade_eur         = 54857657
elevated_usd         = 279061454
elevated_eur         = 256736538
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 338689342
civil_subtotal_eur   = 311594195
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 41600000
stations_eur         = 38272000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 42417743
rolling_stock_eur    = 39024324
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2544140
signalling_eur       = 2340609
charging_microgrid_usd = 12970000
charging_microgrid_eur = 11932400
power_eur            = 11932400  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 32215486
epc_overhead_eur     = 29638247
total_usd            = 492436711  # full CAPEX stack
total_eur            = 453041774  # full CAPEX stack
