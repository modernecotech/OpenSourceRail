# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 50989426
at_grade_eur         = 46910272
elevated_usd         = 10519798
elevated_eur         = 9678214
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4000000  # $2 M per elevated interchange.
junction_premium_eur = 3680000  # EUR 1.8 M per elevated interchange.
civil_subtotal_usd   = 65509224
civil_subtotal_eur   = 60268486
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 18990000
stations_eur         = 17470800
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 48820422
rolling_stock_eur    = 44914788
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 944882
signalling_eur       = 869291
charging_microgrid_usd = 8200000
charging_microgrid_eur = 7544000
power_eur            = 7544000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 10812517
epc_overhead_eur     = 9947516
total_usd            = 165277044  # full CAPEX stack
total_eur            = 152054880  # full CAPEX stack
