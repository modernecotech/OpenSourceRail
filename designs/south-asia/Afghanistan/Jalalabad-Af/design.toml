at_grade_eur         = 127315594
elevated_usd         = 10354113
elevated_eur         = 9525784
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 148740628
civil_subtotal_eur   = 136841377
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 100100000
stations_eur         = 92092000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 108000000
rolling_stock_eur    = 99360000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 21600000
production_plant_eur = 19872000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2349584
signalling_eur       = 2161617
charging_microgrid_usd = 2650000
charging_microgrid_eur = 2438000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 27400815
epc_overhead_eur     = 25208750
total_usd            = 418841026  # base CAPEX before timetable-sized dedicated solar
total_eur            = 385333744  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
