# Civil structure unit BOMs — per-km materials for each structure class.
#
# Used by the BOM generator (osr-design crate) to roll up quantities from
# line sections. A 14 km line with 3 km elevated and 1 km bridge pulls the
# corresponding unit BOMs and sums the quantities.
#
# Unit costs are BASE USD values; country cost factors (from a separate
# catalog) scale them. The default factor is 1.0 (OECD mid-range).
#
# Unified system principle: every OSR section belongs to one of THREE
# classes (at-grade / elevated / bridge), and the per-km BOM is the same
# everywhere. That makes BOMs comparable across cities and makes the CAD
# block library finite.
#
# NO TUNNELS. Per RFC 0011, the catalogue has no cut-and-cover or bored-
# tunnel classes. Where an alignment cannot be at-grade, it goes
# elevated — never underground. The two tunnel classes this template
# used to carry were removed with RFC 0011 v1.

# ---- At-grade double track — the default section ------------------------

[classes.at-grade]
# Permanent way (per route-km, double track)
rail_kg_per_km           = 240000        # UIC60, 4 rails × 60 kg/m × 1000 m
sleepers_count_per_km    = 3334          # concrete, 0.6 m spacing, double track
fastenings_count_per_km  = 13336         # 4 per sleeper
ballast_m3_per_km        = 3600          # 1.8 m³/m
formation_m3_per_km      = 5000          # subgrade prep
drainage_m_per_km        = 2000          # both sides
fencing_m_per_km         = 2000
pole_count_per_km        = 40            # signalling / comms masts, 25 m spacing
cost_usd_per_km     = 6000000       # OECD mid-range double-track at-grade

# ---- Elevated viaduct — prefabricated spans ----------------------------

[classes.elevated]
# Includes at-grade permanent way on top of the deck
rail_kg_per_km              = 240000
sleepers_count_per_km       = 3334
fastenings_count_per_km     = 13336
# Viaduct superstructure
pier_count_per_km           = 33         # 30 m span
pier_concrete_m3_per_km     = 1650       # 50 m³/pier
foundation_concrete_m3_per_km = 2640     # 80 m³/pier
deck_concrete_m3_per_km     = 3500
deck_rebar_kg_per_km        = 480000
cost_usd_per_km        = 22000000

# ---- River / highway bridge — engineered span -------------------------

[classes.bridge]
# Full engineering premium over viaduct — river protection, nav clearance.
rail_kg_per_km              = 240000
sleepers_count_per_km       = 3334
fastenings_count_per_km     = 13336
steel_deck_kg_per_km        = 2200000    # composite steel-concrete
concrete_m3_per_km          = 4500
rebar_kg_per_km             = 650000
pile_count_per_km           = 40
pile_length_m_avg           = 35
cost_usd_per_km        = 45000000

# Tunnel classes were removed with RFC 0011. See that RFC §3 for the
# CAPEX / schedule / operational rationale; §11 pitfall-decisions
# documents why the upstream catalogue never reintroduces them.
