at_grade_eur         = 159002220
elevated_usd         = 65958000
elevated_eur         = 60681360
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 243286500
civil_subtotal_eur   = 223823580
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 121600000
stations_eur         = 111872000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; delivered all-in planning unit).
rolling_stock_usd    = 436800000
rolling_stock_eur    = 401856000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 31200000
production_plant_eur = 28704000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3155297
signalling_eur       = 2902873
charging_microgrid_usd = 12770000
charging_microgrid_eur = 11748400
power_eur            = 11748400  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7% of subtotal).
epc_overhead_usd     = 60956826
epc_overhead_eur     = 56080280
total_usd            = 931768623  # full CAPEX stack
total_eur            = 857227133  # full CAPEX stack
