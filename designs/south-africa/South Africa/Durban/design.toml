# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 1100928300
at_grade_eur         = 1012854036
elevated_usd         = 376970400
elevated_eur         = 346812768
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 85500000  # $4.5 M per elevated interchange.
junction_premium_eur = 78660000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 1563398700
civil_subtotal_eur   = 1438326804
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 876100000
stations_eur         = 806012000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 42000000
depots_eur           = 38640000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 520217609
rolling_stock_eur    = 478600200
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 19919519
signalling_eur       = 18325957
charging_microgrid_usd = 74520000
charging_microgrid_eur = 68558400
power_eur            = 68558400  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 216730908
epc_overhead_eur     = 199392435
total_usd            = 3312886736  # full CAPEX stack
total_eur            = 3047855797  # full CAPEX stack
