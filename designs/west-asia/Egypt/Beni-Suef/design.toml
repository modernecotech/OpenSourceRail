civil_subtotal_eur   = 118378463
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 106000000
stations_eur         = 97520000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 93600000
rolling_stock_eur    = 86112000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 18720000
production_plant_eur = 17222400
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1997501
signalling_eur       = 1837701
charging_microgrid_usd = 2750000
charging_microgrid_eur = 2530000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 25181782
epc_overhead_eur     = 23167239
total_usd            = 384921525  # base CAPEX before timetable-sized dedicated solar
total_eur            = 354127803  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
