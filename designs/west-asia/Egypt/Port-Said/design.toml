at_grade_eur         = 91915728
elevated_usd         = 17904000
elevated_eur         = 16471680
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 122312400
civil_subtotal_eur   = 112527408
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 118000000
stations_eur         = 108560000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; delivered all-in planning unit).
rolling_stock_usd    = 256200000
rolling_stock_eur    = 235704000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 18300000
production_plant_eur = 16836000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1739736
signalling_eur       = 1600557
charging_microgrid_usd = 11850000
charging_microgrid_eur = 10902000
power_eur            = 10902000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7% of subtotal).
