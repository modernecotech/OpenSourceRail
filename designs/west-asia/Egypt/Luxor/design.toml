at_grade_eur         = 140906556
elevated_usd         = 29854800
elevated_eur         = 27466416
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 9000000  # $4.5 M per elevated interchange.
junction_premium_eur = 8280000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 192014100
civil_subtotal_eur   = 176652972
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 50800000
stations_eur         = 46736000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 43218078
rolling_stock_eur    = 39760632
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2677051
signalling_eur       = 2462887
charging_microgrid_usd = 14970000
charging_microgrid_eur = 13772400
power_eur            = 13772400  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
