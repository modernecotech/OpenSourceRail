at_grade_eur         = 135118192
elevated_usd         = 11162196
elevated_eur         = 10269220
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 162529796
civil_subtotal_eur   = 149527412
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 45500000
stations_eur         = 41860000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 58424439
rolling_stock_eur    = 53750484
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3733702
signalling_eur       = 3435006
charging_microgrid_usd = 13830000
charging_microgrid_eur = 12723600
power_eur            = 12723600  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 21421256
epc_overhead_eur     = 19707555
total_usd            = 327439193  # full CAPEX stack
total_eur            = 301244058  # full CAPEX stack
