version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
# Civil works (€/km × civil mix).
at_grade_eur         = 182302338
elevated_eur         = 21877039
bridge_eur           = 0
junction_premium_eur = 20000000  # €20 M per elevated interchange.
civil_subtotal_eur   = 224179377
# Stations (RFC 0010 archetype catalogue).
stations_eur         = 83400000
# Depots (RFC 0014 archetype catalogue).
depots_eur           = 40000000
# Rolling stock (RFC 0008 family × fleet count; €1M/car).
rolling_stock_eur    = 165000000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_eur       = 799527
charging_microgrid_eur = 12375000
power_eur            = 12375000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_eur     = 36802773
total_eur            = 562556677  # full CAPEX stack
