at_grade_eur         = 74914087
elevated_usd         = 6639087
elevated_eur         = 6107960
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 2500000  # $2.5 M per elevated interchange.
junction_premium_eur = 2300000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 90567442
civil_subtotal_eur   = 83322047
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 29660000
stations_eur         = 27287200
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 54422765
rolling_stock_eur    = 50068944
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1036562
signalling_eur       = 953637
charging_microgrid_usd = 8550000
charging_microgrid_eur = 7866000
power_eur            = 7866000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 13736574
epc_overhead_eur     = 12637648
total_usd            = 209973343  # full CAPEX stack
total_eur            = 193175476  # full CAPEX stack
