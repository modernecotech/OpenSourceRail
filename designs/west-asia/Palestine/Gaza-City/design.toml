epc_overhead_eur     = 30120947
total_usd            = 500456728  # base CAPEX before timetable-sized dedicated solar
total_eur            = 460420189  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
