at_grade_eur         = 174804190
elevated_usd         = 11087635
elevated_eur         = 10200624
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 205592189
civil_subtotal_eur   = 189144814
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 43100000
stations_eur         = 39652000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 52021761
rolling_stock_eur    = 47860020
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3228341
signalling_eur       = 2970074
charging_microgrid_usd = 13180000
charging_microgrid_eur = 12125600
