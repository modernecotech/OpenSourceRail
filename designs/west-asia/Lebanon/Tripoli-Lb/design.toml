epc_overhead_eur     = 29061771
total_usd            = 482858614  # base CAPEX before timetable-sized dedicated solar
total_eur            = 444229925  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
