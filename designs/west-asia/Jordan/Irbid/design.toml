junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 123740218
civil_subtotal_eur   = 113841000
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 50200000
stations_eur         = 46184000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 44818748
rolling_stock_eur    = 41233248
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2791508
signalling_eur       = 2568187
charging_microgrid_usd = 14920000
charging_microgrid_eur = 13726400
