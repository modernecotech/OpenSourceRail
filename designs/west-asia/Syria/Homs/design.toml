# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 59081428
at_grade_eur         = 54354914
elevated_usd         = 10823667
elevated_eur         = 9957774
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 2500000  # $2.5 M per elevated interchange.
junction_premium_eur = 2300000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 72405095
civil_subtotal_eur   = 66612688
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 26330000
stations_eur         = 24223600
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 42417743
rolling_stock_eur    = 39024324
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 769786
signalling_eur       = 708204
charging_microgrid_usd = 7575000
charging_microgrid_eur = 6969000
power_eur            = 6969000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 11304834
epc_overhead_eur     = 10400447
total_usd            = 172802458  # full CAPEX stack
total_eur            = 158978263  # full CAPEX stack
