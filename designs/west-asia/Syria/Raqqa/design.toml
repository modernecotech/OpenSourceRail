at_grade_eur         = 114744240
elevated_usd         = 38337600
elevated_eur         = 35270592
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 9000000  # $4.5 M per elevated interchange.
junction_premium_eur = 8280000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 172059600
civil_subtotal_eur   = 158294832
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 115500000
stations_eur         = 106260000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; delivered all-in planning unit).
rolling_stock_usd    = 193200000
rolling_stock_eur    = 177744000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 13800000
production_plant_eur = 12696000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2238440
signalling_eur       = 2059365
charging_microgrid_usd = 11250000
charging_microgrid_eur = 10350000
power_eur            = 10350000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7% of subtotal).
