# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 122507400
at_grade_eur         = 112706808
elevated_usd         = 0
elevated_eur         = 0
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 122507400
civil_subtotal_eur   = 112706808
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 108500000
stations_eur         = 99820000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 34414396
rolling_stock_eur    = 31661244
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2041790
signalling_eur       = 1878447
charging_microgrid_usd = 11400000
charging_microgrid_eur = 10488000
power_eur            = 10488000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 21060451
epc_overhead_eur     = 19375615
total_usd            = 321924037  # full CAPEX stack
total_eur            = 296170114  # full CAPEX stack
