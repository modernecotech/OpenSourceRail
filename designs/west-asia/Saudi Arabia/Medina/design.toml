# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 393791398
at_grade_eur         = 362288086
elevated_usd         = 124103713
elevated_eur         = 114175416
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 49500000  # $4.5 M per elevated interchange.
junction_premium_eur = 45540000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 567395111
civil_subtotal_eur   = 522003503
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 156500000
stations_eur         = 143980000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 26000000
depots_eur           = 23920000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 182476330
rolling_stock_eur    = 167878224
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 10534250
signalling_eur       = 9691510
charging_microgrid_usd = 44390000
charging_microgrid_eur = 40838800
power_eur            = 40838800  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 69110698
epc_overhead_eur     = 63581843
total_usd            = 1056406390  # full CAPEX stack
total_eur            = 971893879  # full CAPEX stack
