at_grade_eur         = 125784061
elevated_usd         = 29200571
elevated_eur         = 26864526
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 9000000  # $4.5 M per elevated interchange.
junction_premium_eur = 8280000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 174922377
civil_subtotal_eur   = 160928586
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 167500000
stations_eur         = 154100000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 110700000
rolling_stock_eur    = 101844000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 22140000
production_plant_eur = 20368800
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2400366
signalling_eur       = 2208337
charging_microgrid_usd = 3500000
charging_microgrid_eur = 3220000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 34241392
epc_overhead_eur     = 31502081
total_usd            = 523404134  # base CAPEX before timetable-sized dedicated solar
total_eur            = 481531804  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
car_count = 3
