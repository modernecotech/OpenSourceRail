epc_overhead_eur     = 27575680
total_usd            = 458167361  # base CAPEX before timetable-sized dedicated solar
total_eur            = 421513972  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
