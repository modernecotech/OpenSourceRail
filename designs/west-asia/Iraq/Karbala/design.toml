# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 464465400
at_grade_eur         = 427308168
elevated_usd         = 173995200
elevated_eur         = 160075584
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 58500000  # $4.5 M per elevated interchange.
junction_premium_eur = 53820000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 696960600
civil_subtotal_eur   = 641203752
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 159300000
stations_eur         = 146556000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 30000000
depots_eur           = 27600000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 153664278
rolling_stock_eur    = 141371136
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 8466071
signalling_eur       = 7788785
charging_microgrid_usd = 43870000
charging_microgrid_eur = 40360400
power_eur            = 40360400  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 76458266
epc_overhead_eur     = 70341605
total_usd            = 1168719215  # full CAPEX stack
total_eur            = 1075221678  # full CAPEX stack
