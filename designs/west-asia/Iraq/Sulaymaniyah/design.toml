epc_overhead_eur     = 57828251
total_usd            = 960811009  # base CAPEX before timetable-sized dedicated solar
total_eur            = 883946128  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
