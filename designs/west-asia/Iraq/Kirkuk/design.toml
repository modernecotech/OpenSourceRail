stations_usd         = 161500000
stations_eur         = 148580000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 30000000
depots_eur           = 27600000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 151530052
rolling_stock_eur    = 139407648
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 8456822
signalling_eur       = 7780276
