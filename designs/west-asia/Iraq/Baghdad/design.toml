# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 404757159
at_grade_eur         = 372376586
elevated_usd         = 125631856
elevated_eur         = 115581307
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 38000000  # $2 M per elevated interchange.
junction_premium_eur = 34960000  # EUR 1.8 M per elevated interchange.
civil_subtotal_usd   = 568389014
civil_subtotal_eur   = 522917893
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 115610000
stations_eur         = 106361200
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 21000000
depots_eur           = 19320000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 653073183
rolling_stock_eur    = 600827328
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 7642191
signalling_eur       = 7030816
charging_microgrid_usd = 46225000
charging_microgrid_eur = 42527000
power_eur            = 42527000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 98835757
epc_overhead_eur     = 90928897
total_usd            = 1510775145  # full CAPEX stack
total_eur            = 1389913134  # full CAPEX stack
