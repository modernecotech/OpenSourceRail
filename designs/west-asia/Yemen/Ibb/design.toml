at_grade_eur         = 190931004
elevated_usd         = 26066400
elevated_eur         = 23981088
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 9000000  # $4.5 M per elevated interchange.
junction_premium_eur = 8280000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 242600100
civil_subtotal_eur   = 223192092
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 56700000
stations_eur         = 52164000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 56823770
rolling_stock_eur    = 52277868
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3567504
signalling_eur       = 3282104
charging_microgrid_usd = 16740000
charging_microgrid_eur = 15400800
power_eur            = 15400800  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 27890196
epc_overhead_eur     = 25658980
total_usd            = 426321570  # full CAPEX stack
total_eur            = 392215844  # full CAPEX stack
