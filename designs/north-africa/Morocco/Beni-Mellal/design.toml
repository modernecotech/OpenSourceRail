# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 33552565
at_grade_eur         = 30868360
elevated_usd         = 11911270
elevated_eur         = 10958368
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 5000000  # $2.5 M per elevated interchange.
junction_premium_eur = 4600000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 50463835
civil_subtotal_eur   = 46426728
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 15080000
stations_eur         = 13873600
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 24010043
rolling_stock_eur    = 22089240
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 453642
signalling_eur       = 417351
charging_microgrid_usd = 4225000
charging_microgrid_eur = 3887000
power_eur            = 3887000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 7436276
epc_overhead_eur     = 6841374
total_usd            = 113668796  # full CAPEX stack
total_eur            = 104575293  # full CAPEX stack
