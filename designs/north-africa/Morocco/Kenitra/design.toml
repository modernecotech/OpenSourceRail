epc_overhead_eur     = 24788264
total_usd            = 411854699  # base CAPEX before timetable-sized dedicated solar
total_eur            = 378906323  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
