epc_overhead_eur     = 66514476
total_usd            = 1105131814  # base CAPEX before timetable-sized dedicated solar
total_eur            = 1016721269  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
