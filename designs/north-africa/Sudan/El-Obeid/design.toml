at_grade_eur         = 121976770
elevated_usd         = 36633506
elevated_eur         = 33702826
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 13500000  # $4.5 M per elevated interchange.
junction_premium_eur = 12420000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 182716952
civil_subtotal_eur   = 168099596
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 113000000
stations_eur         = 103960000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 108000000
rolling_stock_eur    = 99360000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 21600000
production_plant_eur = 19872000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2362364
signalling_eur       = 2173375
charging_microgrid_usd = 3025000
charging_microgrid_eur = 2783000
# EPC integration + project management (7 % of subtotal).
