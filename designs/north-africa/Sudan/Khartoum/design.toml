elevated_eur         = 199743408
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 31500000  # $4.5 M per elevated interchange.
junction_premium_eur = 28980000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 1279065300
civil_subtotal_eur   = 1176740076
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 609200000
stations_eur         = 560464000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 26000000
depots_eur           = 23920000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 459392165
rolling_stock_eur    = 422640792
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 18078854
signalling_eur       = 16632546
charging_microgrid_usd = 56640000
charging_microgrid_eur = 52108800
power_eur            = 52108800  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
