junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 143893781
civil_subtotal_eur   = 132382279
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 28000000
stations_eur         = 25760000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 31213057
rolling_stock_eur    = 28716012
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1715624
signalling_eur       = 1578374
charging_microgrid_usd = 9020000
charging_microgrid_eur = 8298400
