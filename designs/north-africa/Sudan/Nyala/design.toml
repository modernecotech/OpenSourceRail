at_grade_eur         = 103147907
elevated_usd         = 111704052
elevated_eur         = 102767728
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 223821342
civil_subtotal_eur   = 205915635
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 112500000
stations_eur         = 103500000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 108000000
rolling_stock_eur    = 99360000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 21600000
production_plant_eur = 19872000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2334055
signalling_eur       = 2147331
charging_microgrid_usd = 3050000
charging_microgrid_eur = 2806000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 33551378
epc_overhead_eur     = 30867268
total_usd            = 512856775  # base CAPEX before timetable-sized dedicated solar
total_eur            = 471828233  # base CAPEX before timetable-sized dedicated solar

