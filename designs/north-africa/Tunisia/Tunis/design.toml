epc_overhead_eur     = 137918472
total_usd            = 2291502562  # base CAPEX before timetable-sized dedicated solar
total_eur            = 2108182357  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
