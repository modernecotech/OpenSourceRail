at_grade_eur         = 43597516
elevated_usd         = 2090000
elevated_eur         = 1922800
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $2.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 49478604
civil_subtotal_eur   = 45520316
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 19850000
stations_eur         = 18262000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 29345609
rolling_stock_eur    = 26997960
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 603552
signalling_eur       = 555268
charging_microgrid_usd = 5950000
charging_microgrid_eur = 5474000
power_eur            = 5474000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 8205944
epc_overhead_eur     = 7549468
total_usd            = 125433709  # full CAPEX stack
total_eur            = 115399012  # full CAPEX stack
