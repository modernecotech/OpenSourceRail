# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# direct-procurement planning basis). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2

[costs]
currency_basis      = "USD local-owner trainset-family planning basis with direct material, local assembly/labour, nominal per-train QA/acceptance, and modest handover logistics included; 1 m clip-on fiberglass body modules reduce shell labour, mould tooling, cure space, and production setup; distributed overnight stabling reduces depot parking scope; fixtures/tooling live in the railway production plant line per vehicle/car module; warranty, spares, and routine commissioning support are treated as OPEX; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 113250225
at_grade_eur         = 104190207
elevated_usd         = 3675290
elevated_eur         = 3381267
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 116925515
civil_subtotal_eur   = 107571474
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 70500000
stations_eur         = 64860000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 74700000
rolling_stock_eur    = 68724000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 14940000
production_plant_eur = 13744800
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1902817
signalling_eur       = 1750592
charging_microgrid_usd = 1650000
charging_microgrid_eur = 1518000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 20203283
epc_overhead_eur     = 18587021
total_usd            = 308821616  # base CAPEX before timetable-sized dedicated solar
total_eur            = 284115887  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
