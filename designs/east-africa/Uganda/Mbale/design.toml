epc_overhead_eur     = 13991948
total_usd            = 232474911  # base CAPEX before timetable-sized dedicated solar
total_eur            = 213876918  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
