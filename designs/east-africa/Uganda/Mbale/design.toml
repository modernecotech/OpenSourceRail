at_grade_eur         = 76572217
elevated_usd         = 76818771
elevated_eur         = 70673269
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 9000000  # $4.5 M per elevated interchange.
junction_premium_eur = 8280000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 169049441
civil_subtotal_eur   = 155525486
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 102100000
stations_eur         = 93932000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 57120000
rolling_stock_eur    = 52550400
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 12240000
production_plant_eur = 11260800
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1707256
signalling_eur       = 1570676
charging_microgrid_usd = 2325000
charging_microgrid_eur = 2139000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 24677919
epc_overhead_eur     = 22703685
total_usd            = 377219616  # base CAPEX before timetable-sized dedicated solar
total_eur            = 347042047  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
