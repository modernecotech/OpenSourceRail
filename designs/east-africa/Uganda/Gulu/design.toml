# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 53101000
at_grade_eur         = 48852920
elevated_usd         = 4828427
elevated_eur         = 4442153
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 2000000  # $2 M per elevated interchange.
junction_premium_eur = 1840000  # EUR 1.8 M per elevated interchange.
civil_subtotal_usd   = 59929427
civil_subtotal_eur   = 55135073
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 17670000
stations_eur         = 16256400
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 50421091
rolling_stock_eur    = 46387404
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 956082
signalling_eur       = 879595
charging_microgrid_usd = 7725000
charging_microgrid_eur = 7107000
power_eur            = 7107000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 10409112
epc_overhead_eur     = 9576383
total_usd            = 159110713  # full CAPEX stack
total_eur            = 146381856  # full CAPEX stack
