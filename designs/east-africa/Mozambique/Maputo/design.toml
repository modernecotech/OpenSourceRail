epc_overhead_eur     = 119655207
total_usd            = 1988060114  # base CAPEX before timetable-sized dedicated solar
total_eur            = 1829015305  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
