at_grade_eur         = 136320645
elevated_usd         = 27448208
elevated_eur         = 25252351
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 9000000  # $4.5 M per elevated interchange.
junction_premium_eur = 8280000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 184622822
civil_subtotal_eur   = 169852997
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 120100000
stations_eur         = 110492000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 119700000
rolling_stock_eur    = 110124000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 23940000
production_plant_eur = 22024800
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2583944
signalling_eur       = 2377229
charging_microgrid_usd = 3125000
charging_microgrid_eur = 2875000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 32345024
epc_overhead_eur     = 29757422
total_usd            = 494416791  # base CAPEX before timetable-sized dedicated solar
total_eur            = 454863447  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
car_count = 3
gross_battery_kwh_per_car = 225
