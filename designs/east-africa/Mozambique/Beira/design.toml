# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# direct-procurement planning basis). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD local-owner production planning basis with direct material, local production labour, shop overhead, nominal per-train QA/acceptance, and modest local handover logistics included; fixtures/tooling live in the railway production plant line; warranty, spares, and routine commissioning support are treated as OPEX; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 156573600
at_grade_eur         = 144047712
elevated_usd         = 15578400
elevated_eur         = 14332128
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 176652000
civil_subtotal_eur   = 162519840
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 168500000
stations_eur         = 155020000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; local-owner production unit).
rolling_stock_usd    = 216000000
rolling_stock_eur    = 198720000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 27000000
production_plant_eur = 24840000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2674471
signalling_eur       = 2460513
charging_microgrid_usd = 17300000
charging_microgrid_eur = 15916000
power_eur            = 15916000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7% of subtotal).
epc_overhead_usd     = 44108853
epc_overhead_eur     = 40580145
total_usd            = 674235324  # full CAPEX stack
total_eur            = 620296498  # full CAPEX stack
