elevated_eur         = 49923671
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 2000000  # $2 M per elevated interchange.
junction_premium_eur = 1840000  # EUR 1.8 M per elevated interchange.
civil_subtotal_usd   = 76981633
civil_subtotal_eur   = 70823102
# Stations (RFC 0010 archetype catalogue).
