at_grade_eur         = 79794360
elevated_usd         = 77126400
elevated_eur         = 70956288
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 9000000  # $4.5 M per elevated interchange.
junction_premium_eur = 8280000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 172859400
civil_subtotal_eur   = 159030648
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 116500000
stations_eur         = 107180000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 27211383
rolling_stock_eur    = 25034472
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1766913
signalling_eur       = 1625560
charging_microgrid_usd = 10650000
charging_microgrid_eur = 9798000
power_eur            = 9798000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 24569139
epc_overhead_eur     = 22603608
total_usd            = 375556835  # full CAPEX stack
total_eur            = 345512288  # full CAPEX stack
