stations_eur         = 41952000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 52822096
rolling_stock_eur    = 48596328
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 3309961
signalling_eur       = 3045164
charging_microgrid_usd = 14000000
charging_microgrid_eur = 12880000
