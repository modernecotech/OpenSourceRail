at_grade_eur         = 139208199
elevated_usd         = 20875861
elevated_eur         = 19205793
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 172189121
civil_subtotal_eur   = 158413991
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 90100000
stations_eur         = 82892000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 101700000
rolling_stock_eur    = 93564000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 20340000
production_plant_eur = 18712800
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2608870
signalling_eur       = 2400161
charging_microgrid_usd = 2250000
charging_microgrid_eur = 2070000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 27803159
epc_overhead_eur     = 25578907
total_usd            = 424991151  # base CAPEX before timetable-sized dedicated solar
total_eur            = 390991859  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
