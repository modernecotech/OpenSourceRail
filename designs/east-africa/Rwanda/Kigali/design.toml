junction_premium_eur = 13800000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 250994931
civil_subtotal_eur   = 230915337
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 71600000
stations_eur         = 65872000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 148328713
rolling_stock_eur    = 136462416
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2558751
signalling_eur       = 2354051
charging_microgrid_usd = 19400000
charging_microgrid_eur = 17848000
power_eur            = 17848000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
