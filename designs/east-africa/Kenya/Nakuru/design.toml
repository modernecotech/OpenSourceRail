version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 69821246
at_grade_eur         = 64235546
elevated_usd         = 6547960
elevated_eur         = 6024123
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 2500000  # $2.5 M per elevated interchange.
junction_premium_eur = 2300000  # EUR 2.3 M per elevated interchange.
civil_subtotal_usd   = 78869206
civil_subtotal_eur   = 72559669
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 25700000
stations_eur         = 23644000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 48820422
rolling_stock_eur    = 44914788
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 894195
signalling_eur       = 822659
charging_microgrid_usd = 7850000
charging_microgrid_eur = 7222000
power_eur            = 7222000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 12189368
epc_overhead_eur     = 11214218
total_usd            = 186323191  # full CAPEX stack
total_eur            = 171417334  # full CAPEX stack
