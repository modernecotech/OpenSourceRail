at_grade_eur         = 87361493
elevated_usd         = 10714844
elevated_eur         = 9857656
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 110172989
civil_subtotal_eur   = 101359149
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 29900000
stations_eur         = 27508000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 25610713
rolling_stock_eur    = 23561856
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1642163
signalling_eur       = 1510790
charging_microgrid_usd = 9200000
charging_microgrid_eur = 8464000
power_eur            = 8464000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
