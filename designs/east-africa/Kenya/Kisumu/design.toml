# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 60078042
at_grade_eur         = 55271798
elevated_usd         = 16949201
elevated_eur         = 15593265
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $2 M per elevated interchange.
junction_premium_eur = 0  # EUR 1.8 M per elevated interchange.
civil_subtotal_usd   = 77027242
civil_subtotal_eur   = 70865063
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 15450000
stations_eur         = 14214000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 12000000
depots_eur           = 11040000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 59224774
rolling_stock_eur    = 54486792
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 1131975
signalling_eur       = 1041417
charging_microgrid_usd = 7600000
charging_microgrid_eur = 6992000
power_eur            = 6992000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 12070379
epc_overhead_eur     = 11104749
total_usd            = 184504371  # full CAPEX stack
total_eur            = 169744021  # full CAPEX stack
