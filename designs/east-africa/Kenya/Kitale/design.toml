epc_overhead_eur     = 22758049
total_usd            = 378122863  # base CAPEX before timetable-sized dedicated solar
total_eur            = 347873034  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
