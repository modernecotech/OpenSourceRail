stations_usd         = 346000000
stations_eur         = 318320000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 113113983
rolling_stock_eur    = 104064864
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 6261272
signalling_eur       = 5760370
