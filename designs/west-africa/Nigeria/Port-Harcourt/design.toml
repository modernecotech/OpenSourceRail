# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# marketplace/direct-procurement floor). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 567161700
at_grade_eur         = 521788764
elevated_usd         = 105926400
elevated_eur         = 97452288
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 27000000  # $4.5 M per elevated interchange.
junction_premium_eur = 24840000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 700088100
civil_subtotal_eur   = 644081052
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 429500000
stations_eur         = 395140000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 170738087
rolling_stock_eur    = 157079040
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 9894059
signalling_eur       = 9102534
charging_microgrid_usd = 39150000
charging_microgrid_eur = 36018000
power_eur            = 36018000  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 95995917
epc_overhead_eur     = 88316244
total_usd            = 1467366163  # full CAPEX stack
total_eur            = 1349976870  # full CAPEX stack
