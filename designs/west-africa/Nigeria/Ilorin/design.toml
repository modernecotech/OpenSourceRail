epc_overhead_eur     = 28950533
total_usd            = 481010414  # base CAPEX before timetable-sized dedicated solar
total_eur            = 442529581  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
