stations_usd         = 107600000
stations_eur         = 98992000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 157932730
rolling_stock_eur    = 145298112
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 9133724
signalling_eur       = 8403026
