at_grade_eur         = 819932448
elevated_usd         = 573775571
elevated_eur         = 527873525
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 31500000  # $4.5 M per elevated interchange.
junction_premium_eur = 28980000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 1496506493
civil_subtotal_eur   = 1376785973
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 196500000
stations_eur         = 180780000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 30000000
depots_eur           = 27600000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 457791496
rolling_stock_eur    = 421168176
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 18041491
signalling_eur       = 16598172
charging_microgrid_usd = 57080000
charging_microgrid_eur = 52513600
power_eur            = 52513600  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7 % of subtotal).
