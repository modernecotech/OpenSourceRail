at_grade_eur         = 112318476
elevated_usd         = 17498400
elevated_eur         = 16098528
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 144083700
civil_subtotal_eur   = 132557004
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 111600000
stations_eur         = 102672000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; marketplace BOM floor).
rolling_stock_usd    = 36015065
rolling_stock_eur    = 33133860
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2107667
signalling_eur       = 1939054
charging_microgrid_usd = 11670000
charging_microgrid_eur = 10736400
