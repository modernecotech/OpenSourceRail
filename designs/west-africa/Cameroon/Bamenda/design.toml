at_grade_eur         = 144566522
elevated_usd         = 1597645
elevated_eur         = 1469833
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 0  # $4.5 M per elevated interchange.
junction_premium_eur = 0  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 158735169
civil_subtotal_eur   = 146036355
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 108600000
stations_eur         = 99912000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 122400000
rolling_stock_eur    = 112608000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 24480000
production_plant_eur = 22521600
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2625616
signalling_eur       = 2415566
charging_microgrid_usd = 3150000
charging_microgrid_eur = 2898000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 29959355
epc_overhead_eur     = 27562607
total_usd            = 457950139  # base CAPEX before timetable-sized dedicated solar
total_eur            = 421314128  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
