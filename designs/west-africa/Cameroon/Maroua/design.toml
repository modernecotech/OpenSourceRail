at_grade_eur         = 128633337
elevated_usd         = 71011740
elevated_eur         = 65330801
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 4500000  # $4.5 M per elevated interchange.
junction_premium_eur = 4140000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 215330584
civil_subtotal_eur   = 198104138
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 93700000
stations_eur         = 86204000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 8000000
depots_eur           = 7360000
# Rolling stock (RFC 0008 family × fleet count; local-owner production unit).
rolling_stock_usd    = 101700000
rolling_stock_eur    = 93564000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 20340000
production_plant_eur = 18712800
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2626196
signalling_eur       = 2416101
charging_microgrid_usd = 2125000
charging_microgrid_eur = 1955000
# EPC integration + project management (7 % of subtotal).
epc_overhead_usd     = 31067525
epc_overhead_eur     = 28582123
total_usd            = 474889305  # base CAPEX before timetable-sized dedicated solar
total_eur            = 436898161  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
onboard_architecture = "800 V-class; 650-700 V nominal traction DC bus"
car_count = 3
