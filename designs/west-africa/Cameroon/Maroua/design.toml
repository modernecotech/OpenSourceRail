# [costs] — RFC 0011 §9 planning-grade CAPEX (USD
# direct-procurement planning basis). country-costs.toml applies
# the per-country labour/material multiplier downstream.
[schema]
version = 2
cost_power_eur_alias = "deprecated; use costs.charging_microgrid_eur"

[costs]
currency_basis      = "USD direct-procurement planning basis with labour, shop overhead, rail QA, freight/duty, warranty, spares, training, and acceptance testing included; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur          = 0.92
# Civil works (USD/km x civil mix; EUR mirror at usd_to_eur).
at_grade_usd         = 135407100
at_grade_eur         = 124574532
elevated_usd         = 79785600
elevated_eur         = 73402752
bridge_usd           = 0
bridge_eur           = 0
junction_premium_usd = 9000000  # $4.5 M per elevated interchange.
junction_premium_eur = 8280000  # EUR 4.1 M per elevated interchange.
civil_subtotal_usd   = 224192700
civil_subtotal_eur   = 206257284
# Stations (RFC 0010 archetype catalogue).
stations_usd         = 121700000
stations_eur         = 111964000
# Depots (RFC 0014 archetype catalogue).
depots_usd           = 22000000
depots_eur           = 20240000
# Rolling stock (RFC 0008 family x fleet count; delivered all-in planning unit).
rolling_stock_usd    = 361200000
rolling_stock_eur    = 332304000
# Railway production plant (tooling + plant setup per vehicle/car module, not per trainset).
production_plant_usd = 25800000
production_plant_eur = 23736000
# Systems: residual train-control wayside + station/depot charging microgrids.
signalling_usd       = 2589226
signalling_eur       = 2382088
charging_microgrid_usd = 11990000
charging_microgrid_eur = 11030800
power_eur            = 11030800  # deprecated alias for charging_microgrid_eur
# EPC integration + project management (7% of subtotal).
epc_overhead_usd     = 53863035
epc_overhead_eur     = 49553992
total_usd            = 823334961  # full CAPEX stack
total_eur            = 757468164  # full CAPEX stack
