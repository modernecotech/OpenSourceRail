epc_overhead_eur     = 36788923
total_usd            = 611244528  # base CAPEX before timetable-sized dedicated solar
total_eur            = 562344966  # base CAPEX before timetable-sized dedicated solar

[costs.technology_basis]
cost_treatment = "included in planning units; do not add again"
