\* TLC configuration for MCSmall.
\* Invoke with:
\*   tlc -config MCSmall.cfg MCSmall.tla -workers auto -deadlock

SPECIFICATION Spec

CONSTANTS
  Server <- McServer
  Value  <- McValue
  Category <- McCategory
  MaxTerm <- McMaxTerm
  MaxLogLen <- McMaxLogLen
  n1 = n1
  n2 = n2
  n3 = n3
  v1 = v1
  v2 = v2
  Nil = Nil

INVARIANTS
  Invariants

\* Symmetry across interchangeable nodes and values cuts the state space
\* substantially without affecting safety invariants.
SYMMETRY
  Permutations(McServer) \cup Permutations(McValue)

CHECK_DEADLOCK FALSE
