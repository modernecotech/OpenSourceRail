schema_version = 1

# Executes inside osr-sim for every applicable train tick. These names must
# also be direct Cargo dependencies of osr-sim.
[tick_controller]
components = [
  "osr-ato", "osr-atp", "osr-aux-power", "osr-bms", "osr-brake",
  "osr-derailment", "osr-door-control", "osr-fire-safety", "osr-hvac",
  "osr-lighting", "osr-obstacle-detect", "osr-odometry", "osr-hot-axle",
  "osr-passenger-assist", "osr-pis-onboard", "osr-tcn", "osr-traction",
  "osr-cbm-onboard", "osr-event-recorder", "osr-t2g", "osr-tcms",
  "osr-regen",
]

# Linked into the deterministic runtime as shared primitives or infrastructure.
[runtime_kernel]
components = [
  "osr-consensus", "osr-core", "osr-crypto", "osr-interlocking", "osr-ptp",
  "osr-proto", "osr-secbus", "osr-selftest",
]

# Executes inside osr-sim for each configured station or wayside section tick.
[infrastructure_tick_controller]
components = [
  "osr-afc", "osr-balise", "osr-hot-axle-wayside", "osr-intrusion-detect", "osr-pis-station", "osr-psd",
  "osr-station-scada",
  "osr-energy-site",
  "osr-level-crossing", "osr-tvm", "osr-wayside-points",
]

# Consumes radio-delivered telemetry in the deterministic ground-service path.
[backend_stream_processor]
components = ["osr-afc-backoffice", "osr-analytics", "osr-cbm-backend", "osr-historian", "osr-occ"]

# Represented by an aggregate/scenario-native model. This is explicit technical
# debt: the standalone crate is not claimed to have run.
[scenario_model]
components = []

# Runs before/after the service simulation rather than on every vehicle tick.
[design_pipeline]
components = [
  "osr-alignment", "osr-city-studio", "osr-design", "osr-routing",
  "osr-safety-case", "osr-trainset-image",
]

# Simulation shell and operator-facing visualisation.
[simulation_shell]
components = ["osr-gui-shared", "osr-occ-gui", "osr-sim", "osr-sim-gui"]

# Has a defined integration boundary but is not falsely executed as an onboard
# tick. These services require their own service/wayside/station test harnesses.
[external_boundary]
components = []
