required_outputs = ["exact manufacturers and order codes", "controlled dimensions masses loads and interface drawings", "wheel rail suspension and axle-load compatibility", "friction dynamic parking emergency and degraded braking evidence", "RAMS maintenance spares and test evidence", "signed combined-configuration responsibility matrix"]
supplier_owner = ""
