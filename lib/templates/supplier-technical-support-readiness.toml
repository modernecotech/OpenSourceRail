[[work_package]]
id = "TS-WP-01"
title = "Frozen LM3 system review"
discipline = "systems-engineering"
objective = "Review one frozen train envelope, loading, speed, duty, energy architecture and localisation objective; classify each conclusion as suitable, suitable-with-change, alternative-required or test-required"
osr_input_refs = ["docs/rolling-stock/light-metro-3car/README.md", "docs/rolling-stock/light-metro-3car/interfaces.md", "engineering/models/bim/design-detail-register.json"]
required_outputs = ["signed review basis and assumptions", "requirement compliance and deviation matrix", "classification and rationale for every reviewed item", "change and test action register", "named engineering responsibility and limitations"]
supplier_owner = ""
osr_owner = ""
independent_reviewer = ""
evidence_refs = []
status = "proposed"

