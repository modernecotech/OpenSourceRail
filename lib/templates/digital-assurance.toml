[meta]
schema = "osr-digital-standards-thread/2"
id = "osr-digital-standards-thread-2"
title = "Deterministic digital standards-adherence thread"
status = "evidence-coherence-not-conformity"
standards_source = "docs/certification/standards-baseline.md"
fmea_source = "lib/templates/system-fmea.toml"
report_markdown = "docs/certification/digital-assurance-report.md"
report_json = "docs/certification/digital-assurance-report.json"
standards_reviewed_on = "2026-10-02"
next_registry_review_due = "2026-10-31"
standards_review_enforced = true
required_domains = ["system", "mechanical", "electrical", "thermal", "embedded-software", "civil", "operations", "quality", "information", "cybersecurity"]
required_lifecycle_stages = ["concept", "system-definition", "risk-and-requirements", "design", "implementation", "verification", "validation", "acceptance", "operation", "maintenance", "change", "retirement"]

[authority_boundary]
digital_gate_required_before_build = true
physical_release_required_before_service = true
independent_assessment_required = true
statement = "Passing means the named repository evidence is present, hashed, traceable and internally coherent. It is not a clause-by-clause conformity finding, certification, physical validation, permission to manufacture, construction release or permission to operate."
prohibited_claims = [
  "simulation replaces mandatory physical testing",
  "repository evidence is type approval",
  "routing selection is movement authority",
  "absence of conventional equipment removes protection functions",
  "a metadata mapping proves compliance with copyrighted normative text",
  "a machine-generated report replaces a competent or independent decision",
]

[evidence_policy]
required_metadata = ["stable_id", "claim", "configuration", "source_revision", "method", "acceptance_criteria", "result", "tool_and_version", "environment", "author", "reviewer", "independence", "created_at", "valid_until_or_review_trigger", "sha256", "limitations"]
allowed_states = ["planned", "generated-unreviewed", "reviewed", "accepted-for-stated-use", "rejected", "expired", "superseded", "not-applicable-with-rationale"]
repository_machine_state = "generated-unreviewed"
conformity_state = "not-assessed"
physical_release_state = "blocked"
roll_up_rule = "A parent control cannot close while a safety-significant child, interface, common-cause dependency, stale evidence item or required independent decision remains open."
change_rule = "A changed requirement, design source, implementation, interface, environment, tool, evidence result, standard edition or condition of use reopens the affected control and every dependent decision."

