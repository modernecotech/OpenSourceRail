# Trackside energy site tiers — PV + Na-ion + grid-tie Lego block.
#
# City design.toml references a tier per station that has a site:
#     [[sites]]
#     station = "samawah-rws"
#     tier    = "terminal"
#     # tier supplies all kW/kWh fields; overrides allowed.
#
# Tier sizing follows RFC 0002 §6 distributed pattern. Storage initial SoC
# defaults to 0.5 unless the tier specifies otherwise (depots start higher
# to buffer morning peak).
#
# Unified system principle: every trackside site in an OSR deployment is
# one of six tiers. This lets the BMS, inverter kit, switchgear, and
# enclosure CAD be reused across all stations in all cities.

# ---- None: station has no trackside energy ------------------------------
# (No entry — use tier = "none" or omit [[sites]] entirely.)

# ---- Standard: default mid-line station ---------------------------------

[tiers.standard]
pv_nameplate_kw          = 300
storage_capacity_kwh     = 2000
storage_max_charge_kw    = 800
storage_max_discharge_kw = 800
storage_initial_soc      = 0.5
grid_import_kw           = 500
grid_export_kw           = 500

# ---- Major: anchor station with charging pad ----------------------------

[tiers.major]
pv_nameplate_kw          = 400
storage_capacity_kwh     = 2500
storage_max_charge_kw    = 1000
storage_max_discharge_kw = 1000
storage_initial_soc      = 0.5
grid_import_kw           = 600
grid_export_kw           = 600

# ---- Interchange: two-line junction, larger buffer ----------------------

[tiers.interchange]
pv_nameplate_kw          = 500
storage_capacity_kwh     = 3000
storage_max_charge_kw    = 1000
storage_max_discharge_kw = 1000
storage_initial_soc      = 0.5
grid_import_kw           = 600
grid_export_kw           = 600

# ---- Terminal: end-of-line, bigger charging absorb ---------------------

[tiers.terminal]
pv_nameplate_kw          = 500
storage_capacity_kwh     = 3000
storage_max_charge_kw    = 1500
storage_max_discharge_kw = 1500
storage_initial_soc      = 0.6
grid_import_kw           = 800
grid_export_kw           = 800

# ---- Depot-secondary: small layup + yard PV -----------------------------

[tiers.depot-secondary]
pv_nameplate_kw          = 1500
storage_capacity_kwh     = 5000
storage_max_charge_kw    = 2000
storage_max_discharge_kw = 2000
storage_initial_soc      = 0.6
grid_import_kw           = 1000
grid_export_kw           = 1000

# ---- Depot-main: main depot microgrid -----------------------------------

[tiers.depot-main]
pv_nameplate_kw          = 5000
storage_capacity_kwh     = 40000
storage_max_charge_kw    = 10000
storage_max_discharge_kw = 10000
storage_initial_soc      = 0.6
grid_import_kw           = 3000
grid_export_kw           = 3000
