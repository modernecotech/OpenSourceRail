hold_point = true

[[method.steps]]
sequence = 60
name = "Finish, cure and inspect"
planning_minutes = 60
instruction = "Respect adhesive return-to-service time, inspect adhesion/seams/slip and PRM geometry, remove/refit every service hatch and complete snag, sharp-edge and rattle checks."
hold_point = true

