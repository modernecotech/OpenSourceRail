[[method.steps]]
sequence = 20
name = "Prepare floor and pre-cut covering"
planning_minutes = 150
instruction = "Verify substrate flatness, dryness and cleanliness; cut labelled floor pieces from controlled CAD templates and preserve access-hatch breaks, coved edges and drainage paths."
hold_point = false

[[method.steps]]
sequence = 30
name = "Bond covering"
planning_minutes = 210
instruction = "Condition material, apply only the selected supplier adhesive at specified spread rate/open time, lay without trapped air, roll in both directions and complete released seam/edge treatment."
hold_point = true

[[method.steps]]
sequence = 40
name = "Install service rails and inserts"
planning_minutes = 180
instruction = "Set blind threaded inserts perpendicular with the supplier force-controlled tool and sampled pull checks; gauge OSR-RAIL-42 pitch/alignment and preserve galvanic isolation."
hold_point = true

[[method.steps]]
sequence = 50
name = "Mount and proof passenger fixtures"
planning_minutes = 180
