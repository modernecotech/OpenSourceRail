[[method]]
id = "LM3-MFG-010"
title = "Locally fabricated steel body, bogie and interface structures"
product_ids = ["LM3-BDY-P010", "LM3-BDY-P020", "LM3-BDY-P030", "LM3-BDY-P040", "LM3-BDY-P050", "LM3-BDY-P060", "LM3-BDY-P070", "LM3-BDY-P080", "LM3-BDY-P090", "LM3-BDY-P100", "LM3-BDY-P110", "LM3-BDY-P120", "LM3-ART-P010", "LM3-BOG-P010", "LM3-BOG-P020"]
tooling_ids = ["LM3-TOOL-STEEL-FIXTURE", "LM3-TOOL-DATUM-GAUGE"]
work_center = "local steel preparation, weld and metrology cells"
crew_size = 6
planning_cycle_minutes = 4320
joining_parts = ["released structural welds", "machined datum inserts", "OSR-FST-M8-FLOAT only for calculated secondary interfaces", "galvanic-isolation shims"]
release_gate = "Controlled cut/flat-pattern pack, WPS/WPQR, qualified welders, weld map, NDT plan, dimensional survey and released structural proof."
source_ids = ["SRC-ERA-LOC-PAS"]

[[method.steps]]
sequence = 10
name = "Release material and fixture"
planning_minutes = 120
instruction = "Verify drawing revision, heat certificates, section/plate identity, fixture calibration and datum targets before cutting. Quarantine substitutions."
hold_point = true

[[method.steps]]
sequence = 20
name = "Cut, form, machine and deburr"
planning_minutes = 960
instruction = "Produce the controlled cut list and flat patterns; protect datum and bond lands; identify every primary part to heat and drawing position."
hold_point = false

[[method.steps]]
sequence = 30
name = "Fixture, tack and survey"
planning_minutes = 480
instruction = "Load parts against the 3-2-1 datum scheme, install calibrated shims/stops, tack to the released sequence and survey before production welding."
hold_point = true

[[method.steps]]
sequence = 40
name = "Qualified weld and controlled cool"
planning_minutes = 1680
instruction = "Execute only the released weld map/WPS with heat-input and consumable records; use a balanced sequence and controlled cooling or stress relief where specified."
hold_point = false

[[method.steps]]
sequence = 50
name = "NDT, machine datums and coat"
planning_minutes = 1080
instruction = "Complete VT and classed MT/UT, repair through an NCR, machine released interfaces, survey the frame, restore edge/cavity protection and record coating batches."
hold_point = true

[[method]]
id = "LM3-MFG-020"
title = "Reusable one-metre GFRP body/roof moulds and split end-cowl moulds"
product_ids = ["LM3-BDY-P130", "LM3-BDY-P140", "LM3-CWL-P010", "LM3-CWL-P011", "LM3-CWL-P012", "LM3-CWL-P013", "LM3-CWL-P014", "LM3-CWL-P015", "LM3-CWL-P016", "LM3-EXT-P080", "LM3-EXT-P090"]
tooling_ids = ["LM3-TOOL-SIDE-MOULD", "LM3-TOOL-ROOF-MOULD", "LM3-TOOL-COWL-MOULD", "LM3-TOOL-TRIM-DRILL"]
work_center = "local composite moulding, cure, trim and dry-fit cell"
crew_size = 3
planning_cycle_minutes = 1440
joining_parts = ["potted threaded inserts", "solid laminate clip lands", "OSR-FST-M6-CAPTIVE", "keyed over-centre clips", "replaceable EPDM dry seals"]
release_gate = "Released laminate/core/insert map, fire evidence, material shelf life, mould survey, vacuum leak check, cure record, witness coupon, trim report, insert pull-out sample and master-frame dry fit."
source_ids = ["SRC-COMPOSITES-ONE-INFUSION", "SRC-ERA-LOC-PAS"]

[[method.steps]]
sequence = 10
name = "Inspect, clean and release mould"
planning_minutes = 60
instruction = "Inspect mould A-surface, split line, vacuum ports and datums; clean with the qualified system and apply the released semi-permanent release process. Record mould and release lots."
hold_point = true

[[method.steps]]
sequence = 20
name = "Apply exterior finish primer or gelcoat"
planning_minutes = 75
instruction = "Apply the released UV/fire-compatible finish layer at controlled wet-film thickness. The supplier minimum/maximum overcoat window overrides this planning allowance."
hold_point = false

[[method.steps]]
sequence = 30
name = "Load reinforcement, core, solid lands and inserts"
planning_minutes = 180
instruction = "Place identified dry plies, local core and solid laminate lands to the released ply book; pot or fixture inserts and build a co-cured witness coupon."
hold_point = true

[[method.steps]]
sequence = 40
name = "Bag, leak-test and infuse"
planning_minutes = 120
instruction = "Install peel ply/flow media/bag and resin lines, record a stable vacuum leak test, then infuse within supplier temperature, viscosity and working-time limits."
hold_point = true

[[method.steps]]
sequence = 50
name = "Cure in mould"
planning_minutes = 720
instruction = "Hold the supplier-qualified time/temperature cure and record thermocouples. Do not demould on elapsed time alone; cure acceptance or hardness/Tg evidence controls release."
hold_point = true

[[method.steps]]
sequence = 60
name = "Demould, trim, seal and dry-fit"
planning_minutes = 285
instruction = "Demould without prying on show surfaces; inspect/tap-check, CNC trim and drill in the datum fixture, seal every cut edge, install inserts/seals, gauge the part and dry-fit it to the master frame."
hold_point = true

[[method]]
id = "LM3-MFG-030"
title = "Solar-reflective, high-emittance exterior coating and thermal witness route"
product_ids = ["LM3-BDY-P130", "LM3-CWL-P011", "LM3-CWL-P012", "LM3-CWL-P013", "LM3-CWL-P014", "LM3-CWL-P015", "LM3-CWL-P016"]
tooling_ids = ["LM3-TOOL-COATING-RACK", "LM3-TOOL-COATING-COUPON"]
work_center = "local preparation and controlled paint cell"
crew_size = 2
planning_cycle_minutes = 960
joining_parts = ["compatible primer/topcoat system", "sealed GFRP edges", "coated witness coupons", "replaceable external labels"]
release_gate = "Rail fire/smoke compatibility, substrate/primer compatibility, adhesion, weathering, cleanability, colour/glare review and measured new/aged solar reflectance and thermal emittance. No cooling or energy saving may be claimed before vehicle thermal testing."
source_ids = ["SRC-DOE-COOL-SURFACE", "SRC-SIKA-RAIL", "SRC-ERA-LOC-PAS"]

[[method.steps]]
sequence = 10
name = "Condition and inspect substrate"
planning_minutes = 60
instruction = "Verify cured laminate, sealed edges, moisture/temperature limits and defect repair; mask bonds, seals, datums, windows, sensors and electrical earths."
hold_point = true

[[method.steps]]
sequence = 20
name = "Prepare and prime"
planning_minutes = 120
instruction = "Abrade and clean only by the released coating procedure, apply compatible primer and coat a traceable witness coupon beside the vehicle modules."
hold_point = false

[[method.steps]]
sequence = 30
name = "Apply reflective/emissive topcoat"
planning_minutes = 120
instruction = "Apply the selected light-colour rail topcoat to controlled wet/dry film thickness. Avoid unqualified experimental radiative-cooling chemistry and review glare/visibility with the authority."
hold_point = false

[[method.steps]]
sequence = 40
name = "Controlled cure"
planning_minutes = 600
instruction = "Maintain supplier temperature, humidity and ventilation limits; the released coating datasheet controls flash, recoat, cure and return-to-service times."
hold_point = true

[[method.steps]]
sequence = 50
name = "Inspect and retain coupons"
planning_minutes = 60
instruction = "Record film thickness, adhesion/cure acceptance, colour/gloss and measured solar reflectance/emittance; retain labelled coupons for accelerated weathering and cleaning trials."
hold_point = true

[[method]]
id = "LM3-MFG-040"
title = "Replaceable side-window cassette, pressure frame, seal and drain installation"
product_ids = ["LM3-BDY-P110", "LM3-WIN-P010", "LM3-EXT-P020", "LM3-EXT-P030"]
tooling_ids = ["LM3-TOOL-WINDOW-GAUGE", "LM3-TOOL-WATER-TEST"]
work_center = "local glazing preparation and vehicle fit-out cell"
crew_size = 2
planning_cycle_minutes = 180
joining_parts = ["supplier-bonded aluminium glazing cassette", "replaceable closed-cell/EPDM outer seal", "aluminium pressure frame", "OSR-FST-M6-CAPTIVE", "drain rail and jack points"]
release_gate = "Supplier glazing/edge certificate, retained frame calculation, approved surface preparation, seal compression map, drain test, water-ingress test, heater/isolation test where fitted and timed replacement demonstration."
source_ids = ["SRC-SIKA-RAIL", "SRC-ERA-LOC-PAS"]

[[method.steps]]
sequence = 10
name = "Receive and inspect cassette"
planning_minutes = 25
instruction = "Confirm pane/cassette identity and orientation; inspect laminate, edges, frame bond and heater terminals. Quarantine any edge impact, delamination or expired adhesive evidence."
hold_point = true

[[method.steps]]
sequence = 20
name = "Gauge aperture and dry-fit"
planning_minutes = 35
instruction = "Gauge carrier-ring datums and drains, protect glass edges, place the cassette on nonmetallic setting blocks and confirm uniform design clearance without forcing the glass."
hold_point = true

[[method.steps]]
sequence = 30
name = "Install dry seal and pressure frame"
planning_minutes = 55
instruction = "Fit the one-piece keyed seal without stretch, lubricants or unapproved sealant; install the pressure frame and tighten captive fasteners in the released cross-pattern to the joint schedule."
hold_point = false

[[method.steps]]
sequence = 40
name = "Verify compression, drains and services"
planning_minutes = 25
instruction = "Measure seal compression at the released witness points; confirm drain continuity, secondary retention, electrical isolation and heater continuity where fitted."
hold_point = true

[[method.steps]]
sequence = 50
name = "Water and replacement test"
planning_minutes = 40
instruction = "Run the controlled spray test, inspect the dry side and drains, then remove/refit the first article with the documented lifting/jacking method and record elapsed replacement time."
hold_point = true

[[method]]
id = "LM3-MFG-050"
title = "Supplier door cassette on locally made four-point adjustable carrier"
product_ids = ["LM3-BDY-P100", "LM3-DOOR-P010", "LM3-EXT-P010"]
tooling_ids = ["LM3-TOOL-DOOR-GAUGE", "LM3-TOOL-SEAL-GAUGE"]
