crew_size = 3
planning_cycle_minutes = 300
joining_parts = ["four adjustable carrier shoes", "two hardened datum pins", "replaceable dry perimeter seal", "OSR-FST-M10-SEAL", "keyed body-side connector bracket"]
release_gate = "Supplier and interface freeze, carrier load proof, EN 14752/national evidence as applicable, datum and seal maps, closed-and-locked loop, obstacle detection, emergency release, water test and timed cassette replacement."
source_ids = ["SRC-KNORR-IFE-DOOR", "SRC-ERA-LOC-PAS"]

[[method.steps]]
sequence = 10
name = "Accept supplier cassette and portal"
planning_minutes = 45
instruction = "Verify serial/revision/evidence, inspect seals/leaf/drive and gauge the locally made portal and four carrier datums before lifting the cassette."
hold_point = true

[[method.steps]]
sequence = 20
name = "Lift, pin and adjust carrier"
planning_minutes = 75
instruction = "Use the approved lift points; engage datum pins, install four carrier shoes and adjust only within their released range to achieve leaf/aperture geometry without distorting the cassette."
hold_point = true

[[method.steps]]
sequence = 30
name = "Join, seal and connect"
planning_minutes = 60
instruction = "Install sealed fasteners to the controlled joint schedule, fit the keyed replaceable seal and connector, retain service loops and record final adjuster positions and witness marks."
hold_point = false

[[method.steps]]
sequence = 40
name = "Static functional and safety tests"
planning_minutes = 75
instruction = "Test open/close cycles, obstruction detection, closed-and-locked circuit, traction interlock, emergency release, local isolation and degraded/manual operation under the supplier procedure."
hold_point = true

[[method.steps]]
sequence = 50
name = "Ingress and replacement demonstration"
planning_minutes = 45
instruction = "Run the controlled water test and first-article removal/refit; repeat safety tests after replacement and record time, tooling and adjustments."
hold_point = true

