# Country cost multipliers — scale base USD to local reality.
#
# All unit costs in other templates are BASE USD (OECD mid-range). The loader
# applies the factor for the city's country:
#
#   actual = base × labor_factor × (material mix) × overhead_factor
#
# Source basis: World Bank construction cost indices + ILO wage data (2024).
# Factors are directional, not precise — refine per PPP of each engagement.
#
# Unified system principle: one multiplier per country covers BOM scaling.
# No per-item tuning — that happens at the actual-procurement stage, not at
# the planning-grade stage this template serves.

# Fields:
#   labor_factor       → applied to any *_cost_usd that is labor-heavy
#                       (civil, workshops, training, cert)
#   material_factor    → applied to *_cost_usd that is materials-heavy
#                       (rail, concrete, PV, batteries, electronics)
#   overhead_factor    → applied to ICT, EPC margin, contingency
#   currency           → ISO 4217 of the local currency (for output)
#   exchange_rate_usd  → local-per-USD indicative rate (2024 average)

