[meta]
schema = "osr-system-fmea/1"
method = "IEC 60812:2018-inspired project worksheet"
status = "living design FMEA; supplier FMEDA and deployment review remain required"
rating_scale = "1 (low/easy detection) to 5 (catastrophic/hard detection)"
required_domains = ["mechanical", "electrical", "thermal", "embedded-software", "civil", "operations"]
required_levels = ["component", "subsystem", "system"]
high_risk_rpn = 40
inventory_sources = [
  "design/component-catalogue/catalog/buildable-trainset/buildable-trainset-manifest.json",
  "design/component-catalogue/catalog/buildable-stations/station-kit-manifest.json",
  "design/component-catalogue/catalog/buildable-civil/reusable-type-release-register.json",
  "Cargo.toml",
]

[[failure_modes]]
id = "FMEA-MEC-C01"
domain = "mechanical"
level = "component"
item = "axle bearing"
function = "support rotating wheelset"
mode = "seizure or overheating"
local_effect = "bearing drag and heat"
system_effect = "derailment risk"
cause = "lubrication loss, contamination or fatigue"
detection = "onboard and wayside temperature plus vibration trend"
controls = ["temperature trip", "condition maintenance", "quarantine threshold"]
severity = 5
occurrence = 2
detection_rating = 2
physical_evidence_required = true
evidence = ["crates/osr-hot-axle/src/lib.rs", "crates/osr-hot-axle-wayside/src/lib.rs"]

