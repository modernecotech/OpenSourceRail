# City operating roles. Replaces the obsolete per-train driver staffing template.
# Weights split existing driverless finance FTE; they are editable planning choices.
# One FTE minimum per function where the group permits; remainder uses largest remainder.
# Functions may share a competent person; validate actual shift and leave rosters locally.
[schema]
version = 2

[policy]
basis = "Budget-neutral allocation of existing GoA 4 labour groups; local staffing proposal, not a measured workload or accepted roster."
shared_country_capabilities = ["rolling-stock and precast manufacturing", "software and reference design", "specialist laboratory, structural/geotechnical checking and training"]
shared_service_rule = "Shared domestic capability: allocate factory staff/cost across actual city orders; do not duplicate a national factory headcount in every city."

[[role]]
id = "occ-lead"
group = "occ_remote_assist"
weight = 15
minimum_fte = 1
title = "Shift leadership and degraded-operation authority"
reports_to = "City director"
skills = "GoA 4 incident command; dispatch competence"
tasks = "Own service start; coordinate recovery and same-line depot releases"
competence_evidence = "Observed task assessment, authorisation scope and expiry; apprentices supervised until assessed."

