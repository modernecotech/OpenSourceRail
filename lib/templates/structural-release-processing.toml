schema_version = 1
template_revision = "2026-09-02"
technical_boundary = "The automated gate checks immutable solver provenance, per-asset schedule coverage, load-case/result reconciliation and independent-check completeness. It does not validate modelling assumptions, codes, loads, mesh quality, reinforcement, prestress, soil springs, fatigue detail, seismic response or structural safety."
acceptance_boundary = "Only the structural and geotechnical engineers of record, independent checker, asset owner and approving authority can release the project structures in a signed controlled record."

[receipt]
required_metadata_fields = ["package_revision", "file_path", "sha256", "capture_date", "coordinate_system", "vertical_datum", "producer", "checker", "acceptance_status"]
allowed_acceptance_statuses = ["received", "checked", "accepted", "rejected"]

[asset_schedule]
required_columns = ["asset_id", "line_id", "asset_type", "from_station_m", "to_station_m", "variant_id", "foundation_ref", "analysis_ids", "status"]
allowed_asset_types = ["span", "pier", "abutment", "foundation", "at-grade-structure", "special-structure"]
accepted_status = "checked"

[solver_report]
accepted_status = "passed"
required_fields = ["status", "tool", "version", "input_sha256", "model_revision", "convergence", "load_case_ids", "output_hashes"]

[verification_report]
accepted_status = "passed"
required_fields = ["status", "design_basis_sha256", "asset_schedule_sha256", "load_case_register_sha256", "solver_evidence_hashes", "asset_results", "residual_risks"]
asset_status_fields = ["global_status", "foundation_status", "seismic_status", "wind_status", "fatigue_status", "bearing_movement_status"]
accepted_result_status = "passed"

[independent_check]
accepted_status = "accepted"
required_fields = ["status", "checker_organisation", "checker_name", "checked_revision", "evidence_hashes", "comments_closed", "signed_at"]

[authority_record]
accepted_decision = "accepted"
required_fields = ["decision", "structural_engineer", "geotechnical_engineer", "independent_checker", "asset_owner", "approving_authority", "information_manager", "signed_at", "document_revision", "controlled_record_reference", "approved_evidence_hashes"]

[[input]]
file_role = "drainage_ground_readiness"
extensions = [".json"]
category = "prerequisite"
[[input]]
file_role = "structural_design_basis"
extensions = [".json", ".pdf"]
category = "technical"
[[input]]
file_role = "structural_asset_schedule"
extensions = [".csv"]
category = "technical"
[[input]]
file_role = "load_case_register"
extensions = [".json"]
category = "technical"
[[input]]
file_role = "opensees_model"
extensions = [".py", ".tcl"]
category = "technical"
[[input]]
file_role = "opensees_report"
extensions = [".json"]
category = "technical"
[[input]]
file_role = "calculix_input"
extensions = [".inp"]
category = "technical"
[[input]]
file_role = "calculix_report"
extensions = [".json"]
category = "technical"
[[input]]
file_role = "structural_verification_report"
extensions = [".json"]
category = "technical"
[[input]]
file_role = "independent_check_record"
extensions = [".json"]
category = "technical"
[[input]]
file_role = "structural_acceptance_record"
extensions = [".json"]
category = "authority"
