# Country financial parameters — used by `osr_scenario.network_readme`
# to estimate CAPEX funding stack, annual OPEX, and affordability-
# anchored ticket pricing.
#
# All values are 2024 indicative; refresh per deployment from the
# country's central bank / national statistics office. Numbers are
# baked into the README's `## Funding & affordability` section.
#
# ---------------------------------------------------------------------------
# FIELDS
# ---------------------------------------------------------------------------
#   median_monthly_income_usd  — household median per-month income, USD.
#                                Drives the affordability-anchored ticket
#                                price.
#   revenue_case_monthly_pass_income_share
#                              — monthly-pass share of median income used
#                                for the stronger service/revenue case.
#   gni_per_capita_usd         — GNI per capita, World Bank Atlas method.
#                                Used as a sanity cross-check.
#   climate_development_grant_share
#                              — optional non-repayable grant override share
#                                of CAPEX. Default is zero; generated
#                                finance reports do not assume grants.
#   local_bond_share_of_local_capex
#                              — share of locally supplied CAPEX financed by
#                                domestic-currency sovereign/project bonds.
#                                The balance is local public equity or another
#                                non-debt domestic funding source. Imported
#                                CAPEX is financed separately in foreign
#                                currency through the international tranche.
#   sovereign_bond_rate        — local-currency infrastructure-bond planning
#                                coupon, decimal, applied only to local content.
#   multilateral_loan_rate     — IBRD / AfDB / ADB blended rate, decimal.
#                                Kept as the country comparator.
#   green_concessional_loan_rate
#                              — target climate-window / GCF-blended
#                                loan rate used for the repayable debt
#                                placeholder. This is not evidence of a
#                                committed lender offer.
#   capex_grace_years          — years of construction during which
#                                principal isn't repaid (interest only).
#   loan_tenor_years           — total tenor for multilateral + bond
#                                tranches.
#   concessional_loan_tenor_years
#                              — preferred tenor for the candidate
#                                climate/MDB concessional package.
#   farebox_recovery_target    — fraction of OPEX that fares should
#                                recover (rest is operating subsidy).
#                                Singapore MRT ≈ 1.0; London Tube ≈ 0.95;
#                                Iraqi / sub-Saharan deployments more
#                                typically 0.4–0.6 because affordability
#                                is the binding constraint.
#   grid_energy_usd_per_kwh    — planning price for residual grid / PPA
#                                import after on-site PV and any dedicated
#                                solar plant cover generated timetable
#                                energy demand.
#   currency                   — local currency ISO 4217 (carried for
#                                downstream output formatting; FX is in
#                                country-costs.toml).
#
# ---------------------------------------------------------------------------
# DEFAULT FALLBACK
# ---------------------------------------------------------------------------
# Country code "XX" supplies values for any city whose country isn't
# listed below — pick conservative middle-income figures so the README
# generates a credible bracket rather than zeroes.

[countries.XX]
median_monthly_income_usd  = 600
revenue_case_monthly_pass_income_share = 0.08
gni_per_capita_usd         = 7500
climate_development_grant_share = 0.00
local_bond_share_of_local_capex = 0.80
sovereign_bond_rate        = 0.07
multilateral_loan_rate     = 0.045
green_concessional_loan_rate = 0.045
capex_grace_years          = 5
loan_tenor_years           = 25
concessional_loan_tenor_years = 40
farebox_recovery_target    = 0.50
grid_energy_usd_per_kwh    = 0.10
currency                   = "USD"

