# Manufacturing schedule template for OSR city deployments.
#
# The generator expands these work packages to each city asset. Rows are
# intentionally spreadsheet-friendly: one asset, one package, one planned
# production/installation work order candidate.

[policy]
planning_basis = "Project-day offsets from notice-to-proceed; replace project_day_N with real dates when the city baseline is approved."
work_order_rule = "Every manufacturing schedule row can be converted into an Ops Core work order with assignee, due date, evidence, NCR/defect hold, audit, and SQLite persistence."
crew_rule = "Crew roles name accountable disciplines, not contractors; local owner-builder teams may staff more than one role."
handover_rule = "Closed manufacturing work orders hand over evidence into construction QA, commissioning, and later maintenance records."
reconciliation = "SQLite is the source of record when available; browser-local records can be merged through Ops Core reconciliation."

[[manufacturing_package]]
id = "sys-00-baseline-freeze"
asset_types = ["system"]
phase = "program-control"
sequence = 0
duration_days = 5
work_center = "project controls"
work_order_title = "Manufacturing baseline, ITP, and traveller release"
work_order_detail = "Freeze asset register, route build lots, production traveller numbering, QA hold points, material release rules, and staff authorization matrix."
staff_roles = ["project controls lead", "quality manager", "production planner", "safety assurance lead"]
staff_tasks = "Publish baseline schedule; assign lot numbers; approve traveller templates; map QA gates to work packages; brief production supervisors."
materials_or_inputs = "Approved design.toml, scenario.toml, QA template, maintenance template, manufacturing template"
bom_refs = ["project_kit:program-control:baseline-pack"]
deliverables = "Baseline schedule, work breakdown structure, lot register, authorization matrix"
evidence_required = "signed schedule baseline, ITP register, revision-controlled traveller pack"
release_authority = "owner engineer"
qa_gate_hint = "qa-00-design-freeze"
priority = "safety"
predecessors = ""

