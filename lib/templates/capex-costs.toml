# CAPEX cost model source of truth.
#
# These are planning-grade USD direct-procurement planning rates
# used by `osr-design` and the generated city README reports. Prose docs
# may summarize these values, but generated artefacts should read this file
# rather than carrying parallel constants.

[schema]
version = 1
currency_basis = "USD direct-procurement planning basis with labour, shop overhead, rail QA, freight/duty, warranty, spares, training, and acceptance testing included; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur = 0.92

[civil_usd_per_km]
at_grade = 3000000
elevated = 12000000
bridge = 18000000

[junctions]
elevated_interchange_premium_usd = 4500000

[station_unit_usd]
halt = 600000
standard = 2500000
major = 4500000
terminal = 4500000
"depot-terminal" = 5000000
interchange = 8000000
"interchange-elevated" = 12000000

[depot_unit_usd]
"main-heavy" = 12000000
"secondary-medium" = 7000000
"layup-minimal" = 2000000

[trainset_unit_usd]
"urban-shuttle-1car" = 1400000
"tram-2car" = 2800000
"light-metro-3car" = 4200000
"metro-4car" = 5600000
"metro-6car" = 8400000

[production_plant]
per_vehicle_usd = 100000
high_sensitivity_per_vehicle_usd = 200000
scope = "City railway production plant, tooling, basic fixtures, plant services, and setup allowance per vehicle/car module, not per trainset"

[systems]
signalling_usd_per_km = 50000

[solar_power_plant]
utility_pv_usd_per_kw = 700
interconnection_usd_per_kw = 100
coverage_margin = 1.15
annual_maintenance_fraction = 0.015
scope = "Dedicated utility-scale solar plant or contracted offsite solar PPA asset sized to cover generated timetable traction-energy shortfall after on-site station/depot PV"

[charging_microgrid_unit_usd]
halt = 120000
standard = 250000
major = 450000
terminal = 500000
interchange = 700000
"interchange-elevated" = 850000
"depot-terminal" = 1000000

[overhead]
epc_fraction = 0.07
