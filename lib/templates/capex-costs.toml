# CAPEX cost model source of truth.
#
# These are planning-grade USD marketplace/direct-procurement floor rates
# used by `osr-design` and the generated city README reports. Prose docs
# may summarize these values, but generated artefacts should read this file
# rather than carrying parallel constants.

[schema]
version = 1
currency_basis = "USD marketplace/direct-procurement floor; *_eur mirrors retained for schema compatibility"
usd_to_eur = 0.92

[civil_usd_per_km]
at_grade = 3000000
elevated = 12000000
bridge = 18000000

[junctions]
elevated_interchange_premium_usd = 4500000

[station_unit_usd]
halt = 600000
standard = 2500000
major = 4500000
terminal = 4500000
"depot-terminal" = 5000000
interchange = 8000000
"interchange-elevated" = 12000000

[depot_unit_usd]
"main-heavy" = 12000000
"secondary-medium" = 7000000
"layup-minimal" = 2000000

[trainset_unit_eur]
"urban-shuttle-1car" = 245436
"tram-2car" = 490872
"light-metro-3car" = 736308
"metro-4car" = 981744
"metro-6car" = 1472616

[systems]
signalling_usd_per_km = 50000

[charging_microgrid_unit_usd]
halt = 120000
standard = 250000
major = 450000
terminal = 500000
interchange = 700000
"interchange-elevated" = 850000
"depot-terminal" = 1000000

[overhead]
epc_fraction = 0.07
