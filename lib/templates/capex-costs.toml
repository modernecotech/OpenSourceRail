# CAPEX cost model source of truth.
#
# These are planning-grade USD direct-procurement planning rates
# used by `osr-design` and the generated city README reports. Prose docs
# may summarize these values, but generated artefacts should read this file
# rather than carrying parallel constants.

[schema]
version = 3
currency_basis = "USD local-owner trainset-family planning basis with direct material, local assembly/labour, nominal per-train QA/acceptance, and modest handover logistics included; 1 m clip-on fiberglass body modules reduce shell labour, mould tooling, cure space, and production setup; distributed overnight stabling reduces depot parking scope; fixtures/tooling live in one shared national railway production plant sized per supported vehicle/car module and excluded from city CAPEX; warranty, spares, and routine commissioning support are treated as OPEX; raw marketplace BOM retained only as audit lower bound; *_eur mirrors retained for schema compatibility"
usd_to_eur = 0.92

# Planning-grade localization-first procurement assumptions. The imported
# share is the portion that needs foreign currency or an international
# financing source; the balance can be procured and financed locally. These
# assume that standard structures, fabrication, installation, cabling,
# software integration, and project services are deliberately localized.
# They remain common reference shares until a country supplier survey provides
# a controlled override.
[procurement_origin]
basis = "Localization-first imported share by CAPEX bucket; local share is 1 - imported_share. Imports are limited to specialist machinery and components not qualified domestically, including battery cells, traction/power electronics, selected control hardware, PV modules/inverters, and initial production tooling. Local scope includes bulk civil materials, structures, fabrication, vehicle bodies/interiors, wiring and cabinets, installation, software integration, testing support, labour, and domestic project services. Replace with a country supplier-capability and rules-of-origin audit before procurement."

[procurement_origin.imported_share]
civil = 0.15
stations = 0.20
depots = 0.25
rolling_stock = 0.35
production_plant = 0.20
solar_plant = 0.45
signalling = 0.50
charging_microgrid = 0.40
epc_overhead = 0.15

# Illustrative like-for-like foreign-turnkey sensitivity, not a supplier quote.
# The multiplier applies to OSR total CAPEX for an equivalent surface/elevated
# network, fleet, service plan, and energy scope. The external share is the
# portion of the foreign contractor's price assumed to require hard currency or
# international finance. Low/default/high are intentionally editable variables;
# replace them with comparable bids using a documented common scope.
[foreign_turnkey_comparator]
basis = "Illustrative variable benchmark for an equivalent foreign-company turnkey delivery. It excludes tunnels, land, tax/duty, utility relocation, financing fees, and escalation on both sides; it does not represent a received bid or named vendor price."
external_capital_share = 0.90

[foreign_turnkey_comparator.cost_multiplier]
low = 1.50
default = 2.00
high = 3.00

# Retained pre-redesign benchmark. Active city calculations use the generated
# `civil-cost-model.toml`, which indexes these values from current CAD
# quantities. Keeping the benchmark here makes claimed reductions auditable.
[civil_benchmark_usd_per_km]
at_grade = 3000000
elevated = 12000000
bridge = 18000000

[junctions]
elevated_interchange_premium_usd = 4500000

[station_unit_usd]
halt = 600000
standard = 2500000
major = 4500000
terminal = 4500000
"depot-terminal" = 5000000
interchange = 8000000
"interchange-elevated" = 12000000

[depot_unit_usd]
"main-heavy" = 8000000
"secondary-medium" = 3000000
"layup-minimal" = 400000

[depot_cost_basis]
scope = "Workshop, inspection, defect repair, wheel and heavy-maintenance functions only; healthy trains stable and recharge overnight at powered passenger stations, so fleet-wide covered parking roads and terminal layup compounds are excluded"
distributed_station_stabling = true

[trainset_unit_usd]
"urban-shuttle-1car" = 280000
"tram-2car" = 560000
"light-metro-3car" = 900000
"metro-4car" = 1120000
"metro-6car" = 1680000

[trainset_cost_basis]
local_assembly_fraction = 0.28
body_system = "1,000 mm clip-on fiberglass side and roof modules on a welded steel safety frame"
body_installation = "three-car exterior body installed and released in one 8-hour shift by six parallel two-person crews after frame paint and dimensional release"
excluded_from_one_day_claim = "doors, glazing, traction equipment, bogies, train commissioning, homologation, and first-article testing"

# RFC 0021 audit basis for the 800 V-class onboard architecture. These
# components are included in, not added to, the delivered trainset rates
# above. Per-car values scale the common modular car architecture.
[trainset_800v_core_electrical_usd]
architecture = "800 V-class; 650-700 V nominal traction DC bus"
gross_battery_kwh_per_car = 225
traction_battery_system_per_car = 24166.67
motor_controller_sets_per_car = 2
motor_controller_set = 10000
hv_distribution_per_car = 3333.33
lv_dc_dc_per_car = 2500
roof_pv_mppt_per_car = 1000
core_electrical_total_per_car = 51000

# RFC 0021 normal passenger-stop module. The $65k equipment subtotal is
# contained within the $100k integrated normal-site planning unit below.
[station_800v_module_usd]
architecture = "500-1500 V DC/DC configured to 500 kW; 650-700 V train bus"
stationary_lfp_500kwh = 37500
dcdc_500kw = 15000
contact_protection_control = 12500
equipment_total = 65000
normal_integrated_site = 100000

[production_plant]
per_vehicle_usd = 60000
high_sensitivity_per_vehicle_usd = 120000
scope = "One shared national railway production plant, sized to the largest single-city fleet programme and reused for phased national rollout. Includes lightweight 1 m panel moulds, clip/drill gauges, basic steel fixtures, plant services, and setup allowance per supported vehicle/car module; no full-length body mould or production adhesive cure hall. City CAPEX excludes this national asset."

[systems]
signalling_usd_per_km = 50000

[solar_power_plant]
utility_pv_usd_per_kw = 700
interconnection_usd_per_kw = 100
coverage_margin = 1.15
annual_maintenance_fraction = 0.015
scope = "Dedicated utility-scale solar plant or contracted offsite solar PPA asset sized to cover generated timetable traction-energy shortfall after on-site station/depot PV"

[charging_microgrid_unit_usd]
halt = 0
standard = 100000
major = 100000
terminal = 100000
interchange = 100000
"interchange-elevated" = 125000
"depot-terminal" = 250000

[overhead]
epc_fraction = 0.07
