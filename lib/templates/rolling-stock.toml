# Rolling stock profiles — the "consist" Lego block.
#
# A city's design.toml references one of these by id, e.g.
#     [[lines]]
#     rolling_stock = "light-metro-3car"
#
# All profiles share the same architecture (RFC 0003 §4.3, ARCHITECTURE D5):
#   - Self-contained driverless cars with onboard Na-ion traction battery
#     under the longitudinal seats
#   - Open SiC traction inverters
#   - One powered bogie + one trailer bogie per car
#   - TSN Ethernet trainbus
#   - Reference T-ECU
# The variation is in scale: cars per consist, battery kWh, platform length.
# Packs are sized for roughly one route length, not a full operating day;
# station charging at ~1 km stop spacing supplies the normal service energy.
# Capacity fields are intentionally split:
#   - seat_count = longitudinal seats / wheelchair-companion places
#   - passenger_capacity = AW2 nominal planning load (seated + standing)
#   - crush_capacity = AW3 short-duration crush load for structure/egress
#
# Unified system principle: every fleet in the OSR catalog uses one of these
# five profiles. Cities do not invent custom consists — they pick the one
# closest to their ridership band. This is what keeps maintenance, training,
# spares, and CAD reuse viable across deployments.

# ---- Tram: small city / feeder lines, < 4k pphpd --------------------------

[profiles.urban-shuttle-1car]
cars                   = 1
length_m               = 21
tare_mass_t            = 34
passenger_capacity     = 100
seat_count             = 20
crush_capacity         = 130
onboard_battery_kwh    = 120
traction_peak_kw       = 600
hvac_design_ambient_c  = 50
max_speed_mps          = 19              # 70 km/h
cad_module             = "osr_cad.rolling_stock.urban_shuttle_1car"

[profiles.tram-2car]
cars                   = 2
length_m               = 39
