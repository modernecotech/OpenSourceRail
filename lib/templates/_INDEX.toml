# Template catalog — machine + human index of every archetype, kit, and preset.
#
# The loader reads this at startup to validate references in city design.toml
# files. Humans read it as a one-page cheat sheet.
#
# Merge stack (bottom to top — later wins):
#     1. defaults.toml             (system-wide fallback)
#     2. archetype/kit/preset      (Lego block selected by city)
#     3. composition-profiles.toml (optional bundle applied via [design.profile])
#     4. city design.toml          (explicit fields)
#
# ID naming convention: kebab-case. Never duplicated across files of the same
# category. The loader errors if an id appears in two files.

[index.rolling_stock]
file = "lib/templates/rolling-stock.toml"
ids  = [
    { id = "urban-shuttle-1car", desc = "Small-town shuttle — 1-car 21 m, 120 kWh battery" },
