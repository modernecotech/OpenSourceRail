hourly = [
  0.01, 0.00, 0.00, 0.00, 0.01, 0.02,
  0.05, 0.12, 0.10, 0.05, 0.04, 0.04,
  0.05, 0.05, 0.04, 0.04, 0.08, 0.12,
  0.08, 0.05, 0.03, 0.02, 0.01, 0.00,
]
