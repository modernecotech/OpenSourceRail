# Depot archetypes — yard + workshop + crew facilities Lego block.
#
# Per RFC 0014, there are three archetypes. Every OSR deployment
# has exactly one `main-heavy`. `secondary-medium` and `layup-minimal`
# are explicit site exceptions when geography, security, or utility capacity
# prevents powered passenger-station stabling; the generator does not emit
# them by default.
#
# City design.toml references an archetype per depot site:
#
#     [[depots]]
#     station      = "east-depot"
#     archetype    = "main-heavy"
#     fleet_stalls = 4               # workshop/inspection bays, not fleet parking
#     # ...sizing overrides per §§5-7...
#
# The `fleet_stalls` field now means concurrent workshop/inspection bays:
#     bays = max(4, ceil(total_fleet × 0.15))
# Healthy sets remain on powered passenger tracks overnight. The archetype
# values below remain catalogue envelopes for local site adaptation.

[operations.turnaround_service]
# Performed at a designated powered service point; only defect/heavy work
# requires the main depot. Mobile teams can use a staffed terminal platform.
# Cleaning, release inspection/diagnostics, and low-C recharge run concurrently.
duration_seconds            = 720
peak_headway_seconds        = 180
rotation_trainsets_per_line = 0            # service uses lower-frequency windows
peak_service_enabled        = false        # peak turnback stays at normal terminal dwell
clean_interior              = true
clean_exterior_walkaround   = true
safety_release_inspection   = true
fault_log_download          = true
recharge_power_kw           = 150
recharge_target_soc         = 0.95

[operations.overnight_distributed_stabling]
# End-of-service healthy trains stable at powered passenger stations near
# their first morning trip instead of returning to a terminal depot.
# This reduces depot stall pressure and avoids later first departures at the
# far end of a line. The main-heavy still owns heavy maintenance and defect
# rectification; distributed stabling is for clean, telemetry-healthy sets.
enabled                     = true
minimum_station_power_kw    = 150
requires_grid_connection    = true
requires_cctv_monitoring    = true
requires_remote_isolation   = true
morning_start_policy        = "simultaneous-from-stabled-stations"
defect_return_policy        = "route-to-main-heavy"

# ---- Main-heavy: primary depot per deployment, with overhaul bay --------

[archetypes.main-heavy]
# One main-heavy per deployment per RFC 0014 §1. Sized below for a
# fleet; larger deployments scale by maintenance concurrency up to the
# 20-bay catalogue ceiling before a second main-heavy is needed.
default_fleet_stalls        = 4           # minimum workshop/inspection bays
max_fleet_stalls_catalog    = 20          # beyond this, add a 2nd main-heavy
workshop_m2                 = 1800        # includes overhaul bay
overhead_crane_t            = 40          # 40 t for bogie drop per RFC 0014 §5.2
pv_canopy_m2                = 4000        # per RFC 0014 §5.3
pv_nominal_kwp              = 600         # 150 W/m² nominal yield
battery_kwh                 = 2000        # Stationary LFP per RFC 0021
stabling_length_m           = 400         # four workshop/inspection roads
wheel_lathe                 = true
overhaul_bay                = true
wash_track                  = true        # automated 2-pass with water recycling
has_training_wing           = true        # opt-in, co-located per RFC 0014 §1 note
approx_footprint_m2         = 8000

# ---- Secondary-medium: 5-12 trainsets, light maintenance only ----------

[archetypes.secondary-medium]
# Deployed on long lines where daily trip-back to the main-heavy is
# uneconomic. Light maintenance only (module swap, brake-disc,
# HVAC swap); no overhaul bay, no wheel lathe — anything heavier
# rolls back to the main-heavy.
default_fleet_stalls        = 8
max_fleet_stalls_catalog    = 12
workshop_m2                 = 900
overhead_crane_t            = 12           # light module handling
pv_canopy_m2                = 1500         # per RFC 0014 §6
pv_nominal_kwp              = 225          # 150 W/m² nominal
battery_kwh                 = 500          # per RFC 0014 §6
stabling_length_m           = 800
wheel_lathe                 = false
overhaul_bay                = false
wash_track                  = false
has_training_wing           = false
approx_footprint_m2         = 2500

# ---- Layup-minimal: overnight stabling only ---------------------------

[archetypes.layup-minimal]
# Overnight parking only. No inspection pit, no wash, no workshop.
# CCTV-monitored, no on-site overnight staff. Per RFC 0014 §7.
default_fleet_stalls        = 4
max_fleet_stalls_catalog    = 6
workshop_m2                 = 0            # no workshop
overhead_crane_t            = 0
pv_canopy_m2                = 600          # per RFC 0014 §7
pv_nominal_kwp              = 90           # 150 W/m² nominal
battery_kwh                 = 150          # per RFC 0014 §7
stabling_length_m           = 300
wheel_lathe                 = false
overhaul_bay                = false
wash_track                  = false
has_training_wing           = false
approx_footprint_m2         = 1000
