# Project development choice, distinct from physical engineering acceptance.
[schema]
version = 1

[development]
primary_family = "ferrite-pm-maglev-study"
propulsion_architecture = "fixed-station-and-located-booster-lsm-with-passive-coast-sections"
primary_input = "ferrite-maglev-study.toml"
primary_runner = "tools/automation/ferrite-maglev-study.py"
status = "primary-development; engineering-acceptance-open"
selected_by = "User station-powered specification, 21 October 2026"

[objectives]
local_design_and_repair_authority = true
minimise_imported_finished_subsystems = true
local_cartridge_carrier_coil_and_guidebeam_manufacture = true
optimise_complete_manufactured_and_erected_system = true
predominantly_elevated_mainline = true
target_elevated_mainline_fraction = 0.99
prefer_straight_tangents_subject_to_feasibility = true
optimise_viaduct_cost_per_dual_route_km = true
optimise_vehicle_and_civil_mass_together = true
minimise_normal_running_gear_moving_parts = true
normal_running_rotating_traction_motors = false
normal_running_conventional_wheelsets = false
linear_electromagnetic_propulsion_required = true
all_vehicle_moving_parts_eliminated = false
retain_required_passenger_and_protection_systems = true
zero_housing_road_wildlife_impact_demonstrated = false
ordinary_guideway_target = "one-integrated-beam-per-direction-no-continuous-external-walkway"
onboard_evacuation_strategy = "vertical-spiral-chute-preferred-research; recovery-first-for-tenable-non-fire-breakdown"
walkway_removal_approved = false
concrete_only_magnetic_reaction_claimed = false
localisation_basis = "costed-local-value-added; imported-input-origin-retained"
localisation_percentage = "unknown-until-origin-traced-MBOM"
structural_gfrp_body_study = true
onboard_main_traction = false
station_zones_powered = true
interstation_traction_powered = true
interstation_continuous_powered_stator = false
junction_operation = "passenger-transfer-between-fixed-lines"
cost_scenarios = ["quantity-low", "quantity-base", "quantity-high", "local-manufacture-targets"]
cost_targets_are_quotes = false

[controls]
language = "Rust"
preferred_host = "off-the-shelf-SBC"
core_package = "osr-maglev-control"
host_example = "sbc_replay"
local_control_independent_of_occ = true
power_stage_and_isolated_io_required = true
target_timing_measured = false
physical_output_adapter_implemented = false

[release]
design_complete = false
physical_validation = false
manufacturing_release = false
physical_release = false
