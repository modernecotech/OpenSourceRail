schema = "org.opensourcerail.trainset-supplier-anchors.v1"
revision = "A-DRAFT"
status = "design-reference-not-released"
checked_on = "2026-08-30"
purpose = "Real supplier product families provide a purchasable/RFQ baseline and a reproducible interface target. They are anchors, not mandatory brands: a local equivalent is accepted only after the same controlled equivalence dossier passes."
release_boundary = "A web page is not a purchase specification. Design authority must freeze the exact supplier part number, configuration, drawings, software, evidence, commercial terms and spares through RFQ before release. Safety-critical substitutes require calculation, test, independent assessment and authority acceptance."

[equivalence]
required = [
  "same or better released fit, mounting datums, connector keying and service envelope",
  "same or better mass, load, duty-cycle, thermal, electrical and environmental ratings",
  "same or better functional safety, fire, EMC, cybersecurity and applicable rail evidence",
  "documented failure modes, maintenance intervals, spares and obsolescence route",
  "first-article inspection plus component, subassembly and vehicle regression tests",
  "signed design-authority substitution record preserving the original anchor and evidence hashes",
]

