# ===========================================================================
#                              FAULT SCENARIOS
# ===========================================================================
# Two faults fire during the run: a system-wide dust storm during AM peak
# that cuts PV output to 30% for four hours, and a depot grid-tie failure in
# mid-afternoon so we can see the depot ride through on stored energy alone.

# ------------ Wayside track-intrusion injection (RFC 0016 v3) ------------
# Exercises the full wayside→interlocking→train chain. Each fault
# below emits a `SectionIntrusion` consensus entry on the named
# section; the interlocking withholds MA to any train that needs to
# cross that section until the fault clears (and a Clear verdict is
# emitted on the following tick).

[[faults]]
name = "Line 1 fwd section 1001 — confirmed intrusion"
kind = "wayside_intrusion"
from = "07:00"
to = "07:30"
section_id = 1001
intrusion_state = "present"

[[faults]]
name = "Line 1 fwd section 1002 — sensor offline (Unknown)"
kind = "wayside_intrusion"
from = "08:00"
to = "08:30"
section_id = 1002
intrusion_state = "unknown"

[[faults]]
name = "Line 1 reverse section 2001 — intrusion on reverse-direction"
kind = "wayside_intrusion"
from = "09:00"
to = "09:15"
section_id = 2001
intrusion_state = "present"
