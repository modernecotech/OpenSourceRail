# Samawah with wayside track-intrusion injection (RFC 0016 v3).
#
# Same topology and fleet as designs/west-asia/Iraq/Samawah/samawah.toml. Demonstrates the
# full wayside→interlocking→train safety chain: the sim injects a
# `SectionIntrusion` log entry at the stated time, the interlocking's
# gate (d) picks it up via `section_intrusion_permits`, and any train
# needing to cross the affected section is prevented from entering.
#
# Three staged events across the morning peak:
#
#   - 07:00–07:30 : Present intrusion on section 1001 (Line 1 fwd) —
#                    expect Line 1 fleet to back up behind it.
#   - 08:00–08:30 : Unknown on section 1002 — fail-restrictive: MA
#                    withheld even though no hazard is confirmed.
#   - 09:00–09:15 : Present on section 2001 (Line 1 reverse) — exercises
#                    the gate on reverse-direction sections too.
#
# Run:
#   cargo run --release --bin osr-sim -- \
#       --config designs/west-asia/Iraq/Samawah/samawah-wayside-intrusion.toml \
#       --duration 18000 --status-every 1800

[scenario]
name = "Samawah — wayside intrusion injection (RFC 0016 v3)"
start_time = "06:00"

[climate]
ambient_c = 42.0
peak_sun_hours = 6.0

