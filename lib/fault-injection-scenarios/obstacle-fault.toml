# Samawah with onboard obstacle-detect fault injection (RFC 0015).
#
# Same topology and fleet as cities/catalogue/west-asia/Iraq/Samawah/samawah.toml. Exercises the five
# O-series safety properties of osr-obstacle-detect through four staged
# sensor failures across the morning peak:
#
#   - 07:00–08:00 : LIDAR dies on train T1 → expect RestrictedSpeed (O4b)
#                    verdict ticks on T1; ATO caps at 40 km/h.
#   - 08:30–09:00 : ultrasonic channel 2 stale fleet-wide → expect
#                    EmergencyBrake (O2) across every trainset's shadow.
#   - 09:30–10:00 : peer 2oo2 disagreement on train T3 → expect
#                    EmergencyBrake (O3) verdict ticks on T3.
#   - 10:30–11:00 : LIDAR + radar both offline fleet-wide at mainline
#                    speed → expect EmergencyBrake (O4a) everywhere.
#
# End-of-run summary prints the per-verdict tick counts under
# "Onboard shadow stack (SIL-4 monitors)".
#
# Run:
#   cargo run --release --bin osr-sim -- \
#       --config cities/catalogue/west-asia/Iraq/Samawah/samawah-obstacle-fault.toml \
#       --duration 18000 --status-every 1800

[scenario]
name = "Samawah — obstacle-detect fault injection (RFC 0015)"
start_time = "06:00"

[climate]
ambient_c = 42.0
peak_sun_hours = 6.0

