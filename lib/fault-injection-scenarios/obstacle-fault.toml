# ===========================================================================
#                              FAULT SCENARIOS
# ===========================================================================
# Two faults fire during the run: a system-wide dust storm during AM peak
# that cuts PV output to 30% for four hours, and a depot grid-tie failure in
# mid-afternoon so we can see the depot ride through on stored energy alone.

# ------------ Onboard obstacle-detect sensor faults (RFC 0015) ------------
# Exercises the five O-series safety properties of osr-obstacle-detect.

[[faults]]
name = "T1 LIDAR dies during AM peak"
kind = "lidar_offline"
from = "07:00"
to = "08:00"
train = "T1"                        # scoped to one train; omit for fleet

[[faults]]
name = "fleet-wide ultrasonic ch 2 stale"
kind = "ultrasonic_channel_stale"
from = "08:30"
to = "09:00"
channel = 2                         # 0..=3 — the four nose transducers

[[faults]]
name = "T3 peer cross-check disagreement"
kind = "obstacle_peer_disagreement"
from = "09:30"
to = "10:00"
train = "T3"

[[faults]]
name = "fleet LIDAR + radar simultaneously down"
kind = "lidar_offline"
from = "10:30"
to = "11:00"                        # (fleet-wide by default)

[[faults]]
name = "fleet radar simultaneously down"
kind = "radar_offline"
from = "10:30"
to = "11:00"
