# Scale-test city list — one city per continent / climate regime, covering
# the full topology + cost-surface regime space.
#
# This is the stepping stone between the 3-city calibration set and the
# 500-city production batch. Every city here has a hand-tuned bbox so a
# failed pull can be diagnosed quickly. Once this set produces clean
# designs across the board, the 500-city list can be generated
# programmatically from GeoNames (see osr_batch.geonames_import).
#
# Selection criteria:
#   - ≥ 1 city per inhabited continent
#   - ≥ 1 city per climate preset (hot-desert, tropical-wet,
#     tropical-arid, temperate-continental, mediterranean, cold-continental)
#   - Size range: 400k (single-radial) → 15M (hub-and-spoke-dual-ring)
#
# Cities here may include ones that already operate metro/tram/LRT
# (Lyon, Tunis). Those are kept deliberately as solver test targets —
# their rich OSM data exercises bridge/tunnel classification and
# dense-anchor routing. The production 500-city scan
# (osr-cities-scan, default behaviour) excludes them via
# osr_batch/existing_transit.py.
#
# ---------------------------------------------------------------------------
# POPULATION SOURCE-OF-TRUTH POLICY
# ---------------------------------------------------------------------------
# This file is the **canonical source for population** across the OSR
# pipeline. Every design.toml emitted by `osr-design` must use the
# population from this catalogue.
#
# Definition of "population" — the **served catchment of a light-metro
# network**. That means the **broadest administrative unit the metro is
# designed to serve**, including suburban + rural portions of the
# subdistrict / canton / governorate / agglomeration / metropolitan
# area, not the city-proper municipality. Samawah's 373,770 is the
# subdistrict total (urban 256,689 + rural 117,081). Baghdad's
# 9,780,429 is the governorate, not the city limits (7,837,463). Cuenca
# is the canton total (817,100), not the urban core (361,524). This
# matters because the rolling-stock family band in RFC 0008 §5
# (≤ 300k → tram-2car, 300k–1M → light-metro-3car, 1M–3M →
# metro-4car, ≥ 3M → metro-6car) selects the consist that fits the
# *served* ridership.
#
# Sources are national-statistics offices (INSEE, INEC, INS, KNBS,
# COSIT) or the most recent census, verified against
# citypopulation.de which integrates national-stat-office census
# releases. Wikipedia is NOT used as a primary source — its city
# figures are routinely stale or conflate municipality vs metro.
#
# When updating: bump `population` AND `population_unit` AND
# `population_source` AND `population_source_year` together. Re-run
# `cargo run --bin osr-design -- --slug <slug> ...` to propagate to
# the city's design.toml.
# ---------------------------------------------------------------------------

# ---- Middle East + North Africa --------------------------------------

[[cities]]
slug                    = "samawah"
country                 = "IQ"
continent               = "middle-east"
population              = 373770
population_unit         = "As-Samawah Subdistrict (urban 256,689 + rural 117,081)"
population_source       = "Iraq 2024 General Population Census; via citypopulation.de/en/iraq/mun/admin/al_muthannā/32011__as_samāwah"
population_source_year  = 2024
climate                 = "hot-desert"
profile                 = "mid-city-desert"
bbox                    = { south = 31.27, west = 45.24, north = 31.35, east = 45.32 }

[[cities]]
slug                    = "baghdad"
country                 = "IQ"
continent               = "middle-east"
population              = 9780429
population_unit         = "Baghdad Governorate (city 7,837,463 + surrounding governorate population)"
population_source       = "Iraq 2024 General Population Census; via citypopulation.de/en/iraq/cities"
population_source_year  = 2024
climate                 = "hot-desert"
profile                 = "mega-city-desert"
# Bbox extended south + east 2026-04-26 to cover Basmaya New City
# (~33.18 °N, 44.62 °E — was clipped at the SE corner) and the
# Diyala-side suburbs SE of Al-Madain.
bbox                    = { south = 33.05, west = 44.20, north = 33.50, east = 44.75 }

[[cities]]
slug                    = "tunis"
country                 = "TN"
continent               = "north-africa"
population              = 2900000
population_unit         = "Grand Tunis (Tunis + Ariana + Manouba + Ben Arous governorates)"
population_source       = "Recensement Général de la Population et de l'Habitat 2024; INS Tunisia"
population_source_year  = 2024
climate                 = "mediterranean"
profile                 = "large-city-tropical"
bbox                    = { south = 36.76, west = 10.12, north = 36.86, east = 10.24 }

