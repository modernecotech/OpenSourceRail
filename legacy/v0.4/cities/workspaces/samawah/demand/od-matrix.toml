schema_version = 1

# Planning periods are deterministic inputs. OD flows are added and reviewed in
# City Studio; no observed passenger counts are implied by an empty flow list.
[[periods]]
id = "weekday-am"
name = "Weekday AM peak"
day_type = "weekday"
from = "07:00"
to = "09:00"

[[periods]]
id = "weekday-pm"
name = "Weekday PM peak"
day_type = "weekday"
from = "15:00"
to = "17:00"

[[periods]]
id = "friday-midday"
name = "Friday midday"
day_type = "friday"
from = "11:00"
to = "14:00"

[[periods]]
id = "weekend-day"
name = "Weekend daytime"
day_type = "weekend"
from = "09:00"
to = "18:00"
