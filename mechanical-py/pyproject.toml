# mechanical-py — parametric mechanical + civil + station catalogue for OSR.
#
# Every component in the OpenSourceRail physical catalogue is expressed as
# parametric Python CAD source. One Python function per component takes the
# RFC-level parameters (span, platform length, consist family, ...) as keyword
# arguments and returns a CAD part or assembly.
#
# The persistent review artifacts are FreeCAD documents generated from
# the same source geometry, so the repository stays compact
# while the Python source remains the canonical design authority.
#
# See README.md for the design philosophy (prefabricated, bolt-together,
# minimal on-site work) and the FreeCAD scripts for regenerating review
# artifacts under `catalog/freecad/`.

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "osr-mechanical-py"
version         = "0.1.0"
description     = "OSR parametric mechanical / civil / station catalogue."
requires-python = ">=3.11"
license         = { text = "Apache-2.0" }

dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[project.scripts]
osr-freecad-trainset = "osr_mech.freecad_trainset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
