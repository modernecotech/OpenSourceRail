[package]
name = "osr-sim"
description = "OpenSourceRail — time-stepped simulator for urban rail networks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "osr-sim"
path = "src/main.rs"

[[bin]]
name = "osr-vis"
path = "src/bin/vis.rs"

[lints]
workspace = true

[dependencies]
osr-analytics = { path = "../osr-analytics" }
osr-afc = { path = "../osr-afc" }
osr-afc-backoffice = { path = "../osr-afc-backoffice" }
osr-ato = { path = "../osr-ato" }
osr-atp = { path = "../osr-atp" }
osr-aux-power = { path = "../osr-aux-power" }
osr-balise = { path = "../osr-balise" }
osr-bms = { path = "../osr-bms" }
osr-brake = { path = "../osr-brake" }
osr-cbm-onboard = { path = "../osr-cbm-onboard" }
osr-cbm-backend = { path = "../osr-cbm-backend" }
osr-consensus = { path = "../osr-consensus" }
osr-core = { path = "../osr-core" }
osr-crypto = { path = "../osr-crypto" }
osr-derailment = { path = "../osr-derailment" }
osr-door-control = { path = "../osr-door-control" }
osr-event-recorder = { path = "../osr-event-recorder" }
osr-fire-safety = { path = "../osr-fire-safety" }
osr-hvac = { path = "../osr-hvac" }
osr-hot-axle = { path = "../osr-hot-axle" }
osr-hot-axle-wayside = { path = "../osr-hot-axle-wayside" }
osr-historian = { path = "../osr-historian" }
osr-interlocking = { path = "../osr-interlocking" }
osr-intrusion-detect = { path = "../osr-intrusion-detect" }
osr-lighting = { path = "../osr-lighting" }
osr-obstacle-detect = { path = "../osr-obstacle-detect" }
osr-odometry = { path = "../osr-odometry" }
osr-passenger-assist = { path = "../osr-passenger-assist" }
osr-pis-onboard = { path = "../osr-pis-onboard" }
osr-pis-station = { path = "../osr-pis-station" }
osr-psd = { path = "../osr-psd" }
osr-ptp = { path = "../osr-ptp" }
osr-secbus = { path = "../osr-secbus" }
osr-t2g = { path = "../osr-t2g" }
osr-tcms = { path = "../osr-tcms" }
osr-station-scada = { path = "../osr-station-scada" }
osr-traction = { path = "../osr-traction" }
osr-tcn = { path = "../osr-tcn" }
osr-tvm = { path = "../osr-tvm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
