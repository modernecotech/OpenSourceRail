<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OSR Sim GUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- trunk picks up this link to build the WASM bundle. -->
  <link data-trunk rel="rust" href="../Cargo.toml" data-cargo-no-default-features data-wasm-opt="z" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #15161c;
      color: #e8e8ec;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 14px;
      color: #9a9ba5;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #15161c;
    }
  </style>
</head>
<body>
  <div id="loading">Loading OSR Sim GUI…</div>
  <canvas id="osr_sim_canvas" role="application" aria-label="OpenSourceRail simulator GUI"></canvas>
  <script type="module">
    const context = Object.fromEntries(new URLSearchParams(location.search));
    window.__OSR_FRONTEND__ = { app: 'simulator', ready: false, error: null, context };
    window.addEventListener('message', (event) => {
      if (event.origin === location.origin && event.data?.type === 'osr:context') {
        Object.assign(context, event.data.context || {});
      }
    });
    (async () => {
      try {
        if (!window.wasmBindings) {
          await new Promise((resolve) =>
            window.addEventListener('TrunkApplicationStarted', resolve, { once: true })
          );
        }
        const details = JSON.parse(
          await window.wasmBindings.start_web(document.getElementById('osr_sim_canvas'))
        );
        document.getElementById('loading').style.display = 'none';
        window.__OSR_FRONTEND__.ready = true;
        window.__OSR_FRONTEND__.details = details;
        if (!/^run-[a-f0-9]{16}$/.test(context.run_id || '')) {
          const input = `${context.city || ''}\0${context.revision || ''}\0${details.durationS}`;
          const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
          context.run_id = `run-${[...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, '0')).join('').slice(0, 16)}`;
        }
        context.mode = 'simulation';
        window.parent?.postMessage({ type: 'osr:context', context }, location.origin);
      } catch (error) {
        window.__OSR_FRONTEND__.error = String(error?.stack || error);
        throw error;
      }
    })();
  </script>
</body>
</html>
