[package]
name = "osr-runtime"
description = "Thin process hosts for existing OpenSourceRail consensus, interlocking and onboard evaluators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
[lints]
workspace = true
[dependencies]
osr-core = { path = "../osr-core" }
osr-interlocking = { path = "../osr-interlocking" }
osr-consensus = { path = "../osr-consensus" }
osr-atp = { path = "../osr-atp" }
osr-ato = { path = "../osr-ato" }
osr-brake = { path = "../osr-brake" }
osr-proto = { path = "../osr-proto" }
osr-secbus = { path = "../osr-secbus" }
osr-crypto = { path = "../osr-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
postcard = { version = "1", features = ["alloc", "use-std"] }
