[package]
name        = "osr-alignment"
version     = "0.2.0"
edition     = "2021"
description = "Horizontal + vertical alignment artefact — civil-contractor-stakeable geometry derived from osr-routing polylines."
license     = "Apache-2.0"

[lib]

[[bin]]
name = "osr-alignment-export"
path = "src/main.rs"

[dependencies]
osr-core = { path = "../osr-core" }
osr-routing = { path = "../osr-routing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
