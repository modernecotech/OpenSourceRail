[package]
name        = "osr-alignment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Horizontal + vertical alignment artefact — civil-contractor-stakeable geometry derived from osr-routing polylines."
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]

[[bin]]
name = "osr-alignment-export"
path = "src/main.rs"

[dependencies]
osr-core = { path = "../osr-core" }
osr-routing = { path = "../osr-routing" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
