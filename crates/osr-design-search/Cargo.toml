[package]
name = "osr-design-search"
default-run = "osr-design-search"
description = "Bounded deterministic proposal generation and compact Pareto search kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python-extension = ["dep:pyo3", "pyo3/extension-module"]
columnar = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]

[[bin]]
name = "osr-campaign-columnar"
path = "src/bin/osr-campaign-columnar.rs"
required-features = ["columnar"]

[[bin]]
name = "osr-campaign-case-v2-preview"
path = "src/bin/osr-campaign-case-v2-preview.rs"
required-features = ["columnar"]

[[bin]]
name = "osr-campaign-case-nodes"
path = "src/bin/osr-campaign-case-nodes.rs"
required-features = ["columnar"]

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
pyo3 = { version = "=0.27.2", optional = true }
arrow-array = { version = "60.1.0", optional = true }
arrow-schema = { version = "60.1.0", optional = true }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"], optional = true }
