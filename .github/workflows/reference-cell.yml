name: v0.6 sourced reference-cell engineering
on:
  push:
    branches: [main]
    paths: ["engineering/design_search/**", "engineering/railway_twin/**", "engineering/station_rail/**", "engineering/development_baseline/**", "engineering/development-baseline.toml", "engineering/requirements.txt", "engineering/component_registry/**", "engineering/reference_cell/**", "services/integration/osr_integration/reference_cell.py", "campaigns/sourced-reference-cell.toml", "docs/design-engine/reference-cell/**", "osr-cell", "tools/automation/reference-cell-geometry.py", ".github/workflows/reference-cell.yml", "!engineering/station_rail/force_evidence.py", "!tests/test_force_evidence.py", "!campaigns/v07-execution.json", "!docs/design-engine/v07-execution/**", "!engineering/city_reports/planning-policy.json", "!tests/test_city_dossier_analysis.py", "!engineering/development_baseline/tests/test_performance_storage.py"]
  pull_request:
    paths: ["engineering/design_search/**", "engineering/railway_twin/**", "engineering/station_rail/**", "engineering/development_baseline/**", "engineering/development-baseline.toml", "engineering/requirements.txt", "engineering/component_registry/**", "engineering/reference_cell/**", "services/integration/osr_integration/reference_cell.py", "campaigns/sourced-reference-cell.toml", "docs/design-engine/reference-cell/**", "osr-cell", "tools/automation/reference-cell-geometry.py", ".github/workflows/reference-cell.yml", "!engineering/station_rail/force_evidence.py", "!tests/test_force_evidence.py", "!campaigns/v07-execution.json", "!docs/design-engine/v07-execution/**", "!engineering/city_reports/planning-policy.json", "!tests/test_city_dossier_analysis.py", "!engineering/development_baseline/tests/test_performance_storage.py"]
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 0"
permissions:
  contents: read
jobs:
  retired-native-reference:
    name: Recorded motor refinement under exact 3bf38a5 producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3bf38a501d09fa3a3c2dd6f4731be11828d04f55
      - run: test "$(git rev-parse HEAD)" = 3bf38a501d09fa3a3c2dd6f4731be11828d04f55
      - run: git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: .venv/bin/pip install --requirement engineering/requirements.txt numpy==2.3.5
      - name: Original-source numerical integrity only; no current evaluator admission
        run: .venv/bin/python -c "from engineering.reference_cell.native_evidence import verify_publication; print(verify_publication('docs/design-engine/reference-cell'))"
  definitions-and-replay:
    needs: retired-native-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin 3bf38a501d09fa3a3c2dd6f4731be11828d04f55
      - run: git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest --requirement engineering/requirements.txt
      - name: Pin NumPy for exact current-cell replay
        run: .venv/bin/pip install numpy==2.3.5
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/component_registry/tests engineering/reference_cell/tests
      - name: Recompute equipped candidates, civil, manufacturing, costs and explicit holds
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin 946f1772540d07af85b57b0d13cac08a3293b140
          .venv/bin/python -m engineering.railway_twin.retained prefetch cell
          .venv/bin/python -m engineering.railway_twin.retained verify cell --state "$RUNNER_TEMP/osr-retained-cell-check"
      - name: Preserve exact original motor bytes without current-source admission
        run: |
          .venv/bin/python - <<'PY'
          import hashlib, pathlib, subprocess
          for name in ('native-motor-refinement-manifest.json', 'native-motor-refinement.tar.gz'):
              path = 'docs/design-engine/reference-cell/' + name
              original = subprocess.check_output(['git', 'show', '3bf38a501d09fa3a3c2dd6f4731be11828d04f55:' + path])
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).digest() == hashlib.sha256(original).digest(), path
          print('Retired numerical references preserved; original-source verification is a separate required job.')
          PY
      - name: Reopen all five actual IFC assemblies
        run: .venv/bin/python tools/automation/reference-cell-geometry.py verify --output docs/design-engine/reference-cell
      - name: Preserve a fresh bounded generation request
        run: ./osr-cell run --state build/reference-cell-ci --max-cases 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sourced-reference-cell-methods-and-open-evidence
          path: |
            build/reference-cell-ci/
            ${{ runner.temp }}/osr-retained-cell-check/receipt.json
            ${{ runner.temp }}/osr-retained-cell-check/stdout.json
            ${{ runner.temp }}/osr-retained-cell-check/stderr.txt
          retention-days: 14
