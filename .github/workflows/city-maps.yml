name: Offline city map context
on:
  push:
    branches: [main]
    paths: ['engineering/city_maps/**', 'engineering/city_reports/**', 'cities/catalogue/**/city.json', 'cities/catalogue/**/*.corridor.geojson', 'cities/catalogue/**/map-context.json.gz', 'cities/catalogue/**/engineering/outline/network.svg', 'cities/catalogue/**/engineering/outline/manifest.json', 'docs/design-engine/city-dossiers/index.json', 'docs/design-engine/city-dossiers/manifest.json', 'tools/automation/check-city-maps.py', '.github/workflows/city-maps.yml']
  pull_request:
    paths: ['engineering/city_maps/**', 'engineering/city_reports/**', 'cities/catalogue/**/city.json', 'cities/catalogue/**/*.corridor.geojson', 'cities/catalogue/**/map-context.json.gz', 'cities/catalogue/**/engineering/outline/network.svg', 'cities/catalogue/**/engineering/outline/manifest.json', 'docs/design-engine/city-dossiers/index.json', 'docs/design-engine/city-dossiers/manifest.json', 'tools/automation/check-city-maps.py', '.github/workflows/city-maps.yml']
permissions:
  contents: read
jobs:
  current-context-and-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r engineering/city_maps/requirements.txt pytest==9.1.1
      - run: python -m pytest -q engineering/city_maps/tests
      - name: Verify current city layers offline
        run: python tools/automation/check-city-maps.py
