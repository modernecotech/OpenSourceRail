name: Open factory programme verification
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'engineering/industrialisation/**'
      - 'engineering/analysis/tests/test_factory_modernisation.py'
      - 'design/component-catalogue/src/osr_mech/**'
      - 'lib/templates/trainset-manufacturing-methods.toml'
      - 'tools/automation/factory-modernisation.py'
      - 'tools/automation/factory-fixture-freecad.py'
      - 'docs/rolling-stock/industrialisation-expansion-plan.md'
      - 'docs/standards/OSR-MFG-001.md'
      - '.github/workflows/factory-modernisation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .:design/component-catalogue/src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 numpy==2.3.5 scipy==1.16.3 jsonschema==4.25.1
      - run: python -m pytest -q engineering/analysis/tests/test_factory_modernisation.py
      - run: |
          python tools/automation/factory-modernisation.py generate --output build/engineering/factory-ci
          python tools/automation/factory-modernisation.py verify --output build/engineering/factory-ci
