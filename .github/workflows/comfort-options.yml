name: "Retained research: Seat-led comfort evidence"
on:
  push:
    paths: ['engineering/comfort_options/**', 'docs/design-engine/ferrite-maglev/comfort-options/**', 'docs/workbench/trip/readiness/comfort/**', 'tools/automation/tests/verify-comfort-options.mjs', '.github/workflows/comfort-options.yml']
  pull_request:
    paths: ['engineering/comfort_options/**', 'docs/design-engine/ferrite-maglev/comfort-options/**', 'docs/workbench/trip/readiness/comfort/**', 'tools/automation/tests/verify-comfort-options.mjs', '.github/workflows/comfort-options.yml']
permissions:
  contents: read
jobs:
  comfort:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r engineering/trip_dynamics/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pytest --import-mode=importlib -q engineering/comfort_options/tests
      - run: python -m engineering.comfort_options verify
      - run: node tools/automation/tests/verify-comfort-options.mjs build/comfort-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfort-browser
          path: build/comfort-browser
