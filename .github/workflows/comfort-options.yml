name: "Retained research: Seat-led comfort evidence"
on:
  push:
    paths: ['engineering/comfort_options/**', 'docs/design-engine/ferrite-maglev/comfort-options/**', 'docs/workbench/trip/readiness/comfort/**', 'tools/automation/tests/verify-comfort-options.mjs', '.github/workflows/comfort-options.yml', 'engineering/research_context.py', 'engineering/research_test_support.py', 'engineering/research_ancestry.py', 'tools/automation/verify-research-snapshot.py']
  pull_request:
    paths: ['engineering/comfort_options/**', 'docs/design-engine/ferrite-maglev/comfort-options/**', 'docs/workbench/trip/readiness/comfort/**', 'tools/automation/tests/verify-comfort-options.mjs', '.github/workflows/comfort-options.yml', 'engineering/research_context.py', 'engineering/research_test_support.py', 'engineering/research_ancestry.py', 'tools/automation/verify-research-snapshot.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comfort:
    name: Current research software compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact retained producer source required by offline ancestry checks
        run: |
          git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
          git cat-file -e 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r engineering/trip_dynamics/requirements.txt
      - run: python -m pytest --import-mode=importlib -q engineering/comfort_options/tests
  historical-publication:
    name: Historical comfort-options publication (exact source replay)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: historical
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Read the retained publication contract and source guard
        uses: actions/checkout@v4
        with:
          path: current
          sparse-checkout: |
            /tools/automation/verify-research-snapshot.py
            /docs/design-engine/ferrite-maglev/comfort-options/manifest.json
          sparse-checkout-cone-mode: false
      - name: Check out the exact publication-origin source and payloads
        uses: actions/checkout@v4
        with:
          ref: f0946b699376699b408df6e9a1f04a657f74022b
          path: historical
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify every historical source and payload byte before execution
        run: python ../current/tools/automation/verify-research-snapshot.py --packet comfort-options --repository . --receipt-root ../current --output build/comfort-options-provenance.json
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r engineering/trip_dynamics/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Replay the source-bound comfort publication
        run: python -m engineering.comfort_options verify
      - run: node tools/automation/tests/verify-comfort-options.mjs build/comfort-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-comfort-options-replay
          path: |
            historical/build/comfort-options-provenance.json
            historical/build/comfort-browser/
          retention-days: 14
