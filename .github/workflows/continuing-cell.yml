name: v0.6 continuing numerical reference cell
on:
  push:
    branches: [main]
    paths: ["engineering/station_rail/**", "engineering/railway_progress/**", "engineering/reference_cell/**", "engineering/component_registry/**", "engineering/development_baseline/**", "engineering/development-baseline.toml", "engineering/design_search/**", "engineering/railway_twin/**", "engineering/requirements.txt", "campaigns/**", "osr", "osr-cell", "osr-twin", "services/integration/osr_integration/reference_cell.py", "docs/design-engine/continuing-cell/**", "docs/design-engine/digital-twin/README.md", "docs/design-engine/ferrite-maglev/comfort-design/design.json.gz", "docs/design-engine/ferrite-maglev/comfort-design/manifest.json", "engineering/sourcing/data/iraq-domestic-2026-july.json", ".github/workflows/continuing-cell.yml"]
  pull_request:
    paths: ["engineering/station_rail/**", "engineering/railway_progress/**", "engineering/reference_cell/**", "engineering/component_registry/**", "engineering/development_baseline/**", "engineering/development-baseline.toml", "engineering/design_search/**", "engineering/railway_twin/**", "engineering/requirements.txt", "campaigns/**", "osr", "osr-cell", "osr-twin", "services/integration/osr_integration/reference_cell.py", "docs/design-engine/continuing-cell/**", "docs/design-engine/digital-twin/README.md", "docs/design-engine/ferrite-maglev/comfort-design/design.json.gz", "docs/design-engine/ferrite-maglev/comfort-design/manifest.json", "engineering/sourcing/data/iraq-domestic-2026-july.json", ".github/workflows/continuing-cell.yml"]
  workflow_dispatch:
  schedule:
    - cron: "45 6 * * 0"
permissions:
  contents: read
jobs:
  retired-native-reference:
    name: Recorded structural and motor methods under exact 3bf38a5 producer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3bf38a501d09fa3a3c2dd6f4731be11828d04f55
      - run: test "$(git rev-parse HEAD)" = 3bf38a501d09fa3a3c2dd6f4731be11828d04f55
      - run: git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
      - run: python -m venv .venv
      - run: .venv/bin/pip install --requirement engineering/requirements.txt numpy==2.3.5
      - name: Original-source numerical integrity only; no current evaluator admission
        run: ./osr design progress verify-methods
  numerical-generation-and-replay:
    needs: retired-native-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin 3bf38a501d09fa3a3c2dd6f4731be11828d04f55
      - run: git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.16"
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest --requirement engineering/requirements.txt
      - name: Pin numerical post-processing to the recorded method environment
        run: .venv/bin/pip install numpy==2.3.5
      - name: Preserve environment and source drift diagnostics before verification
        run: |
          mkdir -p build/continuing-cell-ci-diagnostics
          .venv/bin/python - <<'PY'
          import json, pathlib, platform
          import numpy
          from engineering.railway_progress.coordinator import sources
          expected = json.loads(pathlib.Path('docs/design-engine/continuing-cell/manifest.json').read_text())['source_sha256']
          actual = sources()
          drift = {name: {'published': expected.get(name), 'current': actual.get(name)}
                   for name in sorted(expected.keys() | actual.keys()) if expected.get(name) != actual.get(name)}
          path = pathlib.Path('build/continuing-cell-ci-diagnostics/source-check.json')
          path.write_text(json.dumps({'python': platform.python_version(), 'numpy': numpy.__version__, 'source_drift': drift}, indent=2) + '\n')
          PY
      - name: Conditional engineering and adversarial evidence contracts
        run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/railway_progress/tests
      - name: Reconstruct all physical candidates, trajectories, production and civil loads
        shell: bash
        run: ./osr design progress verify-publication 2>&1 | tee build/continuing-cell-ci-diagnostics/publication-verification.log
      - name: Preserve exact original method bytes without current-source admission
        run: |
          .venv/bin/python - <<'PY'
          import hashlib, pathlib, subprocess
          for name in ('native-methods.json', 'native-methods.tar.gz'):
              path = 'docs/design-engine/continuing-cell/' + name
              original = subprocess.check_output(['git', 'show', '3bf38a501d09fa3a3c2dd6f4731be11828d04f55:' + path])
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).digest() == hashlib.sha256(original).digest(), path
          print('Retired numerical references preserved; original-source verification is a separate required job.')
          PY
      - name: Preserve a fresh bounded generation request
        run: ./osr design progress run --state build/continuing-cell-ci --max-cases 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuing-cell-numerical-executions
          path: |
            build/continuing-cell-ci/
            build/continuing-cell-ci-diagnostics/
          retention-days: 14
