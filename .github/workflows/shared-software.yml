name: Shared software and control contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-shared-software:
    name: Shared workspace and retained research regressions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact retained producer source required by offline ancestry checks
        run: |
          git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
          git cat-file -e 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164^{commit}
      - name: Fetch the pinned source revision for retained packet hash checks
        run: |
          git fetch --no-tags --depth=1 origin 578ee3950b872bf30fbf9e4207b2bda85951bdd7
          git cat-file -e 578ee3950b872bf30fbf9e4207b2bda85951bdd7^{commit}
      - name: Fetch the exact retired demonstrator reference for offline integrity checks
        run: |
          git fetch --no-tags --depth=1 origin 3bf38a501d09fa3a3c2dd6f4731be11828d04f55:refs/osr/retired-station-reference
          git cat-file -e 3bf38a501d09fa3a3c2dd6f4731be11828d04f55^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt,clippy
      - run: python -m pip install pytest -r engineering/requirements.txt
      - name: Enforce historical and current CI separation
        run: |
          python tools/automation/tests/test_ci_architecture.py
          python tools/automation/tests/test_doc_index.py
          python tools/automation/tests/test_research_snapshot.py
          python tools/automation/tests/test_historical_apt.py
          python tools/automation/tests/test_historical_replay.py
      - name: Fail-closed pinned tool download and fallback contracts
        run: python -m pytest -q tests/test_pinned_tool_download.py
      - name: Explicit research family, ancestry and portable fixture contracts
        run: python -m pytest -q --import-mode=importlib engineering/development_baseline/tests/test_research_context.py engineering/development_baseline/tests/test_research_portability.py
      - name: Source geometry and engineering model export integrity
        run: python -m pytest -q --import-mode=importlib engineering/visual_models/tests
      - name: CAD gallery identity and complete native FEM field integrity
        run: python -m pytest -q --import-mode=importlib tests/test_engineering_gallery_cad.py tests/test_engineering_gallery_fem.py tests/test_engineering_gallery_publication.py
      - name: Chair material geometry, independent feature probes and saved native evidence
        run: python -m pytest -q --import-mode=importlib tests/test_chair_installation.py tests/test_chair_native_geometry.py tests/test_chair_native_probes.py tests/test_chair_r4_publication.py
      - name: Terminal fabrication material and saved native evidence
        run: python -m pytest -q --import-mode=importlib tests/test_terminal_frame_publication.py
      - name: Installed research assembly, material ownership and counterpart contracts
        run: >-
          python -m pytest -q --import-mode=importlib
          tests/test_railway_vehicle_composition.py
          tests/test_terminal_installation.py tests/test_terminal_component.py
          tests/test_terminal_hardware.py
          tests/test_terminal_welds.py
          tests/test_terminal_revision.py
          tests/test_hardware_component.py
          tests/test_chair_p6_counterparts.py
          tests/test_header_steel_joint.py tests/test_header_component.py
      - name: Current city atlas identity and journey contracts
        run: |
          python -m pytest -q tests/test_city_atlas.py tests/test_city_atlas_api.py tests/test_city_dossier_analysis.py tests/test_city_dossier_maps.py tests/test_city_report_publication.py
          node tools/automation/tests/test-city-journeys.mjs
      - name: Canonical streaming identity parity
        run: python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_canonical_stream.py
      - name: Rust generative search and source-bound Python integration
        run: |
          python -m engineering.design_search.native_search build
          cargo fmt --package osr-design-search -- --check
          cargo clippy --locked -p osr-design-search --all-targets -- -D warnings
          python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_native_search.py engineering/design_search/tests/test_native_campaign.py engineering/design_search/tests/test_topology_mutation.py engineering/design_search/tests/test_topology_revision.py engineering/design_search/tests/test_search_archive.py engineering/design_search/tests/test_native_refinement.py engineering/design_search/tests/test_search_feedback.py engineering/design_search/tests/test_axial_analysis.py engineering/design_search/tests/test_invocation_cache.py engineering/design_search/tests/test_frame_analysis.py engineering/design_search/tests/test_frame_refinement.py engineering/design_search/tests/test_frame_native.py
      - name: Civil and station demonstrator identity and evidence handoffs
        run: python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_civil_demonstrator.py engineering/design_search/tests/test_station_demonstrator.py
      - name: Actual-wall torsion fields, bounded workers and same-candidate frame refinement
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_section_torsion.py engineering/design_search/tests/test_section_torsion_job.py engineering/design_search/tests/test_frame_section_refinement.py engineering/design_search/tests/test_solid_torsion_native.py
      - name: Efficient serialization and complete searched-candidate delivery handoffs
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_campaign_serialization.py engineering/design_search/tests/test_campaign_benchmark_cohort.py engineering/design_search/tests/test_search_geometry.py engineering/design_search/tests/test_search_delivery.py
      - name: Retained v0.5 source and packet portability
        run: python tools/automation/tests/verify-maglev-sources.py
      - name: Retained offline-host compatibility contracts
        run: python tools/automation/validate-host-manifests.py
      - name: Current shared workspace unit tests
        run: cargo test --locked --workspace --all-targets
      - name: Retained maglev controller unit tests
        run: cargo test --locked -p osr-maglev-control --all-targets
      - name: Retained maglev controller without default features
        run: cargo check --locked -p osr-maglev-control --no-default-features
      - name: Retained maglev controller formatting
        run: cargo fmt --package osr-maglev-control -- --check
      - name: Retained maglev controller lint
        run: cargo clippy -p osr-maglev-control --all-targets -- -D warnings
      - name: Retained offline normal-wrench observer prototype
        run: |
          cargo fmt --manifest-path engineering/ferrite_maglev/observer-prototype/Cargo.toml -- --check
          cargo clippy --locked --manifest-path engineering/ferrite_maglev/observer-prototype/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path engineering/ferrite_maglev/observer-prototype/Cargo.toml --all-targets
          python engineering/ferrite_maglev/observer-prototype/tests/differential.py
      - name: Retained baseline-independent numerical method controls
        run: >-
          python -m pytest -q --import-mode=importlib
          engineering/analysis/tests/test_ferrite_maglev_coupled.py::test_fe_point_load_and_modal_frequencies_have_independent_controls
          engineering/analysis/tests/test_ferrite_maglev_coupled.py::test_fe_shape_and_load_transfer_conserve_virtual_work
          engineering/analysis/tests/test_ferrite_maglev_coupled.py::test_exact_modal_step_preserves_undamped_equilibrium_energy
          engineering/analysis/tests/test_ferrite_maglev_coupled.py::test_static_reaction_response_is_linear_and_mesh_converges
          engineering/analysis/tests/test_ferrite_maglev_coupled.py::test_invalid_beam_assumptions_fail_before_numerics
  bounded-axial-search-method:
    name: Current bounded axial and frame search methods
    # Pin the CPU solver environment; the floating image changed its dependency graph.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OSR_TEST_NATIVE_AXIAL: "1"
      OSR_TEST_NATIVE_FRAME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the bounded numerical method dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calculix-ccx
          python -m pip install pytest numpy==2.3.5
          test -x /usr/bin/ccx
      - name: Execute and independently replay one axial method control
        run: python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_native_refinement.py -k native_axial_run_and_read_only_replay
      - name: Execute and independently replay one coarse frame bending control
        run: python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_frame_native.py -k optional_native_bending_control_and_readonly_replay
  native-canonical-parity:
    name: Optional Rust canonical encoding on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.92.0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OSR_TEST_NATIVE_CANONICAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Initialize isolated Rust paths
        run: |
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_ENV:-}"
          printf 'RUSTUP_HOME=%s\n' "$RUNNER_TEMP/osr-canonical-rustup" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s\n' "$RUNNER_TEMP/osr-canonical-cargo" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy
      - run: python -m pip install pytest numpy==2.3.5 scipy==1.16.3
      - name: Build explicit source-bound kernel and interpreter-specific extension
        run: |
          python -m engineering.design_search.native_search build
          python -m engineering.design_search.native_canonical build
      - name: Require exact canonical parity and unchanged campaign results
        run: python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_native_canonical.py engineering/design_search/tests/test_campaign_canonical_backend.py engineering/design_search/tests/test_native_sealing.py engineering/design_search/tests/test_interface_validation_performance.py
      - name: Check the optional Rust extension under the pinned compiler
        run: cargo clippy --locked -p osr-design-search --lib --features python-extension -- -D warnings
  control-formal:
    name: Shared authority and retained refusal properties
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install the pinned bounded verifier
        run: |
          cargo install kani-verifier --version 0.67.0 --locked
          python tools/automation/download-pinned-tool.py kani --output build/native-download/kani-0.67.0-x86_64-unknown-linux-gnu.tar.gz
          cargo kani setup --use-local-bundle "$PWD/build/native-download/kani-0.67.0-x86_64-unknown-linux-gnu.tar.gz"
      - name: Execute shared authority and retained maglev refusal properties
        run: python -m engineering.ferrite_maglev.pilot_assurance run control-formal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-formal-execution
          path: |
            engineering/assurance/v052-pilot-profiles/control-formal/
            build/native-download/*.download.json
            build/native-download/*.attempts/*.json
            build/native-download/*.attempts/*.stderr.log
