name: "Retained research: Matched comfort design and two-minute service"
on:
  push:
    paths: ['engineering/comfort_design/**', 'docs/design-engine/ferrite-maglev/comfort-design/**', 'docs/workbench/trip/readiness/comfort-design/**', 'tools/automation/tests/verify-comfort-design.mjs', '.github/workflows/comfort-design.yml']
  pull_request:
    paths: ['engineering/comfort_design/**', 'docs/design-engine/ferrite-maglev/comfort-design/**', 'docs/workbench/trip/readiness/comfort-design/**', 'tools/automation/tests/verify-comfort-design.mjs', '.github/workflows/comfort-design.yml']
permissions:
  contents: read
jobs:
  contracts-and-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r engineering/trip_dynamics/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python -m pytest --import-mode=importlib -q engineering/comfort_design/tests
      - name: Replay source, stock, service and retained native receipts
        run: python -m engineering.comfort_design verify
      - run: node tools/automation/tests/verify-comfort-design.mjs build/comfort-design-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comfort-design-browser
          path: build/comfort-design-browser
