name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  python-and-generated:
    name: Python, links, and generated drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            design-py/pyproject.toml
            mechanical-py/pyproject.toml
            tools/osr-aln-convert/pyproject.toml
            tools/reference-ma/pyproject.toml
      - name: Install project test environments
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e ./design-py -e ./mechanical-py
          python -m pip install -e ./tools/osr-aln-convert -e ./tools/reference-ma
      - run: python -m pytest -q design-py/tests
      - run: python -m pytest -q mechanical-py/tests
      - run: python -m pytest -q tools/osr-aln-convert/tests tools/reference-ma/tests
      - run: python scripts/check-markdown-links.py
      - run: python scripts/validate-host-manifests.py
      - run: python scripts/repo-health.py --quiet
      - name: Check generated indexes and buildable product tree
        run: |
          python scripts/generate-doc-index.py
          python scripts/generate-national-briefs.py
          scripts/design-iterate.sh
          scripts/buildable-trainset.sh
          git diff --exit-code
