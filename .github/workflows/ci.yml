name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: python3 tools/automation/validate-city-projects.py

  python-and-generated:
    name: Python, links, and generated drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            design/city-generation/pyproject.toml
            design/component-catalogue/pyproject.toml
            tools/osr-aln-convert/pyproject.toml
            tools/reference-ma/pyproject.toml
            engineering/toolchain/ifc-python-requirements.txt
      - name: Install project test environments
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest CairoSVG mistune Pillow reportlab
          python -m pip install -e ./design/city-generation -e ./design/component-catalogue
          python -m pip install -e ./tools/osr-aln-convert -e ./tools/reference-ma
          python -m pip install --requirement engineering/toolchain/ifc-python-requirements.txt
      - run: python -m pytest -q design/city-generation/tests
      - run: python tools/automation/build-doc-book.py --out build/releases/opensource-rail-docs-book.pdf
      - run: python -m pytest -q design/component-catalogue/tests
      - run: python -m pytest -q tools/osr-aln-convert/tests tools/reference-ma/tests
      - run: python tools/automation/check-markdown-links.py
      - run: python tools/automation/validate-host-manifests.py
      - run: python tools/automation/check-tracked-file-sizes.py
      - run: python tools/automation/repo-health.py --quiet
      - name: Check generated indexes and buildable product tree
        run: |
          python tools/automation/generate-doc-index.py
          python tools/automation/generate-national-briefs.py
          tools/automation/design-iterate.sh
          tools/automation/buildable-trainset.sh
          git diff --exit-code

  frontend:
    name: Deterministic browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engineering/toolchain/ifc-python-requirements.txt
      - name: Install pinned frontend tools
        run: |
          npm ci
          tools/automation/osr-python -m pip install --upgrade pip
          tools/automation/osr-python -m pip install -e ./design/component-catalogue --requirement engineering/toolchain/ifc-python-requirements.txt
          npx playwright install --with-deps chromium
          curl -fsSLo /tmp/trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.21.8/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "cd9fb2822c9f0ae111737500c179226cb080241ac55002c1db7344aa51a97fec  /tmp/trunk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trunk.tar.gz -C /tmp trunk
          sudo install -m 0755 /tmp/trunk /usr/local/bin/trunk
          trunk --version
      - run: tools/automation/osr-python -c 'import _pytest, bcf, ifcopenshell, ifctester, networkx; print("IFC GUI runtime ready")'
      - run: npm run test:frontend
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            build/playwright/
            build/gui-acceptance/
          if-no-files-found: ignore
