name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features --doc
      - run: cargo check -p osr-runtime --bins
      - run: python3 tools/automation/tacs_assurance.py --check --verify-replay
      - name: RustSec dependency advisory audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings
      - run: python3 tools/automation/validate-city-projects.py

  python-and-generated:
    name: Python, links, and generated drift
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            design/city-generation/pyproject.toml
            design/component-catalogue/pyproject.toml
            tools/osr-aln-convert/pyproject.toml
            tools/reference-ma/pyproject.toml
            engineering/toolchain/ifc-python-requirements.txt
      - name: Install project test environments
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest CairoSVG mistune Pillow reportlab PyYAML
          python -m pip install -e './design/city-generation[geography]' -e ./design/component-catalogue
          python -m pip install -e ./tools/osr-aln-convert -e ./tools/reference-ma
          python -m pip install --requirement engineering/toolchain/ifc-python-requirements.txt
          python -m pip install pyswmm==2.1.0 swmm-toolkit==0.17.0
          python -m pip install pandapower==3.5.3 pvlib==0.15.2 pyproj==3.7.2
      - name: Restore exact Baghdad operations test input
        run: python tools/automation/bootstrap_baghdad_tests.py
      - run: |
          python tools/automation/rework-baghdad-alignment.py --check
          python tools/automation/publish-city-summary.py --check
      - run: python -m pytest -q design/city-generation/tests
      - name: Verify retained water evidence and actual platform geography
        run: |
          python tools/automation/audit-city-geography.py --check
      - name: Verify retained population, transfers and viaduct obstacle evidence
        run: |
          python tools/automation/audit-city-access.py --all --check
          python tools/automation/audit-viaduct-clearance.py --all --check --jobs 2
          python tools/automation/generate-access-clearance-review.py --check
      - run: python tools/automation/build-doc-book.py --out build/releases/opensource-rail-docs-book.pdf
      - name: Generate buildable product test prerequisites
        run: |
          tools/automation/design-iterate.sh
          tools/automation/buildable-trainset.sh
          tools/automation/buildable-stations.sh
          tools/automation/buildable-civil.sh
      - run: python -m pytest -q design/component-catalogue/tests
      - run: python -m pytest -q engineering/analysis/tests
      - run: python engineering/toolchain/baseline_assurance.py --check
      - run: python -m pytest -q tools/osr-aln-convert/tests tools/reference-ma/tests
      - run: python -m pytest -q tools/automation/tests
      - name: Validate business operating deployment
        run: |
          python tools/automation/erp-platform.py init
          python tools/automation/erpnext-city.py validate
          python tools/automation/erp-components.py validate
          docker compose --env-file var/erpnext/local.env -f deployment/erpnext/compose.yaml config --quiet
      - run: python tools/automation/audit-project-twins.py
      - run: python tools/automation/safety-case-summary.py --check
      - run: python tools/automation/check-markdown-links.py
      - run: python tools/automation/validate-host-manifests.py
      - run: python tools/automation/check-tracked-file-sizes.py
      - run: python tools/automation/repo-health.py --quiet
      - name: Check generated indexes and buildable product tree
        run: |
          python engineering/subsystem_control_register.py
          cargo run --quiet -p osr-consensus --bin osr-resilience-evidence -- --check
          cargo run --quiet --release -p osr-sim --bin osr-soak-evidence -- --check
          python tools/automation/component_rfc_readiness.py --check
          python tools/automation/generate-doc-index.py
          python tools/automation/generate-design-index.py --check
          python tools/automation/generate-national-briefs.py
          python tools/automation/publish-city-summary.py
          python tools/automation/rework-baghdad-alignment.py --check
          python tools/automation/publish-city-summary.py --check
          python tools/automation/operating-readiness.py --check
          python tools/automation/validate-commercial-partnership.py --check
          python tools/automation/validate-supplier-technical-support.py --check
          python tools/automation/digital-assurance.py --check
          python tools/automation/connected_assurance.py --check
          python tools/automation/subsystem_qualification.py --check
          python tools/automation/component_assurance.py --check
          python tools/automation/civil_reference.py --check
          python tools/automation/baghdad_viaduct_comparison.py --check
          python tools/automation/baghdad_programme_recalculation.py --check
          python tools/automation/tacs_assurance.py --check
          python tools/automation/redundancy_policy.py
          git diff --exit-code

  frontend:
    name: Deterministic browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engineering/toolchain/ifc-python-requirements.txt
      - name: Install pinned frontend tools
        run: |
          npm ci
          tools/automation/osr-python -m pip install --upgrade pip
          tools/automation/osr-python -m pip install -e ./design/component-catalogue --requirement engineering/toolchain/ifc-python-requirements.txt
          npx playwright install --with-deps chromium
          curl -fsSLo /tmp/trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.21.8/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "cd9fb2822c9f0ae111737500c179226cb080241ac55002c1db7344aa51a97fec  /tmp/trunk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trunk.tar.gz -C /tmp trunk
          sudo install -m 0755 /tmp/trunk /usr/local/bin/trunk
          trunk --version
      - run: tools/automation/osr-python -c 'import _pytest, bcf, ifcopenshell, ifctester, networkx; print("IFC GUI runtime ready")'
      - name: Check both Rust GUI libraries for WebAssembly
        run: >-
          cargo check --target wasm32-unknown-unknown
          -p osr-sim-gui -p osr-occ-gui --no-default-features
      - run: npm run test:frontend
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            build/playwright/
            build/gui-acceptance/
          if-no-files-found: ignore

  tacs-formal:
    name: Bounded TACS resource invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify pinned TLC and execute the declared model
        run: |
          mkdir -p build/toolchain/tla
          cp engineering/toolchain/tla/tla2tools-1.8.0.jar build/toolchain/tla/tla2tools-1.8.0.jar
          echo "c2fe4e56e43bde19f213b4a7e441d037297fda733e503579623e859b79348239  build/toolchain/tla/tla2tools-1.8.0.jar" | sha256sum -c -
          python3 tools/automation/tacs_assurance.py --check
          python3 tools/automation/tacs_assurance.py --run-formal build/toolchain/tla/tla2tools-1.8.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: tacs-bounded-formal-result
          path: |
            engineering/assurance/tacs/formal-tlc.log
            engineering/assurance/tacs/formal-execution.json
