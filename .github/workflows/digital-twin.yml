name: v0.6 end-to-end digital twin
on:
  push:
    branches: [main]
    paths:
      - "engineering/railway_twin/**"
      - "engineering/design_search/**"
      - "engineering/station_rail/**"
      - "engineering/development_baseline/**"
      - "engineering/development-baseline.toml"
      - "campaigns/end-to-end-digital-twin.toml"
      - "campaigns/station-accelerator-development.toml"
      - "docs/design-engine/digital-twin/**"
      - "osr-twin"
      - ".github/workflows/digital-twin.yml"
  pull_request:
    paths:
      - "engineering/railway_twin/**"
      - "engineering/design_search/**"
      - "engineering/station_rail/**"
      - "engineering/development_baseline/**"
      - "engineering/development-baseline.toml"
      - "campaigns/station-accelerator-development.toml"
      - "campaigns/end-to-end-digital-twin.toml"
      - "docs/design-engine/digital-twin/**"
      - "osr-twin"
      - ".github/workflows/digital-twin.yml"
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * 0"
permissions:
  contents: read
jobs:
  contracts-and-semantic-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Reserve disk on the disposable GitHub-hosted runner
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          df -h "$RUNNER_TEMP"
          sudo /usr/bin/python3 - <<'PYCODE'
          from pathlib import Path
          import shutil
          # These unused SDKs belong to the disposable runner image. Never
          # remove the workspace, Git objects, evidence, or Python toolcache.
          for path in map(Path, ('/usr/local/lib/android', '/opt/ghc', '/usr/share/dotnet')):
              if path.is_symlink():
                  raise SystemExit('Refusing symlinked runner SDK path: '+str(path))
              if path.exists():
                  if not path.is_dir():
                      raise SystemExit('Expected runner SDK directory: '+str(path))
                  print('Reclaiming unused runner SDK:', path, flush=True)
                  shutil.rmtree(path)
          PYCODE
          /usr/bin/python3 - <<'PYCODE'
          import os, shutil
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE'])
          while not workspace.exists():
              workspace = workspace.parent
          for path, required in ((workspace, 16 * 1024**3), (Path(os.environ['RUNNER_TEMP']), 2 * 1024**3)):
              free = shutil.disk_usage(path).free
              print('Runner filesystem:', path, 'free bytes:', free, 'required:', required)
              if free < required:
                  raise SystemExit('Insufficient runner space for full checkout and CAD replay')
          PYCODE
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
      - uses: actions/setup-python@v5
        with:
          # Retained byte-exact packets use Python 3.13 gzip headers. Python
          # 3.12 emits a different OS byte with mtime=0; keep exact checks.
          # https://docs.python.org/3.13/library/gzip.html#gzip.compress
          python-version: "3.13"
      - name: Confirm the runner can reproduce retained compressed representation
        run: |
          python - <<'PYCODE'
          import gzip, json, pathlib, sys, tarfile, zlib
          print(sys.version, 'zlib', zlib.ZLIB_RUNTIME_VERSION)
          root = pathlib.Path('docs/design-engine/digital-twin')
          manifest = json.loads((root/'manifest.json').read_bytes())
          for case in manifest['cases']:
              with tarfile.open(root/case['archive'], 'r:gz') as archive:
                  raw = archive.extractfile('candidate.json.gz').read()
              if gzip.compress(gzip.decompress(raw), mtime=0) != raw:
                  raise SystemExit('Runner gzip representation differs: '+case['archive'])
          print('Retained representation matches; full source, semantic and native checks follow.')
          PYCODE
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest --requirement engineering/requirements.txt
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/railway_twin/tests
      - name: Install the pinned headless CAD tool for actual file reopening
        run: |
          /usr/bin/python3 - <<'PYCODE'
          import os, shutil
          path = os.environ['GITHUB_WORKSPACE']
          free = shutil.disk_usage(path).free
          required = 8 * 1024**3
          print('Workspace free bytes before CAD installation:', free, 'required:', required)
          if free < required:
              raise SystemExit('Insufficient workspace space for pinned CAD extraction and replay')
          PYCODE
          df -h "$GITHUB_WORKSPACE"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglu1-mesa libegl1 libopengl0 libxrender1 libxkbcommon0 libxcb-cursor0
          /usr/bin/python3 - <<'PYCODE'
          import os, shutil
          free = shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free
          required = 6 * 1024**3
          print('Workspace free bytes after dependency installation:', free, 'required:', required)
          if free < required:
              raise SystemExit('Insufficient workspace space for pinned CAD extraction and replay')
          PYCODE
          mkdir -p build/twin-tools
          curl --fail --location --retry 3 --max-time 600 https://github.com/FreeCAD/FreeCAD/releases/download/1.1.4/FreeCAD_1.1.4-Linux-x86_64-py311.AppImage --output build/twin-tools/freecad.AppImage
          .venv/bin/python tools/automation/install-historical-freecad.py --archive build/twin-tools/freecad.AppImage --output build/twin-tools/freecad
          test -s build/twin-tools/freecad/install.json
          test -x build/twin-tools/freecad/bin/FreeCADCmd
          du -sh build/twin-tools/freecad
          /usr/bin/python3 - <<'PYCODE'
          from pathlib import Path
          import stat
          archive = Path('build/twin-tools/freecad.AppImage')
          size = archive.lstat().st_size
          if not stat.S_ISREG(archive.lstat().st_mode):
              raise SystemExit('Expected the verified regular FreeCAD download')
          archive.unlink()
          print('Removed verified temporary FreeCAD download bytes:', size)
          PYCODE
          df -h "$GITHUB_WORKSPACE"
          echo "$PWD/build/twin-tools/freecad/bin" >> "$GITHUB_PATH"
      - name: Verify current semantic packets and reopen published IFC, CAD and STEP
        run: ./osr-twin verify-publication
      - name: Exercise native translation and single-object placement regressions
        run: OSR_RUN_NATIVE_TWIN_TEST=1 .venv/bin/python -m pytest -q engineering/railway_twin/tests/test_geometry.py -k actual_native
      - name: Execute a fresh bounded candidate request
        run: ./osr-twin run --state build/twin-ci --max-cases 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v06-digital-twin-methods-not-physical-qualification
          path: build/twin-ci/
          retention-days: 14
