permissions:
  contents: read
jobs:
  release-fast-tests:
    name: Selected v0.6 software and resource contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/release-smoke-tests.txt
            /.github/tests/test_workflow_path_filters.py
            /.github/workflows/v06-software-release.yml
            /.github/workflows/v06-software-journey.yml
            /.github/workflows/digital-twin.yml
            /.github/workflows/frame-refinement.yml
            /.github/workflows/reference-cell.yml
            /.github/workflows/engineering-closure.yml
            /.github/workflows/reconciled-pilot.yml
            /.github/workflows/development-baseline.yml
            /.github/workflows/shared-software.yml
            /.github/workflows/sourced-hardware.yml
            /.github/workflows/sourcing.yml
            /campaigns/**
            /engineering/**
            /tests/test_v06_software_release_gate.py
            /tests/test_v06_status_portfolio_pointers.py
            /tests/test_retired_station_reference.py
            /tests/test_city_recalculation.py
            /tests/test_city_dossier_analysis.py
            /docs/design-engine/city-atlas/cities/samawah.json.gz
            /tests/test_outline_city_jobs.py
            /tests/test_corridor_revision*.py
            /tests/test_v07_project.py
            /tests/test_city_parent_custody.py
            /tests/test_door_module.py
            /tests/test_city_worker_capacity.py
            /tests/test_civil_moving_load.py
            /tests/test_linear_load_reuse.py
            /tests/test_door_cad.py
            /tests/test_force_evidence.py
            /tests/test_candidate_delivery_assemblies.py
            /tests/test_candidate_delivery_assembly_lifecycle.py
            /tests/test_delivery_schedule_integration.py
            /tests/test_outline_delivery_plan.py
            /tests/test_candidate_delivery_adapter.py
            /tests/test_pilot_delivery_review.py
            /tests/test_railway_closure_retained.py
            /deployment/erpnext/apps/osr_erpnext/osr_erpnext/**
            /services/integration/osr_integration/**
            /tools/automation/native-v06/**
            /docs/design-engine/reconciled-pilot-bogie-detail/delivery/proposal.json.gz
            /tests/test_corridor_profile.py
            /tests/test_outline_completion_cli_admission.py
            /tests/test_outline_completion_source_scope.py
            /engineering/railway_progress/tests/test_streaming_publication_archive.py
            /README.md
            /docs/README.md
            /docs/capabilities/README.md
            /docs/capabilities/directory.md
            /docs/workbench/planning/README.md
            /docs/archives/pre-comfort-default/README.md
            /docs/ARCHITECTURE.md
            /docs/first-adoptable-product.md
            /docs/open-source-rail-overview.md
            /docs/assets/v0.6/illustrations.json
            /osr
            /docs/design-engine/coupled-railway/**
            /docs/design-engine/compact-launch/**
            /docs/design-engine/line30-benchmark/**
            /docs/archives/coupled-railway-source-epochs/**
            /docs/archives/compact-launch-source-epochs/**
            /docs/archives/line30-benchmark-source-epochs/**
            /docs/archives/v06-closure-source-context/**
            /cities/catalogue/west-asia/Iraq/Samawah/**
            /docs/design-engine/v06-software-release/**
            /docs/releases/v0.6.1/**
            /docs/design-engine/v06-design-closure/status.json
            /docs/design-engine/outline-completion/manifest.json
            /docs/design-engine/outline-completion/summary.json
            /docs/design-engine/city-atlas/manifest.json
            /docs/design-engine/city-atlas/summary.json
            /docs/design-engine/ferrite-maglev/comfort-design/**
            /docs/design-engine/current/**
            /docs/design-engine/v06-design-closure/compact-drive-source-replay-01/compact-737-h100/**
            /docs/design-engine/powered-bogie-detail/body.json.gz
            /docs/design-engine/outline-completion/**
            /docs/design-engine/demand-outline/**
            /docs/design-engine/supply-economics/**
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engineering/requirements.txt
      - name: Install the small Python test environment
        run: python -m pip install --disable-pip-version-check pytest==9.2.0 scipy==1.16.3
      - name: Run the versioned selected-test manifest
        shell: bash
        run: |
          mapfile -t selected < <(sed '/^[[:space:]]*#/d; /^[[:space:]]*$/d' .github/release-smoke-tests.txt)
          test "${#selected[@]}" -gt 0
          python -B -m pytest -q --import-mode=importlib -p no:cacheprovider "${selected[@]}"
