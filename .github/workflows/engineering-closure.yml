name: v0.6 current engineering inputs and motor methods
on:
  push:
    branches: [main]
    paths: ["tools/automation/verify_retained_publications.py", "tests/test_retained_twin_motor.py", "engineering/railway_completion/**", "engineering/railway_twin/**", "engineering/design_search/**", "engineering/station_rail/**", "engineering/development_baseline/**", "engineering/development-baseline.toml", "campaigns/engineering-completion.toml", "docs/design-engine/engineering-closure/**", "osr-complete", ".github/workflows/engineering-closure.yml", "!engineering/station_rail/force_evidence.py", "!tests/test_force_evidence.py", "!campaigns/v07-execution.json", "!docs/design-engine/v07-execution/**", "!engineering/city_reports/planning-policy.json", "!tests/test_city_dossier_analysis.py", "!engineering/development_baseline/door_readiness.py", "!engineering/development_baseline/server.py", "!engineering/development_baseline/web/**", "!engineering/development_baseline/tests/test_performance_storage.py"]
  pull_request:
    paths: ["tools/automation/verify_retained_publications.py", "tests/test_retained_twin_motor.py", "engineering/railway_completion/**", "engineering/railway_twin/**", "engineering/design_search/**", "engineering/station_rail/**", "engineering/development_baseline/**", "engineering/development-baseline.toml", "campaigns/engineering-completion.toml", "docs/design-engine/engineering-closure/**", "osr-complete", ".github/workflows/engineering-closure.yml", "!engineering/station_rail/force_evidence.py", "!tests/test_force_evidence.py", "!campaigns/v07-execution.json", "!docs/design-engine/v07-execution/**", "!engineering/city_reports/planning-policy.json", "!tests/test_city_dossier_analysis.py", "!engineering/development_baseline/door_readiness.py", "!engineering/development_baseline/server.py", "!engineering/development_baseline/web/**", "!engineering/development_baseline/tests/test_performance_storage.py"]
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * 0"
permissions:
  contents: read
jobs:
  contracts-and-retained-execution-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest --requirement engineering/requirements.txt
      - name: Pin NumPy for exact current-evaluator replay
        run: .venv/bin/pip install numpy==2.3.5
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/railway_completion/tests tests/test_retained_twin_motor.py
      - name: Recompute current closure and inspect retained motor and variant integrity
        run: |
          ./osr-complete verify-publication
          git fetch --no-tags --depth=1 --filter=blob:none origin 946f1772540d07af85b57b0d13cac08a3293b140
          .venv/bin/python -m tools.automation.verify_retained_publications prefetch motor
          .venv/bin/python -m tools.automation.verify_retained_publications verify motor --state "$RUNNER_TEMP/osr-retained-motor-check"
          .venv/bin/python -m tools.automation.verify_retained_publications prefetch variants
          .venv/bin/python -m tools.automation.verify_retained_publications verify variants --state "$RUNNER_TEMP/osr-retained-variants-check"
      - name: Execute fresh zero-voltage control with this runner's source and numerical tools
        run: ./osr-complete motor-run --state build/completion-ci --max-new-runs 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v06-current-methods-and-open-physical-obligations
          path: |
            build/completion-ci/
            ${{ runner.temp }}/osr-retained-motor-check/receipt.json
            ${{ runner.temp }}/osr-retained-motor-check/stdout.json
            ${{ runner.temp }}/osr-retained-motor-check/stderr.txt
            ${{ runner.temp }}/osr-retained-variants-check/receipt.json
            ${{ runner.temp }}/osr-retained-variants-check/stdout.json
            ${{ runner.temp }}/osr-retained-variants-check/stderr.txt
          retention-days: 14
