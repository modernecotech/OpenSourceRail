name: v0.6 wheel and station reference design
on:
  pull_request:
    paths:
      - "engineering/development-baseline.toml"
      - "engineering/development_baseline/**"
      - "engineering/station_rail/**"
      - "engineering/design_search/**"
      - "campaigns/whole-railway-architecture-search.toml"
      - "campaigns/adaptive-railway-design.toml"
      - "tests/test_body_revision.py"
      - "tests/test_joint*.py"
      - "tools/automation/architecture-native-benchmarks.py"
      - "crates/osr-atp/**"
      - "Cargo.lock"
      - "docs/design-engine/current/**"
      - "docs/workbench/current/**"
      - "cities/**/engineering/current/**"
      - "tools/automation/default-design*.py"
      - "tools/automation/tests/verify-development-baseline.mjs"
      - "osr"
      - "package.json"
      - ".github/workflows/development-baseline.yml"
  push:
    branches: [main]
    paths:
      - "engineering/development-baseline.toml"
      - "engineering/development_baseline/**"
      - "engineering/station_rail/**"
      - "engineering/design_search/**"
      - "campaigns/whole-railway-architecture-search.toml"
      - "campaigns/adaptive-railway-design.toml"
      - "tests/test_body_revision.py"
      - "tests/test_joint*.py"
      - "tools/automation/architecture-native-benchmarks.py"
      - "crates/osr-atp/**"
      - "Cargo.lock"
      - "docs/design-engine/current/**"
      - "docs/workbench/current/**"
      - "osr"
  workflow_dispatch:
  schedule:
    - cron: "45 3 * * *"
permissions:
  contents: read
jobs:
  current-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest --requirement engineering/ferrite_maglev/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/development_baseline/tests engineering/station_rail/tests
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_railway_architecture.py engineering/design_search/tests/test_architecture_demand.py engineering/design_search/tests/test_capabilities.py engineering/design_search/tests/test_nonlinear_motor.py tests/test_joint_models.py tests/test_joint_body.py
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_requirement_policy.py engineering/design_search/tests/test_design_variables.py engineering/design_search/tests/test_revision_planner.py engineering/design_search/tests/test_adaptive_campaign.py engineering/design_search/tests/test_section_proposals.py tests/test_body_revision.py
      - run: ./osr verify
      - run: npm run test:frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-development-workbench
          path: build/development-baseline-browser/

  native-methods:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y getdp gmsh calculix-ccx libglu1-mesa
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest --requirement engineering/ferrite_maglev/requirements.txt
      - run: .venv/bin/python tools/automation/v06-native-benchmarks.py --output build/v06-native-ci
      - run: .venv/bin/python -c "from engineering.trip_dynamics.setup_tools import install; install('build/trip-dynamics/tools')"
      - run: .venv/bin/python tools/automation/architecture-native-benchmarks.py --output build/architecture-native-ci
      - run: cargo test --locked -p osr-atp -p osr-interlocking -p osr-door-control -p osr-tcms -p osr-station-scada
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v06-native-methods-not-physical-qualification
          path: build/v06-native-ci/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-native-methods-not-physical-qualification
          path: build/architecture-native-ci/
          retention-days: 14
