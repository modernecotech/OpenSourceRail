  workflow_dispatch:
    inputs:
      native_methods:
        description: Run the expensive native method fixtures as well as required contracts
        type: boolean
        default: false
  schedule:
    - cron: "45 3 * * *"
permissions:
  contents: read
jobs:
  current-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact retained producer source required by offline ancestry checks
        run: |
          git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
          git cat-file -e 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164^{commit}
          git fetch --no-tags --depth=1 origin 5b9b943e198dd22bdabc57d705e7cc1f1462bd7f
          git cat-file -e 5b9b943e198dd22bdabc57d705e7cc1f1462bd7f^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - run: python -m venv .venv
      - run: .venv/bin/pip install --no-cache-dir pytest --requirement engineering/requirements.txt
      - name: Pin NumPy for exact source-bound evaluator replay
        run: .venv/bin/pip install --no-cache-dir numpy==2.3.5
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/development_baseline/tests engineering/station_rail/tests
      - run: ./osr design space verify
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_railway_architecture.py engineering/design_search/tests/test_architecture_demand.py engineering/design_search/tests/test_capabilities.py engineering/design_search/tests/test_nonlinear_motor.py tests/test_joint_models.py tests/test_joint_body.py
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_launch_options.py
      - run: .venv/bin/python -m engineering.design_search.launch_options verify
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_propulsion_storage.py engineering/design_search/tests/test_sparse_launch.py engineering/design_search/tests/test_propulsion_layout.py
      - run: .venv/bin/python -m engineering.design_search.propulsion_layout verify
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_station_accelerators.py
      - run: .venv/bin/python -m engineering.design_search.station_accelerators verify
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_requirement_policy.py engineering/design_search/tests/test_design_variables.py engineering/design_search/tests/test_revision_planner.py engineering/design_search/tests/test_adaptive_campaign.py engineering/design_search/tests/test_section_proposals.py tests/test_body_revision.py
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_design_grammar.py engineering/design_search/tests/test_interface_graph.py engineering/design_search/tests/test_material_database.py engineering/design_search/tests/test_dfma.py engineering/design_search/tests/test_generative_publication.py tests/test_grammar_structure.py
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_breadth_first_portfolio.py
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_retained_publication.py engineering/design_search/tests/test_architecture_publication_retention.py
      - run: .venv/bin/python -m engineering.station_rail.closure_retention verify
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_architecture_reach_closure.py
      - name: Stepped civil mechanics and portable publication compression
        run: |
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_civil_beam.py engineering/design_search/tests/test_civil_section_model.py engineering/design_search/tests/test_civil_shape_mechanics.py engineering/design_search/tests/test_portable_gzip.py
          .venv/bin/python -m engineering.design_search.civil_shape_mechanics verify
      - name: Material-distribution experiments and disjoint cost accounting
        run: |
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_cost_accounting_partition.py engineering/design_search/tests/test_cost_accounting_archive.py engineering/design_search/tests/test_topology_optimisation.py engineering/design_search/tests/test_topology_geometry.py engineering/design_search/tests/test_topology_cost.py engineering/design_search/tests/test_topology_system_cost.py engineering/design_search/tests/test_civil_topology.py engineering/design_search/tests/test_civil_topology_publication.py engineering/design_search/tests/test_topology_revisions.py engineering/design_search/tests/test_topology_revision_campaign.py engineering/design_search/tests/test_topology_revision_publication.py engineering/design_search/tests/test_flanged_span.py engineering/design_search/tests/test_flanged_span_publication.py engineering/design_search/tests/test_implicit_geometry.py engineering/design_search/tests/test_implicit_geometry_publication.py
          .venv/bin/python -m engineering.design_search.cost_accounting_archive verify
          .venv/bin/python -m engineering.design_search.civil_topology_publication verify
          .venv/bin/python -m engineering.design_search.topology_revision_publication verify
          .venv/bin/python -m engineering.design_search.flanged_span_publication verify
          .venv/bin/python -m engineering.design_search.implicit_geometry_publication verify --expected-manifest-id 3fa44c54689ae832a4d450a45ba5da7fe0092bd87d54a3738d499a7087787117
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_topology_baseline_integrity.py engineering/design_search/tests/test_flanged_system_cost.py engineering/design_search/tests/test_flanged_system_cost_publication.py engineering/design_search/tests/test_flanged_system_cost_context.py
          .venv/bin/python -m engineering.design_search.topology_baseline_integrity --expected-baseline-id 55755de037fa3708aab0ff579caea20585c92e3da740505c395784aed6fe7d29
          .venv/bin/python -m engineering.design_search.flanged_system_cost_publication verify --expected-topology-manifest-id 294de81f3b1cca8215a95704287cfedf74ddfac596232027dee3c030163fdc43 --expected-flanged-manifest-id c6c10afa4889de76b64a806d3b0d6fc9f13ae4d4d40981284a7161c94618605a --expected-manifest-id 8304503b6b409692552846c046d44dfe659c8c9bc8527f1d5289e954b8d70a79
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_matched_renewal_research.py engineering/design_search/tests/test_matched_renewal_publication.py
          .venv/bin/python -m engineering.design_search.matched_renewal_publication verify --expected-manifest-id 5e7e1eb3868d8d459132c9f2928bd5ea834ba88ef61736e43c4a357787072e69 --expected-parent-manifest-id 8304503b6b409692552846c046d44dfe659c8c9bc8527f1d5289e954b8d70a79 --expected-topology-manifest-id 294de81f3b1cca8215a95704287cfedf74ddfac596232027dee3c030163fdc43 --expected-flanged-manifest-id c6c10afa4889de76b64a806d3b0d6fc9f13ae4d4d40981284a7161c94618605a --expected-request-id 91080f862a1d0e55e906910f9c1e90a14deee5a716c73398c8bdb180dafedc3c --expected-evaluation-id b7a87fa3de087822de6147b805a65b6d69eb4e6d00f1810000452e99c59ed05c
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_installed_mass_cg.py engineering/design_search/tests/test_installed_mass_cg_publication.py
          .venv/bin/python -m engineering.design_search.installed_mass_cg_publication verify --expected-manifest-id 53f880cc6cd0a422aa5992b302899b70841b795671c133e4ebe9880e84541ebc
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_retained_source_epoch.py
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_periodic_thermal_research.py engineering/design_search/tests/test_periodic_thermal_publication.py
          .venv/bin/python -m engineering.design_search.periodic_thermal_publication verify --expected-manifest-id e2ac8e01ac36eaa19d8f5c59c0dcfc28de6acd7759065a0a7b122cd8d7c3d66d --expected-handoff-id 701824bd9fec83c2ae48725040804d3f7d42f94c3e742b638ac6e23437d6ef3d --expected-request-id 019fb919aaaef52d9e0af4ceda21648544bd35c1c15d9d31dc832f2bdcff6967 --expected-evaluation-id de6c95144aedca6ffde689fb4eb62dcef57adde633da9a46b013420d95dff48c
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_railway_bundle.py engineering/design_search/tests/test_railway_campaign.py engineering/design_search/tests/test_railway_delivery.py engineering/design_search/tests/test_system_inventory.py engineering/design_search/tests/test_system_selection.py engineering/design_search/tests/test_system_motion.py engineering/design_search/tests/test_transient_lim.py tests/test_grammar_shell.py
      - run: ./osr design railway verify
      - name: Candidate, moving-conductor and end-to-end closure contracts
        run: |
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_equipped_candidates.py engineering/design_search/tests/test_moving_lim.py engineering/design_search/tests/test_lim_transport.py engineering/design_search/tests/test_lim_critical_mesh.py engineering/design_search/tests/test_moving_lim_publication.py engineering/design_search/tests/test_fault_response.py engineering/design_search/tests/test_test_readiness.py engineering/design_search/tests/test_demonstration.py engineering/design_search/tests/test_railway_refinement_current.py
          ./osr design railway demonstration-verify
          .venv/bin/python -m engineering.design_search.moving_lim_publication verify
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_lim_static_benchmark.py engineering/design_search/tests/test_lim_static_publication.py
          .venv/bin/python -m engineering.design_search.lim_static_publication verify
      - run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_railway_publication.py
      - run: ./osr design generative verify
      - run: ./osr verify
      - run: .venv/bin/python tools/automation/check-readmes.py
      - run: .venv/bin/python tools/automation/generate-doc-index.py --check
      - run: npm run test:frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-development-workbench
          path: build/development-baseline-browser/
  independent-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Breadth-first civil geometry and independent search libraries
        run: |
          python -m venv .venv-search
          .venv-search/bin/pip install --no-cache-dir pytest numpy==2.3.5 scipy==1.16.3 --requirement engineering/design_search/requirements-search.txt
          .venv-search/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_civil_shape_geometry.py engineering/design_search/tests/test_civil_shape_portfolio.py engineering/design_search/tests/test_search_backends.py
          .venv-search/bin/python -m engineering.design_search.civil_shape_portfolio verify
          .venv-search/bin/python -m engineering.design_search.civil_shape_portfolio audit-optimizers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: civil-portfolio-search-audit
          path: build/civil-shape-portfolio/optimizer-audits/
          retention-days: 14

  retained-packet-reconstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install --no-cache-dir pytest
      - name: Reconstruct pinned historical packet trees
        run: |
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_retained_packet_materialize.py
          git fetch --no-tags --depth=1 origin dad8c4bedb2361d3e621e9def312273167279027
          retained_packet_parent=$(mktemp -d "$RUNNER_TEMP/osr-retained-packets.XXXXXX")
          ulimit -v 1048576
          .venv/bin/python -m engineering.design_search.retained_packet_materialize --git-repo . --output "$retained_packet_parent/packets" --archive-directory docs/design-engine/retained-battery-source-epoch/archive --pins docs/design-engine/retained-battery-source-epoch/pins.json --expected-commit dad8c4bedb2361d3e621e9def312273167279027 --expected-archive-id 478479a93642c464cc2be318bbc5b45b9c5c3fec2e9cecb02318d53bd4fb568e
          .venv/bin/python -m engineering.design_search.retained_source_epoch verify --root "$retained_packet_parent/packets/root" --archive-directory docs/design-engine/retained-battery-source-epoch/archive --pins docs/design-engine/retained-battery-source-epoch/pins.json --expected-archive-id 478479a93642c464cc2be318bbc5b45b9c5c3fec2e9cecb02318d53bd4fb568e

  retained-service-energy-extra:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install --no-cache-dir pytest
      - name: Verify additional historical service-energy source epoch
        env:
          OSR_MIGRATION_REQUIRE_REAL: "1"
        run: |
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_retained_service_energy_epoch.py engineering/design_search/tests/test_retained_service_energy_handoff.py engineering/design_search/tests/test_retained_service_energy_materialize.py engineering/design_search/tests/test_retained_service_energy_materialize_handoff.py
          git fetch --no-tags --depth=1 origin 5cd6b8ff9b2fdf3c705f0d68073543c58e6dec76
          git fetch --no-tags --depth=1 origin dad8c4bedb2361d3e621e9def312273167279027
          git fetch --no-tags --depth=1 origin be03a8436a7b5b307840514e05146f98b3ee2574
          .venv/bin/python -m pytest -q --import-mode=importlib engineering/design_search/tests/test_service_energy_migration_inventory.py
          ulimit -v 1048576
          retained_extra_parent=$(mktemp -d "$RUNNER_TEMP/osr-service-energy.XXXXXX")
          .venv/bin/python -m engineering.design_search.retained_service_energy_materialize materialize --git-repo . --output "$retained_extra_parent/packets" --archive-directory docs/design-engine/retained-service-energy-extra/original/worker-v7/archive --pins docs/design-engine/retained-service-energy-extra/original/worker-v7/pins.json --expected-commit 5cd6b8ff9b2fdf3c705f0d68073543c58e6dec76 --expected-pins-id 91d8be8f7893aea692e90683c214bbda0d35c4dbe1a652c7cb8908e3d3a4f050 --expected-archive-id d2f4511f180592083945bb993658353218b9efcf91d0dd3f21d02e58399967b9
          .venv/bin/python -m engineering.design_search.retained_service_energy_epoch verify --root "$retained_extra_parent/packets/root" --archive-directory docs/design-engine/retained-service-energy-extra/original/worker-v7/archive --pins docs/design-engine/retained-service-energy-extra/original/worker-v7/pins.json --expected-pins-id 91d8be8f7893aea692e90683c214bbda0d35c4dbe1a652c7cb8908e3d3a4f050 --expected-archive-id d2f4511f180592083945bb993658353218b9efcf91d0dd3f21d02e58399967b9

  vehicle-runtime-reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python311
        with:
          python-version: "3.11"
      - uses: actions/setup-python@v5
        id: python312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        id: python313
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Compare complete vehicle and selector payloads on all three runtimes
        env:
          OSR_VEHICLE_REPRO_PYTHONS: ${{ steps.python311.outputs.python-path }}:${{ steps.python312.outputs.python-path }}:${{ steps.python313.outputs.python-path }}
        run: python -m pytest -q --import-mode=importlib engineering/station_rail/tests/test_vehicle_runtime_reproducibility.py

  required-engineering:
    if: always()
    needs: [current-contracts, independent-search, retained-packet-reconstruction, retained-service-energy-extra, vehicle-runtime-reproducibility]
    runs-on: ubuntu-24.04
    steps:
      - name: Require source, engineering and browser contracts
        run: |
          test '${{ needs.current-contracts.result }}' = success
          test '${{ needs.independent-search.result }}' = success
          test '${{ needs.retained-packet-reconstruction.result }}' = success
          test '${{ needs.retained-service-energy-extra.result }}' = success
          test '${{ needs.vehicle-runtime-reproducibility.result }}' = success

  coupled-native-methods:
    if: (github.event_name == 'workflow_dispatch' && inputs.native_methods) || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact retained producer source required by offline ancestry checks
        run: |
          git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
          git cat-file -e 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y calculix-ccx gmsh libglu1-mesa
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest gmsh==4.14.1 --requirement engineering/requirements.txt
      - run: .venv/bin/python tools/automation/coupled-native-benchmarks.py --output build/coupled-native-ci
      - name: Bounded moving-conductor numerical controls
        run: .venv/bin/python tools/automation/moving-lim-benchmarks.py --output build/moving-lim-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coupled-solid-transient-methods-not-operating-qualification
          path: build/coupled-native-ci/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moving-conductor-controls-not-operating-map
          path: build/moving-lim-ci/
          retention-days: 14

  native-methods:
    if: (github.event_name == 'workflow_dispatch' && inputs.native_methods) || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact retained producer source required by offline ancestry checks
        run: |
          git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
          git cat-file -e 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y getdp gmsh calculix-ccx libglu1-mesa
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest gmsh==4.14.1 --requirement engineering/requirements.txt
      - run: .venv/bin/python tools/automation/v06-native-benchmarks.py --output build/v06-native-ci
      - run: .venv/bin/python -c "from engineering.trip_dynamics.setup_tools import install; install('build/trip-dynamics/tools')"
      - run: .venv/bin/python tools/automation/architecture-native-benchmarks.py --output build/architecture-native-ci
      - run: .venv/bin/python tools/automation/generative-native-benchmarks.py --output build/generative-native-ci
      - run: cargo test --locked -p osr-atp -p osr-interlocking -p osr-door-control -p osr-tcms -p osr-station-scada
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v06-native-methods-not-physical-qualification
          path: build/v06-native-ci/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-native-methods-not-physical-qualification
          path: build/architecture-native-ci/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generative-axial-methods-not-body-qualification
          path: build/generative-native-ci/
          retention-days: 14
