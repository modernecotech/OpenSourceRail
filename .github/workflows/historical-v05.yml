name: Historical v0.5 maglev replay
on:
  push:
    branches: [main]
    tags: ["v0.5.*"]
    paths:
      - ".github/workflows/historical-v05.yml"
      - "docs/archives/v0.5-maglev/**"
  pull_request:
    paths:
      - ".github/workflows/historical-v05.yml"
      - "docs/archives/v0.5-maglev/**"
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * 0"
permissions:
  contents: read
jobs:
  primary-study:
    name: Historical v0.5 replay (pinned archive)
    defaults:
      run:
        working-directory: historical
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Read the current archive contract
        uses: actions/checkout@v4
        with:
          path: current
          sparse-checkout: /docs/archives/v0.5-maglev/manifest.json
          sparse-checkout-cone-mode: false
      - name: Check out the immutable v0.5 source and publication
        uses: actions/checkout@v4
        with:
          ref: 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
          path: historical
      - name: Require the archive identity and historical version
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('../current/docs/archives/v0.5-maglev/manifest.json').read_text())
          unsigned = {k: v for k, v in manifest.items() if k != 'archive_id'}
          encoded = (json.dumps(unsigned, sort_keys=True, separators=(',', ':'), allow_nan=False) + '\n').encode()
          assert manifest['schema'] == 'osr-v05-git-archive/1'
          assert manifest['archive_id'] == hashlib.sha256(encoded).hexdigest()
          assert manifest['physical_accepted'] is False
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == manifest['revision']
          assert Path('VERSION').read_text().strip() == '0.5'
          print('Historical source:', manifest['revision'], 'archive:', manifest['archive_id'])
          PYTHON
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt,clippy
      - name: Media encoding and decoded-frame verification
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install pytest -r engineering/ferrite_maglev/requirements.txt
      - name: Verify every published source and packet file is tracked
        run: python tools/automation/tests/verify-maglev-sources.py
      # Rebuild with the pinned generators in this disposable checkout before
      # checking publication formats that predate the current release adapter.
      - name: Prepare runtime-bound publication and reader
        shell: bash
        run: |
          mkdir -p build
          python tools/automation/ferrite-maglev-study.py cycle --output build/maglev-workflow-report 2>&1 | tee build/maglev-historical-cycle.log
      - name: Primary deployment and capability configuration
        run: |
          python tools/automation/validate-host-manifests.py
          python tools/automation/capabilities.py --check
          python tools/automation/catalogue.py index --check
          python tools/automation/generate-design-index.py --check
          python tools/automation/generate-doc-index.py --check
          python tools/automation/check-readmes.py
      - name: Shared research software unit tests
        run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked -p osr-maglev-control --all-targets
      - run: cargo check --locked -p osr-maglev-control --no-default-features
      - run: cargo fmt --package osr-maglev-control -- --check
      - run: cargo clippy -p osr-maglev-control --all-targets -- -D warnings
      - name: Offline normal-wrench observer prototype
        run: |
          cargo fmt --manifest-path engineering/ferrite_maglev/observer-prototype/Cargo.toml -- --check
          cargo clippy --locked --manifest-path engineering/ferrite_maglev/observer-prototype/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path engineering/ferrite_maglev/observer-prototype/Cargo.toml --all-targets
          python engineering/ferrite_maglev/observer-prototype/tests/differential.py
      - name: All primary maglev Python suites
        run: python -m pytest engineering/analysis/tests/test_ferrite_maglev*.py -q
      - name: Verify retained engineering, lifecycle and formal execution profiles
        run: python -m engineering.ferrite_maglev.pilot_assurance verify --require-executed
      - name: Verify source-bound native packet without FreeCAD
        run: |
          python - <<'PY'
          from engineering.ferrite_maglev import geometry,evacuation,system_development
          geometry.verify_native('docs/design-engine/ferrite-maglev/native')
          evacuation.verify_native('docs/design-engine/ferrite-maglev/beam-only')
          system_development.verify()
          PY
      - name: Build Rust bridge and publish actual two-way numerical replay
        run: |
          python -m engineering.ferrite_maglev.coupled --output build/maglev-ci-coupled
          python -m engineering.ferrite_maglev.coupled --verify build/maglev-ci-coupled
          python -m engineering.ferrite_maglev.coupled --verify docs/design-engine/ferrite-maglev/coupled
      - run: |
          python tools/automation/ferrite-maglev-study.py run --output build/maglev-ci
          python tools/automation/ferrite-maglev-study.py check --output build/maglev-ci
          cargo run --locked -p osr-maglev-control --release --example multimodule_replay
      - name: Confirm physical release remains gated
        shell: bash
        run: |
          code=0
          python tools/automation/ferrite-maglev-study.py release-check || code=$?
          test "$code" = 3
      - name: Primary public overview and reader book
        run: |
          python tools/automation/generate-public-overview.py --check
          python tools/automation/build-doc-book.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser report, images and mobile layout
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python tools/automation/ferrite-maglev-study.py run
          node tools/automation/tests/verify-maglev-v05.mjs build/maglev-browser
          node tools/automation/tests/verify-maglev-workbench.mjs build/maglev-workbench-browser
      - name: Preserve historical replay logs and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-v05-replay-not-current-qualification
          path: |
            historical/build/maglev-historical-cycle.log
            historical/build/maglev-workflow/
            historical/build/maglev-workflow-report/
            historical/build/maglev-ci/
            historical/build/maglev-ci-coupled/
            historical/build/maglev-browser/
            historical/build/maglev-workbench-browser/
          retention-days: 14
