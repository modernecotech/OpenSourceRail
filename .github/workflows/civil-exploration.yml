name: Civil exploration numerical verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'engineering/analysis/**'
      - 'engineering/assurance/civil-reference/**'
      - 'engineering/assurance/standards/**'
      - 'docs/standards/**'
      - 'engineering/toolchain/tool-manifest.toml'
      - 'tools/automation/project_twin.py'
      - 'tools/automation/civil_reference.py'
      - 'tools/automation/engineering-change.py'
      - 'tools/automation/verify-civil-native-cad.py'
      - 'lib/templates/foundation-catalog.toml'
      - 'design/component-catalogue/src/osr_mech/cad.py'
      - 'design/component-catalogue/src/osr_mech/common.py'
      - 'design/component-catalogue/src/osr_mech/provenance.py'
      - 'design/component-catalogue/src/osr_mech/family_definition.py'
      - 'design/component-catalogue/src/osr_mech/schema_validation.py'
      - 'design/component-catalogue/src/osr_mech/buildable_trainset.py'
      - 'design/component-catalogue/src/osr_mech/design_definition.py'
      - 'design/component-catalogue/src/osr_mech/freecad_engineering_definition.py'
      - 'design/component-catalogue/src/osr_mech/freecad_trainset.py'
      - 'design/component-catalogue/src/osr_mech/freecad_sources.py'
      - 'design/component-catalogue/src/osr_mech/freecad_occ_bridge.py'
      - 'design/component-catalogue/src/osr_mech/rolling_stock/**'
      - 'design/component-catalogue/src/osr_mech/engineering_definition.py'
      - 'design/component-catalogue/src/osr_mech/vehicle_mass_properties.py'
      - 'design/component-catalogue/schemas/shared-engineering-model.json'
      - 'design/component-catalogue/tests/test_shared_engineering.py'
      - 'tools/automation/shared-train-viaduct.py'
      - 'tools/automation/shared-engineering-campaign.py'
      - 'tools/automation/shared-service-envelope.py'
      - 'tools/automation/export-shared-service-review.py'
      - 'tools/automation/verify-shared-review-history.py'
      - 'tools/automation/tests/test_shared_review_history.py'
      - 'tools/automation/export-shared-campaign-review.py'
      - 'tools/automation/check-shared-engineering-standard.py'
      - 'tools/automation/tests/test_shared_engineering_standard.py'
      - 'design/component-catalogue/src/osr_mech/joint_design.py'
      - 'design/component-catalogue/src/osr_mech/automated_geometry.py'
      - 'engineering/reference-parts/**'
      - 'tools/automation/compile-reference-parts.py'
      - 'tools/automation/verify-reference-parts-freecad.py'
      - 'tools/automation/export-reference-parts-evidence.py'
      - 'tools/automation/shared-engineering-freecad.py'
      - 'tools/automation/tests/test_engineering_identity.py'
      - 'deployment/erpnext/apps/osr_erpnext/osr_erpnext/engineering_identity.py'
      - 'deployment/erpnext/apps/osr_erpnext/osr_erpnext/integration.py'
      - 'services/integration/osr_integration/engineering.py'
      - 'engineering/analysis/tests/test_shared_train_bridge.py'
      - 'docs/civil/**'
      - 'OpenSourceRail_Civil_Exploration_Plan.docx'
      - 'engineering/civil_exploration/**'
      - 'engineering/analysis/benchmarks/civil/**'
      - 'engineering/analysis/tests/test_civil_exploration.py'
      - 'engineering/analysis/tests/test_civil_exploration_review.py'
      - 'engineering/analysis/tests/test_civil_exploration_extensions.py'
      - 'engineering/analysis/tests/test_civil_qualification.py'
      - 'engineering/analysis/tests/test_civil_system_choices.py'
      - 'docs/civil/viaduct-load-model.toml'
      - 'lib/templates/rolling-stock.toml'
      - 'cities/catalogue/west-asia/Iraq/Baghdad/design.toml'
      - 'cities/catalogue/west-asia/Iraq/Baghdad/engineering/soil/summary.json'
      - 'cities/catalogue/west-asia/Iraq/Baghdad/engineering/survey/*readiness.json'
      - 'design/component-catalogue/src/osr_mech/civil/**'
      - 'tools/automation/civil-study.py'
      - 'tools/automation/export-civil-system-review.py'
      - '.github/workflows/civil-exploration.yml'
  workflow_dispatch:
    inputs:
      campaign:
        description: Run the complete bounded research comparison
        type: boolean
        default: false
      complete_systems:
        description: Run the complete Baghdad static research package search and detailed shortlist
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  numerical-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .:design/component-catalogue/src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the retained research evidence source commit
        run: git fetch --no-tags --depth=1 origin bcb21593fb6e4d0c73645429d4fbf059252b4002
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded numerical test environment
        run: |
          python -m pip install pytest==9.1.1 numpy==2.3.5 scipy==1.16.3 jsonschema==4.25.1 openseespy==3.8.0.0 ifcopenshell==0.8.5
          sudo apt-get update
          sudo apt-get install -y calculix-ccx
      - name: Verify contracts, independent equations and native integrity
        run: python -m pytest -q engineering/analysis/tests/test_civil_exploration.py engineering/analysis/tests/test_civil_exploration_review.py engineering/analysis/tests/test_civil_exploration_extensions.py engineering/analysis/tests/test_civil_qualification.py engineering/analysis/tests/test_civil_system_choices.py engineering/analysis/tests/test_civil_review_acceptance.py
      - name: Verify shared geometry, inertia, evidence and train–bridge coupling
        env:
          PYTHONPATH: design/component-catalogue/src:.
        run: python -m pytest -q design/component-catalogue/tests/test_shared_engineering.py engineering/analysis/tests/test_shared_train_bridge.py engineering/analysis/tests/test_shared_spatial_engineering.py engineering/analysis/tests/test_shared_service.py engineering/analysis/tests/test_automated_parts.py tools/automation/tests/test_engineering_identity.py tools/automation/tests/test_shared_engineering_standard.py tools/automation/tests/test_shared_review_history.py
      - name: Verify generated industry-reference parts review
        run: python tools/automation/compile-reference-parts.py check-review --review engineering/civil_exploration/examples/automated-parts-review.json
      - name: Install existing native reference replay dependencies
        if: ${{ inputs.campaign }}
        run: |
          python -m pip install pyswmm==2.1.0 swmm-toolkit==0.17.0
      - name: Run complete research campaign
        if: ${{ inputs.campaign }}
        run: python tools/automation/civil-study.py programme --deployment reference --search-evaluations 96
      - name: Run complete-system search and native refinements
        if: ${{ inputs.complete_systems }}
        run: python tools/automation/civil-study.py system-study
      - name: Retain complete-system evidence
        if: ${{ always() && inputs.complete_systems }}
        uses: actions/upload-artifact@v4
        with:
          name: baghdad-civil-complete-systems
          path: build/engineering/civil-studies/baghdad-complete-systems/
          retention-days: 30
      - name: Retain comparison and failed numerical evidence
        if: ${{ always() && inputs.campaign }}
        uses: actions/upload-artifact@v4
        with:
          name: civil-exploration-research
          path: build/engineering/civil-studies/programme/
          retention-days: 30
