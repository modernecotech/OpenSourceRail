name: Civil exploration numerical verification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'engineering/analysis/**'
      - 'engineering/assurance/civil-reference/**'
      - 'engineering/toolchain/tool-manifest.toml'
      - 'tools/automation/project_twin.py'
      - 'tools/automation/civil_reference.py'
      - 'tools/automation/engineering-change.py'
      - 'tools/automation/verify-civil-native-cad.py'
      - 'lib/templates/foundation-catalog.toml'
      - 'design/component-catalogue/src/osr_mech/cad.py'
      - 'design/component-catalogue/src/osr_mech/common.py'
      - 'design/component-catalogue/src/osr_mech/provenance.py'
      - 'docs/civil/**'
      - 'OpenSourceRail_Civil_Exploration_Plan.docx'
      - 'engineering/civil_exploration/**'
      - 'engineering/analysis/benchmarks/civil/**'
      - 'engineering/analysis/tests/test_civil_exploration.py'
      - 'engineering/analysis/tests/test_civil_exploration_review.py'
      - 'engineering/analysis/tests/test_civil_exploration_extensions.py'
      - 'engineering/analysis/tests/test_civil_qualification.py'
      - 'engineering/analysis/tests/test_civil_system_choices.py'
      - 'docs/civil/viaduct-load-model.toml'
      - 'lib/templates/rolling-stock.toml'
      - 'cities/catalogue/west-asia/Iraq/Baghdad/design.toml'
      - 'cities/catalogue/west-asia/Iraq/Baghdad/engineering/soil/summary.json'
      - 'cities/catalogue/west-asia/Iraq/Baghdad/engineering/survey/*readiness.json'
      - 'design/component-catalogue/src/osr_mech/civil/**'
      - 'tools/automation/civil-study.py'
      - 'tools/automation/export-civil-system-review.py'
      - '.github/workflows/civil-exploration.yml'
  workflow_dispatch:
    inputs:
      campaign:
        description: Run the complete bounded research comparison
        type: boolean
        default: false
      complete_systems:
        description: Run the complete Baghdad static research package search and detailed shortlist
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  numerical-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONPATH: .:design/component-catalogue/src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded numerical test environment
        run: |
          python -m pip install pytest==9.1.1 numpy==2.3.5 openseespy==3.8.0.0 ifcopenshell==0.8.5
          sudo apt-get update
          sudo apt-get install -y calculix-ccx
      - name: Verify contracts, independent equations and native integrity
        run: python -m pytest -q engineering/analysis/tests/test_civil_exploration.py engineering/analysis/tests/test_civil_exploration_review.py engineering/analysis/tests/test_civil_exploration_extensions.py engineering/analysis/tests/test_civil_qualification.py engineering/analysis/tests/test_civil_system_choices.py engineering/analysis/tests/test_civil_review_acceptance.py
      - name: Install existing native reference replay dependencies
        if: ${{ inputs.campaign }}
        run: |
          python -m pip install pyswmm==2.1.0 swmm-toolkit==0.17.0
      - name: Run complete research campaign
        if: ${{ inputs.campaign }}
        run: python tools/automation/civil-study.py programme --deployment reference --search-evaluations 96
      - name: Run complete-system search and native refinements
        if: ${{ inputs.complete_systems }}
        run: python tools/automation/civil-study.py system-study
      - name: Retain complete-system evidence
        if: ${{ always() && inputs.complete_systems }}
        uses: actions/upload-artifact@v4
        with:
          name: baghdad-civil-complete-systems
          path: build/engineering/civil-studies/baghdad-complete-systems/
          retention-days: 30
      - name: Retain comparison and failed numerical evidence
        if: ${{ always() && inputs.campaign }}
        uses: actions/upload-artifact@v4
        with:
          name: civil-exploration-research
          path: build/engineering/civil-studies/programme/
          retention-days: 30
