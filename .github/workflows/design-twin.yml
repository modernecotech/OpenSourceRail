name: Best-practice design twin
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'engineering/twin_design/**'
      - 'engineering/models/digital-twins/best-practice/**'
      - 'engineering/best_practice/data/**'
      - 'engineering/analysis/tests/test_design_twin.py'
      - 'engineering/civil_exploration/**'
      - 'design/component-catalogue/src/osr_mech/**'
      - 'lib/templates/rolling-stock.toml'
      - 'tools/automation/design-best-practice-twin.py'
      - 'tools/automation/design-twin-freecad.py'
      - 'tools/automation/design-twin-smoke.py'
      - 'tools/automation/publish-design-twin-evidence.py'
      - '.github/workflows/design-twin.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .:design/component-catalogue/src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 numpy==2.3.5 scipy==1.16.3 jsonschema==4.25.1
      - run: python tools/automation/design-best-practice-twin.py check-public
      - run: python -m pytest -q engineering/analysis/tests/test_design_twin.py
      - run: |
          python tools/automation/design-best-practice-twin.py generate --output build/engineering/design-twin-ci
          python tools/automation/design-best-practice-twin.py verify --output build/engineering/design-twin-ci
