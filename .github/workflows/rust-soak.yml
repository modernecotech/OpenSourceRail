name: rust-soak

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-horizon-simulation:
    name: Rust two-hour consensus and energy soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Execute the release-only ignored soak
        run: >-
          cargo test --release -p osr-sim --test phase2b_integration
          two_hour_samawah_run_preserves_battery_reserve_and_event_balance
          -- --ignored --exact

  coverage:
    name: Rust workspace coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Generate source coverage
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo llvm-cov --workspace --all-features --all-targets --lcov --output-path rust-coverage.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: rust-coverage.lcov
          if-no-files-found: error
