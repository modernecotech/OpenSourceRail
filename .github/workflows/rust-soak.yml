name: rust-soak

on:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-horizon-simulation:
    name: Rust seven-day normal, peak, degraded and recovery soak
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Execute the full multi-day resource-growth soak
        run: cargo run --release -p osr-sim --bin osr-soak-evidence -- --full
      - uses: actions/upload-artifact@v4
        with:
          name: software-soak-evidence
          path: build/assurance/software-soak-report.*
          if-no-files-found: error

  coverage:
    name: Rust workspace coverage artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Generate source coverage
        run: |
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo llvm-cov --workspace --all-features --all-targets --lcov --output-path rust-coverage.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: rust-coverage.lcov
          if-no-files-found: error
