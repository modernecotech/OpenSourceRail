name: Candidate-bound sourcing and cost intelligence
on:
  pull_request:
    paths:
      - "engineering/sourcing/**"
      - "engineering/component_registry/**"
      - "engineering/station_rail/**"
      - "engineering/reference_cell/**"
      - "engineering/requirements.txt"
      - "engineering/readme_context.py"
      - "engineering/README.md"
      - "docs/README.md"
      - "docs/design-engine/sourcing/**"
      - "docs/design-engine/frame-refinement/packet/**"
      - "docs/design-engine/digital-twin/*.tar.gz"
      - "osr"
      - ".github/workflows/sourcing.yml"
  push:
    branches: [main]
    paths:
      - "engineering/sourcing/**"
      - "engineering/component_registry/**"
      - "engineering/station_rail/**"
      - "engineering/reference_cell/**"
      - "engineering/requirements.txt"
      - "engineering/readme_context.py"
      - "engineering/README.md"
      - "docs/README.md"
      - "docs/design-engine/sourcing/**"
      - "docs/design-engine/frame-refinement/packet/**"
      - "docs/design-engine/digital-twin/*.tar.gz"
      - "osr"
      - ".github/workflows/sourcing.yml"
  workflow_dispatch:
    inputs:
      refresh_public_feeds:
        description: Refresh official public World Bank and ECB feeds; no suppliers contacted
        type: boolean
        default: false
  schedule:
    - cron: "20 5 * * 1"
permissions:
  contents: read
jobs:
  sourcing-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest --requirement engineering/requirements.txt
      - name: Source adapters, database, twin extraction and HTTP Workbench contracts
        run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/sourcing/tests
      - name: Replay the full vehicle inventory
        run: |
          mkdir -p build/sourcing-review
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" init
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" seed
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" run \
            --input docs/design-engine/frame-refinement/packet \
            --as-of 2026-10-29 --target-currency GBP \
            --output build/sourcing-review/frame-vehicle
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" verify \
            build/sourcing-review/frame-vehicle
      - name: Evaluate a balanced whole-cell frontier and preserve the remaining backlog
        run: |
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" run \
            --input docs/design-engine/digital-twin/3a07936303fe5d471a88c95875e55b73b13a5cda94e98d1169f168c647766a93.tar.gz \
            --member federated-bom.json.gz --as-of 2026-10-29 --target-currency GBP \
            --category-budget propulsion=25 --category-budget civil=25 \
            --category-budget body-materials=25 --category-budget running-gear=25 \
            --category-budget HVAC=10 --category-budget doors-glazing=6 \
            --category-budget auxiliary-power=6 --category-budget station=5 \
            --category-budget other=10 \
            --output build/sourcing-review/federated-balanced-frontier
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" verify \
            build/sourcing-review/federated-balanced-frontier
      - name: Compare sourced 10 m² laminate material hypotheses without replacing the selected vehicle
        run: |
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" study laminate \
            --input docs/design-engine/digital-twin/3a07936303fe5d471a88c95875e55b73b13a5cda94e98d1169f168c647766a93.tar.gz \
            --member federated-bom.json.gz --as-of 2026-10-29 --target-currency GBP \
            --output build/sourcing-review/laminate-studies \
            > build/sourcing-review/laminate-study-set.json
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" verify \
            build/sourcing-review/laminate-studies/solid-600gsm
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" verify \
            build/sourcing-review/laminate-studies/sandwich-600gsm
          ./osr source --database "$RUNNER_TEMP/osr-sourcing.sqlite3" verify \
            build/sourcing-review/laminate-studies/higher-fibre-sandwich-600gsm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sourcing-review-packets-no-physical-qualification
          path: build/sourcing-review/

  required-sourcing:
    if: always()
    needs: [sourcing-contracts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require sourcing records, adapters, replay and UI contracts
        run: test '${{ needs.sourcing-contracts.result }}' = success

  public-feed-refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_public_feeds)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install --requirement engineering/requirements.txt
      - name: Refresh declared official public feeds only
        run: |
          mkdir -p build/sourcing-feed-refresh
          ./osr source --database "$RUNNER_TEMP/osr-feed-refresh.sqlite3" init
          ./osr source --database "$RUNNER_TEMP/osr-feed-refresh.sqlite3" seed
          ./osr source --database "$RUNNER_TEMP/osr-feed-refresh.sqlite3" refresh \
            --cache-dir "$RUNNER_TEMP/osr-public-feed-cache" \
            > build/sourcing-feed-refresh/refresh.json
          ./osr source --database "$RUNNER_TEMP/osr-feed-refresh.sqlite3" status \
            > build/sourcing-feed-refresh/status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sourcing-public-feed-refresh-no-raw-source-no-credentials
          path: build/sourcing-feed-refresh/*.json
