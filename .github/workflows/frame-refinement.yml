name: v0.6 counted frame revision research
on:
  push:
    branches: [main]
    paths:
      - "engineering/frame_refinement/**"
      - "engineering/sourced_case/**"
      - "engineering/sourced_redesign/**"
      - "engineering/railway_progress/**"
      - "engineering/reference_cell/**"
      - "engineering/component_registry/**"
      - "engineering/station_rail/**"
      - "engineering/development_baseline/**"
      - "engineering/development-baseline.toml"
      - "tools/automation/frame-cell.py"
      - "tools/automation/replay-retained-frame.py"
      - "tools/automation/audit-frame-states.py"
      - "tools/automation/tests/test_frame_cell.py"
      - "tools/automation/tests/test_replay_retained_frame.py"
      - "tools/automation/tests/test_audit_frame_states.py"
      - "docs/design-engine/frame-refinement/**"
      - ".github/workflows/frame-refinement.yml"
      # The bounded release lane covers standalone E01 code; progress receipts do not alter retained physics.
      - "!engineering/station_rail/force_evidence.py"
      - "!tests/test_force_evidence.py"
      - "!campaigns/v07-execution.json"
      - "!docs/design-engine/v07-execution/**"
      # Pure dossier presentation policy contracts run in the bounded Python lane.
      - "!engineering/city_reports/planning-policy.json"
      - "!tests/test_city_dossier_analysis.py"
      - "!engineering/development_baseline/tests/test_performance_storage.py"
  pull_request:
    paths:
      - "engineering/frame_refinement/**"
      - "engineering/sourced_case/**"
      - "engineering/sourced_redesign/**"
      - "engineering/railway_progress/**"
      - "engineering/reference_cell/**"
      - "engineering/component_registry/**"
      - "engineering/station_rail/**"
      - "engineering/development_baseline/**"
      - "engineering/development-baseline.toml"
      - "tools/automation/frame-cell.py"
      - "tools/automation/replay-retained-frame.py"
      - "tools/automation/audit-frame-states.py"
      - "tools/automation/tests/test_frame_cell.py"
      - "tools/automation/tests/test_replay_retained_frame.py"
      - "tools/automation/tests/test_audit_frame_states.py"
      - "docs/design-engine/frame-refinement/**"
      - ".github/workflows/frame-refinement.yml"
      # The bounded release lane covers standalone E01 code; progress receipts do not alter retained physics.
      - "!engineering/station_rail/force_evidence.py"
      - "!tests/test_force_evidence.py"
      - "!campaigns/v07-execution.json"
      - "!docs/design-engine/v07-execution/**"
      # Pure dossier presentation policy contracts run in the bounded Python lane.
      - "!engineering/city_reports/planning-policy.json"
      - "!tests/test_city_dossier_analysis.py"
      - "!engineering/development_baseline/tests/test_performance_storage.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-revision-and-semantic-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: NEHALEM
      NPY_DISABLE_CPU_FEATURES: AVX512F,AVX512CD,AVX512_KNL,AVX512_KNM,AVX512_SKX,AVX512_CLX,AVX512_CNL,AVX512_ICL,AVX512_SPR
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
      - name: Fetch the exact producer epoch for retained frame replay
        run: |
          git fetch --no-tags --depth=1 origin b37988a750690d85939e5cbe7b2223b96c02980e
          git cat-file -e b37988a750690d85939e5cbe7b2223b96c02980e^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: .venv/bin/pip install pytest --requirement engineering/sourced_case/requirements.txt
      - name: Record the fixed x86-64 numerical replay runtime
        env:
          OPENBLAS_VERBOSE: "2"
        run: .venv/bin/python -c 'import numpy as np; np.show_runtime()'
      - name: Geometry, protected hardware and evidence boundaries
        run: .venv/bin/python -m pytest -q --import-mode=importlib engineering/frame_refinement/tests tools/automation/tests/test_frame_cell.py tools/automation/tests/test_audit_frame_states.py tools/automation/tests/test_replay_retained_frame.py
      - name: Replay nine journeys and reopen IFC under the exact retained producer epoch
        run: .venv/bin/python tools/automation/replay-retained-frame.py docs/design-engine/frame-refinement/packet --git-root . --output build/frame-retained-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-frame-epoch-verification
          path: |
            build/frame-retained-replay/preflight.json
            build/frame-retained-replay/report.json
            build/frame-retained-replay/stdout.log
            build/frame-retained-replay/stderr.log
            build/frame-retained-replay/failure.log
          retention-days: 14
      - name: Independently accumulate retained saved-state actions and energy without a new solve
        run: .venv/bin/python tools/automation/replay-retained-frame.py docs/design-engine/frame-refinement/packet --git-root . --scope frame-audit --output build/frame-retained-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retained-frame-saved-state-audit
          path: |
            build/frame-retained-audit/preflight.json
            build/frame-retained-audit/report.json
            build/frame-retained-audit/stdout.log
            build/frame-retained-audit/stderr.log
            build/frame-retained-audit/failure.log
          retention-days: 14
