name: Standards evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p test_standards_assurance.py
      - run: python3 -m engineering.assurance.standards --check
