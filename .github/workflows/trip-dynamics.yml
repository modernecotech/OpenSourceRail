name: Trip dynamics contracts and native methods
on:
  push:
    paths: ['engineering/trip_dynamics/**', 'docs/workbench/trip/**', 'tools/automation/maglev-workbench.py', 'tools/automation/tests/verify-trip-workbench.mjs', 'osr', '.github/workflows/trip-dynamics.yml']
  pull_request:
    paths: ['engineering/trip_dynamics/**', 'docs/workbench/trip/**', 'tools/automation/maglev-workbench.py', 'tools/automation/tests/verify-trip-workbench.mjs', 'osr', '.github/workflows/trip-dynamics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trip-workbench-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/automation/tests/verify-trip-workbench.mjs build/trip-workbench-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trip-workbench-browser
          path: build/trip-workbench-browser
  contracts-and-retained-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r engineering/trip_dynamics/requirements.txt
      - run: python -m pytest -q engineering/trip_dynamics/tests engineering/trip_dynamics/fixtures/magnetics/test_numerics.py
      - run: python -m engineering.trip_dynamics verify --output docs/design-engine/trip-dynamics
  native-chrono-and-fem:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r engineering/trip_dynamics/requirements.txt
      - run: python engineering/trip_dynamics/setup_tools.py --output build/trip-dynamics/tools
      - run: build/trip-dynamics/tools/micromamba/bin/micromamba create --prefix "$PWD/build/trip-dynamics/environment/chrono" --file engineering/trip_dynamics/environment-linux-64.lock --yes
      - run: build/trip-dynamics/environment/chrono/bin/python -m pytest -q engineering/trip_dynamics/tests/test_chrono_runner.py
      - run: python -m engineering.trip_dynamics run --output build/trip-dynamics/ci --chrono-python "$PWD/build/trip-dynamics/environment/chrono/bin/python" --getdp "$PWD/build/trip-dynamics/tools/getdp-3.5.0-Linux64/bin/getdp" --finite-coupon-archive docs/design-engine/trip-dynamics/finite-coupon-artifacts.tar.gz
      - run: python -m engineering.trip_dynamics verify --output build/trip-dynamics/ci
