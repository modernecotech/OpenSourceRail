name: Reconciled railway research pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engineering/**"
      - "docs/design-engine/reconciled-pilot*/**"
      - "docs/design-engine/vehicle-parts/**"
      - "tests/test_railway_closure*.py"
      - "tests/test_vehicle_installation*.py"
      - "tests/test_pilot_civil.py"
      - "osr"
      - ".github/workflows/reconciled-pilot.yml"
      # The bounded release lane covers standalone E01 code; progress receipts do not alter retained physics.
      - "!engineering/station_rail/force_evidence.py"
      - "!tests/test_force_evidence.py"
      - "!campaigns/v07-execution.json"
      - "!docs/design-engine/v07-execution/**"
      # Pure dossier presentation policy contracts run in the bounded Python lane.
      - "!engineering/city_reports/planning-policy.json"
      - "!tests/test_city_dossier_analysis.py"
      # Door Workbench paths are covered by the fast contracts and browser journey.
      - "!engineering/development_baseline/door_readiness.py"
      - "!engineering/development_baseline/server.py"
      - "!engineering/development_baseline/web/**"
      - "!engineering/development_baseline/tests/test_performance_storage.py"
  pull_request:
    paths:
      - "engineering/**"
      - "docs/design-engine/reconciled-pilot*/**"
      - "docs/design-engine/vehicle-parts/**"
      - "tests/test_railway_closure*.py"
      - "tests/test_vehicle_installation*.py"
      - "tests/test_pilot_civil.py"
      - "osr"
      - ".github/workflows/reconciled-pilot.yml"
      # The bounded release lane covers standalone E01 code; progress receipts do not alter retained physics.
      - "!engineering/station_rail/force_evidence.py"
      - "!tests/test_force_evidence.py"
      - "!campaigns/v07-execution.json"
      - "!docs/design-engine/v07-execution/**"
      # Pure dossier presentation policy contracts run in the bounded Python lane.
      - "!engineering/city_reports/planning-policy.json"
      - "!tests/test_city_dossier_analysis.py"
      # Door Workbench paths are covered by the fast contracts and browser journey.
      - "!engineering/development_baseline/door_readiness.py"
      - "!engineering/development_baseline/server.py"
      - "!engineering/development_baseline/web/**"
      - "!engineering/development_baseline/tests/test_performance_storage.py"

permissions:
  contents: read

concurrency:
  group: reconciled-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.92.0"
      CARGO_TARGET_DIR: /tmp/osr-closure-test-target
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engineering/requirements.txt
      - name: Initialize isolated Rust paths
        run: |
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_ENV:-}"
          printf 'RUSTUP_HOME=%s\n' "$RUNNER_TEMP/osr-pilot-rustup" >> "$GITHUB_ENV"
          printf 'CARGO_HOME=%s\n' "$RUNNER_TEMP/osr-pilot-cargo" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt,clippy
      - run: python -m venv .venv
      - run: .venv/bin/pip install --no-cache-dir pytest numpy==2.3.5 --requirement engineering/requirements.txt
      - name: Fetch only pinned retained source epochs
        run: |
          git fetch --no-tags --depth=1 --filter=blob:none origin f990fc24ba9c1c2adcd8afb4456ded5c4753209a
          git fetch --no-tags --depth=1 --filter=blob:none origin 49e095ba5751706c4dcd51f25dfd8f1b728bd20e
          git fetch --no-tags --depth=1 --filter=blob:none origin e254e4d3a70c82c54964a5f54df140e92d53fb5d
      - name: Prefetch bounded source and publication blobs explicitly
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from engineering.railway_closure.retained import tree, prefetch_selected
          packets = (
              ('reconciled-pilot', 'f990fc24ba9c1c2adcd8afb4456ded5c4753209a'),
              ('reconciled-pilot-no-store', '49e095ba5751706c4dcd51f25dfd8f1b728bd20e'),
              ('reconciled-pilot-bogie-detail', 'e254e4d3a70c82c54964a5f54df140e92d53fb5d'),
          )
          for packet, revision in packets:
              prefix = 'docs/design-engine/' + packet + '/'
              entries = tree(Path.cwd(), revision, sizes=False)
              sources = json.loads(Path(prefix, 'manifest.json').read_bytes())['source_sha256']
              delivery = Path(prefix, 'delivery/manifest.json')
              if delivery.is_file():
                  sources.update(json.loads(delivery.read_bytes())['source_sha256'])
              names = set(sources) | {n for n in entries if n.startswith(prefix) or
                  (n.endswith('.py') and n.startswith(('engineering/', 'services/integration/')))}
              names.update(n for n in ('engineering/design_search/craft_backends/tools.json',) if n in entries)
              print(packet, prefetch_selected(Path.cwd(), revision, names))
          PY
      - name: Authenticate retained research dossiers in their original source epochs without new CAD or FEM
        run: |
          ./osr design closure verify --retained-source f990fc24ba9c1c2adcd8afb4456ded5c4753209a
          ./osr design closure verify --output docs/design-engine/reconciled-pilot-no-store --retained-source 49e095ba5751706c4dcd51f25dfd8f1b728bd20e
          ./osr design closure verify --output docs/design-engine/reconciled-pilot-bogie-detail --retained-source e254e4d3a70c82c54964a5f54df140e92d53fb5d
          .venv/bin/python tools/publish_recovery_economics.py verify --packet docs/design-engine/recovery-economics
          .venv/bin/python tools/publish_powered_bogie_detail.py verify --packet docs/design-engine/powered-bogie-detail
      - name: Vehicle, wheel/rail, civil, service, costs and real serving contracts
        run: |
          mkdir -p build/reconciled-pilot-ci
          .venv/bin/python -m pytest -q --junitxml=build/reconciled-pilot-ci/contracts.xml tests/test_vehicle_installation.py tests/test_vehicle_installation_underframe.py tests/test_pilot_civil.py tests/test_railway_closure*.py tests/test_powered_bogie*.py tests/test_recovery_search*.py tests/test_pilot_delivery*.py
      - name: Causal fleet, energy conservation and continuous release regressions
        run: cargo test --manifest-path engineering/station_pair/native/Cargo.toml --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciled-pilot-test-report
          path: build/reconciled-pilot-ci/contracts.xml
          if-no-files-found: ignore
