name: Engineering integration contracts
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'engineering/integration_programme/**'
      - 'engineering/analysis/tests/test_integration_programme.py'
      - 'engineering/analysis/tests/test_shared_service.py'
      - 'engineering/analysis/tests/test_spatial_equipment_modes.py'
      - 'engineering/civil_exploration/**'
      - 'tools/automation/native-spatial-pilot.py'
      - 'tools/automation/integration-programme.py'
      - 'tools/automation/dependency-impact.py'
      - 'tools/automation/tests/test_dependency_impact.py'
      - 'crates/osr-sim/examples/twin_controller_bridge.rs'
      - '.github/workflows/integration-programme.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .:design/component-catalogue/src
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install pytest==9.1.1 numpy==2.3.5 scipy==1.16.3 jsonschema==4.25.1
      - run: python -m pytest -q engineering/analysis/tests/test_integration_programme.py engineering/analysis/tests/test_spatial_equipment_modes.py engineering/analysis/tests/test_shared_service.py tools/automation/tests/test_dependency_impact.py tools/automation/tests/test_platform_recovery.py
      - run: cargo test -p osr-sim --example twin_controller_bridge
