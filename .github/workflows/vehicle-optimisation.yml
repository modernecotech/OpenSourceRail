name: NdFeB and lightweight vehicle research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vehicle-optimisation.yml'
      - 'engineering/vehicle_optimisation/**'
      - 'engineering/passive_suspension/**'
      - 'engineering/design_search/**'
      - 'engineering/ferrite_maglev/**'
      - 'engineering/factory_examples/**'
      - 'engineering/analysis/tests/test_ferrite_maglev_candidate_magnetics.py'
      - 'docs/design-engine/vehicle-optimisation/**'
  pull_request:
    paths:
      - '.github/workflows/vehicle-optimisation.yml'
      - 'engineering/vehicle_optimisation/**'
      - 'engineering/passive_suspension/**'
      - 'engineering/design_search/**'
      - 'engineering/ferrite_maglev/**'
      - 'engineering/factory_examples/**'
      - 'engineering/analysis/tests/test_ferrite_maglev_candidate_magnetics.py'
      - 'docs/design-engine/vehicle-optimisation/**'
permissions:
  contents: read
jobs:
  research-contracts-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3 pytest==9.1.1
      - name: Named magnets, physical takeoffs, occupied HVAC and identity gates
        run: python -m pytest --import-mode=importlib -q engineering/vehicle_optimisation/tests engineering/passive_suspension/tests
      - name: Rebuild derived reports and verify the retained native package
        run: |
          python - <<'PY'
          from engineering.vehicle_optimisation import publication
          print(publication.verify('docs/design-engine/vehicle-optimisation'))
          PY
