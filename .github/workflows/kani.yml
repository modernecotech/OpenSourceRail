name: kani

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Per-harness verification budget (all safety checks remain enabled)
        type: choice
        default: '600'
        options: ['600', '1800']

jobs:
  kani-interlocking:
    name: Kani — interlocking MA validity-window arithmetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prove the release-selected interlocking property
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # fixed v1 installer
        with:
          kani-version: "0.67.0"
          working-directory: .
          args: "-p osr-interlocking --harness kani_p5_time_bounded_arithmetic"

      - name: Verify the tested Kani installation
        run: |
          test "$(cargo-kani --version)" = "cargo-kani 0.67.0"
          test "$(kani --version)" = "kani 0.67.0"

  kani-atp-expired-authority:
    name: Kani — ATP rejects expired movement authority
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prove the release-selected ATP property
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126 # fixed v1 installer
        with:
          kani-version: "0.67.0"
          working-directory: .
          args: "-p osr-atp --harness kani_a2_expired_ma_trips"

      - name: Verify the tested Kani installation
        run: |
          test "$(cargo-kani --version)" = "cargo-kani 0.67.0"
          test "$(kani --version)" = "kani 0.67.0"

  declared-evidence:
    name: Declared Kani evidence / ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package: [osr-interlocking, osr-atp, osr-brake, osr-odometry, osr-wayside-points, osr-obstacle-detect, osr-intrusion-detect, osr-secbus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the reviewed Kani version
        uses: model-checking/kani-github-action@2534b7aeb3c6b4b0a5ecc3981bb3e63d47b5b126
        with:
          kani-version: '0.67.0'
          args: '--version'
      - name: Execute every declared harness for this package and export actual results
        env:
          PROOF_TIMEOUT: ${{ inputs.timeout_seconds || '600' }}
        run: python3 tools/automation/assurance-evidence.py run --package '${{ matrix.package }}' --timeout "$PROOF_TIMEOUT" --output 'build/assurance/${{ matrix.package }}'
      - name: Preserve successes, failures and timeouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-execution-${{ matrix.package }}
          path: build/assurance/${{ matrix.package }}/
          if-no-files-found: error
