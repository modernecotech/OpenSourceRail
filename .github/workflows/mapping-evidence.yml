name: Population and mapping evidence
on:
  push:
    branches: [main]
    paths:
      - 'design/network-planning/baghdad-*.json'
      - 'cities/catalogue/west-asia/Iraq/Baghdad/**'
      - 'tools/automation/*mapping*.py'
      - 'tools/automation/render-city-population-map.py'
      - 'tools/automation/baghdad_*network.py'
      - 'tools/automation/tests/test_mapping_evidence.py'
      - 'tools/automation/tests/test_baghdad_*network.py'
      - '.github/workflows/mapping-evidence.yml'
  pull_request:
    paths:
      - 'design/network-planning/baghdad-*.json'
      - 'cities/catalogue/west-asia/Iraq/Baghdad/**'
      - 'tools/automation/*mapping*.py'
      - 'tools/automation/render-city-population-map.py'
      - 'tools/automation/baghdad_*network.py'
      - 'tools/automation/tests/test_mapping_evidence.py'
      - 'tools/automation/tests/test_baghdad_*network.py'
      - '.github/workflows/mapping-evidence.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.1.1 numpy==2.3.5 scipy==1.16.3 rasterio==1.4.3 matplotlib==3.11.1
      - run: python tools/automation/refresh-city-mapping.py --city baghdad --check
      - run: python tools/automation/render-city-population-map.py --design cities/catalogue/west-asia/Iraq/Baghdad/design.toml --check
      - run: python -m pytest -q tools/automation/tests/test_mapping_evidence.py tools/automation/tests/test_baghdad_compact_network.py tools/automation/tests/test_baghdad_regional_network.py
