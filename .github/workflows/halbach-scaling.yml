name: "Retained research: Larger Halbach and lighter vehicle contracts"
on:
  push:
    paths: ['engineering/halbach_scaling/**', 'engineering/vehicle_optimisation/**', 'engineering/passive_suspension/**', 'engineering/magnetic_confirmation/**', '.github/workflows/halbach-scaling.yml', 'engineering/research_context.py', 'engineering/research_test_support.py', 'engineering/research_ancestry.py']
  pull_request:
    paths: ['engineering/halbach_scaling/**', 'engineering/vehicle_optimisation/**', 'engineering/passive_suspension/**', 'engineering/magnetic_confirmation/**', '.github/workflows/halbach-scaling.yml', 'engineering/research_context.py', 'engineering/research_test_support.py', 'engineering/research_ancestry.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts-and-independent-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact retained producer source required by offline ancestry checks
        run: |
          git fetch --no-tags --depth=1 origin 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164
          git cat-file -e 92e1385e03dcd5c6f76a5b0a9dd5ba348f50d164^{commit}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -r engineering/trip_dynamics/requirements.txt
      - run: python -m pytest -q engineering/halbach_scaling/tests
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
