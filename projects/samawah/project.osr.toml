[project]
schema_version = 1
id = "osr-city-iq-samawah"
slug = "samawah"
name = "Samawah"
country = "IQ"
default_branch = "main"

[inputs]
base_design = "../../designs/west-asia/Iraq/Samawah/design.toml"
corridor_geojson = "../../designs/west-asia/Iraq/Samawah/samawah.corridor.geojson"
simulator_scenario = "../../designs/west-asia/Iraq/Samawah/samawah.toml"
network_overrides = "network/overrides.toml"
service_plan = "services/service-plan.toml"
source_lock = "sources.lock.json"

[planning]
passenger_capacity_per_train = 360
average_speed_kmh = 35.0
station_dwell_min = 2.0
terminal_turnaround_min = 5.0
geometry_regeneration_radius_m = 2000.0

[routing]
sidecar = "routing/samawah.grid.json"
slug = "samawah"
source_ids = [
  "routing-grid",
  "routing-cost",
  "routing-demand",
  "routing-buildability",
  "routing-anchors",
  "routing-provenance",
]
demand_weight = 5.0
search_margin_m = 2500.0
endpoint_snap_m = 500.0

[revision]
policy = "pull-request"
tag_prefix = "city/samawah/design/"
require_clean_source_locks = true
require_passing_validation = true
